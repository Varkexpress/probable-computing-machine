<p><b>Example:</b> What is the expected number of fair coin flips until two heads in a row? Let E<sub>0</sub> be the expectation from the start and E<sub>1</sub> the expectation just after an H. Then E<sub>0</sub> = 1 + ½E<sub>1</sub> + ½E<sub>0</sub> and E<sub>1</sub> = 1 + ½·0 + ½E<sub>0</sub>. The first equation gives E<sub>0</sub> = 2 + E<sub>1</sub>; substituting, E<sub>0</sub> = 3 + E<sub>0</sub>/2. <b>Answer:</b> 6.</p>
<p><b>Example:</b> A and B alternate shooting, A first, each hitting with probability 1/2, and the first hit wins. P(A) = ½ + ¼P(A), so P(A) = (1/2)/(3/4). <b>Answer:</b> 2/3.</p>
<p><b>Example:</b> A frog starts at 3 on a number line from 0 to 10 and jumps ±1 with equal probability. The probability that it reaches 10 before 0 is 3/10. <b>Answer:</b> 3/10.</p>
<p><b>Trap:</b> Different patterns of the same length can have different waiting times (HH takes 6 flips on average, HT takes 4). Do not assume symmetry; set up the states.</p>`},
{h:'Binomial distribution',html:`<p>In n independent trials, each succeeding with probability p, a specific sequence with k successes has probability pᵏ(1 − p)ⁿ⁻ᵏ, and there are C(n, k) such sequences. The mean follows from linearity (n indicators, each with mean p). For a fair coin, the distribution is symmetric about n/2.</p>
<div class="rule"><span class="k">Binomial</span> P(X = k) = C(n, k)pᵏ(1 − p)ⁿ⁻ᵏ<br>
<span class="k">Mean / variance</span> E[X] = np; Var(X) = np(1 − p)<br>
<span class="k">Fair coin</span> P(k heads in n flips) = C(n, k)/2ⁿ<br>
<span class="k">Symmetry</span> with n odd and p = 1/2, P(more heads than tails) = 1/2<br>
<span class="k">Even number of successes</span> P(even) = (1 + (1 − 2p)ⁿ)/2<br>
<span class="k">Variance</span> Var(X) = E[X²] − (E[X])²</div>
<p><b>Example:</b> Exactly 3 heads in 5 fair flips: C(5, 3)/32 = 10/32. <b>Answer:</b> 5/16.</p>
<p><b>Example:</b> More heads than tails in 5 fair flips: by symmetry. <b>Answer:</b> 1/2.</p>
<p><b>Example:</b> A die is rolled 4 times. The probability of exactly two sixes is C(4, 2)(1/6)²(5/6)² = 6·25/1296. <b>Answer:</b> 25/216.</p>
<p><b>Example:</b> 6 fair flips: P(more heads than tails) = (1 − C(6, 3)/64)/2 = (1 − 20/64)/2. <b>Answer:</b> 11/32.</p>
<p><b>Trap:</b> Do not forget the factor C(n, k): the successes can happen in any of those positions. With an even number of trials, a tie is possible, so "more heads" is less than 1/2.</p>`}
]},
{id:'geo',t:'Plane Geometry',sections:[
{h:'Angles, parallel lines and polygon angles',html:`<p>A transversal crossing two parallel lines creates equal corresponding angles and equal alternate interior angles; co-interior angles add to 180°. Draw the line through a triangle’s vertex parallel to the opposite side and those equal angles show that the angles of a triangle sum to 180°. A convex n-gon splits into n − 2 triangles from one vertex, so its angles sum to (n − 2)·180°. Walking around a convex polygon you turn through exactly 360° in total, so the exterior angles sum to 360°.</p>
<div class="rule"><span class="k">Lines</span> vertical angles are equal; a linear pair sums to 180°<br>
<span class="k">Parallel lines</span> corresponding = alternate interior angles; co-interior angles sum to 180°<br>
<span class="k">Triangle</span> ∠A + ∠B + ∠C = 180°; exterior angle = sum of the two remote interior angles<br>
<span class="k">Polygon</span> interior angle sum = (n − 2)·180°; exterior angle sum = 360°<br>
<span class="k">Regular n-gon</span> each interior angle = (n − 2)·180°/n; each exterior angle = 360°/n<br>
<span class="k">Diagonals</span> an n-gon has n(n − 3)/2 diagonals</div>
<p><b>Example:</b> Each interior angle of a regular polygon is 156°. Then each exterior angle is 24° and n = 360/24. <b>Answer:</b> 15 sides.</p>
<p><b>Example:</b> A decagon has 10·7/2 diagonals. <b>Answer:</b> 35.</p>
<p><b>Example:</b> The five tip angles of a regular five-pointed star are each 36°, and they sum to 180°. (This holds for any 5-pointed star: by the exterior angle theorem, the five tips act like the angles of one triangle.) <b>Answer:</b> 180°.</p>
<p><b>Example:</b> A regular hexagon has interior angle 120° and a regular octagon 135°. Placing one of each and a square around a point fills 120 + 135 + 90 = 345°, leaving a 15° gap. <b>Answer:</b> 15°.</p>
<p><b>Trap:</b> The angle-sum formulas hold for concave polygons as well, but the exterior-angle argument and "each angle of a regular polygon" assume convexity. An "angle between two lines" is usually taken as the smaller one (≤ 90°).</p>`},
{h:'Triangle basics and special right triangles',html:`<p>In a triangle, the larger side lies opposite the larger angle. The Law of Cosines tells you the type of the largest angle C by comparing c² with a² + b²: equal means right, smaller means acute, larger means obtuse. The two special right triangles come from halving an equilateral triangle (30-60-90) and a square along a diagonal (45-45-90).</p>
<div class="rule"><span class="k">30-60-90</span> sides x : x√3 : 2x (short leg opposite 30°, hypotenuse opposite 90°)<br>
<span class="k">45-45-90</span> sides x : x : x√2<br>
<span class="k">Equilateral</span> side s: height (√3/2)s, area (√3/4)s², inradius s/(2√3) = s√3/6, circumradius s/√3 = s√3/3<br>
<span class="k">Classification</span> c largest: c² &lt; a² + b² acute; = right; &gt; obtuse<br>
<span class="k">Isosceles</span> the base angles are equal, and the altitude from the apex bisects the base and the apex angle<br>
<span class="k">Midsegment</span> the segment joining the midpoints of two sides is parallel to the third side and half as long</div>
<p><b>Example:</b> The area of an equilateral triangle with side 6 is (√3/4)·36. <b>Answer:</b> 9√3.</p>
<p><b>Example:</b> Is the triangle with sides 7, 8, 9 acute? 81 &lt; 49 + 64 = 113. <b>Answer:</b> Yes, acute.</p>
<p><b>Example:</b> A 30-60-90 triangle with hypotenuse 10 has legs 5 and 5√3. <b>Answer:</b> area 25√3/2.</p>
<p><b>Example:</b> A square with diagonal 8 has side 8/√2 = 4√2. <b>Answer:</b> area 32 (also d²/2).</p>
<p><b>Trap:</b> In the 30-60-90 triangle the √3 belongs to the longer leg, opposite the 60° angle. The hypotenuse is exactly twice the short leg.</p>`},
{h:'Pythagorean triples and right-triangle relations',html:`<p>In a right triangle with legs a, b and hypotenuse c, a² + b² = c². One proof: four copies of the triangle arranged inside a square of side a + b leave a tilted square of area c². Every primitive integer triple comes from <b>Euclid’s formula</b>. The altitude to the hypotenuse splits the triangle into two triangles similar to the original, which gives the geometric-mean relations.</p>
<div class="rule"><span class="k">Euclid’s formula</span> (m² − n², 2mn, m² + n²), m &gt; n &gt; 0; it is primitive when gcd(m, n) = 1 and m − n is odd<br>
<span class="k">Common triples</span> 3-4-5, 5-12-13, 8-15-17, 7-24-25, 20-21-29, 12-35-37, 9-40-41, 11-60-61 (and their multiples, like 6-8-10, 9-12-15)<br>
<span class="k">Altitude to the hypotenuse</span> h = ab/c; h² = pq; a² = pc, b² = qc (p, q are the hypotenuse segments next to a and b)<br>
<span class="k">Right triangle radii</span> R = c/2 (the hypotenuse is a diameter); r = (a + b − c)/2<br>
<span class="k">Median to the hypotenuse</span> equals c/2</div>
<p><b>Example:</b> Find all integer right triangles with hypotenuse 25. Since 25² = 625 = 7² + 24² = 15² + 20², they are 7-24-25 and 15-20-25. <b>Answer:</b> two triangles.</p>
<p><b>Example:</b> In a 6-8-10 triangle, the altitude to the hypotenuse is 48/10 = 4.8, and it cuts the hypotenuse into 36/10 = 3.6 and 64/10 = 6.4 (check: 3.6·6.4 = 23.04 = 4.8²). <b>Answer:</b> h = 4.8.</p>
<p><b>Example:</b> m = 4, n = 1 gives (15, 8, 17). <b>Answer:</b> 8-15-17.</p>
<p><b>Trap:</b> Not every triangle with a 3-4-5 look is right; check a² + b² = c². Also, 2-3-4 is not a triple. In 3D, a² + b² + c² gives the square of the space diagonal of a box.</p>`},
{h:'Similar triangles',html:`<p>Two triangles are similar if they have the same angles (AA is enough). Then every length (side, altitude, median, perimeter, inradius) scales by the same factor k. Areas scale by k² and volumes of similar solids by k³. Parallel lines create similar triangles automatically, and finding them is the single most common AMC geometry move.</p>
<div class="rule"><span class="k">Tests</span> AA; SAS with the included angle; SSS (all ratios equal)<br>
<span class="k">Scaling</span> lengths × k, areas × k², volumes × k³<br>
<span class="k">Basic proportionality</span> a line parallel to BC meeting AB at D and AC at E: AD/AB = AE/AC = DE/BC<br>
<span class="k">Right triangle</span> the altitude to the hypotenuse creates three mutually similar triangles<br>
<span class="k">Trapezoid</span> the diagonals cut each other in the ratio of the parallel bases; the segment through the intersection parallel to the bases has length 2ab/(a + b)</div>
<p><b>Example:</b> △ABC has area 81. A line parallel to BC cuts AB at D with AD = (2/3)AB. △ADE has ratio k = 2/3 and area 81·4/9. <b>Answer:</b> 36.</p>
<p><b>Example:</b> A line parallel to the base divides a triangle into two pieces of equal area. The small triangle has half the area, so its ratio is k = 1/√2. <b>Answer:</b> the line is at (√2/2) of the way from the apex.</p>
<p><b>Example:</b> A 6-foot person standing 10 ft from a lamppost casts a 4-ft shadow. Similar triangles give height/(10 + 4) = 6/4. <b>Answer:</b> the lamp is 21 ft high.</p>
<p><b>Trap:</b> Match corresponding vertices in the right order; write △ABC ∼ △DEF only when ∠A = ∠D and so on. Area ratios are squares of length ratios, never the length ratios themselves.</p>`},
{h:'Triangle area formulas',html:`<p>All triangle area formulas are versions of ½·base·height. Using h = b·sin C gives ½ab sin C. Splitting the triangle at the incenter into three triangles of height r gives rs. Combining ½ab sin C with the Law of Sines (sin C = c/2R) gives abc/(4R). Heron’s formula follows from the Law of Cosines.</p>
<div class="rule"><span class="k">Base-height</span> A = ½bh<br>
<span class="k">SAS</span> A = ½ab sin C<br>
<span class="k">Heron</span> A = √(s(s − a)(s − b)(s − c)), where s = (a + b + c)/2<br>
<span class="k">Inradius</span> A = rs<br>
<span class="k">Circumradius</span> A = abc/(4R)<br>
<span class="k">Coordinates</span> A = ½|x<sub>1</sub>(y<sub>2</sub> − y<sub>3</sub>) + x<sub>2</sub>(y<sub>3</sub> − y<sub>1</sub>) + x<sub>3</sub>(y<sub>1</sub> − y<sub>2</sub>)|<br>
<span class="k">Shared height</span> triangles with the same height have areas in the ratio of their bases</div>
<p><b>Example:</b> The 13-14-15 triangle: s = 21, so A = √(21·8·7·6) = √7056 = 84. Then r = 84/21 = 4 and R = 13·14·15/(4·84) = 2730/336. <b>Answer:</b> A = 84, r = 4, R = 65/8.</p>
<p><b>Example:</b> Two sides 8 and 5 with an included angle of 30° give A = ½·8·5·½. <b>Answer:</b> 10.</p>
<p><b>Example:</b> In △ABC, D is on BC with BD:DC = 2:3 and [ABC] = 40. Since both triangles share the height from A, [ABD] = 40·2/5. <b>Answer:</b> 16.</p>
<p><b>Tip:</b> The 13-14-15 triangle splits into a 5-12-13 and a 9-12-15 triangle, both with altitude 12 to the side 14. Many AMC triangles are built from two Pythagorean triangles glued along an altitude.</p>
<p><b>Trap:</b> Heron uses the semiperimeter s, not the perimeter. ½ab sin C needs the angle <i>between</i> sides a and b.</p>`},
{h:'Polygon areas, shoelace and Pick',html:`<p>Quadrilateral and polygon areas reduce to triangles. The <b>shoelace formula</b> adds signed triangle areas from the origin, so it works for any simple polygon whose vertices are listed in order. <b>Pick’s theorem</b> counts lattice points for polygons with integer-coordinate vertices.</p>
<div class="rule"><span class="k">Trapezoid</span> A = ½(b<sub>1</sub> + b<sub>2</sub>)h<br>
<span class="k">Rhombus / kite</span> A = ½d<sub>1</sub>d<sub>2</sub>; any quadrilateral: ½d<sub>1</sub>d<sub>2</sub> sin θ<br>
<span class="k">Parallelogram</span> A = bh = ab sin θ<br>
<span class="k">Regular hexagon</span> A = (3√3/2)s² (six equilateral triangles)<br>
<span class="k">Regular octagon</span> A = 2(1 + √2)s²<br>
<span class="k">Regular n-gon</span> A = ½·perimeter·apothem = ½nR² sin(360°/n)<br>
<span class="k">Shoelace</span> A = ½|∑(x<sub>i</sub>y<sub>i+1</sub> − x<sub>i+1</sub>y<sub>i</sub>)|, with the vertices in cyclic order<br>
<span class="k">Pick</span> A = I + B/2 − 1 (I = interior lattice points, B = boundary lattice points)<br>
<span class="k">Lattice points on a segment</span> from (x<sub>1</sub>, y<sub>1</sub>) to (x<sub>2</sub>, y<sub>2</sub>): gcd(|Δx|, |Δy|) + 1, endpoints included</div>
<p><b>Example:</b> The quadrilateral (0, 0), (4, 0), (5, 3), (1, 4). The shoelace terms are 0, 4·3 − 5·0 = 12, 5·4 − 1·3 = 17 and 0, totalling 29. <b>Answer:</b> area 29/2.</p>
<p><b>Example:</b> The triangle (0, 0), (4, 0), (0, 4) has area 8 and B = 4 + 4 + 4 = 12 boundary points, so I = 8 − 6 + 1. <b>Answer:</b> 3 interior points: (1, 1), (1, 2), (2, 1).</p>
<p><b>Example:</b> A regular hexagon with side 2 has area (3√3/2)·4. <b>Answer:</b> 6√3.</p>
<p><b>Trap:</b> The shoelace formula needs the vertices in order around the polygon; a criss-crossed order gives the wrong answer. Pick only applies to lattice polygons without holes.</p>`},
{h:'Triangle centers',html:`<p>Each triangle center is where three special lines meet. The <b>centroid</b> G is where the medians meet; it divides each median 2:1 from the vertex and is the average of the vertices. The <b>incenter</b> I is where the angle bisectors meet; it is equidistant (r) from the sides. The <b>circumcenter</b> O is where the perpendicular bisectors meet; it is equidistant (R) from the vertices. The <b>orthocenter</b> H is where the altitudes meet.</p>
<div class="rule"><span class="k">Centroid</span> G = ((x<sub>1</sub> + x<sub>2</sub> + x<sub>3</sub>)/3, (y<sub>1</sub> + y<sub>2</sub> + y<sub>3</sub>)/3); AG:GM = 2:1; the medians cut the triangle into 6 triangles of equal area<br>
<span class="k">Median length</span> m<sub>a</sub>² = (2b² + 2c² − a²)/4<br>
<span class="k">Incenter</span> r = A/s; the tangent length from A is s − a<br>
<span class="k">Circumcenter</span> R = a/(2 sin A) = abc/(4A); right triangle: O is the midpoint of the hypotenuse; obtuse triangle: O lies outside<br>
<span class="k">Orthocenter</span> right triangle: H is the right-angle vertex; acute triangle: H lies inside<br>
<span class="k">Euler line</span> O, G, H are collinear with HG = 2GO; OI² = R(R − 2r), so R ≥ 2r<br>
<span class="k">Equilateral</span> all four centers coincide, and R = 2r</div>
<p><b>Example:</b> In the 3-4-5 triangle, r = (3 + 4 − 5)/2 = 1 (or 6/6) and R = 5/2. <b>Answer:</b> r = 1, R = 2.5.</p>
<p><b>Example:</b> In the 13-14-15 triangle, the median to the side 14 satisfies m² = (2·169 + 2·225 − 196)/4 = 148. <b>Answer:</b> 2√37.</p>
<p><b>Example:</b> The triangle (0, 0), (6, 0), (3, 9) has centroid (3, 3). <b>Answer:</b> (3, 3).</p>
<p><b>Trap:</b> The incenter is generally not the centroid, and the inradius is not one third of a median. Keep straight which center goes with which lines: medians, bisectors, perpendicular bisectors, altitudes.</p>`},
{h:'Angle bisector theorem and Stewart’s theorem',html:`<p>The bisector of angle A splits the opposite side in the ratio of the adjacent sides. Proof: triangles ABD and ACD have equal angles at A, so their areas are in the ratio AB:AC. They also share the height from A, so their areas are in the ratio BD:DC. <b>Stewart’s theorem</b> gives the length of any cevian (a segment from a vertex to the opposite side). It is the Law of Cosines applied to the two angles at the foot D, whose cosines are negatives of each other.</p>
<div class="rule"><span class="k">Angle bisector theorem</span> AD bisects ∠A ⇒ BD/DC = AB/AC = c/b; so BD = ac/(b + c), DC = ab/(b + c)<br>
<span class="k">External bisector</span> divides BC externally in the same ratio c/b<br>
<span class="k">Stewart</span> cevian AD = d, BD = m, DC = n, BC = a = m + n: b²m + c²n = a(d² + mn) ("a man and his dad put a bomb in the sink": man + dad = bmb + cnc)<br>
<span class="k">Bisector length</span> d² = bc(1 − a²/(b + c)²) = bc − mn<br>
<span class="k">Median</span> the special case m = n = a/2 of Stewart gives m<sub>a</sub>² = (2b² + 2c² − a²)/4</div>
<p><b>Example:</b> In △ABC with AB = 13, AC = 15, BC = 14, the bisector from A meets BC at D. BD = 14·13/28 = 6.5 and DC = 7.5. Then d² = 13·15 − 6.5·7.5 = 195 − 48.75 = 146.25. Check with Stewart: 15²·6.5 + 13²·7.5 = 2730 = 14(146.25 + 48.75). <b>Answer:</b> AD = 3√65/2.</p>
<p><b>Example:</b> A triangle has sides AB = 6 and AC = 9, and the bisector of A meets BC = 10 at D. BD = 10·6/15. <b>Answer:</b> BD = 4, DC = 6.</p>
<p><b>Trap:</b> In Stewart, b² multiplies m = BD, the segment touching B, which is <i>not</i> adjacent to side b = AC. Mixing these up is the classic error, so check with a median, where the two sides are symmetric.</p>`},
{h:'Mass points, Ceva and Menelaus',html:`<p><b>Mass points</b> treat ratios on a segment like a balanced lever: put masses at the endpoints inversely proportional to the distances to the balance point, and give the balance point the sum of the two masses. <b>Ceva</b> says when three cevians are concurrent. <b>Menelaus</b> says when three points on the (extended) sides are collinear. Both come from area ratios or parallel-line similar triangles.</p>
<div class="rule"><span class="k">Mass points</span> P on AB with AP:PB = m:n ⇒ mass(A):mass(B) = n:m and mass(P) = mass(A) + mass(B)<br>
<span class="k">Reading ratios</span> on any segment XY through the balance point Q: XQ:QY = mass(Y):mass(X)<br>
<span class="k">Ceva</span> D ∈ BC, E ∈ CA, F ∈ AB: AD, BE, CF are concurrent ⇔ (BD/DC)·(CE/EA)·(AF/FB) = 1<br>
<span class="k">Trig Ceva</span> concurrent ⇔ (sin∠BAD/sin∠DAC)(sin∠CBE/sin∠EBA)(sin∠ACF/sin∠FCB) = 1<br>
<span class="k">Menelaus</span> a line meets lines BC, CA, AB at D, E, F ⇒ (BD/DC)·(CE/EA)·(AF/FB) = 1 (unsigned lengths; with signed lengths the product is −1)</div>
<p><b>Example:</b> In △ABC, D is the midpoint of BC and E lies on AC with AE:EC = 1:2. AD and BE meet at P. Find AP:PD and BP:PE. Since D is a midpoint, mass B = mass C = 1. From AE:EC = 1:2, mass A = 2·mass C = 2. So mass D = 2 and mass E = 3. AP:PD = mass D:mass A = 2:2 and BP:PE = mass E:mass B = 3:1. <b>Answer:</b> AP:PD = 1:1, BP:PE = 3:1.</p>
<p><b>Check by Menelaus:</b> line B–P–E crosses △ADC: (AP/PD)·(DB/BC)·(CE/EA) = 1·(1/2)·2 = 1. ✓</p>
<p><b>Example:</b> Cevians from A, B, C cut the opposite sides in the ratios BD/DC = 2 and CE/EA = 3. For concurrency, AF/FB = 1/6. <b>Answer:</b> AF:FB = 1:6.</p>
<p><b>Trap:</b> Mass is <i>inversely</i> proportional to the distance: the heavier mass sits closer to the balance point. Ceva needs the cevians to be concurrent; Menelaus needs the points to be collinear (and one point is on an extension).</p>`},
{h:'Circle angles, arcs and sectors',html:`<p>An inscribed angle is half its intercepted arc: draw the diameter through the vertex and use two isosceles triangles. Every other circle-angle rule follows from it. An angle with its vertex inside the circle averages the two intercepted arcs; an angle with its vertex outside takes half their difference. Arc length and sector area are simply the fraction θ/360° of the full circle.</p>
<div class="rule"><span class="k">Inscribed angle</span> = ½·intercepted arc; angles subtending the same arc are equal; an angle in a semicircle = 90°<br>
<span class="k">Central angle</span> = its arc<br>
<span class="k">Tangent-chord angle</span> = ½·intercepted arc<br>
<span class="k">Two chords (inside)</span> angle = ½(arc<sub>1</sub> + arc<sub>2</sub>)<br>
<span class="k">Secants / tangents (outside)</span> angle = ½(far arc − near arc)<br>
<span class="k">Arc length</span> L = rθ (θ in radians) = 2πr·(θ°/360)<br>
<span class="k">Sector area</span> ½r²θ = πr²·(θ°/360); segment = sector − triangle = ½r²(θ − sin θ)<br>
<span class="k">Chord</span> length = 2r sin(θ/2) = 2√(r² − d²) (d = distance from the center)</div>
<p><b>Example:</b> Two chords cross inside a circle, and the angle intercepts arcs of 70° and 110°. <b>Answer:</b> ½(180°) = 90°.</p>
<p><b>Example:</b> Two secants from an outside point cut off arcs of 100° and 30°. <b>Answer:</b> ½(70°) = 35°.</p>
<p><b>Example:</b> A sector of 60° with r = 6 has arc 2π and area 6π. The segment is 6π − (√3/4)·36. <b>Answer:</b> segment area 6π − 9√3.</p>
<p><b>Example:</b> A chord 8 cm from the center of a circle of radius 10 has length 2√(100 − 64). <b>Answer:</b> 12.</p>
<p><b>Trap:</b> For an outside angle, subtract the arcs (do not add them). An inscribed angle and a central angle on the same arc differ by a factor of 2, which is easy to drop.</p>`},
{h:'Tangents and power of a point',html:`<p>A tangent is perpendicular to the radius at the point of contact, and the two tangent segments from an outside point are equal. <b>Power of a point:</b> for any line through P meeting the circle at A and B, the product PA·PB is the same for every such line, because the triangles formed are similar (inscribed angles on the same arc). That common value is |OP² − r²|.</p>
<div class="rule"><span class="k">Tangent ⟂ radius</span> OT ⟂ PT; PT² = OP² − r²<br>
<span class="k">Equal tangents</span> PT<sub>1</sub> = PT<sub>2</sub> from the same external point<br>
<span class="k">Intersecting chords</span> PA·PB = PC·PD (P inside)<br>
<span class="k">Secant-secant</span> PA·PB = PC·PD (P outside; distances to the near and far points)<br>
<span class="k">Tangent-secant</span> PT² = PA·PB<br>
<span class="k">Power</span> pow(P) = OP² − r² (negative inside the circle)<br>
<span class="k">Common tangents</span> centers d apart: external tangent length √(d² − (r<sub>1</sub> − r<sub>2</sub>)²); internal √(d² − (r<sub>1</sub> + r<sub>2</sub>)²)<br>
<span class="k">Radical axis</span> the points with equal power to two circles form a line perpendicular to the line of centers</div>
<p><b>Example:</b> Chords AB and CD meet at P with AP = 4, PB = 6, CP = 3. Then 4·6 = 3·PD. <b>Answer:</b> PD = 8.</p>
<p><b>Example:</b> From P outside, a secant meets the circle at A and B with PA = 4, PB = 9. The tangent satisfies PT² = 36. <b>Answer:</b> PT = 6.</p>
<p><b>Example:</b> Circles of radii 3 and 8 are externally tangent (d = 11). The common external tangent has length √(121 − 25) = √96. <b>Answer:</b> 4√6 (equal to 2√(r<sub>1</sub>r<sub>2</sub>) when the circles touch).</p>
<p><b>Trap:</b> In the secant formula, use the whole length PB from P to the far point, not the chord AB. For a circle inscribed in a polygon, assign equal tangent lengths to each vertex.</p>`},
{h:'Cyclic quadrilaterals and Ptolemy',html:`<p>A quadrilateral is <b>cyclic</b> (its vertices lie on one circle) exactly when its opposite angles are supplementary. This follows from inscribed angles: two opposite angles intercept arcs totalling 360°. Equivalently, a side subtends equal angles from the two remaining vertices. <b>Ptolemy</b> relates the sides and diagonals, and <b>Brahmagupta</b> extends Heron’s formula.</p>
<div class="rule"><span class="k">Cyclic test</span> ∠A + ∠C = 180° (equivalently ∠B + ∠D = 180°), or ∠ABD = ∠ACD<br>
<span class="k">Ptolemy</span> ABCD cyclic: AC·BD = AB·CD + BC·DA (product of the diagonals = sum of the products of opposite sides)<br>
<span class="k">Ptolemy inequality</span> for any quadrilateral, AC·BD ≤ AB·CD + BC·DA<br>
<span class="k">Brahmagupta</span> cyclic quadrilateral with sides a, b, c, d: A = √((s − a)(s − b)(s − c)(s − d))<br>
<span class="k">Tangential (Pitot)</span> a circle can be inscribed ⇔ a + c = b + d; then A = rs<br>
<span class="k">Facts</span> every rectangle, isosceles trapezoid and triangle is cyclic</div>
<p><b>Example:</b> In a regular pentagon with side 1, let d be a diagonal. Apply Ptolemy to four of its vertices (sides 1, 1, 1, d; both diagonals d): d·d = 1·1 + d·1, so d² = d + 1. <b>Answer:</b> d = (1 + √5)/2.</p>
<p><b>Example:</b> A cyclic quadrilateral with sides 3, 4, 5, 6 has s = 9 and area √(6·5·4·3) = √360. <b>Answer:</b> 6√10.</p>
<p><b>Example:</b> In a cyclic quadrilateral, ∠A = 70°, so ∠C = 180° − 70°. <b>Answer:</b> 110°.</p>
<p><b>Trap:</b> Brahmagupta’s formula requires a cyclic quadrilateral. In Ptolemy, match each side with its opposite side, not its neighbor.</p>`},
{h:'Coordinate geometry: points and lines',html:`<p>Coordinates turn geometry into algebra. Distance is the Pythagorean theorem; midpoints and centroids are averages; slope is rise over run. Parallel lines have equal slopes, and perpendicular slopes multiply to −1 (rotating a direction vector (a, b) by 90° gives (−b, a)).</p>
<div class="rule"><span class="k">Distance</span> d = √((x<sub>2</sub> − x<sub>1</sub>)² + (y<sub>2</sub> − y<sub>1</sub>)²)<br>
<span class="k">Midpoint</span> ((x<sub>1</sub> + x<sub>2</sub>)/2, (y<sub>1</sub> + y<sub>2</sub>)/2)<br>
<span class="k">Section formula</span> the point dividing AB in the ratio m:n (from A) is (nA + mB)/(m + n)<br>
<span class="k">Slope</span> m = (y<sub>2</sub> − y<sub>1</sub>)/(x<sub>2</sub> − x<sub>1</sub>) = tan(angle of inclination)<br>
<span class="k">Line forms</span> y = mx + b; y − y<sub>1</sub> = m(x − x<sub>1</sub>); Ax + By = C; intercept form x/a + y/b = 1<br>
<span class="k">Parallel / perpendicular</span> m<sub>1</sub> = m<sub>2</sub>; m<sub>1</sub>m<sub>2</sub> = −1<br>
<span class="k">Collinear</span> three points are collinear ⇔ the slopes agree ⇔ the triangle they form has area 0<br>
<span class="k">Triangle cut off</span> the line x/a + y/b = 1 forms a triangle of area ½|ab| with the axes</div>
<p><b>Example:</b> The distance between (1, 2) and (4, 6) is √(9 + 16). <b>Answer:</b> 5.</p>
<p><b>Example:</b> Find the perpendicular bisector of (0, 0) and (4, 2). The midpoint is (2, 1); the segment has slope 1/2, so the bisector has slope −2: y − 1 = −2(x − 2). <b>Answer:</b> y = −2x + 5.</p>
<p><b>Example:</b> The line 3x + 4y = 24 meets the axes at (8, 0) and (0, 6), forming a triangle of area 24. <b>Answer:</b> 24.</p>
<p><b>Trap:</b> Vertical lines have undefined slope (x = c), so "m<sub>1</sub>m<sub>2</sub> = −1" does not apply to a vertical line paired with a horizontal one. Keep the order of the coordinates consistent when computing a slope.</p>`},
{h:'Coordinate geometry: circles, distance to a line, reflections',html:`<p>The distance from a point to a line is the length of the perpendicular. The formula comes from projecting onto the normal vector (A, B). Circle equations come from the distance formula; complete the square to read off the center and radius. A reflection turns a "bent path" into a straight one, which is the key to shortest-path problems.</p>
<div class="rule"><span class="k">Point to line</span> distance from (x<sub>0</sub>, y<sub>0</sub>) to Ax + By + C = 0 is |Ax<sub>0</sub> + By<sub>0</sub> + C|/√(A² + B²)<br>
<span class="k">Parallel lines</span> Ax + By + C<sub>1</sub> = 0 and Ax + By + C<sub>2</sub> = 0 are |C<sub>1</sub> − C<sub>2</sub>|/√(A² + B²) apart<br>
<span class="k">Circle</span> (x − h)² + (y − k)² = r²; x² + y² + Dx + Ey + F = 0 has center (−D/2, −E/2) and r² = D²/4 + E²/4 − F<br>
<span class="k">Tangency</span> a line is tangent to a circle ⇔ its distance from the center equals r<br>
<span class="k">Reflections</span> over the x-axis (x, −y); over the y-axis (−x, y); over y = x (y, x); over y = −x (−y, −x); through the origin (−x, −y)<br>
<span class="k">Rotation 90° CCW</span> (x, y) → (−y, x) about the origin<br>
<span class="k">Shortest path</span> to get from A to a line and then to B, reflect B across the line and draw a straight segment</div>
<p><b>Example:</b> The distance from (1, 2) to 3x + 4y − 1 = 0 is |3 + 8 − 1|/5. <b>Answer:</b> 2.</p>
<p><b>Example:</b> x² + y² − 6x + 8y = 0 becomes (x − 3)² + (y + 4)² = 25. <b>Answer:</b> center (3, −4), radius 5.</p>
<p><b>Example:</b> The shortest path from A(0, 1) to the x-axis and then to B(4, 3): reflect A to (0, −1), giving the straight-line length √(16 + 16). <b>Answer:</b> 4√2.</p>
<p><b>Trap:</b> The point-line formula needs the line in the form Ax + By + C = 0, with everything on one side. Write y = 2x + 3 as 2x − y + 3 = 0 first.</p>`}
]},
{id:'solid',t:'3D Geometry',sections:[
{h:'Prisms, boxes and cylinders',html:`<p>A prism or cylinder is a stack of identical cross-sections, so its volume is base area times height (Cavalieri’s principle: solids with equal cross-sectional areas at every height have equal volumes, which also covers slanted prisms). The surface area is the two bases plus the lateral area. Unrolling a cylinder’s side gives a rectangle of width 2πr.</p>
<div class="rule"><span class="k">Prism / cylinder volume</span> V = B·h (B = base area, h = perpendicular height)<br>
<span class="k">Box</span> V = abc; surface area S = 2(ab + bc + ca); space diagonal d = √(a² + b² + c²)<br>
<span class="k">Box identity</span> (a + b + c)² = d² + S<br>
<span class="k">Cube</span> V = s³, S = 6s², face diagonal s√2, space diagonal s√3<br>
<span class="k">Cylinder</span> V = πr²h; lateral area 2πrh; total area 2πr(r + h)<br>
<span class="k">Face-area trick</span> if the three face areas are xy, yz, zx, then V = √(xy·yz·zx)</div>
<p><b>Example:</b> A box has face areas 12, 15, 20. Then V = √(12·15·20) = √3600. <b>Answer:</b> 60 (the dimensions are 3 × 4 × 5).</p>
<p><b>Example:</b> The space diagonal of a 3 × 4 × 12 box is √(9 + 16 + 144) = √169. <b>Answer:</b> 13.</p>
<p><b>Example:</b> A box has edge sum 4(a + b + c) = 24 and surface area 22. Then d² = 6² − 22. <b>Answer:</b> d = √14.</p>
<p><b>Example:</b> A cylinder with r = 3 and h = 5 has V = 45π and total surface area 2π·3·8 = 48π. <b>Answer:</b> 45π and 48π.</p>
<p><b>Trap:</b> "Lateral" area excludes the bases, while "total" or "surface" area includes them. An open-top box has only one base. A slanted (oblique) prism uses the perpendicular height, not the slant edge.</p>`},
{h:'Pyramids and cones',html:`<p>A pyramid or cone has one third the volume of the prism or cylinder with the same base and height. Three congruent pyramids fill a cube, and Cavalieri extends this to any base. Unrolling a cone’s lateral surface gives a circular sector whose radius is the slant height l and whose arc length is the base circumference 2πr.</p>
<div class="rule"><span class="k">Pyramid / cone volume</span> V = ⅓Bh<br>
<span class="k">Cone</span> V = ⅓πr²h; slant height l = √(r² + h²); lateral area πrl; total area πr(r + l)<br>
<span class="k">Sector → cone</span> a sector of radius R and angle θ rolls into a cone with l = R and base radius r = R·θ/360°<br>
<span class="k">Frustum</span> V = (h/3)(A<sub>1</sub> + A<sub>2</sub> + √(A<sub>1</sub>A<sub>2</sub>)); for a cone frustum, V = (πh/3)(R² + Rr + r²)<br>
<span class="k">Regular tetrahedron</span> edge s: height s√6/3, V = s³√2/12, area √3s²<br>
<span class="k">Regular octahedron</span> edge s: V = s³√2/3<br>
<span class="k">Similar cut</span> cutting a cone at a fraction k of its height from the apex leaves a small cone with volume k³ of the original</div>
<p><b>Example:</b> A cone with r = 3 and h = 4 has l = 5, V = ⅓π·9·4 = 12π, lateral area 15π and total area 24π. <b>Answer:</b> V = 12π.</p>
<p><b>Example:</b> A 240° sector of radius 6 is rolled into a cone. Then r = 6·240/360 = 4 and h = √(36 − 16) = 2√5. <b>Answer:</b> V = ⅓π·16·2√5 = 32√5π/3.</p>
<p><b>Example:</b> A cone filled to half its height (measured from the apex, point down) holds (1/2)³ of its capacity. <b>Answer:</b> 1/8 full.</p>
<p><b>Example:</b> A regular tetrahedron with edge 6 has V = 216√2/12. <b>Answer:</b> 18√2.</p>
<p><b>Trap:</b> Do not mix up the slant height l with the height h. Volume uses h, lateral area uses l. A pyramid’s "height" is perpendicular to the base, not along an edge.</p>`},
{h:'Spheres',html:`<p>Archimedes showed that a sphere fills exactly 2/3 of its circumscribed cylinder, in both volume and total surface area. The sphere’s surface equals the cylinder’s lateral area 2πr·2r = 4πr². Thinking of the sphere as many thin cones from the center gives V = ⅓·(area)·r = (4/3)πr³.</p>
<div class="rule"><span class="k">Volume</span> V = (4/3)πr³<br>
<span class="k">Surface area</span> S = 4πr²<br>
<span class="k">Hemisphere</span> V = (2/3)πr³; total area (curved + flat) 3πr²<br>
<span class="k">Spherical cap</span> height h: V = πh²(3r − h)/3; curved area 2πrh<br>
<span class="k">Cube relations</span> inscribed sphere r = s/2; sphere through the vertices r = s√3/2; sphere touching all edges r = s√2/2<br>
<span class="k">Cross-section</span> a plane at distance d from the center cuts a circle of radius √(r² − d²)<br>
<span class="k">Ratio</span> V/S = r/3</div>
<p><b>Example:</b> The sphere inscribed in a cube of side 6 has r = 3 and V = 36π. <b>Answer:</b> 36π.</p>
<p><b>Example:</b> The sphere circumscribed about the same cube has r = 3√3 and V = (4/3)π·81√3. <b>Answer:</b> 108√3π.</p>
<p><b>Example:</b> A sphere whose volume equals its surface area has r/3 = 1. <b>Answer:</b> r = 3.</p>
<p><b>Example:</b> Melting a sphere of radius 3 into a cylinder of radius 3: (4/3)π·27 = π·9·h. <b>Answer:</b> h = 4.</p>
<p><b>Trap:</b> Volume scales with r³ and area with r². Doubling the radius multiplies the volume by 8, not 2. A "hemisphere’s surface area" may or may not include the flat disk, so read carefully.</p>`},
{h:'Euler’s formula and Platonic solids',html:`<p>For any convex polyhedron, V − E + F = 2. Intuition: flatten the polyhedron into a planar graph and remove edges one at a time; each removal deletes either a face or a vertex and keeps V − E + F unchanged until a single vertex remains. Count edges by <b>handshaking</b>: each edge borders two faces and joins two vertices.</p>
<div class="rule"><span class="k">Euler</span> V − E + F = 2<br>
<span class="k">Edge count</span> 2E = ∑(sides of each face) = ∑(degree of each vertex)<br>
<span class="k">Tetrahedron</span> V 4, E 6, F 4 (triangles, 3 at a vertex)<br>
<span class="k">Cube</span> V 8, E 12, F 6 (squares, 3 at a vertex)<br>
<span class="k">Octahedron</span> V 6, E 12, F 8 (triangles, 4 at a vertex)<br>
<span class="k">Dodecahedron</span> V 20, E 30, F 12 (pentagons, 3 at a vertex)<br>
<span class="k">Icosahedron</span> V 12, E 30, F 20 (triangles, 5 at a vertex)<br>
<span class="k">Duality</span> cube ↔ octahedron, dodecahedron ↔ icosahedron, tetrahedron self-dual (V and F swap, E stays)<br>
<span class="k">Prism / pyramid</span> n-gonal prism: 2n, 3n, n + 2; n-gonal pyramid: n + 1, 2n, n + 1</div>
<p><b>Example:</b> A soccer ball has 12 pentagons and 20 hexagons. F = 32, E = (60 + 120)/2 = 90 and V = 2 − 32 + 90. <b>Answer:</b> V = 60.</p>
<p><b>Example:</b> How many space diagonals does a cube have? C(8, 2) = 28 segments, minus 12 edges, minus 12 face diagonals. <b>Answer:</b> 4.</p>
<p><b>Example:</b> A polyhedron with all faces triangles and 12 vertices: 2E = 3F and 12 − E + F = 2 give F = 20, E = 30. <b>Answer:</b> 30 edges (the icosahedron).</p>
<p><b>Trap:</b> Euler’s formula is for convex polyhedra (more generally, solids without holes). A solid with a tunnel through it has V − E + F = 0. When counting diagonals, subtract both the edges and the face diagonals.</p>`},
{h:'3D distance, cross-sections and unfolding',html:`<p>3D distance is the Pythagorean theorem applied twice. The trick with solids is to find the right 2D slice: a plane through the axis of a cone or cylinder, through the center of a sphere, or through a space diagonal of a box. For paths along a surface, unfold the faces into the plane and draw a straight line.</p>
<div class="rule"><span class="k">Distance</span> d = √(Δx² + Δy² + Δz²)<br>
<span class="k">Sphere</span> (x − a)² + (y − b)² + (z − c)² = r²<br>
<span class="k">Point to plane</span> |ax<sub>0</sub> + by<sub>0</sub> + cz<sub>0</sub> + d|/√(a² + b² + c²)<br>
<span class="k">Cube cross-sections</span> can be a triangle, square, rectangle, trapezoid, pentagon or regular hexagon (never a regular pentagon or a heptagon)<br>
<span class="k">Hexagon section</span> the plane through the center perpendicular to a space diagonal gives a regular hexagon with side s/√2 and area (3√3/4)s²<br>
<span class="k">Corner triangle</span> the plane through three vertices adjacent to one corner gives an equilateral triangle with side s√2<br>
<span class="k">Unfolding</span> shortest surface path of an a × b × c box between opposite corners (a ≥ b ≥ c): √(a² + (b + c)²)</div>
<p><b>Example:</b> The distance from (1, 2, 3) to (4, 6, 15) is √(9 + 16 + 144). <b>Answer:</b> 13.</p>
<p><b>Example:</b> A sphere of radius 5 is cut by a plane 3 units from its center. The section has radius √(25 − 9) = 4. <b>Answer:</b> area 16π.</p>
<p><b>Example:</b> An ant crawls on the surface of a unit cube from one corner to the opposite corner. Unfolding two faces gives a 2 × 1 rectangle. <b>Answer:</b> √5.</p>
<p><b>Example:</b> The cube with side 2 cut by the plane through three vertices adjacent to one corner leaves a corner tetrahedron with volume ⅙·2³. <b>Answer:</b> 4/3.</p>
<p><b>Trap:</b> For non-cubic boxes, try every way of unfolding; the shortest surface path joins the two smaller dimensions. The straight 3D diagonal goes through the inside, so it is not a surface path.</p>`}
]},
{id:'trig',t:'Trigonometry',sections:[
{h:'Unit circle and exact values',html:`<p>On the unit circle, the point at angle θ (measured counterclockwise from the positive x-axis) is (cos θ, sin θ), and tan θ = sin θ/cos θ is the slope of the radius. Values at 30°, 45° and 60° come from the special right triangles. In other quadrants, use the <b>reference angle</b> and fix the sign: "All Students Take Calculus" says which functions are positive in quadrants I, II, III, IV (all, sin, tan, cos).</p>
<div class="rule"><span class="k">Radians</span> π rad = 180°; arc length = rθ<br>
<span class="k">0°, 30°, 45°, 60°, 90°</span> sin: 0, 1/2, √2/2, √3/2, 1 · cos: 1, √3/2, √2/2, 1/2, 0 · tan: 0, √3/3, 1, √3, undefined<br>
<span class="k">Signs (ASTC)</span> QI all positive; QII sin; QIII tan; QIV cos<br>
<span class="k">Reference angles</span> sin(180° − θ) = sin θ; cos(180° − θ) = −cos θ; sin(180° + θ) = −sin θ; cos(360° − θ) = cos θ<br>
<span class="k">Extra values</span> sin 15° = cos 75° = (√6 − √2)/4; cos 15° = (√6 + √2)/4; tan 15° = 2 − √3; tan 75° = 2 + √3<br>
<span class="k">Golden values</span> sin 18° = (√5 − 1)/4; cos 36° = (1 + √5)/4</div>
<p><b>Example:</b> sin 210° = −sin 30°. <b>Answer:</b> −1/2.</p>
<p><b>Example:</b> cos(5π/4): reference angle π/4 in QIII, where cos is negative. <b>Answer:</b> −√2/2.</p>
<p><b>Example:</b> tan 120° = −tan 60°. <b>Answer:</b> −√3.</p>
<p><b>Example:</b> How many solutions does sin x = 1/2 have in [0, 2π)? There are two: π/6 and 5π/6. <b>Answer:</b> 2.</p>
<p><b>Trap:</b> Check whether the problem uses degrees or radians. Most equations sin x = c with |c| &lt; 1 have two solutions per period, not one.</p>`},
{h:'Fundamental identities',html:`<p>The Pythagorean identity is the unit-circle equation x² + y² = 1. Dividing it by cos² or sin² gives the other two. Cofunction identities come from the two acute angles of a right triangle, and even/odd rules from reflecting across the x-axis. A standard move: when you know sin x + cos x, square it to get sin x cos x.</p>
<div class="rule"><span class="k">Pythagorean</span> sin²θ + cos²θ = 1; 1 + tan²θ = sec²θ; 1 + cot²θ = csc²θ<br>
<span class="k">Ratios</span> tan = sin/cos; cot = 1/tan; sec = 1/cos; csc = 1/sin<br>
<span class="k">Cofunction</span> sin(90° − θ) = cos θ; tan(90° − θ) = cot θ<br>
<span class="k">Even / odd</span> cos(−θ) = cos θ; sin(−θ) = −sin θ; tan(−θ) = −tan θ<br>
<span class="k">Periods</span> sin, cos: 360°; tan: 180°<br>
<span class="k">Square trick</span> (sin x ± cos x)² = 1 ± 2 sin x cos x = 1 ± sin 2x<br>
<span class="k">Amplitude</span> a sin x + b cos x = √(a² + b²) sin(x + φ), so its range is [−√(a² + b²), √(a² + b²)]</div>
<p><b>Example:</b> If sin x + cos x = 1/2, then 1 + 2 sin x cos x = 1/4, so sin x cos x = −3/8. <b>Answer:</b> −3/8.</p>
<p><b>Example:</b> The maximum of 3 sin x + 4 cos x is √(9 + 16). <b>Answer:</b> 5.</p>
<p><b>Example:</b> sin θ = 3/5 with θ in QII. Then cos θ = −4/5 and tan θ = −3/4. <b>Answer:</b> tan θ = −3/4.</p>
<p><b>Example:</b> sin²1° + sin²2° + … + sin²89°. Pair sin²k° with sin²(90 − k)° = cos²k° to get 44 pairs of 1, plus sin²45° = 1/2. <b>Answer:</b> 44.5.</p>
<p><b>Trap:</b> sin²x means (sin x)², but sin⁻¹x means arcsin, not 1/sin x. Taking a square root to get cos from sin requires choosing the sign from the quadrant.</p>`},
{h:'Sum, difference, double and half angle',html:`<p>The addition formulas follow from rotating points on the unit circle, or from complex multiplication: cis A·cis B = cis(A + B), where cis θ = cos θ + i sin θ (see Complex numbers). Expanding gives cos(A + B) and sin(A + B). Setting A = B gives the double-angle formulas, and solving the cosine double-angle formula backwards gives the half-angle ones.</p>
<div class="rule"><span class="k">Sum / difference</span> sin(A ± B) = sin A cos B ± cos A sin B; cos(A ± B) = cos A cos B ∓ sin A sin B<br>
<span class="k">Tangent sum</span> tan(A ± B) = (tan A ± tan B)/(1 ∓ tan A tan B)<br>
<span class="k">Double</span> sin 2x = 2 sin x cos x; cos 2x = cos²x − sin²x = 2cos²x − 1 = 1 − 2sin²x; tan 2x = 2tan x/(1 − tan²x)<br>
<span class="k">Half angle</span> sin²(x/2) = (1 − cos x)/2; cos²(x/2) = (1 + cos x)/2; tan(x/2) = sin x/(1 + cos x) = (1 − cos x)/sin x<br>
<span class="k">Triple</span> sin 3x = 3sin x − 4sin³x; cos 3x = 4cos³x − 3cos x<br>
<span class="k">t-substitution</span> with t = tan(x/2): sin x = 2t/(1 + t²), cos x = (1 − t²)/(1 + t²)</div>
<p><b>Example:</b> cos 75° = cos 45° cos 30° − sin 45° sin 30° = (√6 − √2)/4. <b>Answer:</b> (√6 − √2)/4.</p>
<p><b>Example:</b> tan A = 1/2 and tan B = 1/3 (A, B acute). Then tan(A + B) = (5/6)/(1 − 1/6) = 1. <b>Answer:</b> A + B = 45°.</p>
<p><b>Example:</b> If cos x = 1/3, then cos 2x = 2/9 − 1. <b>Answer:</b> −7/9.</p>
<p><b>Example:</b> If tan x = 2, then sin 2x = 2t/(1 + t²) = 4/5. <b>Answer:</b> 4/5.</p>
<p><b>Trap:</b> sin 2x ≠ 2 sin x. The sign of the half-angle square root depends on the quadrant of x/2, not of x.</p>`},
{h:'Product-to-sum and sum-to-product',html:`<p>Adding and subtracting the sum and difference formulas isolates products such as cos A cos B. Reading the result backwards turns sums into products, which is useful for factoring sin a + sin b = 0 or for telescoping. Products of sines or cosines at angles in arithmetic or geometric progression often collapse when you multiply by a well-chosen sine and use the double-angle formula repeatedly.</p>
<div class="rule"><span class="k">Product to sum</span> sin A sin B = ½[cos(A − B) − cos(A + B)]<br>
cos A cos B = ½[cos(A − B) + cos(A + B)]<br>
sin A cos B = ½[sin(A + B) + sin(A − B)]<br>
<span class="k">Sum to product</span> sin A + sin B = 2 sin((A + B)/2) cos((A − B)/2)<br>
sin A − sin B = 2 cos((A + B)/2) sin((A − B)/2)<br>
cos A + cos B = 2 cos((A + B)/2) cos((A − B)/2)<br>
cos A − cos B = −2 sin((A + B)/2) sin((A − B)/2)<br>
<span class="k">Telescoping trick</span> 2 sin(d/2) cos(kd) = sin((k + ½)d) − sin((k − ½)d)<br>
<span class="k">Doubling chain</span> cos x cos 2x cos 4x ⋯ cos 2ⁿ⁻¹x = sin(2ⁿx)/(2ⁿ sin x)</div>
<p><b>Example:</b> cos 20° cos 40° cos 80°. Multiply and divide by sin 20°; the doubling chain gives sin 160°/(8 sin 20°), and sin 160° = sin 20°. <b>Answer:</b> 1/8.</p>
<p><b>Example:</b> sin 75° + sin 15° = 2 sin 45° cos 30° = 2·(√2/2)(√3/2). <b>Answer:</b> √6/2.</p>
<p><b>Example:</b> sin 20° sin 40° sin 80° = ¼ sin 60° by the identity sin x sin(60° − x) sin(60° + x) = ¼ sin 3x. <b>Answer:</b> √3/8.</p>
<p><b>Trap:</b> Watch the minus sign in cos A − cos B = −2 sin(…) sin(…), and the order (A − B) versus (A + B) in sin A sin B.</p>`},
{h:'Law of Sines, Law of Cosines and inverse trig',html:`<p>The <b>Law of Sines</b> comes from inscribing the triangle in its circumcircle: a chord subtending the inscribed angle A has length 2R sin A. The <b>Law of Cosines</b> is the Pythagorean theorem with a correction term, obtained by dropping an altitude. Use the Law of Sines for angle-angle-side or side-side-angle data, and the Law of Cosines for side-angle-side or side-side-side. Inverse trig functions return an angle within a fixed principal range.</p>
<div class="rule"><span class="k">Law of Sines</span> a/sin A = b/sin B = c/sin C = 2R<br>
<span class="k">Law of Cosines</span> c² = a² + b² − 2ab cos C; cos C = (a² + b² − c²)/(2ab)<br>
<span class="k">Area</span> ½ab sin C = abc/(4R) = 2R² sin A sin B sin C<br>
<span class="k">Ambiguous case</span> SSA can give 0, 1 or 2 triangles<br>
<span class="k">Principal ranges</span> arcsin: [−90°, 90°]; arccos: [0°, 180°]; arctan: (−90°, 90°)<br>
<span class="k">Compositions</span> sin(arccos x) = √(1 − x²); cos(arctan x) = 1/√(1 + x²)<br>
<span class="k">Arctan sum</span> arctan a + arctan b = arctan((a + b)/(1 − ab)) when ab &lt; 1</div>
<p><b>Example:</b> In a triangle with sides 5, 7, 8, the angle opposite 7 has cos = (25 + 64 − 49)/80 = 1/2, so it is 60°. Area = ½·5·8·sin 60°. <b>Answer:</b> 60° and area 10√3.</p>
<p><b>Example:</b> A triangle with a = 6 and A = 30° has 2R = 6/(1/2) = 12. <b>Answer:</b> R = 6.</p>
<p><b>Example:</b> arctan(1/2) + arctan(1/3) = arctan((5/6)/(5/6)). <b>Answer:</b> π/4.</p>
<p><b>Example:</b> cos(arctan(3/4)): this is a 3-4-5 triangle. <b>Answer:</b> 4/5.</p>
<p><b>Trap:</b> arcsin(sin(5π/6)) = π/6, not 5π/6, because outputs lie in the principal range. In the Law of Cosines, C must be the angle opposite side c.</p>`}
]},
{id:'cplx',t:'Complex Numbers',sections:[
{h:'Complex arithmetic, conjugates and modulus',html:`<p>A complex number is z = a + bi with i² = −1. Add and multiply like polynomials, then replace i² by −1. The conjugate z̄ = a − bi reflects z across the real axis, and z·z̄ = a² + b² = |z|² is real. That is why you divide by multiplying the top and bottom by the conjugate of the denominator.</p>
<div class="rule"><span class="k">Powers of i</span> i¹ = i, i² = −1, i³ = −i, i⁴ = 1 (cycle of 4)<br>
<span class="k">Product</span> (a + bi)(c + di) = (ac − bd) + (ad + bc)i<br>
<span class="k">Modulus</span> |a + bi| = √(a² + b²); |zw| = |z||w|; |z/w| = |z|/|w|<br>
<span class="k">Conjugate</span> z·z̄ = |z|²; z + z̄ = 2Re z; conj(zw) = z̄·w̄<br>
<span class="k">Division</span> 1/z = z̄/|z|²<br>
<span class="k">Real polynomials</span> non-real roots come in conjugate pairs<br>
<span class="k">Square roots</span> to solve (x + yi)² = a + bi, match x² − y² = a and 2xy = b</div>
<p><b>Example:</b> (3 + 4i)/(1 − 2i) = (3 + 4i)(1 + 2i)/5 = (3 + 10i − 8)/5. <b>Answer:</b> −1 + 2i.</p>
<p><b>Example:</b> i²⁰²⁶: 2026 ≡ 2 (mod 4). <b>Answer:</b> −1.</p>
<p><b>Example:</b> |(1 + i)⁸| = (√2)⁸. <b>Answer:</b> 16.</p>
<p><b>Example:</b> √(−5 + 12i): x² − y² = −5 and xy = 6 give x = 2, y = 3. <b>Answer:</b> ±(2 + 3i).</p>
<p><b>Example:</b> i + i² + i³ + … + i¹⁰⁰: each block of four sums to 0. <b>Answer:</b> 0.</p>
<p><b>Trap:</b> √(−4)·√(−9) = 2i·3i = −6, not √36 = 6; the rule √a√b = √(ab) fails for negative numbers. A polynomial with non-real coefficients need not have conjugate root pairs.</p>`},
{h:'Polar form and De Moivre’s theorem',html:`<p>Write z = r(cos θ + i sin θ) = r·cis θ = re<sup>iθ</sup>, where r = |z| and θ = arg z. Multiplication multiplies the moduli and <b>adds the angles</b> (this is the sum formulas for sin and cos). So powers raise r to the n-th power and multiply θ by n. Converting to polar form is the fastest way to compute large powers.</p>
<div class="rule"><span class="k">Polar form</span> z = r cis θ; r = √(a² + b²); tan θ = b/a (choose the quadrant correctly)<br>
<span class="k">Euler</span> e<sup>iθ</sup> = cos θ + i sin θ; e<sup>iπ</sup> = −1<br>
<span class="k">Multiply / divide</span> (r<sub>1</sub> cis α)(r<sub>2</sub> cis β) = r<sub>1</sub>r<sub>2</sub> cis(α + β); quotient: r<sub>1</sub>/r<sub>2</sub> cis(α − β)<br>
<span class="k">De Moivre</span> (r cis θ)ⁿ = rⁿ cis(nθ)<br>
<span class="k">Trig from powers</span> cos nθ and sin nθ are the real and imaginary parts of (cos θ + i sin θ)ⁿ<br>
<span class="k">Cosine</span> z + 1/z = 2cos θ when |z| = 1, and then zⁿ + 1/zⁿ = 2cos nθ</div>
<p><b>Example:</b> (1 + i)¹⁰ = (√2 cis 45°)¹⁰ = 32 cis 450° = 32 cis 90°. <b>Answer:</b> 32i.</p>
<p><b>Example:</b> (1 + i√3)⁶ = (2 cis 60°)⁶ = 64 cis 360°. <b>Answer:</b> 64.</p>
<p><b>Example:</b> If z + 1/z = 1, then 2cos θ = 1 gives θ = ±60°, and z²⁰²⁶ + 1/z²⁰²⁶ = 2cos(2026·60°) = 2cos(121560°). Reduce 121560 mod 360: 121560 = 337·360 + 240. So the value is 2cos 240°. <b>Answer:</b> −1.</p>
<p><b>Trap:</b> arctan(b/a) gives the wrong angle in quadrants II and III; for −1 − i the argument is 225°, not 45°. Reduce angles mod 360° only after multiplying.</p>`},
{h:'Roots of unity',html:`<p>The solutions of zⁿ = 1 are ωᵏ = cis(360°k/n) for k = 0, …, n − 1. They are the vertices of a regular n-gon on the unit circle. Because they are the roots of zⁿ − 1, Vieta gives their sum (0 for n ≥ 2) and their product. More generally, zⁿ = c has n roots equally spaced on a circle of radius |c|<sup>1/n</sup>.</p>
<div class="rule"><span class="k">Roots</span> zⁿ = 1 ⇔ z = cis(2πk/n), k = 0, 1, …, n − 1<br>
<span class="k">Factorization</span> zⁿ − 1 = ∏<sub>k=0</sub><sup>n−1</sup>(z − ωᵏ)<br>
<span class="k">Sum</span> 1 + ω + ω² + … + ωⁿ⁻¹ = 0 (n ≥ 2)<br>
<span class="k">Power sums</span> ∑<sub>k</sub> ω<sup>jk</sup> = n if n | j, otherwise 0<br>
<span class="k">Product</span> the product of all n roots is (−1)ⁿ⁺¹; ∏<sub>k=1</sub><sup>n−1</sup>(1 − ωᵏ) = n<br>
<span class="k">Cube roots</span> ω = (−1 + i√3)/2: ω³ = 1, ω² + ω + 1 = 0, ω̄ = ω²<br>
<span class="k">Filter</span> the sum of the coefficients of P at exponents divisible by 3 is (P(1) + P(ω) + P(ω²))/3</div>
<p><b>Example:</b> Solve z³ = 8. The roots are 2·cis(0°, 120°, 240°). <b>Answer:</b> 2, −1 + i√3, −1 − i√3.</p>
<p><b>Example:</b> C(9, 0) + C(9, 3) + C(9, 6) + C(9, 9): with P(x) = (1 + x)⁹, 1 + ω = −ω², so (1 + ω)⁹ = −1 and likewise (1 + ω²)⁹ = −1. The sum is (512 − 1 − 1)/3. <b>Answer:</b> 170 (check: 1 + 84 + 84 + 1).</p>
<p><b>Example:</b> The roots of z⁶ = 64 form a regular hexagon of circumradius 2. <b>Answer:</b> area (3√3/2)·4 = 6√3.</p>
<p><b>Trap:</b> zⁿ = c has exactly n roots. Do not stop after the obvious real ones. The non-real roots of x³ = 1 satisfy x² + x + 1 = 0, not x² − x + 1 = 0.</p>`},
{h:'Geometry in the complex plane',html:`<p>Complex numbers are points, and the basic operations are transformations: adding w translates, multiplying by cis θ rotates about the origin, and multiplying by a real k &gt; 0 scales. |z − w| is the distance between z and w. Many locus problems become simple once you read |z − a| as a distance.</p>
<div class="rule"><span class="k">Distance</span> |z − w| = the distance between the points z and w<br>
<span class="k">Circle</span> |z − a| = r is a circle centered at a with radius r<br>
<span class="k">Perpendicular bisector</span> |z − a| = |z − b|<br>
<span class="k">Ellipse</span> |z − a| + |z − b| = 2c (with 2c &gt; |a − b|)<br>
<span class="k">Rotation</span> multiplying by i rotates by 90°; rotating z about c by θ gives c + (z − c)cis θ<br>
<span class="k">Midpoint / centroid</span> (a + b)/2; (a + b + c)/3<br>
<span class="k">Equilateral</span> a, b, c form an equilateral triangle ⇔ a² + b² + c² = ab + bc + ca<br>
<span class="k">Extremes</span> on |z − a| = r: the maximum |z| is |a| + r and the minimum is ||a| − r|</div>
<p><b>Example:</b> Rotate 3 + i by 90° counterclockwise about 1: 1 + (2 + i)i = 1 + 2i − 1. <b>Answer:</b> 2i.</p>
<p><b>Example:</b> If |z − 3 − 4i| = 2, the largest possible |z| is |3 + 4i| + 2. <b>Answer:</b> 7.</p>
<p><b>Example:</b> Two vertices of a square are 0 and 2 + i, and the square lies counterclockwise from that side. The next vertex is (2 + i) + i(2 + i) = 2 + i + 2i − 1 = 1 + 3i, and the fourth vertex is i(2 + i) = −1 + 2i. <b>Answer:</b> 1 + 3i and −1 + 2i.</p>
<p><b>Example:</b> The set |z − 1| = |z + i| is the perpendicular bisector of 1 and −i. <b>Answer:</b> the line y = −x.</p>
<p><b>Trap:</b> Multiplying by i rotates about the <i>origin</i>. To rotate about another point, translate it to the origin first.</p>`}
]},
{id:'conic',t:'Conics',sections:[
{h:'Parabolas',html:`<p>A parabola is the set of points equidistant from a <b>focus</b> and a line called the <b>directrix</b>. With the focus at (0, p) and the directrix y = −p, the distance condition x² + (y − p)² = (y + p)² simplifies to x² = 4py. The vertex lies midway between the focus and the directrix. Every quadratic y = ax² + bx + c is such a parabola, with 4p = 1/a.</p>
<div class="rule"><span class="k">Standard form</span> x² = 4py: vertex (0, 0), focus (0, p), directrix y = −p, axis x = 0<br>
<span class="k">Sideways</span> y² = 4px: focus (p, 0), directrix x = −p<br>
<span class="k">Shifted</span> (x − h)² = 4p(y − k): vertex (h, k), focus (h, k + p), directrix y = k − p<br>
<span class="k">Quadratic</span> y = ax² + bx + c: vertex x = −b/(2a), focal distance p = 1/(4a)<br>
<span class="k">Latus rectum</span> the chord through the focus parallel to the directrix has length |4p|<br>
<span class="k">Reflection</span> rays parallel to the axis reflect through the focus<br>
<span class="k">Tangency</span> a line y = mx + k is tangent to y = ax² + bx + c ⇔ the resulting quadratic has discriminant 0</div>
<p><b>Example:</b> y = x²/8 is x² = 8y, so 4p = 8 and p = 2. <b>Answer:</b> focus (0, 2), directrix y = −2.</p>
<p><b>Example:</b> y = x² − 4x + 7 = (x − 2)² + 3, so p = 1/4. <b>Answer:</b> vertex (2, 3), focus (2, 13/4), directrix y = 11/4.</p>
<p><b>Example:</b> The point (4, 2) lies on x² = 8y. Its distance to the focus (0, 2) equals its distance to the directrix: 2 − (−2). <b>Answer:</b> 4.</p>
<p><b>Example:</b> For which k is y = 2x + k tangent to y = x²? We need x² − 2x − k = 0 to have Δ = 4 + 4k = 0. <b>Answer:</b> k = −1.</p>
<p><b>Trap:</b> In x² = 4py the focus is at distance p, not 4p, from the vertex. In y = ax² the focus is at height 1/(4a), not a/4.</p>`},
{h:'Ellipses',html:`<p>An ellipse is the set of points whose distances to two foci add up to a constant 2a. At the end of the minor axis, both distances equal a, and a right triangle with legs b and c gives a² = b² + c². An ellipse is a circle stretched by a factor of a/b along one axis, which explains its area πab.</p>
<div class="rule"><span class="k">Standard form</span> x²/a² + y²/b² = 1 (a ≥ b): major axis 2a, minor axis 2b<br>
<span class="k">Foci</span> (±c, 0) with c² = a² − b²<br>
<span class="k">Focal sum</span> PF<sub>1</sub> + PF<sub>2</sub> = 2a for every point P on the ellipse<br>
<span class="k">Eccentricity</span> e = c/a, with 0 ≤ e &lt; 1 (a circle has e = 0)<br>
<span class="k">Area</span> πab (no simple exact formula for the perimeter)<br>
<span class="k">Directrices</span> x = ±a/e = ±a²/c; PF = e·(distance to the directrix)<br>
<span class="k">Latus rectum</span> 2b²/a<br>
<span class="k">Shifted</span> (x − h)²/a² + (y − k)²/b² = 1, centered at (h, k); complete the square to get there</div>
<p><b>Example:</b> 9x² + 25y² = 225 becomes x²/25 + y²/9 = 1, so a = 5, b = 3 and c = √(25 − 9) = 4. <b>Answer:</b> foci (±4, 0), area 15π, e = 4/5.</p>
<p><b>Example:</b> For a point P on that ellipse, PF<sub>1</sub> + PF<sub>2</sub> = 2a. <b>Answer:</b> 10.</p>
<p><b>Example:</b> 4x² + y² − 8x + 4y = 8 becomes 4(x − 1)² + (y + 2)² = 16, that is (x − 1)²/4 + (y + 2)²/16 = 1. <b>Answer:</b> center (1, −2), vertical major axis of length 8.</p>
<p><b>Trap:</b> For an ellipse c² = a² − b², but for a hyperbola c² = a² + b², so do not swap them. The larger denominator marks the major axis, which may be vertical.</p>`},
{h:'Hyperbolas and classifying conics',html:`<p>A hyperbola is the set of points whose distances to two foci <i>differ</i> by a constant 2a. Far from the center, the curve hugs its <b>asymptotes</b> y = ±(b/a)x, found by replacing the 1 with 0 in the standard form. Rotated rectangular hyperbolas like xy = k appear often on the AMC. The general second-degree equation is classified by its discriminant.</p>
<div class="rule"><span class="k">Standard form</span> x²/a² − y²/b² = 1: vertices (±a, 0), foci (±c, 0), c² = a² + b²<br>
<span class="k">Focal difference</span> |PF<sub>1</sub> − PF<sub>2</sub>| = 2a<br>
<span class="k">Asymptotes</span> y = ±(b/a)x; for y²/a² − x²/b² = 1 they are y = ±(a/b)x<br>
<span class="k">Eccentricity</span> e = c/a &gt; 1<br>
<span class="k">Rectangular</span> xy = k: the asymptotes are the axes; for xy = 1, vertices (±1, ±1) (same signs) and foci (±√2, ±√2)<br>
<span class="k">Classify</span> Ax² + Bxy + Cy² + Dx + Ey + F = 0: B² − 4AC &lt; 0 ellipse (circle if B = 0, A = C), = 0 parabola, &gt; 0 hyperbola (barring degenerate cases)<br>
<span class="k">Degenerate</span> a pair of lines, a single point, or the empty set (for example x² − y² = 0 is two lines)</div>
<p><b>Example:</b> x²/9 − y²/16 = 1 has a = 3, b = 4, c = 5. <b>Answer:</b> foci (±5, 0), asymptotes y = ±4x/3, e = 5/3.</p>
<p><b>Example:</b> A point on that hyperbola is at distance 10 from one focus. Its distance to the other is 10 ± 6, giving 16 or 4. Distances of at least c − a = 2 are possible, so both values occur on the two branches. <b>Answer:</b> 4 or 16.</p>
<p><b>Example:</b> x² + xy + y² = 1 has B² − 4AC = 1 − 4 &lt; 0. <b>Answer:</b> an ellipse (rotated 45°).</p>
<p><b>Example:</b> The graph of x² − y² = 0 is the pair of lines y = ±x. <b>Answer:</b> two lines.</p>
<p><b>Trap:</b> Hyperbola uses c² = a² + b², and the focal condition uses the absolute difference. The asymptote slope is b/a only when the x-term is positive.</p>`}
]},
{id:'strat',t:'Contest Strategy & Techniques',sections:[
{h:'Using the answer choices: plugging in and estimation',html:`<p>The AMC is multiple choice, and the five options are information. Before you solve anything, scan them. Their <b>form</b> (do they all contain √3? π?) tells you what kind of answer to expect. Their <b>spread</b> tells you how precise an estimate must be. Their <b>size or parity</b> may rule some out immediately.</p>
<div class="rule"><span class="k">Back-solving</span> when the question asks for a number that satisfies a condition, test the choices, starting with the middle one (C), since the choices are usually in increasing order<br>
<span class="k">Plugging in</span> for "for all x" or "in terms of n" questions, pick simple values (0, 1, 2, or a convenient triangle) and see which choice matches<br>
<span class="k">Estimation</span> approximate √2 ≈ 1.414, √3 ≈ 1.732, π ≈ 3.1416, e ≈ 2.718 and compare with the choices<br>
<span class="k">Elimination</span> rule out choices with the wrong sign, the wrong parity, the wrong units, or an impossible size (a probability above 1, an area larger than the whole figure)<br>
<span class="k">Extreme cases</span> slide a point to an endpoint or make a triangle degenerate; the answer must still hold</div>
<p><b>Example:</b> "Which expression equals 1 + 3 + 5 + … + (2n − 1) for all n?" With n = 2, the sum is 4. Of the choices n², n(n + 1), 2n − 1, n² + 1 and (n + 1)², only n² gives 4. <b>Answer:</b> n².</p>
<p><b>Example:</b> Which is closest to √99 − √98: 0.03, 0.05, 0.07, 0.1, 0.5? Rationalize: 1/(√99 + √98) ≈ 1/19.85 ≈ 0.0504. <b>Answer:</b> 0.05.</p>
<p><b>Trap:</b> When you plug in values, avoid special ones (like 0 or 1) that make two choices agree, and test a second value if two survive. Estimates near 50/50 calls need more precision; do not guess blindly from a picture that may not be drawn to scale.</p>`},
{h:'Symmetry, small cases and working backwards',html:`<p><b>Symmetry:</b> if a problem is unchanged when you swap variables or rotate a figure, the answer usually shares that symmetry. Extreme values of symmetric expressions often occur when the variables are equal, and probabilities split evenly among symmetric outcomes. <b>Small cases:</b> when n = 2026, try n = 1, 2, 3, 4, then guess and check the pattern. <b>Working backwards:</b> when the final state is known, undo each step.</p>
<div class="rule"><span class="k">Symmetry</span> P(X first) = 1/k among k symmetric competitors; expected positions average out<br>
<span class="k">WLOG</span> order the variables (a ≤ b ≤ c) or place a figure conveniently (a vertex at the origin, a side on the x-axis)<br>
<span class="k">Small cases</span> compute the first few terms, find the pattern (linear? squares? powers of 2? Fibonacci? Catalan?), and confirm it with the next case<br>
<span class="k">Working backwards</span> reverse each operation from the end state (useful for "after these steps, X remains" problems)<br>
<span class="k">Complementary view</span> count or compute what you do not want when that is simpler</div>
<p><b>Example:</b> A process halves the remaining marbles and then removes one more, three times, leaving 1. Undo each step (add 1, then double): 1 → 4 → 10 → 22. <b>Answer:</b> 22 marbles at the start.</p>
<p><b>Example:</b> How many ways can dominoes tile a 2 × 10 board? Small cases: 2 × 1 has 1 way, 2 × 2 has 2, 2 × 3 has 3, 2 × 4 has 5. The pattern looks like Fibonacci, and the reason is that the left end is either one vertical domino or two stacked horizontal ones, so f(n) = f(n − 1) + f(n − 2). Continuing: 8, 13, 21, 34, 55, 89. <b>Answer:</b> 89.</p>
<p><b>Example:</b> 1 − 2 + 3 − 4 + … − 100: the pairs give −1 each, 50 times. <b>Answer:</b> −50.</p>
<p><b>Trap:</b> Patterns from small cases can break (for instance, points on a circle give 1, 2, 4, 8, 16 regions and then 31, not 32). Confirm your guess with a reason or one more case.</p>`},
{h:'Invariants and the extremal principle',html:`<p>An <b>invariant</b> is a quantity that a process never changes, such as a parity, a sum mod n, a product or a coloring count. If the start and target states have different invariant values, the target is unreachable. A <b>monovariant</b> changes in only one direction, which proves that a process terminates. The <b>extremal principle</b>: look at the largest, smallest, first or last object. Its extremality often forces a contradiction or reveals the structure.</p>
<div class="rule"><span class="k">Parity</span> each move changes a count by an even number ⇒ the parity of the count is invariant<br>
<span class="k">Sum mod n</span> track the total mod 3, mod 9, and so on (for example, the digit sum mod 9 under digit operations)<br>
<span class="k">Coloring</span> checkerboard-color the board: each domino covers one black and one white square<br>
<span class="k">Monovariant</span> a strictly decreasing nonnegative integer quantity ⇒ the process stops<br>
<span class="k">Extremal</span> consider the maximum element, the closest pair, the longest path, or the smallest counterexample</div>
<p><b>Example:</b> Two opposite corners are removed from an 8 × 8 board. Can 31 dominoes tile the rest? Opposite corners have the same color, leaving 32 squares of one color and 30 of the other, while every domino covers one of each. <b>Answer:</b> No.</p>
<p><b>Example:</b> The numbers 1, 2, …, 10 are on a board. Repeatedly replace any two numbers a, b by a + b + ab. The quantity ∏(x + 1) is invariant, because (a + 1)(b + 1) = a + b + ab + 1. So the final number is 11! − 1. <b>Answer:</b> 11! − 1 = 39,916,799.</p>
<p><b>Example:</b> Can 1 + 2 + … + 10 be made 0 by choosing a sign for each term? The total 55 is odd, and flipping a sign changes the sum by an even number. <b>Answer:</b> No.</p>
<p><b>Trap:</b> An invariant proves impossibility; it does not prove that a state <i>is</i> reachable. For that you need a construction.</p>`},
{h:'Time management, scoring and when to guess',html:`<p>The AMC 10 and AMC 12 each have 25 questions in 75 minutes, which averages 3 minutes per question. Problems get harder roughly in order. Scoring is <b>6 points per correct answer, 1.5 per blank and 0 per wrong answer</b>, so the maximum is 150. Because blanks earn points, accuracy is worth more than coverage.</p>
<div class="rule"><span class="k">Score</span> 6C + 1.5B (C correct, B blank)<br>
<span class="k">Random guess</span> expected value 6·(1/5) = 1.2 &lt; 1.5 ⇒ leave it blank<br>
<span class="k">One choice eliminated</span> 6·(1/4) = 1.5 = 1.5 ⇒ break-even<br>
<span class="k">Two eliminated</span> 6·(1/3) = 2 &gt; 1.5 ⇒ guess<br>
<span class="k">Three eliminated</span> 6·(1/2) = 3 ⇒ definitely guess<br>
<span class="k">Marginal value</span> each extra correct answer is worth +4.5 over a blank; each wrong answer costs −1.5 compared with a blank</div>
<p><b>Pacing plan:</b> Do problems 1–10 carefully, in about 15–20 minutes, because silly errors there are the most expensive. Then work through 11–25, skipping any problem that has no plan after about 2 minutes. Mark it, come back later, and leave about 5 minutes to check bubbles and recheck easy arithmetic. Many strong scorers fully solve about 18–20 problems and leave the rest blank.</p>
<p><b>Example:</b> 15 correct, 8 blank, 2 wrong: 6·15 + 1.5·8 = 90 + 12. <b>Answer:</b> 102.</p>
<p><b>Example:</b> Which is better: 16 correct with 9 blank, or 17 correct with 8 wrong? 96 + 13.5 = 109.5 versus 102. <b>Answer:</b> the careful 109.5.</p>
<p><b>Strategy notes:</b> AIME qualifying cutoffs vary by year and test, so check the published values for your target. If you need a high score to qualify, more educated guessing (with 2 or more choices eliminated) is reasonable. Read every word of the question ("not", "positive", "distinct", "at least") and answer exactly what was asked, for example the sum of the roots versus the roots themselves.</p>
<p><b>Trap:</b> Rushing the early problems to save time for hard ones usually lowers your score.</p>`}
]}
];

const VIS=[

   const ins=new THREE.Mesh(new THREE.SphereGeometry(s/2,40,24),vlMat(0xe8b931,.6));ins.position.y=s/2;E.root.add(ins);const out=new THREE.Mesh(new THREE.SphereGeometry(s*Math.sqrt(3)/2,40,24),vlMat(0xd6455a,.12));out.position.y=s/2;E.root.add(out);
   const mid=new THREE.Mesh(new THREE.SphereGeometry(s*Math.SQRT2/2,40,24),new THREE.MeshBasicMaterial({color:0xc8a2f0,wireframe:true,transparent:true,opacity:.25}));mid.position.y=s/2;E.root.add(mid);
   return`<div class="rule">Inscribed sphere (touches the faces, gold): r = s/2 = ${FQ(s,2)}<br>Midsphere (touches the edges, violet mesh): r = s√2/2<br>Circumscribed sphere (through the vertices, red): r = s√3/2</div><p>The three radii are half the face-to-face distance, half the face diagonal, and half the space diagonal. Ratio of volumes inscribed : circumscribed = 1 : 3√3.</p>`}},
 {id:'tetcube',n:'A tetrahedron inside a cube',topic:'3D geometry',ctl:[['s',2,8,4,'cube side s']],
  build(v){const s=v.s;const g=new THREE.BoxGeometry(s,s,s);const c=new THREE.Mesh(g,vlMat(0x5fd4c4,.08));c.position.y=s/2;c.add(vlEdges(g));E.root.add(c);
   const P=[[-s/2,0,-s/2],[s/2,0,s/2],[s/2,s,-s/2],[-s/2,s,s/2]];const geo=new THREE.BufferGeometry();const idx=[[0,1,2],[0,1,3],[0,2,3],[1,2,3]];const arr=[];idx.forEach(f=>f.forEach(i=>arr.push(...P[i])));geo.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));geo.computeVertexNormals();
   const t=new THREE.Mesh(geo,vlMat(0xe8b931,.6));E.root.add(t);for(let i=0;i<4;i++)for(let j=i+1;j<4;j++)vlLine(P[i],P[j],0xe8b931);
   return`<div class="rule">Using alternate corners of a cube of side ${s} gives a regular tetrahedron with edge ${s}√2.<br>Volume = cube − 4 corner pyramids = s³ − 4 · (⅙ s³) = ⅓ s³ = ${FQ(s*s*s,3)}</div><p>So a regular tetrahedron of edge a has volume a³/(6√2): put a = s√2 into ⅓ s³. This picture also shows the 6 edges of the tetrahedron are the 6 face diagonals of the cube.</p>`}},
 {id:'pascal',n:'Pascal’s triangle as towers',topic:'Counting',ctl:[['n',2,9,6,'rows 0 to n']],
  build(v){const N=v.n;const max=choose(N,Math.floor(N/2));for(let n=0;n<=N;n++)for(let k=0;k<=n;k++){const val=choose(n,k),h=.4+5*val/max;const m=new THREE.Mesh(new THREE.BoxGeometry(.8,h,.8),vlMat(k===0||k===n?0x5fd4c4:0xe8b931,.85));m.position.set((k-n/2)*1.1,h/2,(n-N/2)*1.1);E.root.add(m);vlLab(String(val),new THREE.Vector3((k-n/2)*1.1,h+.3,(n-N/2)*1.1))}
   return`<div class="rule">Row n holds C(n, 0), …, C(n, n). Each entry is the sum of the two above it: C(n, k) = C(n − 1, k − 1) + C(n − 1, k).<br>Row ${N} sums to 2<sup>${N}</sup> = ${2**N}.</div><p>The middle towers are tallest: the central binomial coefficient C(${N}, ${Math.floor(N/2)}) = ${max}. Hockey stick: summing down a diagonal gives the entry just below and to the side.</p>`}},
 {id:'dice',n:'Two dice: the 36-outcome grid',topic:'Probability',ctl:[['s',2,12,7,'target sum']],
  build(v){let c=0;for(let a=1;a<=6;a++)for(let b=1;b<=6;b++){const hit=a+b===v.s;if(hit)c++;const m=new THREE.Mesh(new THREE.BoxGeometry(.9,hit?1.6:.3,.9),vlMat(hit?0xe8b931:0x2b3d43,hit?1:.9));m.position.set((a-3.5)*1.2,hit?.8:.15,(b-3.5)*1.2);E.root.add(m)}
   for(let a=1;a<=6;a++){vlLab(String(a),new THREE.Vector3((a-3.5)*1.2,.2,-5));vlLab(String(a),new THREE.Vector3(-5,.2,(a-3.5)*1.2))}
   return`<div class="rule">Sum ${v.s}: ${c} of 36 outcomes, probability ${FQ(c,36)}.</div><p>The raised towers lie on one diagonal of the grid, which is why the counts go 1, 2, 3, 4, 5, 6, 5, 4, 3, 2, 1. Always count ordered pairs: (1, 2) and (2, 1) are different outcomes.</p>`}},
 {id:'stars',n:'Stars and bars',topic:'Counting',ctl:[['n',2,10,7,'stars n'],['k',2,5,3,'boxes k']],
  build(v){const n=v.n,k=v.k;const seq=shuffle(Array(n).fill('*').concat(Array(k-1).fill('|')));const L=seq.length;const counts=[0];seq.forEach((c,i)=>{const x=(i-(L-1)/2)*1.1;if(c==='*'){const m=new THREE.Mesh(new THREE.SphereGeometry(.38,16,12),vlMat(0xe8b931));m.position.set(x,.4,0);E.root.add(m);counts[counts.length-1]++}else{const m=new THREE.Mesh(new THREE.BoxGeometry(.15,1.6,.8),vlMat(0xd6455a));m.position.set(x,.8,0);E.root.add(m);counts.push(0)}});
   return`<div class="rule">This arrangement means x₁, …, x<sub>${k}</sub> = ${counts.join(', ')} (sum ${n}).<br>Arrangements of ${n} stars and ${k-1} bars: C(${n+k-1}, ${k-1}) = ${choose(n+k-1,k-1)}</div><p>Every way to split ${n} identical items into ${k} boxes is a row of ${n} stars and ${k-1} bars, and every row is a split. Press Rebuild for another one. For positive parts, first give each box one item: C(n − 1, k − 1).</p>`}});

/* ---- AMC bank round 3 (176 verified problems) ---- */
AB.push(
 {u:'A1',d:1,q:'Kira jogs up a hill at 6 km/h and then returns down the same path at 15 km/h. What is her average speed, in km/h, for the whole round trip?',c:['8','60/7','9','10','21/2'],a:'B',s:['Average speed is total distance divided by total time, not the average of the two speeds.','If the path has length d, the time is d/6 + d/15 = 7d/30, so the average speed is 2d ÷ (7d/30) = 60/7.','This is the harmonic mean 2·6·15/(6 + 15) = 60/7.']},
 {u:'A1',d:1,q:'Today Dana is three times as old as Eli. In 8 years Dana will be twice as old as Eli. In how many years from today will the ratio of Dana’s age to Eli’s age be 4 : 3?',c:['16','24','32','40','48'],a:'D',s:['Let Eli be e, so Dana is 3e; then 3e + 8 = 2(e + 8) gives e = 8 and Dana is 24.','We need (24 + t)/(8 + t) = 4/3, so 72 + 3t = 32 + 4t.','Thus t = 40 years.']},
 {u:'A1',d:1,q:'Nonzero real numbers a and b have a sum that is 5 times their difference: a + b = 5(a − b). What is a/b + b/a?',c:['13/6','5/2','26/9','10/3','13/3'],a:'A',s:['From a + b = 5a − 5b we get 6b = 4a, so a/b = 3/2.','Then a/b + b/a = 3/2 + 2/3 = 13/6.']},
 {u:'A1',d:2,q:'A motorboat travels 3 km downstream in the same time that it travels 2 km upstream. A trip of 36 km downstream followed by 36 km back upstream takes 5 hours in all. What is the speed of the boat in still water, in km/h?',c:['15','17','18','20','25'],a:'A',s:['Let the boat speed be b and the current c; equal times give (b + c)/(b − c) = 3/2, so b = 5c.','Downstream speed is 6c and upstream speed is 4c, so 36/(6c) + 36/(4c) = 15/c = 5.','Hence c = 3 and b = 15 km/h.']},
 {u:'A1',d:2,q:'Between 4:00 and 5:00, how many minutes after 4:00 do the hour hand and the minute hand of a clock point in exactly opposite directions?',c:['240/11','480/11','540/11','600/11','55'],a:'D',s:['The minute hand moves 6° per minute and the hour hand 0.5° per minute, so the minute hand gains 5.5° per minute.','At 4:00 the minute hand is 120° behind the hour hand; to be opposite it must get 180° ahead, a total gain of 300°.','So 5.5t = 300 and t = 600/11 minutes (about 54.5).']},
 {u:'A1',d:2,q:'If Lena scores 97 on her next test, her test average will go up by 2 points. If instead she scores 73 on her next test, her average will go down by 1 point. What is her current test average?',c:['75','77','79','80','81'],a:'E',s:['If she has taken k tests with average m, a new score x changes the average by (x − m)/(k + 1).','So 97 − m = 2(k + 1) and 73 − m = −(k + 1); subtracting gives 24 = 3(k + 1), so k + 1 = 8.','Then m = 73 + 8 = 81.']},
 {u:'A1',d:2,q:'The grass in a pasture starts at some amount and grows at a constant rate. Twelve cows would eat all the grass, including what grows meanwhile, in 15 days, while 18 cows would eat it all in 9 days. Every cow eats at the same constant rate. In how many days would 30 cows eat all the grass?',c:['4','5','27/5','6','15/2'],a:'B',s:['Measure grass in cow-days: if G is the initial amount and r the daily growth, G + 15r = 180 and G + 9r = 162.','Subtracting gives r = 3 and G = 135.','With 30 cows, 135 + 3t = 30t, so t = 5 days.']},
 {u:'A1',d:2,q:'Two trains leave towns A and B at the same moment and travel toward each other on the same track at constant speeds. After they meet, the first train needs 4 more hours to reach B and the second needs 9 more hours to reach A. The towns are 300 km apart. What is the speed of the first train, in km/h?',c:['24','25','30','36','45'],a:'C',s:['Let them meet after t hours with speeds u (first) and v (second). The first covers the second’s part: vt = 4u; the second covers the first’s part: ut = 9v.','Multiplying gives t² = 36, so t = 6 and u/v = t/4 = 3/2.','The first train takes 6 + 4 = 10 hours for 300 km, so its speed is 30 km/h.']},
 {u:'A1',d:3,q:'Car A leaves a town at noon driving at 50 km/h. Car B leaves the same town on the same road at 1:00 p.m. driving at 60 km/h. Car C leaves the town on the same road at 2:00 p.m. at a constant speed, passes car B, and passes car A exactly 30 minutes after passing car B. What is the sum of all possible speeds of car C, in km/h?',c:['90','100','150','180','190'],a:'E',s:['If C’s speed is v and it catches B after t hours, then vt = 60(t + 1), so t = 60/(v − 60); similarly C catches A after 100/(v − 50) hours.','Setting 100/(v − 50) − 60/(v − 60) = 1/2 and clearing denominators gives v² − 190v + 9000 = 0.','The roots v = 90 and v = 100 both work (each passes B before A), and their sum is 190 by Vieta.']},
 {u:'A1',d:3,q:'Real numbers a and b satisfy a³ − 3ab² = 11 and b³ − 3a²b = 2. What is a² + b²?',c:['5','√26','6','3√5','13'],a:'A',s:['These are the parts of a cube: (a + bi)³ = (a³ − 3ab²) + (3a²b − b³)i = 11 − 2i.','Taking absolute values, |a + bi|³ = √(11² + 2²) = √125 = 5√5.','So |a + bi| = √5, and a² + b² = 5.']},
 {u:'A1',d:3,q:'A faulty clock runs at a constant rate. Its hour and minute hands are on top of each other every 65 minutes of real time. How many minutes does the clock gain in 24 real hours?',c:['720/143','1440/143','11','12','144/11'],a:'B',s:['On a correct clock the minute hand gains 330° per hour on the hour hand, so the hands coincide every 720/11 minutes of clock time.','The faulty clock shows 720/11 minutes while 65 real minutes pass, so it runs at (720/11)/65 = 144/143 of the true rate.','In 1440 real minutes it shows 1440·144/143 minutes, a gain of 1440/143 minutes (about 10.07).']},
 {u:'A1',d:3,q:'Al alone can do a job in 9 hours and Bo alone can do it in 12 hours. They take turns working on it one hour at a time, with only one person working at any moment, until the job is done. How many more minutes does the job take if Bo works the first hour than if Al works the first hour?',c:['1','2','3','4','5'],a:'E',s:['Each pair of hours completes 1/9 + 1/12 = 7/36 of the job, so after 10 hours (5 turns each) 35/36 is done in either order.','Checking earlier hours shows the job is not finished before then, so 1/36 remains for hour 11.','If Al started, hour 11 is Al’s: 1/36 ÷ 1/9 = 1/4 hour; if Bo started, it is Bo’s: 1/36 ÷ 1/12 = 1/3 hour.','The difference is 1/3 − 1/4 = 1/12 hour = 5 minutes.']},
 {u:'A2',d:1,q:'For some real number b, the line y = 2x + b is tangent to the parabola y = x² − 4x + 13. What is b?',c:['−4','−1','4','8','13'],a:'C',s:['Tangency means x² − 4x + 13 = 2x + b has exactly one solution, i.e. x² − 6x + (13 − b) = 0 has discriminant 0.','So 36 − 4(13 − b) = 0, giving b = 4 (the point of tangency is (3, 10)).']},
 {u:'A2',d:1,q:'Write (2x − 1)⁶ = a₆x⁶ + a₅x⁵ + ⋯ + a₁x + a₀. What is a₀ + a₂ + a₄ + a₆?',c:['−364','1','364','365','729'],a:'D',s:['Let f(x) = (2x − 1)⁶. Then f(1) is the sum of all coefficients and f(−1) is the alternating sum.','Adding, f(1) + f(−1) = 2(a₀ + a₂ + a₄ + a₆).','Since f(1) = 1 and f(−1) = 729, the answer is 730/2 = 365.']},
 {u:'A2',d:2,q:'A polynomial P(x) with integer coefficients satisfies P(1) = 4 and P(6) = 19. Which of the following could be P(11)?',c:['33','34','35','36','37'],a:'B',s:['For integer-coefficient polynomials, a − b divides P(a) − P(b) for all integers a ≠ b.','So 10 divides P(11) − 4, which among the choices allows only 34 (and 5 divides P(11) − 19, consistent).','Indeed P(x) = 3x + 1 gives P(1) = 4, P(6) = 19, P(11) = 34.']},
 {u:'A2',d:2,q:'For how many integers k are both roots of x² − 2kx + k + 6 = 0 real and greater than 1?',c:['2','3','4','5','7'],a:'C',s:['Let f(x) = x² − 2kx + k + 6. Both roots exceed 1 exactly when the discriminant is ≥ 0, the vertex k is > 1, and f(1) > 0.','The discriminant condition 4k² − 4(k + 6) ≥ 0 gives k ≤ −2 or k ≥ 3; f(1) = 7 − k > 0 gives k < 7.','Together with k > 1 we need 3 ≤ k < 7, so k = 3, 4, 5, 6: four integers.']},
 {u:'A2',d:2,q:'Let M and m be the largest and smallest values of (x² + x + 1)/(x² + 1) over all real x. What is M·m?',c:['1/4','3/8','1/2','2/3','3/4'],a:'E',s:['A value y is attained exactly when y(x² + 1) = x² + x + 1, i.e. (y − 1)x² − x + (y − 1) = 0, has a real solution x.','For y ≠ 1 this needs discriminant 1 − 4(y − 1)² ≥ 0, so 1/2 ≤ y ≤ 3/2 (attained at x = −1 and x = 1).','Thus M·m = (3/2)(1/2) = 3/4.']},
 {u:'A2',d:2,q:'Real numbers x, y, z satisfy 2x + 3y + 6z = 14. What is the minimum possible value of x² + y² + z²?',c:['1','14/11','2','4','588/121'],a:'D',s:['By the Cauchy–Schwarz inequality, (2x + 3y + 6z)² ≤ (2² + 3² + 6²)(x² + y² + z²) = 49(x² + y² + z²).','So x² + y² + z² ≥ 196/49 = 4.','Equality holds when (x, y, z) is proportional to (2, 3, 6), namely (4/7, 6/7, 12/7), so the minimum is 4.']},
 {u:'A2',d:2,q:'Let f(x) = x² + 6x + 10. What is the minimum value of f(f(x)) over all real x?',c:['10','17','26','37','50'],a:'B',s:['Complete the square: f(x) = (x + 3)² + 1, so f(x) takes exactly the values y ≥ 1.','On y ≥ 1, f(y) is increasing because its vertex −3 lies to the left of 1.','So the minimum of f(f(x)) is f(1) = 17, reached at x = −3.']},
 {u:'A2',d:3,q:'Let r, s, t be the roots of x³ + 2x² − x + 3 = 0. What is 1/(1 − r) + 1/(1 − s) + 1/(1 − t)?',c:['−2','−6/5','−1/5','5/6','6/5'],a:'E',s:['If P(x) = (x − r)(x − s)(x − t), then P′(x)/P(x) = 1/(x − r) + 1/(x − s) + 1/(x − t).','So the requested sum equals P′(1)/P(1).','Here P(1) = 1 + 2 − 1 + 3 = 5 and P′(x) = 3x² + 4x − 1 gives P′(1) = 6, so the sum is 6/5.']},
