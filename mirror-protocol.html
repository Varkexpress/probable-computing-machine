UNITS.push(
 {u:'A5',n:'Polynomials and conics',amc12:1,body:`<div class="rule">Vieta for degree n: sum of roots = −(next coefficient)/(leading); product = (−1)ⁿ(constant)/(leading).<br>Newton’s sums: pₖ = rᵏ + sᵏ + …; for x² − ex + f: pₖ = e·pₖ₋₁ − f·pₖ₋₂.<br>Rational Root Theorem: rational roots are ±(factor of constant)/(factor of leading).<br>Remainder of p(x) ÷ (x − a)(x − b) is the line through (a, p(a)) and (b, p(b)).<br>Parabola y = ax² + bx + c: vertex at x = −b/(2a). Ellipse x²/a² + y²/b² = 1: area πab, foci at ±√(a² − b²).</div><p>Integer-coefficient polynomials: a − b divides p(a) − p(b). Pairing roots r and 1/r, or substituting y = x + 1/x, simplifies palindromic polynomials.</p>`},
 {u:'C2',n:'Advanced counting: recursion, bijections, derangements',amc12:1,body:`<div class="rule">Recursion: count strings or tilings by the last step (Fibonacci-style aₙ = aₙ₋₁ + aₙ₋₂).<br>Derangements: D₁ = 0, D₂ = 1, D₃ = 2, D₄ = 9, D₅ = 44; Dₙ = (n − 1)(Dₙ₋₁ + Dₙ₋₂).<br>Distributing n identical objects into k distinct boxes: C(n + k − 1, k − 1). Distinct objects: kⁿ.<br>Hockey stick: C(r, r) + C(r + 1, r) + … + C(n, r) = C(n + 1, r + 1).</div><p>A bijection turns a hard count into an easy one (paths ↔ binary strings, subsets ↔ yes/no choices). When symmetry is involved, count arrangements and divide by the number of equivalent copies only if every arrangement has the same number of copies.</p>`},
 {u:'G4',n:'Advanced geometry: Stewart, mass points, Ptolemy, trig areas',amc12:1,body:`<div class="rule">Stewart: for cevian AD = d with BD = m, DC = n, BC = a: b²m + c²n = a(d² + mn).<br>Area = ½ab sin C = abc/(4R) = rs.<br>Ptolemy (cyclic ABCD): AC · BD = AB · CD + AD · BC.<br>Mass points: masses inversely proportional to the segment lengths on each side.<br>Angle bisector length: d² = bc(1 − a²/(b + c)²).</div><p>For ratios of areas, share a height or a base. Chains of similar triangles often come from parallel lines or equal angles in a circle.</p>`});

amcBuild=function(level){bankRecent.clear();const u10=['A1','A2','A3','N1','N2','C1','P1','G1','G2','G3','S1'],u12=u10.concat(['A4','T1','A5','C2','G4']);const units=level===12?u12:u10;const gens=['a1','a7','a8','n4','g3','k1','a6','n2'];
 const plan=[[1,8],[2,9],[3,8]];const items=[];const used=new Set();
 plan.forEach(([d,n],idx)=>{for(let i=0;i<n;i++){if(idx===0&&i<2){const g=gens[i+Math.floor(Math.random()*6)];const it=TBYID[g].gen();it.tid=g;items.push(it);continue}
   let pool=AB.filter(p=>p.d===d&&units.includes(p.u)&&!used.has(p));if(level===12&&d>=2&&Math.random()<.4){const adv=pool.filter(p=>['A4','T1','A5','C2','G4'].includes(p.u));if(adv.length)pool=adv}
   if(!pool.length)pool=AB.filter(q=>!used.has(q)&&units.includes(q.u));const p=pick(pool);used.add(p);const it=bankItem(p);it.tid='B_'+p.u;items.push(it)}});
 return items.slice(0,25)};

AB.push(
 {u:'A1',d:1,q:'A jacket’s price is raised by p percent, and later the new price is lowered by p percent. The final price is 84% of the original price. What is p?',c:['16','20','32','40','60'],a:'D',s:['If the original price is 1, the final price is (1 + p/100)(1 − p/100) = 1 − (p/100)².','Setting this equal to 0.84 gives (p/100)² = 0.16, so p/100 = 0.4.','Thus p = 40.']},
 {u:'A1',d:1,q:'Real numbers a, b, c, d satisfy a + b = 12, b + c = 17, and c + d = 15. What is d + a?',c:['5','8','10','12','15'],a:'C',s:['The individual values are not determined, so look for a combination of the given sums.','(a + b) + (c + d) and (b + c) + (d + a) both equal a + b + c + d.','So 12 + 15 = 17 + (d + a), which gives d + a = 10.']},
 {u:'A1',d:1,q:'The average age of the members of a family is 20. The father is 48 years old, and the average age of the other members (the mother and the children) is 16. How many children are in the family?',c:['6','7','8','10','12'],a:'A',s:['Let n be the number of family members, so the total of the ages is 20n.','The total is also 48 + 16(n − 1), so 20n = 16n + 32 and n = 8.','Removing the father and mother leaves 8 − 2 = 6 children.']},
 {u:'A1',d:2,q:'What is the sum of all two-digit positive integers that exceed the product of their digits by exactly 12?',c:['28','39','52','67','78'],a:'D',s:['Write the number as 10a + b, so 10a + b − ab = 12.','Rearrange to a(10 − b) − (10 − b) = 2, which factors as (a − 1)(10 − b) = 2.','The factor pairs (1, 2) and (2, 1) give a = 2, b = 8 and a = 3, b = 9, i.e. 28 and 39.','Their sum is 28 + 39 = 67.']},
 {u:'A1',d:2,q:'Pipe A can fill an empty tank in 6 hours and pipe B can fill it in 4 hours, while drain C can empty a full tank in 3 hours. The tank is empty when pipes A and B are opened at noon. At 1:00 p.m. drain C is accidentally opened as well, and all three stay open. At what time is the tank first full?',c:['6:00 p.m.','7:00 p.m.','8:00 p.m.','9:00 p.m.','10:00 p.m.'],a:'C',s:['In the first hour A and B fill 1/6 + 1/4 = 5/12 of the tank.','With the drain open, the net rate is 1/6 + 1/4 − 1/3 = 1/12 of the tank per hour.','The remaining 7/12 takes (7/12)/(1/12) = 7 more hours, so the tank is full 8 hours after noon, at 8:00 p.m.']},
 {u:'A1',d:2,q:'Buses run in both directions along a long straight road; buses leave each end at equal time intervals and all travel at the same constant speed. A cyclist riding along the road at constant speed notices that a bus going her way overtakes her every 20 minutes, while a bus coming toward her passes her every 5 minutes. Every how many minutes does a bus leave each end of the road?',c:['8','10','12','12.5','15'],a:'A',s:['Let buses have speed v, the cyclist speed u, and let consecutive buses be d apart, so d = vT where T is the interval.','Overtaking buses close the gap at v − u and oncoming ones at v + u, so v − u = d/20 and v + u = d/5.','Adding gives 2v = d/20 + d/5 = d/4, so d/v = 8.','A bus leaves every 8 minutes.']},
 {u:'A1',d:2,q:'A cyclist leaves a town riding at 15 km/h. Two hours later a car leaves the same town on the same road at 60 km/h. After passing the cyclist, the car reaches a village 90 km from the town, immediately turns around, and drives back at the same speed. How many kilometers from the town is the car when it meets the cyclist again?',c:['60','66','72','75','80'],a:'A',s:['Measure time t in hours from when the cyclist starts; the cyclist is 15t km from town.','The car reaches the village at t = 2 + 90/60 = 3.5 and afterward is 90 − 60(t − 3.5) = 300 − 60t km from town.','Setting 15t = 300 − 60t gives t = 4, so they meet 15 · 4 = 60 km from town.']},
 {u:'A1',d:2,q:'A list of 8 distinct positive integers has mean 15 and median 10. What is the largest possible value of the greatest integer in the list?',c:['55','59','61','65','69'],a:'E',s:['The eight numbers sum to 8 · 15 = 120, so make the other seven as small as possible.','The median is the average of the 4th and 5th numbers, so they sum to 20; the smallest choice for the 5th number is 11 (with 9 as the 4th).','The three smallest can be 1, 2, 3 and the 6th and 7th can be 12 and 13, giving 6 + 20 + 25 = 51.','The greatest number can then be 120 − 51 = 69.']},
 {u:'A1',d:2,q:'At noon two clocks with ordinary 12-hour faces are both set to the correct time. One clock gains 2 minutes every hour and the other loses 3 minutes every hour. After how many days will both clocks next show the correct time at the same moment?',c:['30','45','60','90','120'],a:'A',s:['A 12-hour clock shows the correct time again whenever its error is a multiple of 12 hours, or 720 minutes.','The fast clock is right every 720/2 = 360 hours and the slow clock every 720/3 = 240 hours.','Both are right together after lcm(360, 240) = 720 hours, which is 30 days.']},
 {u:'A1',d:3,q:'A group of friends agrees to split a restaurant bill equally. If 3 more friends had come, each person would have paid $9 less. If 2 fewer friends had come, each person would have paid $11 more. What was the total bill, in dollars?',c:['198','240','264','288','330'],a:'C',s:['Let there be n friends and a bill of B dollars, so B/n − B/(n + 3) = 9 and B/(n − 2) − B/n = 11.','These simplify to 3B = 9n(n + 3) and 2B = 11n(n − 2), so B = 3n(n + 3) = 11n(n − 2)/2.','Dividing by n gives 6n + 18 = 11n − 22, so n = 8.','Then B = 3 · 8 · 11 = 264.']},
 {u:'A1',d:3,q:'Positive real numbers x and y satisfy x + 1/y = 10 and y + 1/x = 5/12. What is the sum of all possible values of xy?',c:['2/3','3/2','2','13/6','25/6'],a:'D',s:['Multiply the equations: (x + 1/y)(y + 1/x) = xy + 2 + 1/(xy) = 10 · 5/12 = 25/6.','With t = xy this is t + 1/t = 13/6, so 6t² − 13t + 6 = 0 and t = 3/2 or 2/3.','Both work: (x, y) = (6, 1/4) and (4, 1/6) satisfy the equations.','The sum of the possible values is 3/2 + 2/3 = 13/6.']},
 {u:'A1',d:3,q:'Ann and Bob must both travel to a town 30 km away and share one bicycle, which only one person can ride at a time. Ann walks at 4 km/h and Bob walks at 6 km/h, and either of them rides the bicycle at 12 km/h. They start together; Ann rides the bicycle part of the way, leaves it by the road, and walks the rest, while Bob walks until he reaches the bicycle and then rides it the rest of the way. What is the least possible number of minutes until both have arrived?',c:['225','240','250','260','275'],a:'C',s:['If the bicycle is left x km from the start, Ann takes x/12 + (30 − x)/4 hours and Bob takes x/6 + (30 − x)/12 hours.','Ann’s time decreases and Bob’s increases as x grows, so the later arrival is earliest when the two times are equal.','Equating gives 7.5 − x/6 = 2.5 + x/12, so x/4 = 5 and x = 20.','Then both take 20/12 + 10/4 = 25/6 hours, which is 250 minutes.']},
 {u:'A2',d:1,q:'The roots of x² + bx + c = 0 are each 2 greater than the roots of x² − 5x + 3 = 0. What is b + c?',c:['−9','−2','4','8','17'],a:'D',s:['If r is a root of x² − 5x + 3, then r + 2 is a root of the new quadratic, so the new quadratic is (x − 2)² − 5(x − 2) + 3.','Expanding gives x² − 9x + 17, so b = −9 and c = 17.','Thus b + c = 8.']},
 {u:'A2',d:1,q:'What is √(11 + 6√2) − √(11 − 6√2)?',c:['2','2√2','3','2√3','6'],a:'B',s:['Look for (a + b√2)² = a² + 2b² + 2ab√2 = 11 + 6√2; a = 3, b = 1 works.','So √(11 + 6√2) = 3 + √2 and √(11 − 6√2) = 3 − √2 (which is positive).','The difference is 2√2.']},
 {u:'A2',d:2,q:'How many integers x satisfy (x² − 11x + 18)/(x² − 16) ≤ 0?',c:['6','7','9','10','11'],a:'E',s:['Factor: the expression is (x − 2)(x − 9)/((x − 4)(x + 4)), with critical points −4, 2, 4, 9.','A sign chart shows it is ≤ 0 on −4 < x ≤ 2 and on 4 < x ≤ 9 (the endpoints ±4 are excluded).','The integers are −3 through 2 (six of them) and 5 through 9 (five of them), for 11 in all.']},
 {u:'A2',d:2,q:'What is the sum of all distinct real numbers x satisfying (x² − 4x)² − (x² − 4x) − 20 = 0?',c:['2','4','6','8','10'],a:'C',s:['Let u = x² − 4x; then u² − u − 20 = 0, so u = 5 or u = −4.','u = 5 gives x² − 4x − 5 = 0, so x = 5 or x = −1.','u = −4 gives x² − 4x + 4 = 0, a double root x = 2, which counts only once.','The distinct real solutions sum to 5 − 1 + 2 = 6.']},
 {u:'A2',d:2,q:'Let r, s, t be the roots of x³ − 3x² + 5x − 7 = 0. What is (r + s)(s + t)(t + r)?',c:['8','12','15','22','27'],a:'A',s:['Since r + s + t = 3, each factor is 3 minus the remaining root: r + s = 3 − t, and so on.','So the product is (3 − r)(3 − s)(3 − t), which equals P(3) for P(x) = (x − r)(x − s)(x − t).','P(3) = 27 − 27 + 15 − 7 = 8.']},
 {u:'A2',d:2,q:'How many ordered pairs of integers (x, y) satisfy x² − 2xy + 2y² ≤ 4?',c:['5','9','12','13','21'],a:'D',s:['Complete the square: x² − 2xy + 2y² = (x − y)² + y².','With u = x − y, pairs (x, y) correspond one-to-one with integer pairs (u, y) satisfying u² + y² ≤ 4.','Those are (0, 0), the 4 points with one coordinate ±1 and the other 0, the 4 points (±1, ±1), and the 4 points with one coordinate ±2 and the other 0.','That is 1 + 4 + 4 + 4 = 13 pairs.']},
 {u:'A2',d:3,q:'Real numbers x and y satisfy x² + xy + y² = 3. What is the greatest possible value of x² + y²?',c:['3','4','9/2','5','6'],a:'E',s:['Write x² + y² = 3 − xy, so we want xy as small as possible.','Since (x + y)² = x² + 2xy + y² = 3 + xy must be nonnegative, xy ≥ −3.','Equality holds at x = √3, y = −√3, which satisfies 3 − 3 + 3 = 3.','So the maximum is 3 − (−3) = 6.']},
 {u:'A2',d:3,q:'Let P(x) = x² − 3x + 1. What is the sum of the squares of the four roots of P(P(x)) = 0?',c:['11','14','17','20','23'],a:'D',s:['If α and β are the roots of P, the roots of P(P(x)) = 0 are the roots of P(x) = α and P(x) = β.','The roots of x² − 3x + (1 − α) = 0 have squares summing to 3² − 2(1 − α) = 7 + 2α, and similarly 7 + 2β for the other equation.','The total is 14 + 2(α + β) = 14 + 2 · 3 = 20.']},
 {u:'A2',d:3,q:'For some real number k, the equation x³ − 21x² + kx − 216 = 0 has three distinct real roots that form a geometric progression. What is k?',c:['90','99','108','117','126'],a:'E',s:['Write the roots as a/r, a, ar; their product is a³ = 216, so the middle root is a = 6.','Substituting x = 6: 216 − 756 + 6k − 216 = 0, so 6k = 756 and k = 126.','Check: x³ − 21x² + 126x − 216 = (x − 3)(x − 6)(x − 12), and 3, 6, 12 is geometric.']},
 {u:'A2',d:3,q:'Real numbers a and b satisfy a + b = 5 and a⁴ + b⁴ = 97. What is a³ + b³?',c:['−535','25','35','65','125'],a:'C',s:['Let p = ab; then a² + b² = 25 − 2p and a⁴ + b⁴ = (25 − 2p)² − 2p².','Setting this to 97 gives p² − 50p + 264 = 0, so p = 6 or p = 44.','Real a, b need (a + b)² ≥ 4ab, i.e. 25 ≥ 4p, so p = 6 (the numbers are 2 and 3).','Then a³ + b³ = (a + b)³ − 3ab(a + b) = 125 − 90 = 35.']},
 {u:'A2',d:3,q:'Real numbers x, y, z satisfy x + y + z = 6, x² + y² + z² = 14, and x³ + y³ + z³ = 36. What is x⁴ + y⁴ + z⁴?',c:['98','104','110','116','196'],a:'A',s:['Let e₁ = x + y + z = 6, e₂ = xy + yz + zx, e₃ = xyz; then 14 = e₁² − 2e₂ gives e₂ = 11.','Newton’s identity x³ + y³ + z³ = e₁³ − 3e₁e₂ + 3e₃ gives 36 = 216 − 198 + 3e₃, so e₃ = 6.','Then pₖ = e₁pₖ₋₁ − e₂pₖ₋₂ + e₃pₖ₋₃ gives p₄ = 6 · 36 − 11 · 14 + 6 · 6 = 98.']},
 {u:'A2',d:3,q:'What is the minimum value of (x² + 3)/√(x² + 2) over all real numbers x?',c:['2','3√2/2','√5','5/2','3'],a:'B',s:['Let u = √(x² + 2), so u ≥ √2 and the expression is (u² + 1)/u = u + 1/u.','AM–GM suggests a minimum of 2 at u = 1, but u = 1 is not allowed; since u + 1/u increases for u ≥ 1, the minimum is at u = √2.','The minimum value is √2 + 1/√2 = 3√2/2, attained at x = 0.']},
 {u:'A3',d:1,q:'In an arithmetic sequence the 3rd term is 17 and the 10th term is 52. What is the first term of the sequence that is greater than 200?',c:['201','202','203','205','207'],a:'B',s:['Going from the 3rd to the 10th term adds 7 common differences, so 7d = 35 and d = 5.','The first term is 17 − 2 · 5 = 7, so every term is 2 more than a multiple of 5.','The smallest such number greater than 200 is 202.']},
 {u:'A3',d:1,q:'Let f(x) = (2x + 3)/(x − 1). What is f⁻¹(5)?',c:['4/13','8/3','3','13/4','4'],a:'B',s:['f⁻¹(5) is the number x with f(x) = 5.','Solve (2x + 3)/(x − 1) = 5: 2x + 3 = 5x − 5, so 3x = 8.','Thus f⁻¹(5) = 8/3.']},
 {u:'A3',d:2,q:'Three numbers a, b, c form an arithmetic sequence with sum 15. When 1, 4, and 19 are added to a, b, and c respectively, the results form a geometric sequence. What is the greatest possible value of a?',c:['2','8','14','21','26'],a:'E',s:['The middle term is 15/3 = 5, so the numbers are 5 − d, 5, 5 + d.','After the additions they are 6 − d, 9, 24 + d, so (6 − d)(24 + d) = 81.','This gives d² + 18d − 63 = 0, so d = 3 or d = −21.','The values of a are 2 and 26, so the greatest is 26.']},
 {u:'A3',d:2,q:'What is −1² + 2² − 3² + 4² − ⋯ − 99² + 100²?',c:['4950','5000','5050','5100','10100'],a:'C',s:['Group the terms in pairs: (2m)² − (2m − 1)² = 4m − 1 for m = 1, 2, …, 50.','The sum is 4(1 + 2 + ⋯ + 50) − 50 = 4 · 1275 − 50.','That equals 5050.']},
 {u:'A3',d:2,q:'A linear function f(x) = ax + b satisfies f(f(x)) = 9x − 8 for all real x. What is the sum of all possible values of f(2)?',c:['−2','2','4','6','8'],a:'B',s:['f(f(x)) = a(ax + b) + b = a²x + (a + 1)b, so a² = 9 and (a + 1)b = −8.','If a = 3 then b = −2 and f(2) = 4; if a = −3 then b = 4 and f(2) = −2.','The sum of the possible values is 4 + (−2) = 2.']},
 {u:'A3',d:2,q:'For how many integers n with 1 ≤ n ≤ 100 is ⌊n/2⌋ + ⌊n/3⌋ = ⌊5n/6⌋?',c:['66','67','80','83','84'],a:'E',s:['Write n = 6q + r with 0 ≤ r ≤ 5; both sides contain 5q, so only r matters.','Comparing ⌊r/2⌋ + ⌊r/3⌋ with ⌊5r/6⌋ for r = 0, …, 5, they agree except at r = 5 (3 versus 4).','Among 1 to 100 there are 16 numbers ≡ 5 (mod 6), namely 5, 11, …, 95, so 100 − 16 = 84 values of n work.']},
 {u:'A3',d:3,q:'A sequence is defined by a₁ = 3 and aₙ₊₁ = aₙ² − aₙ + 1 for n ≥ 1. What is the value of the infinite sum 1/a₁ + 1/a₂ + 1/a₃ + ⋯?',c:['1/3','2/5','10/21','1/2','3/5'],a:'D',s:['From aₙ₊₁ − 1 = aₙ(aₙ − 1), take reciprocals: 1/(aₙ₊₁ − 1) = 1/(aₙ − 1) − 1/aₙ.','So 1/aₙ = 1/(aₙ − 1) − 1/(aₙ₊₁ − 1), and the partial sums telescope to 1/(a₁ − 1) − 1/(aₙ₊₁ − 1).','The terms grow without bound, so the sum is 1/(3 − 1) = 1/2.']},
 {u:'A3',d:3,q:'Let F₁ = F₂ = 1 and Fₙ₊₂ = Fₙ₊₁ + Fₙ for n ≥ 1. What is the value of F₁/3 + F₂/3² + F₃/3³ + F₄/3⁴ + ⋯?',c:['1/2','3/5','2/3','3/4','1'],a:'B',s:['Call the sum S. Then S/3 and S/9 are the same series shifted by one and two places.','In S − S/3 − S/9 the coefficient of 1/3ᵐ is Fₘ − Fₘ₋₁ − Fₘ₋₂ = 0 for m ≥ 3, and F₂ − F₁ = 0 for m = 2, so only F₁/3 = 1/3 survives.','So (5/9)S = 1/3 and S = 3/5.']},
 {u:'A3',d:3,q:'A sequence is defined by a₁ = 1 and aₙ₊₁ = aₙ + 1/aₙ for n ≥ 1. What is ⌊a₁₀₀⌋?',c:['14','15','16','17','20'],a:'A',s:['Squaring the recurrence gives aₙ₊₁² = aₙ² + 2 + 1/aₙ², so a₁₀₀² = 1 + 2 · 99 + (1/a₁² + ⋯ + 1/a₉₉²) > 199.','Since aₙ² ≥ 2n − 1, the extra terms total at most 1 + 1/3 + 1/5 + ⋯ + 1/197, which is less than 4, so a₁₀₀² < 203.','Because 14² = 196 < 199 and 203 < 225 = 15², ⌊a₁₀₀⌋ = 14.']},
 {u:'A3',d:3,q:'Let g(x) = x² − 2. How many real numbers x satisfy g(g(g(x))) = x?',c:['2','3','4','6','8'],a:'E',s:['If |x| > 2 then |g(x)| > |x| > 2, so the values grow and never return; all solutions lie in [−2, 2].','Write x = 2 cos θ with 0 ≤ θ ≤ π; then g(2 cos θ) = 2 cos 2θ, so g(g(g(x))) = 2 cos 8θ.','cos 8θ = cos θ gives θ = 2πk/7 (k = 0, 1, 2, 3) or θ = 2πk/9 (k = 0, …, 4), with θ = 0 counted twice.','That gives 4 + 5 − 1 = 8 real solutions, the most a degree-8 equation can have.']},
 {u:'A3',d:3,q:'What is ⌊2026/2⌋ + ⌊2026/4⌋ + ⌊2026/8⌋ + ⌊2026/16⌋ + ⋯?',c:['1013','2013','2016','2018','2025'],a:'D',s:['⌊n/2ᵏ⌋ is the binary number n with its last k binary digits deleted.','Each binary digit 1 in position j (worth 2ʲ) contributes 2ʲ⁻¹ + ⋯ + 2 + 1 = 2ʲ − 1 to the sum, so the total is n minus the number of 1s in binary.','2026 = 11111101010 in base 2, which has eight 1s.','So the sum is 2026 − 8 = 2018.']}
);

AB.push(
 {u:'N1',d:1,q:'What is the largest prime factor of 3⁸ − 1?',c:['41','43','61','73','82'],a:'A',s:['Factor as a difference of squares: 3⁸ − 1 = (3⁴ − 1)(3⁴ + 1) = 80 · 82.','Then 80 = 2⁴ · 5 and 82 = 2 · 41, so 3⁸ − 1 = 2⁵ · 5 · 41.','The largest prime factor is 41.']},
 {u:'N1',d:1,q:'What is the largest integer k such that 3ᵏ divides 60! ?',c:['28','30','32','36','40'],a:'A',s:['By Legendre’s formula, count multiples of 3, then of 9, then of 27, and so on, up to 60.','There are ⌊60/3⌋ = 20 multiples of 3, ⌊60/9⌋ = 6 of 9, and ⌊60/27⌋ = 2 of 27, while 81 > 60.','Each multiple of 3ʲ contributes one extra factor at level j, so k = 20 + 6 + 2 = 28.']},
 {u:'N1',d:1,q:'For how many prime numbers p is 2ᵖ + p² also prime?',c:['0','1','2','3','infinitely many'],a:'B',s:['For p = 2 we get 4 + 4 = 8, which is not prime, and for p = 3 we get 8 + 9 = 17, which is prime.','For a prime p > 3, p is odd so 2ᵖ ≡ (−1)ᵖ ≡ 2 (mod 3), and p is not a multiple of 3 so p² ≡ 1 (mod 3).','Then 2ᵖ + p² ≡ 0 (mod 3) and is larger than 3, so it is composite; only p = 3 works, giving 1 prime.']},
 {u:'N1',d:2,q:'For how many integers n with 1 ≤ n ≤ 100 is the number of positive divisors of n a prime number?',c:['29','30','31','32','36'],a:'D',s:['If n = p₁^e₁ · … · pₖ^eₖ, the divisor count is (e₁ + 1)⋯(eₖ + 1), which is prime only when n is a single prime power pᵉ with e + 1 prime.','So n = p (25 primes up to 100), n = p² (4, 9, 25, 49), n = p⁴ (16, 81), or n = p⁶ (64).','The total is 25 + 4 + 2 + 1 = 32.']},
 {u:'N1',d:2,q:'What is the largest integer k such that 12ᵏ divides 50! ?',c:['16','22','23','24','47'],a:'B',s:['Since 12ᵏ = 2²ᵏ · 3ᵏ, we need both 2²ᵏ and 3ᵏ to divide 50!.','Legendre’s formula gives the exponent of 2 as 25 + 12 + 6 + 3 + 1 = 47 and the exponent of 3 as 16 + 5 + 1 = 22.','The 2’s allow k ≤ 23 but the 3’s allow only k ≤ 22, so the scarcer prime decides: k = 22.']},
 {u:'N1',d:2,q:'For how many integers n with 1 ≤ n ≤ 100 is gcd(n² + 1, n + 7) greater than 1?',c:['40','50','60','65','70'],a:'C',s:['Since n ≡ −7 (mod n + 7), we have n² + 1 ≡ 49 + 1 = 50, so gcd(n² + 1, n + 7) = gcd(50, n + 7).','This exceeds 1 exactly when n + 7 is even or a multiple of 5, that is, when n is odd or n ≡ 3 (mod 5).','There are 50 odd values, plus the even values with n ≡ 3 (mod 5): 8, 18, …, 98, which is 10 more.','The count is 50 + 10 = 60.']},
 {u:'N1',d:2,q:'What is the smallest positive integer whose digits have product 3600?',c:['25589','25598','45566','55289','225589'],a:'A',s:['Factor 3600 = 2⁴ · 3² · 5²; each 5 must be its own digit, so two digits are 5.','The remaining 2⁴ · 3² = 144 needs at least three digits (no two digits multiply to 144), for example 2·8·9 or 4·6·6.','With five digits, the smallest number puts the digits in increasing order with the smallest leading digit: 2,5,5,8,9 beats 4,5,5,6,6.','The answer is 25589.']},
 {u:'N1',d:3,q:'How many ordered pairs (a, b) of positive integers satisfy a + b = 1000 and gcd(a, b) is a prime number?',c:['120','200','240','280','400'],a:'D',s:['Since gcd(a, b) = gcd(a, 1000), the gcd is a divisor of 1000, so a prime gcd must be 2 or 5.','If gcd = 2, write a = 2a′, b = 2b′ with a′ + b′ = 500 and gcd(a′, 500) = 1; there are φ(500) = 200 choices of a′.','If gcd = 5, then a′ + b′ = 200 with gcd(a′, 200) = 1, giving φ(200) = 80 choices.','The total is 200 + 80 = 280.']},
 {u:'N1',d:3,q:'How many positive divisors of 2025² are greater than 2025 but are not multiples of 2025?',c:['6','8','10','14','22'],a:'B',s:['Write 2025 = 3⁴ · 5², so 2025² = 3⁸ · 5⁴ has 9 · 5 = 45 divisors; pairing d with 2025²/d shows 22 of them exceed 2025.','A divisor 3ᵃ5ᵇ is a multiple of 2025 when a ≥ 4 and b ≥ 2, which gives 5 · 3 = 15 divisors; all except 2025 itself exceed 2025, so 14 of the 22 are multiples.','That leaves 22 − 14 = 8 divisors.']},
 {u:'N1',d:3,q:'How many positive divisors of 12! have exactly 12 positive divisors?',c:['18','22','26','28','30'],a:'E',s:['Factor 12! = 2¹⁰ · 3⁵ · 5² · 7 · 11; a number with 12 divisors has shape p¹¹, p⁵q, p³q², or p²qr.','p¹¹ is impossible; p⁵q needs p ∈ {2, 3} and q among the other 4 primes, giving 8; p³q² needs p ∈ {2, 3} and q ∈ {2, 3, 5} with q ≠ p, giving 4.','p²qr has p ∈ {2, 3, 5} and {q, r} any 2 of the remaining 4 primes, giving 3 · 6 = 18.','The total is 8 + 4 + 18 = 30.']},
 {u:'N1',d:3,q:'How many ordered pairs (a, b) of positive integers satisfy a | b and b | 3600? (Here x | y means x divides y.)',c:['540','576','600','729','900'],a:'A',s:['Write 3600 = 2⁴ · 3² · 5² and handle each prime separately, since divisibility works prime by prime.','For a prime with exponent e in 3600, we need exponents 0 ≤ i ≤ j ≤ e for a and b, which is C(e + 2, 2) choices.','This gives C(6, 2) · C(4, 2) · C(4, 2) = 15 · 6 · 6 = 540.']},
 {u:'N1',d:3,q:'Let S(n) denote the sum of the digits of n. For how many positive integers n ≤ 1000 is S(n) = S(2n)?',c:['46','55','73','82','91'],a:'E',s:['When doubling, each digit of n that is 5 or more produces a carry, and each carry lowers the digit sum by 9, so S(2n) = 2S(n) − 9c where c is the number of digits of n that are at least 5.','So we need S(n) = 9c with c ≥ 1 (n ≤ 1000, and 1000 itself fails).','For c = 1: three-digit strings with digit sum 9 and exactly one digit ≥ 5 number 45; for c = 2: digit sum 18 with exactly two digits ≥ 5 also number 45; for c = 3: only 999.','The total is 45 + 45 + 1 = 91.']},
 {u:'N2',d:1,q:'What is the remainder when 1! + 2! + 3! + ⋯ + 100! is divided by 12?',c:['0','3','5','9','11'],a:'D',s:['Every k! with k ≥ 4 contains the factors 3 and 4, so it is a multiple of 12.','Only 1! + 2! + 3! = 1 + 2 + 6 = 9 matters.','The remainder is 9.']},
 {u:'N2',d:1,q:'When 2026 is written in base 5, what is the sum of its digits?',c:['4','5','6','8','10'],a:'C',s:['The powers of 5 are 1, 5, 25, 125, 625; take the largest first: 2026 = 3 · 625 + 151.','Then 151 = 1 · 125 + 26, 26 = 1 · 25 + 1, and 1 = 0 · 5 + 1, so 2026 = 31101 in base 5.','The digit sum is 3 + 1 + 1 + 0 + 1 = 6.']},
 {u:'N2',d:2,q:'How many ordered pairs (x, y) of positive integers satisfy 7x + 12y = 500?',c:['5','6','7','8','12'],a:'B',s:['Reduce mod 12: 7x ≡ 500 ≡ 8 (mod 12), and since 7 · 7 = 49 ≡ 1, multiplying by 7 gives x ≡ 56 ≡ 8 (mod 12).','The smallest solution is x = 8, y = 37; all solutions are x = 8 + 12t, y = 37 − 7t.','Positivity of y requires t ≤ 5, so t = 0, 1, …, 5 gives 6 pairs.']},
 {u:'N2',d:2,q:'For how many integers n with 1 ≤ n ≤ 1000 is n² − 1 divisible by 24?',c:['166','250','333','500','667'],a:'C',s:['If n is odd, (n − 1)(n + 1) is a product of consecutive even numbers, one a multiple of 4, so it is divisible by 8; if 3 ∤ n, one of n ± 1 is a multiple of 3.','Conversely, if n is even or a multiple of 3, then n² − 1 is odd or ≡ −1 (mod 3), so it fails; hence the condition is exactly gcd(n, 6) = 1.','By inclusion–exclusion, 1000 − 500 − 333 + 166 = 333 integers are coprime to 6.']},
 {u:'N2',d:2,q:'For how many integers b ≥ 2 does the base-b representation of 2026 end in the digit 1?',c:['3','12','13','14','15'],a:'D',s:['The last digit in base b is the remainder of 2026 upon division by b, so we need 2026 ≡ 1 (mod b), i.e. b | 2025.','Since 2025 = 3⁴ · 5², it has 5 · 3 = 15 positive divisors.','Excluding b = 1 leaves 14 bases (each b ≥ 2 makes 1 a valid digit).']},
 {u:'N2',d:2,q:'How many ordered pairs (x, y) of positive integers satisfy x² − y² = 720?',c:['6','9','10','12','15'],a:'B',s:['Factor as (x − y)(x + y) = 720; the two factors have the same parity, and since 720 is even they must both be even.','Write x − y = 2m and x + y = 2n, so mn = 180 with m < n (because y > 0).','Since 180 = 2² · 3² · 5 has 18 divisors and is not a perfect square, there are 9 such pairs (m, n), hence 9 pairs (x, y).']},
 {u:'N2',d:2,q:'How many integers n with 0 ≤ n ≤ 2026 have a base-3 representation that uses no digit 2?',c:['63','64','127','128','255'],a:'D',s:['Since 3⁷ = 2187 > 2026, every such n has at most 7 base-3 digits.','The largest 7-digit base-3 string using only 0s and 1s is 1111111₃ = (3⁷ − 1)/2 = 1093 ≤ 2026, so every 0/1 string of length 7 qualifies.','There are 2⁷ = 128 such strings, including 0.']},
 {u:'N2',d:2,q:'For how many integers k with 1 ≤ k ≤ 100 is 1ᵏ + 2ᵏ + 3ᵏ + 4ᵏ + 5ᵏ + 6ᵏ divisible by 7?',c:['67','76','84','90','96'],a:'C',s:['Let g = 3, which is a primitive root mod 7: the numbers 1, …, 6 are 3⁰, 3¹, …, 3⁵ mod 7 in some order.','So the sum is ≡ 1 + 3ᵏ + 3²ᵏ + ⋯ + 3⁵ᵏ, a geometric series equal to (3⁶ᵏ − 1)/(3ᵏ − 1) ≡ 0 whenever 3ᵏ ≢ 1, i.e. whenever 6 ∤ k.','If 6 | k, every term is 1 by Fermat and the sum is 6, not divisible by 7.','There are 16 multiples of 6 up to 100, so the answer is 100 − 16 = 84.']},
 {u:'N2',d:3,q:'The number Rₙ = 11…1 consists of n ones. What is the smallest n for which Rₙ is divisible by 63?',c:['3','6','9','12','18'],a:'E',s:['Since 63 = 9 · 7 with gcd(9, 7) = 1, we need both 9 | Rₙ and 7 | Rₙ.','Rₙ has digit sum n, so 9 | Rₙ exactly when 9 | n.','Also 9Rₙ = 10ⁿ − 1, so 7 | Rₙ exactly when 10ⁿ ≡ 1 (mod 7); the order of 10 ≡ 3 mod 7 is 6, so 6 | n.','The smallest n divisible by both 9 and 6 is lcm(9, 6) = 18.']},
 {u:'N2',d:3,q:'Given that 101 is prime, what is the remainder when 98! is divided by 101?',c:['1','50','51','99','100'],a:'B',s:['Wilson’s theorem says 100! ≡ −1 (mod 101).','Since 100 ≡ −1 and 99 ≡ −2 (mod 101), we get 100! = 98! · 99 · 100 ≡ 98! · 2, so 2 · 98! ≡ −1 ≡ 100.','Thus 98! ≡ 50 (mod 101), because 2 · 50 = 100.']},
 {u:'N2',d:3,q:'How many ordered pairs (x, y) of positive integers satisfy 3ˣ − 2ʸ = 1?',c:['0','1','2','3','infinitely many'],a:'C',s:['If y ≥ 2, reduce mod 4: 3ˣ ≡ 1 (mod 4), so x is even, say x = 2m.','Then 2ʸ = (3ᵐ − 1)(3ᵐ + 1), two powers of 2 that differ by 2, so they are 2 and 4, giving m = 1, x = 2, y = 3.','If y = 1, then 3ˣ = 3 gives x = 1.','So there are exactly 2 pairs: (1, 1) and (2, 3).']},
 {u:'N2',d:3,q:'How many integers x with 0 ≤ x < 1000 satisfy x² ≡ 1 (mod 1000)?',c:['2','3','4','6','8'],a:'E',s:['By the Chinese Remainder Theorem, solve separately mod 8 and mod 125 (since 1000 = 8 · 125).','Mod 8, every odd x has x² ≡ 1, so there are 4 solutions: 1, 3, 5, 7.','Mod 125, (x − 1)(x + 1) ≡ 0 and 5 cannot divide both factors (they differ by 2), so x ≡ ±1: 2 solutions.','Combining gives 4 · 2 = 8 solutions mod 1000.']},
 {u:'S1',d:1,q:'Seven people sit around a round table. Each is either a knight, who always tells the truth, or a liar, who always lies. Each person says, “Both of my neighbors are liars.” How many knights are at the table?',c:['2','3','4','5','6'],a:'B',s:['A knight’s statement is true, so two knights are never neighbors.','A liar’s statement is false, so every liar has at least one knight as a neighbor; hence no three consecutive people are all liars.','With no two knights adjacent, at most 3 of 7 seats hold knights; with no gap of 3 liars, at least ⌈7/3⌉ = 3 do.','So there are exactly 3 knights (for example in seats 1, 3, 5).']},
 {u:'S1',d:1,q:'A frog starts at 0 on the number line and makes exactly 25 jumps, each of length 1 to the left or to the right. Which of the following could be its final position?',c:['−6','0','8','13','26'],a:'D',s:['Each jump changes the position by an odd number, so after an odd number of jumps the position is odd.','Thus the final position is an odd integer between −25 and 25.','Of the choices, only 13 is odd and within reach (19 jumps right and 6 left).']},
 {u:'S1',d:2,q:'What is the smallest n such that any n distinct numbers chosen from {1, 2, …, 50} must include two whose difference is exactly 7?',c:['29','30','31','33','35'],a:'A',s:['Split {1, …, 50} into 7 chains by residue mod 7, such as 1, 8, 15, …, 50; a difference of 7 means two neighbors in the same chain.','The chain for residue 1 has 8 numbers and the other six chains have 7 numbers each.','From a chain of length L we can pick at most ⌈L/2⌉ numbers with no two adjacent, so the largest safe set has 4 + 6 · 4 = 28 numbers.','Hence n = 29 forces a difference of 7.']},
 {u:'S1',d:3,q:'What is the greatest number of 1×4 rectangular tiles that can be placed on a 6×6 board without overlapping, each tile covering exactly four squares of the board?',c:['4','5','6','7','8'],a:'E',s:['The board has 36 squares, so at most 9 tiles fit by area; we show 9 is impossible with a coloring.','Color square (i, j) with color (i + j) mod 4; every 1×4 tile, horizontal or vertical, covers one square of each of the 4 colors.','Counting, colors 0, 1, 2, 3 appear 9, 10, 9, 8 times, and each tile needs its own square of color 3, so at most 8 tiles fit.','Eight tiles do fit: 6 vertical tiles fill the top four rows, and 2 horizontal tiles go in the bottom two rows, so the answer is 8.']},
 {u:'S1',d:2,q:'Eight teams play a round-robin tournament: each pair of teams plays exactly once, and every game has a winner. What is the greatest possible number of teams that finish with exactly 5 wins?',c:['5','6','7','8','9'],a:'A',s:['There are C(8, 2) = 28 games, so the win totals add up to 28.','Six teams with 5 wins would already need 30 wins, so at most 5 teams can have exactly 5 wins.','Five works: let the other three teams each beat one another cyclically (1 win each), let those three lose to all five strong teams, and arrange the 10 games among the five strong teams so each wins 2 of them (a cyclic pattern); each strong team then has 3 + 2 = 5 wins.','The maximum is 5.']},
 {u:'S1',d:3,q:'Three piles contain 6, 10, and 15 stones. Two players alternate turns; on each turn a player removes any positive number of stones from a single pile. The player who takes the last stone wins. How many different first moves guarantee that the first player can force a win?',c:['0','1','2','3','4'],a:'D',s:['A position is losing for the player to move exactly when the XOR (binary sum without carries) of the pile sizes is 0, since from XOR 0 every move makes it nonzero and from nonzero XOR some move restores 0.','In binary 6 = 0110, 10 = 1010, 15 = 1111, so the XOR is 0011 = 3.','A winning move changes one pile p to p XOR 3, which must be smaller than p: 6 → 5, 10 → 9, and 15 → 12 all work.','So there are 3 winning first moves.']},
 {u:'S1',d:2,q:'Eleven coins lie on a table, all showing heads. A move consists of turning over exactly 3 of the coins. What is the smallest number of moves needed to make all 11 coins show tails?',c:['3','4','5','6','7'],a:'C',s:['Each coin must be flipped an odd number of times, so the total number of flips, 3m for m moves, is a sum of 11 odd numbers and hence odd.','So m is odd, and 3m ≥ 11 forces m ≥ 4; together m ≥ 5.','Five moves suffice: flip coin 1 together with {2, 3}, then {4, 5}, {6, 7}, {8, 9}, {10, 11}; coin 1 is flipped 5 times and every other coin once, so the minimum is 5.']},
 {u:'S1',d:3,q:'Each square of a 3 × n grid is colored red or blue. What is the smallest n for which every such coloring must contain a rectangle whose four corner squares all have the same color? (The rectangle’s sides lie along grid lines, and it spans at least two rows and two columns.)',c:['3','4','5','6','7'],a:'E',s:['Each column of 3 squares has, by pigeonhole, a majority color appearing in at least 2 of its 3 rows; record that color and that pair of rows.','There are 2 colors × 3 row-pairs = 6 possible records, and two columns with the same record give a monochromatic rectangle; so n = 7 forces one.','For n = 6, use the six columns RRB, RBR, BRR, BBR, BRB, RBB: each row pair is red-red in exactly one column and blue-blue in exactly one column, so no rectangle appears.','The smallest n is 7.']},
 {u:'S1',d:2,q:'Ten people numbered 1 through 10 are each either a knight, who always tells the truth, or a liar, who always lies. For each k, person k says, “The number of liars among the ten of us is a positive multiple of k.” How many knights are there?',c:['4','5','6','7','8'],a:'A',s:['Let L be the number of liars; person k is a knight exactly when k divides L, so the number of knights equals the number of divisors of L among 1, …, 10.','L = 0 is impossible, since then every statement would be false, making all ten liars.','We need (divisors of L up to 10) = 10 − L: L = 6 gives divisors 1, 2, 3, 6, which is 4 = 10 − 6, and checking L = 1, …, 10 shows no other value works.','So there are 4 knights.']},
 {u:'S1',d:2,q:'Which of the following is closest to 1/101 + 1/102 + 1/103 + ⋯ + 1/200?',c:['0.3','0.4','0.5','0.6','0.7'],a:'E',s:['There are 100 terms, each between 1/200 and 1/101, so the sum is between 1/2 and about 1/1.01 ≈ 0.99.','Better: the first 50 terms are each more than 1/150 and the last 50 are each more than 1/200, so the sum exceeds 50/150 + 50/200 = 7/12 ≈ 0.58; similarly it is less than 50/101 + 50/151 ≈ 0.83.','Splitting into finer blocks approaches the area under y = 1/x from 100 to 200, which is ln 2 ≈ 0.693.','The closest choice is 0.7.']},
 {u:'S1',d:3,q:'A positive integer n is written on a board. Two players alternate turns; on each turn a player either subtracts 1 from the number, or, if the number is even, halves it. The player who writes 0 wins. For how many starting values n with 1 ≤ n ≤ 100 can the second player force a win?',c:['33','48','49','50','51'],a:'C',s:['Work backward: n = 1 is a first-player win (write 0), n = 2 is a loss (both moves give 1), n = 3 and n = 4 are wins (move to 2).','Claim: the losing positions are 2 and all odd n ≥ 5. From an odd n ≥ 5 the only move is to the even number n − 1.','From any even n ≥ 6, subtracting 1 reaches an odd losing position, and n = 4 halves to 2, so every even number except 2 is a win; thus odd n ≥ 5 can only move to winning positions and is losing.','The second player wins for n = 2 and the 48 odd numbers 5, 7, …, 99, a total of 49.']}
);

AB.push(
 {u:'C1',d:1,q:'How many positive divisors of 7200 are perfect squares?',c:['6','8','10','12','18'],a:'D',s:['Factor: 7200 = 2⁵ · 3² · 5².','A divisor 2ᵃ3ᵇ5ᶜ is a perfect square exactly when every exponent is even.','So a ∈ {0, 2, 4}, b ∈ {0, 2}, c ∈ {0, 2}, giving 3 · 2 · 2 = 12 square divisors.']},
 {u:'C1',d:1,q:'How many three-digit palindromes (numbers such as 474 that read the same forward and backward) are divisible by 3?',c:['27','30','33','36','90'],a:'B',s:['A three-digit palindrome has the form aba with a from 1 to 9 and b from 0 to 9, and its digit sum is 2a + b.','For each a, the condition 2a + b ≡ 0 (mod 3) fixes b modulo 3, and the digits 0–9 contain either 3 or 4 values in each residue class.','b ≡ 0 has 4 choices (0, 3, 6, 9) and b ≡ 1 or 2 has 3 choices; a ≡ 0 (mod 3) needs b ≡ 0, while a ≡ 1 or 2 needs b ≡ 1 or 2 respectively.','Total = 3·4 + 3·3 + 3·3 = 30.']},
 {u:'C1',d:1,q:'Two identical rooks are placed on two different squares of a 6×6 chessboard so that they are not in the same row and not in the same column. In how many ways can this be done?',c:['300','360','450','540','900'],a:'C',s:['Place the first rook anywhere: 36 squares.','Its row and column remove 11 squares, so the second rook has 25 choices.','The rooks are identical, so each placement was counted twice: 36 · 25 / 2 = 450.']},
 {u:'C1',d:2,q:'How many five-digit positive integers have digits whose product is 12?',c:['40','50','60','65','70'],a:'E',s:['No digit can be 0, and the digits multiply to 12 = 2² · 3, so list the multisets of five digits with product 12.','The possibilities are {6, 2, 1, 1, 1}, {4, 3, 1, 1, 1}, and {3, 2, 2, 1, 1} (12 itself is not a digit).','Arrange each: 5!/3! = 20, 5!/3! = 20, and 5!/(2!·2!) = 30.','Total = 20 + 20 + 30 = 70.']},
 {u:'C1',d:2,q:'Three distinct vertices of a regular decagon are chosen. For how many of the C(10, 3) = 120 choices is the triangle formed isosceles?',c:['30','36','40','45','50'],a:'C',s:['Count by apex: an isosceles triangle has an apex vertex whose two other vertices are symmetric about the line through the apex and the center.','For a fixed apex, the 9 other vertices pair up into 4 symmetric pairs (the opposite vertex is unpaired), giving 4 triangles.','An equilateral triangle would be counted 3 times, but 3 does not divide 10, so none exist and no triangle is double-counted.','Total = 10 · 4 = 40.']},
 {u:'C1',d:2,q:'How many triangles have all three vertices among the vertices of a convex decagon but share no side with the decagon?',c:['40','50','60','70','80'],a:'B',s:['Total triangles: C(10, 3) = 120.','Triangles using two adjacent sides (three consecutive vertices): 10.','Triangles using exactly one side: choose the side (10 ways) and a third vertex not adjacent to either endpoint (10 − 4 = 6 ways), giving 60.','So 120 − 10 − 60 = 50 triangles use no side.']},
 {u:'C1',d:2,q:'How many three-element subsets of {1, 2, 3, …, 12} have a sum that is divisible by 3?',c:['68','72','74','76','80'],a:'D',s:['Split the set by residue mod 3: each of the classes 0, 1, 2 contains exactly 4 numbers.','A sum of three residues is 0 mod 3 exactly when all three residues are equal or all three are different.','All equal: 3 · C(4, 3) = 12. All different: 4 · 4 · 4 = 64.','Total = 12 + 64 = 76.']},
 {u:'C1',d:2,q:'How many ordered pairs (A, B) of subsets of {1, 2, 3, 4, 5, 6} satisfy A ∪ B = {1, 2, 3, 4, 5, 6} and contain exactly two elements in A ∩ B?',c:['240','360','480','720','960'],a:'A',s:['Decide each element’s fate independently: it is in A only, in B only, or in both (it cannot be in neither, since the union is everything).','Exactly two elements must be in both: choose them in C(6, 2) = 15 ways.','Each of the other 4 elements is in A only or in B only: 2⁴ = 16 ways.','Total = 15 · 16 = 240.']},
 {u:'C1',d:3,q:'Consider the 25 lattice points (x, y) with x, y ∈ {0, 1, 2, 3, 4}. How many squares, including tilted ones, have all four vertices among these points?',c:['30','36','40','46','50'],a:'E',s:['Every such square fits snugly inside an axis-parallel bounding square of side k, for k = 1, 2, 3, 4.','A bounding square of side k contains exactly k inscribed squares with vertices on its sides at lattice points (one for each offset 0, 1, …, k − 1).','There are (5 − k)² positions for a bounding square of side k.','Total = 16·1 + 9·2 + 4·3 + 1·4 = 16 + 18 + 12 + 4 = 50.']},
 {u:'C1',d:3,q:'How many ordered triples (a, b, c) of positive integers satisfy lcm(a, b, c) = 72?',c:['343','512','630','703','1083'],a:'D',s:['Write 72 = 2³ · 3²; each of a, b, c is a divisor 2ˣ3ʸ, and the prime powers can be handled independently.','For the prime 2, the exponents (x₁, x₂, x₃) lie in {0, 1, 2, 3} with maximum exactly 3: 4³ − 3³ = 37 ways (subtract those with all exponents ≤ 2).','For the prime 3, exponents lie in {0, 1, 2} with maximum exactly 2: 3³ − 2³ = 19 ways.','Total = 37 · 19 = 703.']},
 {u:'C1',d:3,q:'How many four-digit positive integers abcd (with digits a, b, c, d and a ≠ 0) satisfy a + b = c + d?',c:['615','625','660','670','720'],a:'A',s:['Group by the common sum s. Let N(s) be the number of digit pairs (c, d) from 0–9 with c + d = s; this is s + 1 for s ≤ 9 and 19 − s for s ≥ 9.','Without the restriction a ≠ 0, the count is Σ N(s)² = 2(1² + 2² + … + 9²) + 10² = 2·285 + 100 = 670.','Remove those with a = 0: then b = s and (c, d) is any pair with sum s for s = 0, …, 9, giving Σ N(s) = 1 + 2 + … + 10 = 55.','Total = 670 − 55 = 615.']},
 {u:'C1',d:3,q:'The numbers 1 through 9 are placed in a 3×3 grid, one per cell, so that the numbers increase from left to right in every row and from top to bottom in every column. How many such arrangements are there?',c:['24','36','42','48','56'],a:'C',s:['Write the numbers in order 1, 2, …, 9; each new number must go in the leftmost empty cell of some row, and that row may not get ahead of the row above it. So an arrangement is a sequence of row labels (top, middle, bottom), each used 3 times, in which at every stage #top ≥ #middle ≥ #bottom.','Count these sequences by a lattice/ballot argument, or use the hook length formula: the hook of a cell is the number of cells to its right or below it, plus itself.','For the 3×3 grid the hooks are 5, 4, 3 / 4, 3, 2 / 3, 2, 1 with product 8640.','So there are 9!/8640 = 362880/8640 = 42 arrangements.']},
 {u:'P1',d:1,q:'Two fair six-sided dice are rolled. What is the probability that the larger of the two numbers rolled is exactly 4? (If both dice show the same number, that number is the larger.)',c:['1/9','1/6','7/36','2/9','1/4'],a:'C',s:['The maximum is at most 4 when both dice are in {1, 2, 3, 4}: 4² = 16 outcomes.','The maximum is at most 3 in 3² = 9 outcomes.','So the maximum is exactly 4 in 16 − 9 = 7 outcomes, a probability of 7/36.']},
 {u:'P1',d:1,q:'Two fair six-sided dice are rolled, and the sum is 8. Given this, what is the probability that at least one die shows a 3?',c:['1/18','1/9','1/5','1/3','2/5'],a:'E',s:['Conditioning shrinks the sample space to the outcomes with sum 8: (2,6), (3,5), (4,4), (5,3), (6,2), five equally likely outcomes.','Of these, (3,5) and (5,3) contain a 3.','The conditional probability is 2/5.']},
 {u:'P1',d:2,q:'Four balls are tossed independently and at random into four boxes, each ball equally likely to land in any box. What is the expected number of boxes that end up empty?',c:['3/4','27/32','1','81/64','3/2'],a:'D',s:['Use linearity of expectation: the expected number of empty boxes is the sum, over the 4 boxes, of the probability that the box is empty.','A given box is missed by all four balls with probability (3/4)⁴ = 81/256.','Expected number = 4 · 81/256 = 81/64.']},
 {u:'P1',d:2,q:'Four married couples sit in a row of 8 chairs in random order. What is the expected number of couples whose two members sit next to each other?',c:['1/4','1/2','4/7','1','2'],a:'D',s:['By linearity of expectation, add up, over the 4 couples, the probability that the couple sits together.','For a fixed couple, there are 7 adjacent pairs of chairs out of C(8, 2) = 28 pairs of chairs, so they are adjacent with probability 7/28 = 1/4.','Expected number = 4 · 1/4 = 1.']},
 {u:'P1',d:2,q:'Three different numbers are chosen at random from {1, 2, 3, …, 10}. What is the probability that the middle one of the three (the median) is 5?',c:['1/6','1/5','1/4','3/10','1/3'],a:'A',s:['If the median is 5, then 5 is chosen, one number comes from {1, 2, 3, 4}, and one from {6, 7, 8, 9, 10}.','That gives 4 · 5 = 20 favorable subsets.','There are C(10, 3) = 120 subsets in all, so the probability is 20/120 = 1/6.']},
 {u:'P1',d:2,q:'The six letters of the word BANANA are arranged in a random order, with all distinguishable arrangements equally likely. What is the probability that no two A’s are adjacent?',c:['1/5','1/4','3/10','1/3','2/5'],a:'A',s:['There are 6!/(3!·2!) = 60 distinguishable arrangements.','Use the gap method: first arrange B, N, N in 3!/2! = 3 ways, creating 4 gaps (including the ends).','Put the three A’s into 3 different gaps: C(4, 3) = 4 ways, so 3 · 4 = 12 arrangements have no adjacent A’s.','The probability is 12/60 = 1/5.']},
 {u:'P1',d:2,q:'A box contains four coins: one has heads on both sides and the other three are fair. A coin is chosen at random and flipped twice, landing heads both times. What is the probability that the chosen coin is the two-headed coin?',c:['1/2','4/7','3/5','2/3','4/5'],a:'B',s:['Use Bayes’ rule: compare the probability of each way to see two heads.','Two-headed coin and HH: (1/4) · 1 = 1/4. Fair coin and HH: (3/4) · (1/4) = 3/16.','The probability of the two-headed coin is (1/4) / (1/4 + 3/16) = (4/16)/(7/16) = 4/7.']},
 {u:'P1',d:3,q:'A frog sits on one of the points 0, 1, 2, 3, 4, 5 on a number line, starting at 2. Each second it hops one unit right with probability 2/3 or one unit left with probability 1/3. It stops as soon as it reaches 0 or 5. What is the probability that it stops at 5?',c:['2/5','16/31','24/31','4/5','8/9'],a:'C',s:['Let pₖ be the probability of reaching 5 from k, so p₀ = 0, p₅ = 1, and pₖ = (2/3)pₖ₊₁ + (1/3)pₖ₋₁.','Rearranging gives pₖ₊₁ − pₖ = (1/2)(pₖ − pₖ₋₁), so the successive differences form a geometric sequence d, d/2, d/4, d/8, d/16.','Since the differences sum to p₅ − p₀ = 1, d(1 + 1/2 + 1/4 + 1/8 + 1/16) = 1, so d = 16/31.','Then p₂ = d + d/2 = 24/31.']},
 {u:'P1',d:3,q:'A fair coin is flipped repeatedly until either the pattern HHT or the pattern HTT appears as three consecutive flips. What is the probability that HHT appears first?',c:['2/5','1/2','3/5','5/8','2/3'],a:'E',s:['Nothing matters until the first H, so start the analysis right after an H. Let x be the win probability for HHT just after an H (with the last flip H), and y the probability just after HT.','After H: another H wins for sure eventually (HH is followed by more H’s until a T completes HHT), and a T leads to state HT. So x = 1/2 · 1 + 1/2 · y.','After HT: a T completes HTT (loss), and an H returns to the state “last flip H”. So y = 1/2 · 0 + 1/2 · x.','Solving, x = 1/2 + x/4, so x = 2/3.']},
 {u:'P1',d:3,q:'A fair six-sided die is rolled five times. What is the probability that the five numbers rolled form a nondecreasing sequence (each number is at least as large as the one before it)?',c:['1/1296','1/120','1/36','7/216','77/1296'],a:'D',s:['A nondecreasing sequence is determined by how many times each face 1–6 appears, so count multisets of size 5 from 6 values.','By stars and bars there are C(5 + 5, 5) = C(10, 5) = 252 such sequences.','The probability is 252/6⁵ = 252/7776 = 7/216.']},
 {u:'P1',d:3,q:'Four distinct vertices of a regular octagon are chosen at random. What is the probability that the center of the octagon lies strictly inside the quadrilateral they form?',c:['2/5','1/2','19/35','4/7','3/5'],a:'C',s:['The center fails to be strictly inside exactly when all four vertices lie in a closed half of the circle, i.e., among 5 consecutive vertices.','If the set spans exactly 5 consecutive vertices, its two ends are opposite vertices and the other two come from the 3 vertices between them: 8 choices of starting vertex × C(3, 2) = 24 sets.','If the set lies within 4 consecutive vertices, it is exactly 4 consecutive vertices: 8 sets. So 70 − 24 − 8 = 38 of the C(8, 4) = 70 sets work.','The probability is 38/70 = 19/35.']},
 {u:'P1',d:3,q:'A deck of 20 cards contains 3 red cards and 17 black cards. The deck is shuffled and cards are turned over one at a time. What is the expected position of the first red card?',c:['5','21/4','11/2','6','20/3'],a:'B',s:['The 3 red cards split the 17 black cards into 4 groups (before the first red, between reds, after the last red).','By symmetry each group has the same expected size, 17/4.','The first red card comes right after the first group, so its expected position is 17/4 + 1 = 21/4.']},
 {u:'C2',d:1,q:'A 1×8 strip of squares is to be completely covered, without overlap, by 1×1 tiles and 1×3 tiles. In how many ways can this be done?',c:['13','16','19','21','34'],a:'A',s:['Let tₙ be the number of tilings of a 1×n strip; the last tile is a 1×1 or a 1×3, so tₙ = tₙ₋₁ + tₙ₋₃.','Start with t₀ = t₁ = t₂ = 1.','Then t₃ = 2, t₄ = 3, t₅ = 4, t₆ = 6, t₇ = 9, t₈ = 13.']},
 {u:'C2',d:1,q:'What is the value of C(3,3) + C(4,3) + C(5,3) + … + C(10,3)?',c:['120','165','210','252','330'],a:'E',s:['Use the hockey-stick identity: C(r, r) + C(r + 1, r) + … + C(n, r) = C(n + 1, r + 1).','Reason: both count 4-element subsets of {1, …, 11}, grouped by their largest element k + 1, which leaves C(k, 3) choices for the rest.','So the sum is C(11, 4) = 330.']},
 {u:'C2',d:2,q:'A path from (0, 0) to (5, 5) uses unit steps right or up. How many such paths never go above the line y = x (points on the line are allowed)?',c:['14','28','30','35','42'],a:'E',s:['There are C(10, 5) = 252 paths in all.','By the reflection principle, a bad path touches y = x + 1; reflecting its portion after the first touch across that line gives a bijection with all paths from (0, 0) to (4, 6), of which there are C(10, 4) = 210.','Good paths: 252 − 210 = 42 (the Catalan number C₅).']},
 {u:'C2',d:2,q:'In how many ways can 6 people be split into 3 groups, each with at least one person, if the groups are unlabeled (only who is with whom matters)?',c:['60','90','105','120','540'],a:'B',s:['Group sizes can be 4+1+1, 3+2+1, or 2+2+2.','4+1+1: C(6, 4) = 15 (the remaining two people form the singletons). 3+2+1: C(6,3)·C(3,2) = 60. 2+2+2: C(6,2)·C(4,2)/3! = 15.','Total = 15 + 60 + 15 = 90.']},
 {u:'C2',d:2,q:'In how many ways can 30 cents be paid using any number of pennies (1¢), 2-cent coins, and nickels (5¢)? (Only the number of each coin matters.)',c:['49','52','56','58','64'],a:'D',s:['Fix the number f of nickels, from 0 to 6; the remaining 30 − 5f cents is paid with 1¢ and 2¢ coins.','An amount m can be paid with pennies and 2-cent coins in ⌊m/2⌋ + 1 ways (choose the number of 2-cent coins).','For m = 30, 25, 20, 15, 10, 5, 0 this gives 16 + 13 + 11 + 8 + 6 + 3 + 1 = 58.']},
 {u:'C2',d:2,q:'In how many ways can 12 identical marbles be placed into 4 different jars if no jar may hold more than 5 marbles?',c:['105','125','135','165','455'],a:'B',s:['Without the cap, stars and bars gives C(15, 3) = 455 distributions.','Subtract those where some jar has ≥ 6: put 6 in that jar first and distribute the other 6 freely, giving 4 · C(9, 3) = 336.','Add back those where two jars have ≥ 6: C(4, 2) · C(3, 3) = 6.','By inclusion–exclusion: 455 − 336 + 6 = 125.']},
 {u:'C2',d:3,q:'Each cell of a 2×6 grid (2 rows, 6 columns) is colored black or white. In how many colorings is there no 2×2 block of four black cells?',c:['3105','3136','3249','3375','3600'],a:'A',s:['Think column by column; each column is one of 4 types, and a 2×2 black block occurs exactly when two consecutive columns are both fully black.','Let aₙ count good colorings of n columns ending in a full-black column and bₙ those ending otherwise; then aₙ₊₁ = bₙ and bₙ₊₁ = 3(aₙ + bₙ).','Starting from a₁ = 1, b₁ = 3: (a, b) = (3, 12), (12, 45), (45, 171), (171, 648), (648, 2457).','Total = 648 + 2457 = 3105.']},
 {u:'C2',d:3,q:'Six friends each write their name on a slip of paper. The slips are redistributed, one to each friend, so that nobody receives their own slip and no two friends receive each other’s slips. In how many ways can this be done?',c:['120','160','185','200','265'],a:'B',s:['Follow “who holds whose slip”: this is a permutation of the 6 friends, which splits into cycles.','No one gets their own slip rules out cycles of length 1, and no swapped pair rules out cycles of length 2, so every cycle has length at least 3.','With 6 people, the cycle structure is either one 6-cycle, in 5! = 120 ways, or two 3-cycles, in C(6, 3)/2 · 2 · 2 = 10 · 4 = 40 ways.','Total = 120 + 40 = 160.']},
 {u:'C2',d:3,q:'How many ways are there to write 10 as an ordered sum of odd positive integers? (For example, 3 + 7 and 7 + 3 are different, and 1 + 1 + … + 1 counts.)',c:['34','42','55','89','144'],a:'C',s:['Let oₙ be the number of such ordered sums; split by the last part: if it is 1, the rest is a sum for n − 1; if it is ≥ 3, subtract 2 from it to get a sum for n − 2 ending in an odd part.','This gives the Fibonacci recursion oₙ = oₙ₋₁ + oₙ₋₂ with o₁ = 1, o₂ = 1.','So o₃, …, o₁₀ = 2, 3, 5, 8, 13, 21, 34, 55; the answer is 55.']},
 {u:'C2',d:3,q:'What is the value of C(9,0)/1 + C(9,1)/2 + C(9,2)/3 + … + C(9,9)/10?',c:['511/10','512/9','1023/11','1023/10','1024/9'],a:'D',s:['Use the absorption identity C(9, k)/(k + 1) = C(10, k + 1)/10.','The sum becomes [C(10, 1) + C(10, 2) + … + C(10, 10)]/10.','That bracket is 2¹⁰ − 1 = 1023, so the sum is 1023/10.']},
 {u:'C2',d:3,q:'What is the value of 0²·C(10,0) + 1²·C(10,1) + 2²·C(10,2) + … + 10²·C(10,10)?',c:['5120','23040','28160','51200','56320'],a:'C',s:['Count pairs (committee, president, secretary) from 10 people, where president and secretary are committee members and may be the same person: that is Σ k² C(10, k).','If president and secretary are the same person: 10 · 2⁹ = 5120 (choose that person, then any subset of the rest).','If they differ: 10 · 9 · 2⁸ = 23040.','Total = 5120 + 23040 = 28160.']}
);

AB.push(
 {u:'G1',d:1,q:'Regular hexagon ABCDEF has side length 4. What is the area of △ACE?',c:['12√3','14√3','16√3','18√3','24√3'],a:'A',s:['The hexagon splits into 6 equilateral triangles of side 4, so its area is 6 · 4√3 = 24√3.','Each of the three corner triangles ABC, CDE, EFA has two sides 4 with a 120° angle between them, so its area is (1/2) · 4 · 4 · sin 120° = 4√3.','So △ACE has area 24√3 − 3 · 4√3 = 12√3, exactly half the hexagon.']},
 {u:'G1',d:1,q:'Square ABCD has side length 12. Point E is the midpoint of BC and point F is the midpoint of CD. What is the area of △AEF?',c:['54','60','63','72','90'],a:'A',s:['Subtract the three right triangles around △AEF from the square’s area of 144.','△ABE and △ADF each have legs 12 and 6, so each has area 36.','△ECF has legs 6 and 6, so its area is 18.','The area of △AEF is 144 − 36 − 36 − 18 = 54.']},
 {u:'G1',d:2,q:'A triangle has side lengths 10, 17, and 21. What is the length of its shortest altitude?',c:['8','9','168/17','12','84/5'],a:'A',s:['By Heron’s formula with s = 24, the area is √(24 · 14 · 7 · 3) = √7056 = 84.','An altitude equals 2 · (area)/(base), so the shortest altitude is the one to the longest side, 21.','It has length 168/21 = 8.']},
 {u:'G1',d:2,q:'Trapezoid ABCD has AB ∥ CD with AB = 6 and CD = 15. Its diagonals meet at P, and △ABP has area 12. What is the area of ABCD?',c:['120','135','141','144','147'],a:'E',s:['△ABP ~ △CDP with ratio 6 : 15 = 2 : 5, so [CDP] = 12 · (5/2)² = 75.','△ADP and △ABP share the height from A to BD, so [ADP]/[ABP] = DP/PB = 5/2, giving [ADP] = 30; similarly [BCP] = 30.','The trapezoid’s area is 12 + 75 + 30 + 30 = 147.']},
 {u:'G1',d:2,q:'The interior angles of a convex polygon form an arithmetic sequence. The smallest angle is 100° and the common difference is 10°. How many sides does the polygon have?',c:['7','8','9','10','12'],a:'B',s:['With n sides the angle sum is 100n + 10 · n(n − 1)/2, which must equal 180(n − 2).','This simplifies to n² − 17n + 72 = 0, so n = 8 or n = 9.','For n = 9 the largest angle would be 100° + 80° = 180°, impossible in a convex polygon, so n = 8.']},
 {u:'G1',d:2,q:'Regular octagon ABCDEFGH is drawn, and the vertices A, C, E, G are joined to form a square. What fraction of the octagon’s area lies inside the square?',c:['1/2','(√2 + 1)/4','2/3','√2/2','3/4'],a:'D',s:['Let the octagon have circumradius R with center O; it is made of 8 isosceles triangles with apex angle 45°, so its area is 8 · (1/2)R² sin 45° = 2√2 R².','The square ACEG is made of 4 triangles with apex angle 90°, so its area is 4 · (1/2)R² = 2R².','The fraction is 2R²/(2√2 R²) = √2/2.']},
 {u:'G1',d:2,q:'The incircle of a right triangle touches the hypotenuse at a point that divides it into segments of lengths 5 and 12. What is the area of the triangle?',c:['48','54','56','60','65'],a:'D',s:['Equal tangent lengths make the legs 5 + r and 12 + r, where r is the inradius, and the hypotenuse 17.','The Pythagorean theorem gives (5 + r)² + (12 + r)² = 289, so r² + 17r = 60.','The area is (1/2)(5 + r)(12 + r) = (1/2)(60 + 17r + r²) = (1/2)(120) = 60.']},
 {u:'G1',d:3,q:'In △ABC, ∠BAC = 2∠ABC, AC = 4, and AB = 5. What is BC?',c:['2√6','3√3','2√7','6','3√5'],a:'D',s:['Extend CA past A to a point D with AD = AB = 5; then △ABD is isosceles, so ∠ADB = ∠ABD = (1/2)∠BAC = ∠ABC.','Thus △CBD ~ △CAB (they share ∠C and ∠CDB = ∠CBA), so CB/CA = CD/CB.','This gives BC² = CA · CD = 4 · (4 + 5) = 36, so BC = 6.']},
 {u:'G1',d:3,q:'Rectangle ABCD has AB = 12 and BC = 5. Point E lies on AB and point F lies on CD so that AECF is a rhombus. What is EF?',c:['5','65/12','17/3','6','169/24'],a:'B',s:['Let the rhombus side be x = AE = EC; then EB = 12 − x and right △EBC gives (12 − x)² + 25 = x², so x = 169/24.','The rhombus’s area is base AE times height BC, which is 5x = 845/24.','The area also equals half the product of its diagonals, AC = 13 and EF, so EF = 2 · (845/24)/13 = 65/12.']},
 {u:'G2',d:1,q:'A sector of a circle of radius 6 has perimeter 20 (two radii plus the arc). What is the area of the sector?',c:['24','30','36','12π','48'],a:'A',s:['The arc length is 20 − 2 · 6 = 8.','A sector’s area is (1/2) · radius · arc length, just like a triangle with base equal to the arc.','So the area is (1/2) · 6 · 8 = 24.']},
 {u:'G2',d:1,q:'Two concentric circles are drawn. A chord of the larger circle has length 16 and is tangent to the smaller circle. What is the area of the region between the two circles?',c:['32π','48π','64π','128π','256π'],a:'C',s:['Let the radii be R and r. The radius of the small circle to the point of tangency is perpendicular to the chord and bisects it.','The right triangle with hypotenuse R and legs r and 8 gives R² − r² = 64.','The area between the circles is π(R² − r²) = 64π.']},
 {u:'G2',d:2,q:'Points A, B, C lie on a circle so that the arcs AB, BC, CA (each not containing the third point) are in the ratio 3 : 4 : 5. The tangent to the circle at A meets line BC at P. What is the degree measure of ∠APB?',c:['15','20','24','30','45'],a:'D',s:['The arcs are 90°, 120°, and 150°.','An angle formed outside a circle by a tangent and a secant equals half the difference of the intercepted arcs; here those are arc CA = 150° and arc AB = 90°.','So ∠APB = (150° − 90°)/2 = 30°.']},
 {u:'G2',d:2,q:'A right triangle has inradius 3 and circumradius 10. What is its area?',c:['60','65','69','72','78'],a:'C',s:['The hypotenuse is a diameter of the circumcircle, so c = 20.','In a right triangle the inradius is r = (a + b − c)/2, so a + b = 26.','Then 2ab = (a + b)² − c² = 676 − 400 = 276, and the area is ab/2 = 69.']},
 {u:'G2',d:2,q:'Point P is 13 units from the center of a circle of radius 5. A line through P meets the circle at A and B, with A between P and B, and PA = AB. What is PA?',c:['6√2','9','2√21','6√3','12'],a:'A',s:['The power of P is PO² − r² = 169 − 25 = 144, and it equals PA · PB.','Since PA = AB, we have PB = 2 · PA, so 2 · PA² = 144.','Thus PA² = 72 and PA = 6√2.']},
 {u:'G2',d:2,q:'A circle is tangent to both the positive x-axis and the positive y-axis and passes through the point (1, 8). What is the sum of all possible radii of such a circle?',c:['9','13','15','16','18'],a:'E',s:['A circle tangent to both positive axes has center (r, r) and radius r.','Passing through (1, 8) means (r − 1)² + (r − 8)² = r², which simplifies to r² − 18r + 65 = 0.','Both roots, r = 5 and r = 13, work, and by Vieta their sum is 18.']},
 {u:'G2',d:3,q:'Three circles with radii 2, 3, and 10 are mutually externally tangent. What is the radius of the circle that passes through their three points of tangency?',c:['3/2','2','12/5','5/2','3'],a:'B',s:['The centers form a triangle with sides 2 + 3 = 5, 2 + 10 = 12, and 3 + 10 = 13, a right triangle.','From each center, the two tangency points on its sides are at equal distances (the circle’s radius), so the tangency points are exactly where the incircle of the center triangle touches its sides.','Thus the desired circle is that incircle, with radius (5 + 12 − 13)/2 = 2.']},
 {u:'G2',d:3,q:'Circles with radii 5 and 12 intersect at two points, and at each intersection point the tangent lines to the two circles are perpendicular. What is the length of the common chord of the two circles?',c:['60/13','8','9','120/13','10'],a:'D',s:['The tangent to each circle at an intersection point X is perpendicular to that circle’s radius, so the radii O₁X and O₂X are perpendicular.','Thus O₁O₂ = √(25 + 144) = 13, and the common chord is perpendicular to O₁O₂, with X at distance 5 · 12/13 = 60/13 from O₁O₂ (the altitude of the right triangle).','The chord is twice that: 120/13.']},
 {u:'G2',d:3,q:'An isosceles trapezoid with bases of lengths 2 and 18 has a circle inscribed in it. What is the radius of the circle that passes through all four vertices of the trapezoid?',c:['9','5√34/3','10','6√3','3√13'],a:'B',s:['A quadrilateral has an incircle exactly when its opposite sides have equal sums, so each leg is (2 + 18)/2 = 10, and the height is √(10² − 8²) = 6.','Place the vertices at (±9, 0) and (±1, 6); the circumcenter is (0, k) with 81 + k² = 1 + (6 − k)², so k = −11/3.','The radius is √(81 + 121/9) = √(850/9) = 5√34/3.']},
 {u:'G3',d:1,q:'A right circular cylinder has height equal to its diameter and volume 54π. What is its total surface area, including both bases?',c:['36π','45π','54π','63π','72π'],a:'C',s:['With radius r, the height is 2r, so the volume is πr² · 2r = 2πr³ = 54π, giving r = 3.','The two bases contribute 2 · 9π = 18π, and the side contributes 2π · 3 · 6 = 36π.','The total surface area is 54π.']},
 {u:'G3',d:1,q:'What is the y-intercept of the perpendicular bisector of the segment joining (−2, 3) and (4, 7)?',c:['4','5','11/2','6','13/2'],a:'E',s:['The midpoint is (1, 5), and the segment has slope 4/6 = 2/3, so the bisector has slope −3/2.','The bisector is y − 5 = −(3/2)(x − 1).','Setting x = 0 gives y = 5 + 3/2 = 13/2.']},
 {u:'G3',d:2,q:'How many points with both coordinates integers lie on the circle x² + y² = 65?',c:['16','20','24','28','32'],a:'A',s:['65 can be written as a sum of two squares in two ways: 1² + 8² and 4² + 7².','Each representation a² + b² with 0 < a < b gives 8 lattice points: choose the order of a and b and each sign.','So there are 2 · 8 = 16 lattice points.']},
 {u:'G3',d:2,q:'What is the area of the region consisting of all points (x, y) with |x| + |y − 2| ≤ 3 and y ≥ 0?',c:['15','16','17','35/2','18'],a:'C',s:['The inequality |x| + |y − 2| ≤ 3 describes a square (diamond) centered at (0, 2) with diagonals of length 6, so its area is 6 · 6/2 = 18.','The part below the x-axis is a small triangle with apex (0, −1) and base from (−1, 0) to (1, 0), with area (1/2) · 2 · 1 = 1.','The region’s area is 18 − 1 = 17.']},
 {u:'G3',d:2,q:'Cube ABCDEFGH has edge length 2, where ABCD is one face and E, F, G, H lie directly above A, B, C, D, respectively. What is the distance from vertex A to the plane through B, D, and E?',c:['√3/3','1','2√3/3','√2','√3'],a:'C',s:['The tetrahedron ABDE has three mutually perpendicular edges of length 2 at A, so its volume is (1/6) · 2³ = 4/3.','Its face BDE is equilateral with side 2√2, so its area is (√3/4) · 8 = 2√3.','The distance h satisfies (1/3) · 2√3 · h = 4/3, so h = 2/√3 = 2√3/3.']},
 {u:'G3',d:2,q:'A sphere is inscribed in a right circular cone with base radius 6 and height 8, tangent to the base and to the lateral surface. What is the ratio of the volume of the sphere to the volume of the cone?',c:['1/3','3/8','4/9','1/2','9/16'],a:'B',s:['A vertical cross-section through the axis is a triangle with sides 10, 10, 12 and area 48, and the sphere’s cross-section is its incircle.','The inradius is area/semiperimeter = 48/16 = 3.','The ratio is (4/3)π · 27 divided by (1/3)π · 36 · 8, which is 36π/96π = 3/8.']},
 {u:'G3',d:3,q:'A frustum of a right circular cone has bases of radii 3 and 6, and a sphere can be placed inside it tangent to both bases and to the lateral surface. What is the volume of the frustum?',c:['63√2π','84√2π','108√2π','117√2π','126√2π'],a:'E',s:['The cross-section through the axis is an isosceles trapezoid with bases 6 and 12 that has an incircle, so each slanted side equals (6 + 12)/2 = 9.','The height is then √(9² − 3²) = √72 = 6√2.','The frustum’s volume is (πh/3)(R² + Rr + r²) = (π · 6√2/3)(36 + 18 + 9) = 126√2π.']},
 {u:'G3',d:3,q:'A cube with edge length 6 is cut by the plane that passes through its center and is perpendicular to one of its space diagonals. What is the area of the cross-section?',c:['18√3','24√3','27√3','36√2','36√3'],a:'C',s:['By symmetry the plane passes through the midpoints of the six edges that do not touch either end of the diagonal, giving a regular hexagon.','Adjacent such midpoints, like (6, 3, 0) and (6, 0, 3), are 3√2 apart, so the hexagon has side 3√2.','Its area is (3√3/2) · (3√2)² = 27√3.']},
 {u:'G3',d:3,q:'The tangent lines to the parabola y = x² at the points (1, 1) and (4, 16) meet at a point T. What is the area of the triangle with vertices (1, 1), (4, 16), and T?',c:['6','27/4','7','15/2','9'],a:'B',s:['The tangent at (a, a²) is y = 2ax − a², since the line meets the parabola in the double root x = a; so the tangents are y = 2x − 1 and y = 8x − 16.','They meet where 2x − 1 = 8x − 16, at T = (5/2, 4).','By the shoelace formula, the area of the triangle with vertices (1, 1), (4, 16), (5/2, 4) is (1/2)|1 · 16 − 4 · 1 + 4 · 4 − (5/2) · 16 + (5/2) · 1 − 1 · 4| = (1/2)(27/2) = 27/4.']},
 {u:'G4',d:1,q:'In △ABC, AB = 6 and AC = 8, and the median from A to side BC has length 5. What is BC?',c:['8','2√19','9','10','2√30'],a:'D',s:['Stewart’s theorem for a median (Apollonius’s theorem) gives AB² + AC² = 2AM² + BC²/2.','So 36 + 64 = 50 + BC²/2, giving BC² = 100.','Thus BC = 10 (and the triangle is right-angled at A, with the median equal to half the hypotenuse).']},
 {u:'G4',d:2,q:'In △ABC, point D lies on BC with BD : DC = 2 : 3, and point E lies on CA with CE : EA = 4 : 5. Segments AD and BE meet at P. What is AP : PD?',c:['15/8','2','7/3','5/2','25/8'],a:'E',s:['Assign masses so that each cevian balances: BD : DC = 2 : 3 requires mass 3 at B and 2 at C.','CE : EA = 4 : 5 requires 4 · m(C) = 5 · m(A), so m(A) = 8/5; multiply all masses by 5 to get A = 8, B = 15, C = 10.','D carries mass 15 + 10 = 25, so AP : PD = 25 : 8 = 25/8.']},
 {u:'G4',d:2,q:'In △ABC, AB = 10. Point D is the midpoint of BC, and point E lies on side AC with AE : EC = 1 : 2. Line DE meets line AB at F. What is FB?',c:['10','12','15','18','20'],a:'E',s:['Apply Menelaus’s theorem to △ABC with transversal line DEF: (AF/FB) · (BD/DC) · (CE/EA) = 1.','With BD/DC = 1 and CE/EA = 2, we get AF/FB = 1/2, so F lies on ray BA beyond A with FB = 2 · FA.','Then FB = FA + AB = FB/2 + 10, so FB = 20.']},
 {u:'G4',d:2,q:'In △ABC, AB = 5, AC = 8, and ∠BAC = 60°. Let I be the incenter of the triangle. What is AI?',c:['2√3','√13','4','2√5','3√3'],a:'A',s:['The law of cosines gives BC² = 25 + 64 − 40 = 49, so BC = 7.','The area is (1/2) · 5 · 8 · sin 60° = 10√3 and the semiperimeter is 10, so the inradius is r = √3.','Since AI bisects the 60° angle, r = AI · sin 30°, so AI = 2r = 2√3.']},
 {u:'G4',d:2,q:'Point P lies inside △ABC so that the areas of △PBC, △PCA, and △PAB are in the ratio 2 : 3 : 4. Line AP meets BC at D. What is AP : PD?',c:['3/2','2','7/3','5/2','7/2'],a:'E',s:['△PBC and △ABC share base BC, so PD/AD equals the ratio of their heights, which is [PBC]/[ABC] = 2/9.','Hence AP/AD = 7/9.','So AP : PD = 7 : 2 = 7/2.']},
 {u:'G4',d:3,q:'Triangle ABC has AB = 13, BC = 14, and CA = 15. Let H be its orthocenter (the intersection of its altitudes). What is AH?',c:['7','15/2','8','65/8','33/4'],a:'E',s:['Place B = (0, 0), C = (14, 0); then A = (5, 12), and the altitude from A is the line x = 5.','AC has direction (9, −12), so the altitude from B is the line 9x − 12y = 0, i.e. y = 3x/4.','These meet at H = (5, 15/4), so AH = 12 − 15/4 = 33/4.']},
 {u:'G4',d:3,q:'Regular heptagon ABCDEFG has side length 1. What is the value of 1/AC + 1/AD?',c:['1/2','√2/2','1','√2','3/2'],a:'C',s:['Let AC = x and AD = y; every short diagonal of the heptagon equals x and every long diagonal equals y.','Quadrilateral ABCE is inscribed in the heptagon’s circumcircle with sides AB = BC = 1, CE = x, EA = y and diagonals AC = x, BE = y.','Ptolemy’s theorem gives AC · BE = AB · CE + BC · EA, so xy = x + y.','Dividing by xy gives 1/x + 1/y = 1.']},
 {u:'G4',d:3,q:'Triangle ABC has area 48. Point D lies on BC with BD : DC = 1 : 2, and E is the midpoint of AD. Line BE meets AC at F. What is the area of quadrilateral CDEF?',c:['20','24','26','28','32'],a:'D',s:['Use mass points: masses 2 at B and 1 at C balance at D, which then carries 3; since E is the midpoint of AD, A also gets mass 3.','On AC, AF : FC = m(C) : m(A) = 1 : 3.','Then [ABF] = 48/4 = 12 and [ABE] = (1/2)[ABD] = (1/2)(16) = 8, so [AEF] = 4.','Finally [CDEF] = [ADC] − [AEF] = 32 − 4 = 28.']},
 {u:'G4',d:3,q:'In △ABC, AB = 6, BC = 7, and CA = 8. The bisector of ∠BAC meets BC at D and meets the circumcircle of △ABC again at M. What is DM?',c:['3/2','7/4','2','9/4','12/5'],a:'C',s:['By the angle bisector theorem BD : DC = 6 : 8, so BD = 3 and DC = 4.','Stewart’s theorem (or AD² = AB · AC − BD · DC) gives AD² = 48 − 12 = 36, so AD = 6.','By the power of the point D, AD · DM = BD · DC = 12, so DM = 2.']}
);

AB.push(
 {u:'A4',d:1,q:'What is the value of 4^(log₂ 3) + 9^(log₃ 2)?',c:['6','10','12','13','17'],a:'D',s:['Rewrite 4^(log₂ 3) = (2^(log₂ 3))² = 3² = 9.','Similarly 9^(log₃ 2) = (3^(log₃ 2))² = 2² = 4.','The sum is 9 + 4 = 13.']},
 {u:'A4',d:1,q:'Which of the following numbers is the largest?',c:['√2','∛3','⁵√5','⁶√6','⁷√7'],a:'B',s:['To compare a^(1/m) and b^(1/n), raise both to the power mn and compare aⁿ with bᵐ.','√2 vs ∛3: 2³ = 8 < 3² = 9, so ∛3 is bigger; ∛3 vs ⁵√5: 3⁵ = 243 > 5³ = 125.','∛3 vs ⁶√6: 3² = 9 > 6, and ∛3 vs ⁷√7: 3⁷ = 2187 > 7³ = 343.','So ∛3 is the largest.']},
 {u:'A4',d:1,q:'A real number x satisfies 2ˣ + 2⁻ˣ = 6. What is 8ˣ + 8⁻ˣ?',c:['36','192','198','210','216'],a:'C',s:['Let t = 2ˣ, so t + 1/t = 6 and we want t³ + 1/t³.','Cube: (t + 1/t)³ = t³ + 1/t³ + 3(t + 1/t), so t³ + 1/t³ = 216 − 18.','Thus 8ˣ + 8⁻ˣ = 198.']},
 {u:'A4',d:3,q:'Positive real numbers a, b, c, none equal to 1, satisfy log_a(bc) = 3 and log_b(ca) = 4. What is log_c(ab)?',c:['7/12','9/11','1','11/9','12/7'],a:'B',s:['Let A = ln a, B = ln b, C = ln c and S = A + B + C. Then (B + C)/A = 3 means S/A = 4, and (C + A)/B = 4 means S/B = 5.','So A = S/4, B = S/5, and C = S − S/4 − S/5 = 11S/20.','Then log_c(ab) = (A + B)/C = (9S/20)/(11S/20) = 9/11.']},
 {u:'A4',d:2,q:'What is the sum of all positive real numbers x satisfying (log₂ x)(log₃ x) = log₂ x + log₃ x?',c:['1','5','6','7','12'],a:'D',s:['Let L = ln x. The equation becomes L²/(ln 2 · ln 3) = L(1/ln 2 + 1/ln 3) = L(ln 3 + ln 2)/(ln 2 · ln 3).','So L² = L · ln 6, giving L = 0 or L = ln 6.','Thus x = 1 or x = 6, and the sum is 7.']},
 {u:'A4',d:2,q:'What positive real number x satisfies x^(log₂ 3) + 3^(log₂ x) = 18?',c:['2','3','4','8','9'],a:'C',s:['Use the identity x^(log₂ 3) = 3^(log₂ x): taking log₂ of each side gives (log₂ 3)(log₂ x) both times.','So the two terms are equal, and 3^(log₂ x) = 9.','Hence log₂ x = 2 and x = 4.']},
 {u:'A4',d:2,q:'For a certain constant k, the equation 4ˣ − k · 2ˣ + 32 = 0 has two real solutions that differ by 3. What is k?',c:['6','12','16','18','33'],a:'D',s:['Let t = 2ˣ; then t² − kt + 32 = 0 has two positive roots t₁ > t₂ with t₁t₂ = 32.','Solutions differing by 3 means t₁/t₂ = 2³ = 8.','From t₁t₂ = 32 and t₁ = 8t₂ we get t₂ = 2 and t₁ = 16.','So k = t₁ + t₂ = 18.']},
 {u:'A4',d:2,q:'How many ordered pairs (m, n) of positive integers satisfy mⁿ = 2²⁴ · 3³⁶?',c:['6','8','9','12','16'],a:'A',s:['If mⁿ = 2²⁴ · 3³⁶, then m = 2ᵃ · 3ᵇ with na = 24 and nb = 36.','So n must divide both 24 and 36, i.e. n divides gcd(24, 36) = 12, and each such n gives exactly one m.','12 has 6 divisors, so there are 6 pairs.']},
 {u:'A4',d:3,q:'For how many integers n with 1 ≤ n ≤ 100 do 2ⁿ and 5ⁿ have the same leading (leftmost) digit? (Use log₁₀ 2 ≈ 0.30103 if needed.)',c:['5','6','8','10','20'],a:'A',s:['Write 2ⁿ = x · 10ᵖ and 5ⁿ = y · 10^q with 1 ≤ x, y < 10. Since 2ⁿ5ⁿ = 10ⁿ and neither is a power of 10, xy = 10.','If both lead with digit d, then d² ≤ xy = 10 < (d + 1)², forcing d = 3; so we need 3 ≤ x < 10/3.','That means the fractional part of n log₁₀ 2 lies in [log₁₀ 3, 1 − log₁₀ 3) ≈ [0.4771, 0.5229).','Checking n log₁₀ 2 for n ≤ 100, this happens for n = 5, 15, 78, 88, 98, so the answer is 5.']},
 {u:'A4',d:3,q:'What is the larger of the two positive real numbers x satisfying log_x 2 + log_(2x) 2 = log_(4x) 2?',c:['1/16','2^(√2 − 2)','2^(√2 − 1)','√2','2^(2 − √2)'],a:'B',s:['Let t = log₂ x. Then log_x 2 = 1/t, log_(2x) 2 = 1/(1 + t), and log_(4x) 2 = 1/(2 + t).','The equation 1/t + 1/(1 + t) = 1/(2 + t) becomes (2t + 1)(t + 2) = t(t + 1), i.e. t² + 4t + 2 = 0.','So t = −2 ± √2; neither is 0, −1, or −2, so both are valid.','The larger x corresponds to t = √2 − 2, so x = 2^(√2 − 2).']},
 {u:'A4',d:3,q:'Positive real numbers x, y, z satisfy xyz = 2¹² and x^(log₂ y) · y^(log₂ z) · z^(log₂ x) = 2⁴⁴. What is (log₂ x)² + (log₂ y)² + (log₂ z)²?',c:['16','32','44','50','56'],a:'E',s:['Let a = log₂ x, b = log₂ y, c = log₂ z. Then a + b + c = 12.','Since log₂(x^(log₂ y)) = ab, taking log₂ of the second equation gives ab + bc + ca = 44.','So a² + b² + c² = (a + b + c)² − 2(ab + bc + ca) = 144 − 88 = 56.']},
 {u:'A4',d:3,q:'For how many integers n with 1 ≤ n ≤ 1000 is ⌊log₂ n⌋ = ⌊log₃ n⌋ + 3?',c:['660','661','683','688','744'],a:'A',s:['⌊log₃ n⌋ = k means 3ᵏ ≤ n < 3ᵏ⁺¹, and we need 2ᵏ⁺³ ≤ n < 2ᵏ⁺⁴; intersect these ranges for each k.','For k ≤ 2 the ranges miss each other (e.g. [9, 27) and [32, 64)).','k = 3: [64, 81) gives 17; k = 4: [128, 243) gives 115; k = 5: [256, 512) gives 256; k = 6: [729, 1000] gives 272.','The total is 17 + 115 + 256 + 272 = 660.']},

 {u:'T1',d:1,q:'What is i + i² + i³ + ⋯ + i²⁰²⁶, where i² = −1?',c:['−1 + i','−1 − i','−1','i','0'],a:'A',s:['Powers of i repeat every 4 terms: i, −1, −i, 1, which sum to 0.','The first 2024 terms form 506 full cycles and sum to 0.','The remaining terms are i²⁰²⁵ + i²⁰²⁶ = i + (−1) = −1 + i.']},
 {u:'T1',d:1,q:'In △ABC, sin A : sin B : sin C = 4 : 5 : 6. What is the cosine of the largest angle of the triangle?',c:['−1/8','1/8','1/4','9/16','3/4'],a:'B',s:['By the Law of Sines, the sides are in ratio 4 : 5 : 6, so take sides 4, 5, 6.','The largest angle is opposite side 6.','By the Law of Cosines, its cosine is (16 + 25 − 36)/(2 · 4 · 5) = 5/40 = 1/8.']},
 {u:'T1',d:2,q:'What is tan 20° · tan 40° · tan 80°?',c:['√3/3','1','√2','√3','2'],a:'D',s:['Use the identity tan θ · tan(60° − θ) · tan(60° + θ) = tan 3θ.','With θ = 20°, the factors are tan 20°, tan 40°, tan 80°.','So the product is tan 60° = √3.']},
 {u:'T1',d:2,q:'What is the maximum value of sin x (sin x + √3 cos x) over all real x?',c:['1/2','1','5/4','4/3','3/2'],a:'E',s:['Expand: sin²x + √3 sin x cos x = (1 − cos 2x)/2 + (√3/2) sin 2x.','This equals 1/2 + (√3/2) sin 2x − (1/2) cos 2x = 1/2 + sin(2x − 30°).','The sine term is at most 1, so the maximum is 3/2.']},
 {u:'T1',d:2,q:'The four solutions of z⁴ − 4z² + 16 = 0 are the vertices of a quadrilateral in the complex plane. What is its area?',c:['2√3','4','6','4√3','8'],a:'D',s:['Solve for z²: z² = 2 ± 2√3 i, which has modulus 4 and argument ±60°.','Taking square roots, z = ±2(cos 30° ± i sin 30°) = ±√3 ± i.','These are the corners of a rectangle with width 2√3 and height 2, so the area is 4√3.']},
 {u:'T1',d:2,q:'An angle x satisfies sec x + tan x = 3. What is sin x?',c:['3/5','4/5','5/6','8/9','9/10'],a:'B',s:['Since sec²x − tan²x = 1, we have (sec x − tan x)(sec x + tan x) = 1, so sec x − tan x = 1/3.','Adding and subtracting: sec x = 5/3 and tan x = 4/3.','Then sin x = tan x / sec x = (4/3)/(5/3) = 4/5.']},
 {u:'T1',d:2,q:'What is cos²(π/7) + cos²(2π/7) + cos²(3π/7)?',c:['1','9/8','5/4','3/2','7/4'],a:'C',s:['Use cos²θ = (1 + cos 2θ)/2, so the sum is 3/2 + (1/2)(cos(2π/7) + cos(4π/7) + cos(6π/7)).','The real parts of the nonreal 7th roots of unity sum to −1, and by symmetry cos(2π/7) + cos(4π/7) + cos(6π/7) = −1/2.','So the sum is 3/2 − 1/4 = 5/4.']},
 {u:'T1',d:3,q:'In △ABC, ∠A = 2∠B, BC = 6, and CA = 4. What is AB?',c:['3','7/2','4','9/2','5'],a:'E',s:['Let ∠B = β. By the Law of Sines, 6/sin 2β = 4/sin β, so cos β = 6/8 = 3/4.','By the Law of Cosines at B: 16 = 36 + c² − 2 · 6 · c · (3/4), i.e. c² − 9c + 20 = 0, so c = 4 or c = 5.','If c = 4 then AB = CA, making ∠B = ∠C and forcing ∠A = 90° with ∠B = 45°, which contradicts cos β = 3/4; so AB = 5.']},
 {u:'T1',d:3,q:'How many complex numbers z with |z| = 1 have the property that z⁹ − z is a real number?',c:['9','10','14','16','18'],a:'D',s:['Write z = cos θ + i sin θ. Then z⁹ − z is real exactly when sin 9θ = sin θ.','This holds when 9θ = θ + 2πk, giving θ = 2πk/8 (8 values), or 9θ = π − θ + 2πk, giving θ = (2k + 1)π/10 (10 values).','Common values satisfy πk/4 = (2j + 1)π/10, i.e. 5k = 2(2j + 1); this gives θ = π/2 and 3π/2.','So there are 8 + 10 − 2 = 16 such z.']},
 {u:'T1',d:3,q:'A complex number z with positive imaginary part satisfies |z| = 2, and the points z, z², z³ in the complex plane form a right triangle with the right angle at z. What is the area of this triangle?',c:['6√3','8√3','7√7','12√3','14√3'],a:'E',s:['The angle at z is right exactly when (z² − z)/(z³ − z) is purely imaginary; this ratio simplifies to 1/(z + 1).','So z + 1 is purely imaginary, meaning Re z = −1; with |z| = 2 and Im z > 0, z = −1 + √3 i.','Then z² = −2 − 2√3 i and z³ = 8, so the legs are |z² − z| = |−1 − 3√3 i| = 2√7 and |z³ − z| = |9 − √3 i| = 2√21.','The area is (1/2)(2√7)(2√21) = 2√147 = 14√3.']},
 {u:'T1',d:3,q:'A triangle has circumradius 5 and two sides of lengths 6 and 8. What is the sum of all possible areas of such a triangle?',c:['168/25','24','28','30','768/25'],a:'E',s:['By the Law of Sines, the angles A and B opposite sides 6 and 8 satisfy sin A = 6/10 = 3/5 and sin B = 8/10 = 4/5.','A is the angle opposite the shorter side, so it is acute: cos A = 4/5. But B may be acute (cos B = 3/5) or obtuse (cos B = −3/5).','Then sin C = sin(A + B) = (3/5) cos B + (4/5)(4/5) equals 1 or 7/25, giving areas (1/2)(6)(8) sin C = 24 or 168/25.','The sum is 24 + 168/25 = 768/25.']},
