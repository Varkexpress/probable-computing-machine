 {u:'A2',d:3,q:'What is the sum of all distinct real numbers x satisfying x⁴ − 5x³ + 8x² − 5x + 1 = 0?',c:['2','3','4','5','8'],a:'C',s:['The coefficients are symmetric, so divide by x² and let t = x + 1/x: the equation becomes t² − 5t + 6 = 0.','So t = 2 or t = 3. From x + 1/x = 2 we get only x = 1 (a double root).','From x + 1/x = 3 we get x² − 3x + 1 = 0, two distinct real roots with sum 3.','The distinct real roots therefore sum to 1 + 3 = 4.']},
 {u:'A2',d:3,q:'Let P(x) be the monic polynomial of degree 6 with integer coefficients that has √3 + ∛2 as a root. What is P(1)?',c:['−44','−27','8','44','108'],a:'A',s:['If x = √3 + ∛2, then (x − √3)³ = 2, which expands to x³ + 9x − 2 = √3(3x² + 3).','Squaring removes the radical: P(x) = (x³ + 9x − 2)² − 27(x² + 1)² is monic of degree 6 with integer coefficients and has the root.','Then P(1) = 8² − 27·2² = 64 − 108 = −44.']},
 {u:'A2',d:3,q:'What is the minimum value of |x − 1| + 2|x − 2| + 3|x − 3| + ⋯ + 10|x − 10| over all real x?',c:['112','120','125','132','165'],a:'A',s:['The function is piecewise linear and convex; its slope just to the right of x is (total weight of points at or left of x) − (weight to the right).','The weights total 55, and 1 + 2 + ⋯ + 7 = 28 > 27.5 while 1 + ⋯ + 6 = 21 < 27.5, so the minimum (the weighted median) is at x = 7.','There the value is 6 + 10 + 12 + 12 + 10 + 6 + 0 + 8 + 18 + 30 = 112.']},
 {u:'A2',d:3,q:'For a real number m, let N(m) be the number of real solutions x of |x² − 6|x| + 5| = m. What is N(0) + N(1) + N(2) + N(3) + N(4) + N(5) + N(6)?',c:['36','37','38','39','40'],a:'D',s:['The graph is symmetric about x = 0, so study x ≥ 0: |x² − 6x + 5| equals 5 at x = 0, falls to 0 at x = 1, rises to a peak of 4 at x = 3, falls to 0 at x = 5, then increases.','For 0 < m < 4 the horizontal line meets the right half 4 times, so N = 8; N(0) = 4 (x = ±1, ±5), and N(4) = 6 (x = ±3 are tangent points).','For m = 5 the solutions are x = 0 and two others, so N(5) = 3; for m = 6 there are only 2.','The sum is 4 + 8 + 8 + 8 + 6 + 3 + 2 = 39.']},
 {u:'A3',d:1,q:'A sequence has a₁ = 1, a₂ = 2, and for n ≥ 3 each term equals the sum of all the terms before it. What is a₁₀?',c:['256','384','512','768','1024'],a:'B',s:['a₃ = 1 + 2 = 3, and for n ≥ 3, aₙ₊₁ = (a₁ + ⋯ + aₙ₋₁) + aₙ = aₙ + aₙ = 2aₙ.','So from a₃ = 3 the terms double: aₙ = 3·2ⁿ⁻³ for n ≥ 3.','Hence a₁₀ = 3·2⁷ = 384.']},
 {u:'A3',d:1,q:'Let f(x) = ax⁵ + bx³ + cx − 7 for some constants a, b, c. If f(−4) = 13, what is f(4)?',c:['−27','−20','−13','13','27'],a:'A',s:['The part g(x) = ax⁵ + bx³ + cx is odd, so g(4) = −g(−4).','From f(−4) = g(−4) − 7 = 13 we get g(−4) = 20, so g(4) = −20.','Then f(4) = −20 − 7 = −27.']},
 {u:'A3',d:2,q:'How many positive integers less than 1000 appear in both of the arithmetic sequences 3, 10, 17, 24, … and 5, 16, 27, 38, …?',c:['9','11','12','13','14'],a:'D',s:['A common term must be 3 more than a multiple of 7 and 5 more than a multiple of 11.','Checking 3, 10, 17, 24, 31, 38 shows the smallest is 38, and common terms repeat every lcm(7, 11) = 77.','So they are 38 + 77k with 38 + 77k < 1000, i.e. k = 0, 1, …, 12: thirteen numbers.']},
 {u:'A3',d:2,q:'A sequence has a₁ = 1, a₂ = 5, and aₙ₊₂ = 5aₙ₊₁ − 6aₙ for n ≥ 1. What is a₈?',c:['2059','6305','6561','6817','19171'],a:'B',s:['The characteristic equation r² = 5r − 6 has roots 2 and 3, so aₙ = A·3ⁿ + B·2ⁿ.','From a₁ = 1 and a₂ = 5: 3A + 2B = 1 and 9A + 4B = 5 give A = 1, B = −1, so aₙ = 3ⁿ − 2ⁿ.','Thus a₈ = 6561 − 256 = 6305.']},
 {u:'A3',d:2,q:'Let f(x) = x² + 2x. What is f(f(f(f(f(1)))))?',c:['2¹⁶ − 1','2²⁵ − 1','2³² − 1','2³² + 1','2⁶⁴ − 1'],a:'C',s:['Notice f(x) + 1 = (x + 1)², so in terms of y = x + 1 the map simply squares y.','Starting from y = 2, five squarings give 2^(2⁵) = 2³².','So the value is 2³² − 1.']},
 {u:'A3',d:2,q:'A sequence starts with a₁ = 2026. For n ≥ 1, aₙ₊₁ = aₙ/2 if aₙ is even and aₙ₊₁ = aₙ + 5 if aₙ is odd. What is a₁₀₀?',c:['2','4','8','11','16'],a:'C',s:['Compute: 2026, 1013, 1018, 509, 514, 257, 262, 131, 136, 68, 34, 17, 22, 11, 16, 8, so a₁₆ = 8.','From there the terms cycle 8, 4, 2, 1, 6, 3, 8, … with period 6.','Since 100 − 16 = 84 is a multiple of 6, a₁₀₀ = a₁₆ = 8.']},
 {u:'A3',d:2,q:'A sequence has a₁ = 3 and aₙ₊₁ = (n·aₙ + n + 1)/(n + 1) for n ≥ 1. What is a₁₀₀?',c:['50','101/2','1263/25','51','103/2'],a:'C',s:['Multiply by n + 1 and let bₙ = n·aₙ: then bₙ₊₁ = bₙ + (n + 1).','So bₙ = b₁ + (2 + 3 + ⋯ + n) = 3 + n(n + 1)/2 − 1 = 2 + n(n + 1)/2.','Then a₁₀₀ = b₁₀₀/100 = (2 + 5050)/100 = 1263/25.']},
 {u:'A3',d:3,q:'A strictly increasing function f from the positive integers to the positive integers satisfies f(f(n)) = 3n for every positive integer n. What is f(13)?',c:['18','19','20','21','22'],a:'E',s:['f(1) = 1 would give f(f(1)) = 1, and f(1) = k ≥ 3 would make f(k) = 3 even though f(k) > f(1) = k ≥ 3; so f(1) = 2, f(2) = 3, f(3) = 6, f(6) = 9, f(9) = 18, f(18) = 27.','Between 9 and 18, f must take the 9 values 18 < … < 27 on the 9 inputs 9, 10, …, 18 strictly increasing, so f(9 + k) = 18 + k.','Hence f(13) = 22.']},
 {u:'A3',d:3,q:'In the sequence 1, 2, 2, 3, 3, 3, 4, 4, 4, 4, …, each positive integer n appears exactly n times in a row. What is the sum of the first 2026 terms?',c:['83328','84672','85344','85920','85984'],a:'E',s:['The block of n’s ends at position n(n + 1)/2; since 63·64/2 = 2016 ≤ 2026 < 2080, the first 2016 terms are the complete blocks 1 through 63.','Those contribute 1² + 2² + ⋯ + 63² = 63·64·127/6 = 85344.','The remaining 10 terms are 64’s, adding 640, for a total of 85984.']},
 {u:'A3',d:3,q:'What is the value of the double sum of 1/(2ⁱ·3ʲ) over all pairs of positive integers (i, j) with i < j?',c:['1/30','1/20','1/12','1/10','1/6'],a:'D',s:['Fix j and sum over i = 1, …, j − 1: Σ 1/2ⁱ = 1 − 1/2ʲ⁻¹, so the inner sum gives (1/3ʲ)(1 − 2/2ʲ) = 1/3ʲ − 2/6ʲ.','Summing over j ≥ 1: Σ 1/3ʲ = 1/2 and Σ 2/6ʲ = 2·(1/5) = 2/5.','The total is 1/2 − 2/5 = 1/10.']},
 {u:'A3',d:3,q:'A function f, defined for all real x other than 0 and 1, satisfies f(x) + f((x − 1)/x) = 1 + x. What is f(2)?',c:['3/4','1','5/4','3/2','9/4'],a:'A',s:['The map φ(x) = (x − 1)/x cycles 2 → 1/2 → −1 → 2, so it has order 3 on these values.','Plugging in x = 2, 1/2, −1 gives f(2) + f(1/2) = 3, f(1/2) + f(−1) = 3/2, f(−1) + f(2) = 0.','Adding, the three values sum to 9/4; subtracting the second equation gives f(2) = 9/4 − 3/2 = 3/4.']}
);

AB.push(
 {u:'N1',d:1,q:'What is the sum of all positive integers n ≤ 200 that have exactly three positive divisors?',c:['87','208','290','377','548'],a:'D',s:['A number with exactly three divisors 1, p, p² must be the square of a prime p.','The prime squares up to 200 are 4, 9, 25, 49, 121, 169 (the next, 289, is too big).','Their sum is 4 + 9 + 25 + 49 + 121 + 169 = 377.']},
 {u:'N1',d:1,q:'For how many prime numbers p are both p + 10 and p + 14 also prime?',c:['0','1','2','3','infinitely many'],a:'B',s:['Look at p, p + 10, p + 14 modulo 3: they are p, p + 1, p + 2, so one of the three is divisible by 3.','A prime divisible by 3 must equal 3, and p + 10, p + 14 exceed 3, so p = 3.','Indeed 3, 13, 17 are all prime, so there is exactly 1 such prime.']},
 {u:'N1',d:1,q:'Given that 1013 is prime, what is the sum of all positive divisors of 2026 that are less than 2026?',c:['1016','1017','1029','2029','3042'],a:'A',s:['Since 2026 = 2 · 1013 with 1013 prime, its divisors are 1, 2, 1013, 2026.','Leaving out 2026 itself, the sum is 1 + 2 + 1013 = 1016.']},
 {u:'N1',d:2,q:'Each of the 72 fractions 1/72, 2/72, 3/72, …, 72/72 is reduced to lowest terms. How many of the reduced fractions have an odd denominator?',c:['3','4','6','8','9'],a:'E',s:['The fraction k/72 reduces to a fraction with denominator 72/gcd(k, 72).','Since 72 = 8 · 9, this denominator is odd exactly when gcd(k, 72) contains the full factor 8, that is, when 8 divides k.','The multiples of 8 from 1 to 72 are 8, 16, …, 72, so there are 9 such fractions.']},
 {u:'N1',d:2,q:'A positive integer n has exactly four positive divisors, and the sum of those four divisors is 96. What is the sum of all possible values of n?',c:['131','139','146','208','285'],a:'D',s:['A number with four divisors is either p³ or pq with distinct primes p, q.','For p³ the divisor sum 1 + p + p² + p³ is 15, 40, 156, … and never 96.','For pq the sum is (1 + p)(1 + q) = 96; factor pairs give 3 · 32 (p = 2, q = 31), 4 · 24 (3, 23), and 8 · 12 (7, 11), while 2 · 48 and 6 · 16 fail.','So n ∈ {62, 69, 77} and the sum is 208.']},
 {u:'N1',d:2,q:'For how many integers n with 2 ≤ n ≤ 50 is lcm(1, 2, …, n) strictly larger than lcm(1, 2, …, n − 1)?',c:['15','19','21','22','23'],a:'E',s:['Adding n to the list raises the lcm exactly when n contributes a higher power of some prime than any smaller number, which happens exactly when n is a prime power pᵏ.','The primes up to 50 give 15 values.','The higher prime powers up to 50 are 4, 8, 16, 32, 9, 27, 25, 49, giving 8 more.','In total 15 + 8 = 23.']},
 {u:'N1',d:2,q:'What is the smallest positive integer n such that each of n, n + 1, and n + 2 has exactly four positive divisors?',c:['21','33','35','85','93'],a:'B',s:['Numbers with four divisors are pq or p³. Among three consecutive integers one is even, so it must be 2q or 8, and none of the three can be a prime or a prime square.','Check runs: 14, 15, 16 fails (16 has 5 divisors); 21, 22, 23 fails (23 is prime); 26, 27, 28 fails at 28.','33 = 3 · 11, 34 = 2 · 17, 35 = 5 · 7 all have four divisors, and no smaller run works, so n = 33.']},
 {u:'N1',d:2,q:'What is the largest positive integer that divides n⁷ − n for every integer n?',c:['42','84','126','168','252'],a:'A',s:['By Fermat’s little theorem, p divides n⁷ − n for all n whenever p − 1 divides 6, that is, for p = 2, 3, 7.','So 2 · 3 · 7 = 42 always divides n⁷ − n.','Nothing larger works: 2⁷ − 2 = 126 and 3⁷ − 3 = 2184 have gcd 42, so the answer is 42.']},
 {u:'N1',d:2,q:'How many integers n with 1 ≤ n ≤ 100 have exactly 6 positive divisors?',c:['16','17','18','20','24'],a:'A',s:['6 = 6 or 3 · 2, so n = p⁵ or n = p²q with distinct primes p, q.','p⁵ ≤ 100 gives only 32.','p = 2: 4q with q ∈ {3, 5, 7, 11, 13, 17, 19, 23} gives 8; p = 3: 9q with q ∈ {2, 5, 7, 11} gives 4; p = 5: 25q with q ∈ {2, 3} gives 2; p = 7: 98.','Total 1 + 8 + 4 + 2 + 1 = 16.']},
 {u:'N1',d:3,q:'How many ordered triples (a, b, c) of positive integers satisfy lcm(a, b) = lcm(b, c) = lcm(c, a) = 72?',c:['36','49','56','63','70'],a:'E',s:['Write 72 = 2³ · 3² and handle each prime separately, since lcm takes the maximum exponent.','For the prime 2, the exponents (x, y, z) lie in {0, …, 3} and every pair must have maximum 3, so at least two of them equal 3: either all three (1 way) or exactly two with the third in {0, 1, 2} (3 · 3 = 9 ways), 10 in all.','Likewise for the prime 3 with maximum exponent 2: 1 + 3 · 2 = 7 ways.','Multiply: 10 · 7 = 70.']},
 {u:'N1',d:3,q:'Let d(n) be the number of positive divisors of n. How many positive integers n satisfy n = 3·d(n)?',c:['1','2','3','4','5'],a:'C',s:['Divisors come in pairs (k, n/k) with one member at most √n, so d(n) ≤ 2√n. Then n = 3d(n) ≤ 6√n gives n ≤ 36.','Also n must be a multiple of 3, so check n = 3, 6, …, 36 against d(n) = n/3.','Only 9 (d = 3), 18 (d = 6), and 24 (d = 8) work, so there are 3 such integers.']},
 {u:'N1',d:3,q:'Call a positive integer n a record-setter if n has more positive divisors than every positive integer smaller than n (so 1 is a record-setter). How many record-setters are at most 100?',c:['7','8','9','10','12'],a:'C',s:['Track the record as n grows: d(1) = 1, d(2) = 2, d(4) = 3, d(6) = 4, d(12) = 6.','Next, d(24) = 8, d(36) = 9, d(48) = 10, d(60) = 12; after 60, the numbers 72, 84, 90, 96 only tie with 12 divisors, and no n ≤ 100 has more.','The record-setters are 1, 2, 4, 6, 12, 24, 36, 48, 60, which is 9 numbers.']},
 {u:'N2',d:1,q:'What is the remainder when 1 + 22 + 333 + 4444 + ⋯ + 999999999 is divided by 9?',c:['0','1','3','5','6'],a:'E',s:['A number is congruent mod 9 to its digit sum.','The term with k copies of the digit k has digit sum k², so the total is congruent to 1² + 2² + ⋯ + 9² = 285.','285 = 9 · 31 + 6, so the remainder is 6.']},
 {u:'N2',d:1,q:'What is the units digit of 1¹ + 2² + 3³ + ⋯ + 10¹⁰?',c:['1','3','5','7','9'],a:'D',s:['Find each units digit using the 4-cycle of last digits: 1, 4, 7 (27), 6 (256), 5, 6, 3 (7⁷ ends like 7³), 6 (8⁸ ends like 8⁴), 9 (9⁹), and 0.','Their sum is 1 + 4 + 7 + 6 + 5 + 6 + 3 + 6 + 9 + 0 = 47.','So the units digit is 7.']},
 {u:'N2',d:1,q:'How many digits does 2¹⁰⁰ have when written in base 8?',c:['33','34','35','50','100'],a:'B',s:['Write 2¹⁰⁰ = 2 · 2⁹⁹ = 2 · 8³³.','In base 8 this is the digit 2 followed by 33 zeros.','That is 34 digits.']},
 {u:'N2',d:1,q:'Today is Monday. What day of the week will it be 10¹⁰ days from today?',c:['Tuesday','Wednesday','Thursday','Friday','Saturday'],a:'D',s:['Only 10¹⁰ mod 7 matters. Since 10 ≡ 3 (mod 7) and 3⁶ ≡ 1 (mod 7), we get 10¹⁰ ≡ 3¹⁰ ≡ 3⁴ = 81 ≡ 4.','Four days after Monday is Friday.']},
 {u:'N2',d:2,q:'What is the smallest positive integer n such that the last two digits of 17n are 01?',c:['33','53','57','73','93'],a:'B',s:['We need 17n ≡ 1 (mod 100), i.e. n is the inverse of 17 mod 100.','Solve 17n = 100m + 1: try m with 100m + 1 ≡ 0 (mod 17); since 100 ≡ 15 ≡ −2, need 2m ≡ 1, so m ≡ 9 (mod 17).','Then 17n = 901 and n = 53.']},
 {u:'N2',d:3,q:'For how many integers b with 3 ≤ b ≤ 100 is the base-b numeral 1212 (read in base b) divisible by 7?',c:['14','15','27','28','42'],a:'A',s:['1212 in base b equals b³ + 2b² + b + 2 = (b + 2)(b² + 1).','Squares mod 7 are 0, 1, 2, 4, so b² + 1 ≡ 0 (mod 7) is impossible; thus 7 must divide b + 2, i.e. b ≡ 5 (mod 7).','The values are 5, 12, …, 96, which is (96 − 5)/7 + 1 = 14 bases.']},
 {u:'N2',d:2,q:'What are the last three digits of 5²⁰²⁶?',c:['025','125','375','625','875'],a:'D',s:['Mod 8, 5² ≡ 1, so 5²⁰²⁶ ≡ 1 (mod 8); mod 125, 5²⁰²⁶ ≡ 0.','We need a multiple of 125 below 1000 that is ≡ 1 (mod 8): among 125, 375, 625, 875 only 625 works (625 = 78 · 8 + 1).','So the last three digits are 625.']},
 {u:'N2',d:2,q:'What are the last three digits of 11²⁰²⁶?',c:['121','261','361','521','761'],a:'E',s:['Expand (10 + 1)²⁰²⁶ with the binomial theorem; terms with 10³ or more vanish mod 1000.','So 11²⁰²⁶ ≡ 1 + 2026 · 10 + C(2026, 2) · 100 (mod 1000).','2026 · 10 = 20260 ≡ 260, and C(2026, 2) = 2051325 ends in 5, so C(2026, 2) · 100 ≡ 500.','Total 1 + 260 + 500 = 761.']},
 {u:'N2',d:2,q:'How many integers x with 0 ≤ x ≤ 9999 have the property that x² ends in the same last four digits as x (that is, x² ≡ x (mod 10000))?',c:['2','4','5','6','8'],a:'B',s:['x² ≡ x means x(x − 1) ≡ 0 (mod 2⁴ · 5⁴); since x and x − 1 are coprime, each prime power must divide one of them entirely.','So x ≡ 0 or 1 (mod 16) and x ≡ 0 or 1 (mod 625), and by the Chinese Remainder Theorem each of the 2 · 2 choices gives exactly one x.','They are 0, 1, 625, and 9376, so there are 4.']},
 {u:'N2',d:3,q:'What is the smallest positive integer n such that 3ⁿ − 1 is divisible by 1000?',c:['10','20','50','100','500'],a:'D',s:['Split 1000 = 8 · 125. Mod 8, 3² = 9 ≡ 1, so the order of 3 is 2.','Mod 5 the order of 3 is 4, the maximum possible, and 3⁴ = 81 ≢ 1 (mod 25); this makes 3 a primitive root mod every power of 5, so its order mod 125 is φ(125) = 100.','So we need n divisible by lcm(2, 100) = 100, and the answer is 100.']},
 {u:'N2',d:3,q:'For how many integers n with 1 ≤ n ≤ 1000 is n² + n + 1 divisible by 49?',c:['41','42','49','82','286'],a:'A',s:['Mod 7, n² + n + 1 ≡ 0 holds exactly for n ≡ 2 or 4.','Lift to mod 49: from n = 2 + 7t, n² + n + 1 = 7 + 35t + 49t² ≡ 7(1 + 5t), needing t ≡ 4 (mod 7), so n ≡ 30; similarly n = 4 + 7t needs n ≡ 18 (mod 49). (Check 18² + 18 + 1 = 343.)','Count: n ≡ 18 gives 18, 67, …, 998 (21 values) and n ≡ 30 gives 30, …, 961 (20 values).','Total 41.']},
 {u:'N2',d:3,q:'How many pairs (x, y) of positive integers with x < 1000 satisfy x² − 2y² = 1?',c:['2','3','4','5','6'],a:'C',s:['The smallest solution is (3, 2). All positive solutions come from powers: xₙ + yₙ√2 = (3 + 2√2)ⁿ.','This gives the recursion xₙ₊₁ = 3xₙ + 4yₙ, yₙ₊₁ = 2xₙ + 3yₙ: (3, 2), (17, 12), (99, 70), (577, 408), (3363, 2378), ….','Exactly 4 of them have x < 1000.']},
 {u:'S1',d:1,q:'Five different positive integers have sum 100. What is the largest possible value of the smallest of them?',c:['18','19','20','21','22'],a:'A',s:['If the smallest is a, the five numbers are at least a, a + 1, a + 2, a + 3, a + 4, whose sum is 5a + 10.','So 5a + 10 ≤ 100, giving a ≤ 18.','a = 18 works: 18 + 19 + 20 + 21 + 22 = 100.']},
 {u:'S1',d:2,q:'Kings are placed on the squares of a 9×9 board so that no two kings are on squares sharing a side or a corner. What is the largest number of kings that can be placed?',c:['16','20','25','27','41'],a:'C',s:['Cut the board into 25 pieces: 16 blocks of size 2×2, 8 strips of size 1×2 or 2×1 along the last row and column, and the single corner square.','Any two squares within one piece touch, so each piece holds at most one king: at most 25.','Placing kings on all squares with both coordinates odd (rows and columns 1, 3, 5, 7, 9) gives 25 non-touching kings, so the maximum is 25.']},
 {u:'S1',d:2,q:'What is the smallest n such that any n distinct integers chosen from {1, 2, …, 100} must include two whose sum is divisible by 10?',c:['11','12','41','42','43'],a:'E',s:['Sort by remainder mod 10. Two numbers sum to a multiple of 10 if both are ≡ 0, both ≡ 5, or their remainders are 1 and 9, 2 and 8, 3 and 7, or 4 and 6.','To avoid this, take at most one number ≡ 0, at most one ≡ 5, and from each complementary pair of classes only one class (10 numbers each).','That allows 1 + 1 + 4 · 10 = 42 numbers, e.g. those ≡ 1, 2, 3, 4 plus 10 and 5. Any 43 force a pair, so n = 43.']},
 {u:'S1',d:2,q:'The numbers 3, 4, 12 are written on a board. A move picks two of the numbers, say a and b, and replaces them with (3a + 4b)/5 and (4a − 3b)/5. Which of the following could be the three numbers on the board, in some order, after several moves?',c:['1, 8, 10','5, 0, 12','2, 6, 11','4, 4, 11','6, 7, 9'],a:'B',s:['Look for an invariant: ((3a + 4b)/5)² + ((4a − 3b)/5)² = (25a² + 25b²)/25 = a² + b², so the sum of squares never changes.','Initially 3² + 4² + 12² = 169. The options give 165, 169, 161, 153, and 166.','Only 5, 0, 12 keeps 169, and it is reached in one move with a = 3, b = 4: (9 + 16)/5 = 5 and (12 − 12)/5 = 0.']},
 {u:'S1',d:2,q:'Using log₁₀ 2 ≈ 0.30103, how many digits does 2²⁰²⁶ have in base ten?',c:['608','609','610','611','612'],a:'C',s:['A positive integer N has ⌊log₁₀ N⌋ + 1 digits.','log₁₀ 2²⁰²⁶ = 2026 · 0.30103 ≈ 609.89, comfortably away from an integer, so the approximation is safe.','Thus 2²⁰²⁶ has 609 + 1 = 610 digits.']},
 {u:'S1',d:3,q:'A beetle sits on each of the 25 squares of a 5×5 board. At a signal, every beetle moves simultaneously to a square diagonally adjacent to its own (several beetles may land on the same square). What is the smallest possible number of empty squares afterward?',c:['0','1','3','4','5'],a:'E',s:['Label each square by the parities of its row and column. A diagonal step flips both parities, so (odd, odd) squares and (even, even) squares exchange beetles, as do (odd, even) and (even, odd).','There are 9 (odd, odd) squares but only 4 (even, even) squares, so at most 4 of the 9 (odd, odd) squares receive a beetle: at least 5 are empty.','5 is achievable: the 4 (even, even) beetles move to 4 different (odd, odd) squares, the 9 (odd, odd) beetles cover all 4 (even, even) squares, and the 6 + 6 mixed squares swap in pairs.']},
 {u:'S1',d:3,q:'A queen stands on a square of an 8×8 board. Two players alternate turns; a move shifts the queen any positive number of squares to the left, downward, or diagonally down-and-left. The player who moves the queen onto the bottom-left corner wins. For how many of the 63 starting squares other than the corner can the second player force a win?',c:['4','6','7','8','14'],a:'B',s:['Use coordinates (x, y) measured from the corner. A position is losing for the player to move if every move leads to a winning position; (0, 0) is the target.','Build losing positions greedily: after (0, 0), the next ones avoid sharing a row, column, or diagonal with earlier ones: (1, 2) and (2, 1), then (3, 5) and (5, 3), then (4, 7) and (7, 4).','(The next pair, (6, 10), is off the board.) The second player wins from these 6 squares.']},
 {u:'S1',d:3,q:'Let P = (1 · 3 · 5 ⋯ 99)/(2 · 4 · 6 ⋯ 100). Which of the following is closest to P?',c:['0.02','0.04','0.08','0.16','0.32'],a:'C',s:['Pair each fraction with its neighbor: since (2k − 1)/(2k) < 2k/(2k + 1), we get P < Q where Q = (2 · 4 ⋯ 100)/(3 · 5 ⋯ 101), and PQ = 1/101. So P² < 1/101 and P < 0.0995.','Similarly (2k − 1)/(2k) > (2k − 2)/(2k − 1) for k ≥ 2 gives P² > 1/(4 · 50) = 1/200, so P > 0.0707.','Thus 0.0707 < P < 0.0995, and the closest choice is 0.08 (in fact P ≈ 0.0796).']},
 {u:'S1',d:3,q:'On an island there are 9 red, 14 green, and 20 blue chameleons. Whenever two chameleons of different colors meet, both change to the third color. No other color changes happen. Which describes all the colors that all 43 chameleons could eventually share?',c:['red only','green only','blue only','green or blue only','no color is possible'],a:'A',s:['Each meeting changes the counts by (−1, −1, +2) in some order, so every difference of two counts changes by 0 or ±3: the differences mod 3 are invariant.','Initially G − B = −6 ≡ 0, R − G = −5 ≡ 1, R − B = −11 ≡ 1 (mod 3). Ending all green would need R − B ≡ 0, and all blue would need R − G ≡ 0, both impossible.','All red is reachable: 14 green–blue meetings give (37, 0, 6); a red–blue meeting gives (36, 2, 5) and two green–blue meetings give (40, 0, 3); repeating gives (39, 2, 2) and then (43, 0, 0). So the answer is red only.']},
 {u:'S1',d:3,q:'What is the smallest n such that every sequence of n distinct real numbers contains either an increasing subsequence of length 4 or a decreasing subsequence of length 5?',c:['9','10','12','13','20'],a:'D',s:['Label each term by the length of the longest increasing subsequence ending there. If no increasing run of length 4 exists, the labels lie in {1, 2, 3}.','Terms with the same label must form a decreasing subsequence (a larger later term would get a bigger label). With n terms, some label is used at least ⌈n/3⌉ times, so n = 13 forces a decreasing subsequence of length 5.','12 is not enough: 4, 3, 2, 1, 8, 7, 6, 5, 12, 11, 10, 9 has neither. So n = 13.']},
 {u:'S1',d:3,q:'A 4×4 grid of lamps starts with all lamps off. Pressing a lamp toggles it and every other lamp in its row and in its column (7 lamps in all). What is the smallest number of presses needed to turn all 16 lamps on?',c:['4','7','8','12','16'],a:'E',s:['Order and repeats do not matter (two presses of the same lamp cancel), so a solution is a set S of pressed lamps; lamp (i, j) ends on iff rᵢ + cⱼ − [ (i, j) ∈ S ] is odd, where rᵢ, cⱼ count presses in row i and column j.','Pressing every lamp works: each lamp is toggled 4 + 4 − 1 = 7 times, an odd number.','The press-to-effect map is invertible for an even-size grid: pressing every lamp in row i and column j toggles only lamp (i, j) (it is toggled 7 times, every other lamp in that row or column 4 times, and the rest 2 times). So the solution set is unique, and the minimum is 16.']}
);

AB.push(
 {u:'C1',d:1,q:'How many positive integers less than 500 have only odd digits?',c:['55','75','80','105','155'],a:'C',s:['Count by number of digits, with each digit chosen from {1, 3, 5, 7, 9}.','There are 5 one-digit and 5·5 = 25 two-digit such numbers.','A three-digit number below 500 must start with 1 or 3, giving 2·5·5 = 50 numbers.','The total is 5 + 25 + 50 = 80.']},
 {u:'C1',d:1,q:'How many even three-digit positive integers have at least one digit equal to 7?',c:['81','90','98','100','108'],a:'B',s:['Use the complement: count even three-digit numbers, then remove those with no 7.','There are 9·10·5 = 450 even three-digit numbers.','With no 7: the hundreds digit has 8 choices, the tens digit 9, and the even units digit 5 (7 is odd anyway), giving 360.','So 450 − 360 = 90 contain a 7.']},
 {u:'C1',d:1,q:'A 5×5 square is divided into 25 unit squares by grid lines. How many rectangles whose sides lie along the grid lines contain the center unit square?',c:['36','64','72','81','100'],a:'D',s:['A rectangle is fixed by its left, right, bottom, and top grid lines.','To contain the center square (between lines 2 and 3 in each direction), the left line must be 0, 1, or 2 and the right line 3, 4, or 5: 3·3 = 9 choices.','The same holds vertically, so there are 9·9 = 81 rectangles.']},
 {u:'C1',d:1,q:'How many strings of 5 letters, each letter A, B, or C, use all three letters at least once?',c:['120','150','180','210','243'],a:'B',s:['There are 3⁵ = 243 strings in all.','By inclusion–exclusion, strings missing at least one letter number 3·2⁵ − 3·1⁵ = 96 − 3 = 93.','So 243 − 93 = 150 strings use all three letters.']},
 {u:'C1',d:2,q:'How many nonempty subsets S of {1, 2, 3, …, 10} have the property that the smallest element of S plus the largest element of S equals 11?',c:['170','256','341','382','512'],a:'C',s:['If the smallest element is m, the largest is 11 − m, which requires m ≤ 5 (m = 11 − m is impossible).','The elements strictly between m and 11 − m can be included freely: there are 10 − 2m of them, giving 2^(10 − 2m) subsets.','Summing over m = 1, …, 5 gives 2⁸ + 2⁶ + 2⁴ + 2² + 2⁰ = 256 + 64 + 16 + 4 + 1 = 341.']},
 {u:'C1',d:2,q:'In how many orderings of the numbers 1, 2, 3, 4, 5, 6, 7 does the number 2 appear later than both 1 and 3?',c:['720','840','1260','1680','2520'],a:'D',s:['Only the relative order of 1, 2, 3 matters, and all 3! = 6 relative orders are equally common by symmetry.','In exactly 2 of the 6 orders, 2 comes last among the three.','So the count is 7!·(2/6) = 5040/3 = 1680.']},
 {u:'C1',d:2,q:'How many four-digit positive integers use exactly two different digits (for example, 3833 or 1100)?',c:['504','546','567','576','630'],a:'C',s:['Choose the two digits and fill the four positions so both appear: each pair can fill the positions in 2⁴ − 2 = 14 ways.','If both digits are nonzero, there are C(9,2)·14 = 36·14 = 504 numbers.','If one digit is 0, the other is one of 9 digits and the leading digit must be that nonzero digit; the remaining 3 positions are any mix except all nonzero: 2³ − 1 = 7, giving 63.','The total is 504 + 63 = 567.']},
 {u:'C1',d:3,q:'A coin is flipped 8 times, producing a sequence of H’s and T’s. In how many of the 256 possible sequences does the pair HT (a head immediately followed by a tail) occur exactly twice?',c:['126','140','168','210','252'],a:'A',s:['Add an imaginary T at the start and an imaginary H at the end; the sequence now has 10 symbols starting with T and ending with H.','Each HT inside corresponds to a “switch” H→T, and between them there must be switches T→H; with exactly 2 HT’s there are exactly 5 switches in total (T→H, H→T, T→H, H→T, T→H).','The 5 switches occur at 5 of the 9 gaps between the 10 symbols, and any choice of gaps works.','So the count is C(9,5) = 126.']},
 {u:'C1',d:3,q:'Each face of a cube is painted red, white, or blue so that each color is used on exactly two faces. Two colorings are the same if one can be rotated to give the other. How many different colorings are there?',c:['4','5','6','8','15'],a:'C',s:['Classify by how many colors sit on a pair of opposite faces.','All three colors on opposite pairs: 1 coloring.','Exactly one color on an opposite pair (3 choices of that color): the other four faces form a ring, and the two remaining colors must alternate around it, which is 1 coloring each, giving 3.','No color on an opposite pair (exactly two cannot happen, since the third would then be forced opposite too): each color’s two faces are adjacent, and there are 2 mirror-image arrangements, giving 2.','In total 1 + 3 + 2 = 6.']},
 {u:'C1',d:3,q:'How many unordered pairs {A, B} of disjoint nonempty subsets of {1, 2, 3, 4, 5, 6} are there?',c:['301','330','364','602','665'],a:'A',s:['Assign each element to A, to B, or to neither: 3⁶ = 729 ordered pairs (A, B) of disjoint subsets.','Remove those with A empty (2⁶ = 64) or B empty (64), adding back the one with both empty: 729 − 128 + 1 = 602 ordered pairs.','A and B are different (both nonempty and disjoint), so each unordered pair was counted twice: 602/2 = 301.']},
 {u:'C1',d:3,q:'A permutation a₁, a₂, …, a₆ of 1, 2, 3, 4, 5, 6 has a <b>descent</b> at position i if aᵢ > aᵢ₊₁. How many permutations have exactly one descent?',c:['31','57','63','64','120'],a:'B',s:['A permutation with at most one descent splits into two increasing blocks, so it is determined by the set of numbers placed in the first block.','There are 2⁶ subsets; each gives the permutation “first block increasing, then the rest increasing.”','This permutation has no descent exactly when the subset is {1, …, k} for some k = 0, …, 6 (7 subsets, all giving 123456).','So 2⁶ − 7 = 57 permutations have exactly one descent.']},
 {u:'C1',d:2,q:'How many integers n with 1 ≤ n ≤ 2026 can be written as n = a² − b² for some integers a and b?',c:['1013','1266','1500','1518','1519'],a:'E',s:['Since a² − b² = (a − b)(a + b) and the factors have the same parity, the value is odd or a multiple of 4; it is never ≡ 2 (mod 4).','Conversely 2k + 1 = (k + 1)² − k² and 4k = (k + 1)² − (k − 1)², so every other n works.','The numbers ≡ 2 (mod 4) up to 2026 are 2, 6, …, 2026, which is 507 numbers.','So 2026 − 507 = 1519 integers can be written this way.']},
 {u:'P1',d:1,q:'Two fair six-sided dice are rolled. What is the probability that the product of the two numbers is greater than their sum?',c:['1/2','7/12','5/8','2/3','3/4'],a:'D',s:['ab > a + b is equivalent to (a − 1)(b − 1) > 1.','This fails when a = 1 or b = 1 (11 outcomes) or when a = b = 2 (1 outcome), so 12 outcomes fail.','The probability is (36 − 12)/36 = 2/3.']},
 {u:'P1',d:1,q:'Two fair six-sided dice are rolled. What is the probability that the two numbers differ by exactly 2?',c:['1/6','2/9','1/4','5/18','1/3'],a:'B',s:['The unordered pairs differing by 2 are {1,3}, {2,4}, {3,5}, {4,6}.','Each can appear in 2 orders, giving 8 outcomes out of 36.','The probability is 8/36 = 2/9.']},
 {u:'P1',d:1,q:'A fair six-sided die is rolled repeatedly. What is the probability that a 6 is rolled before any odd number is rolled?',c:['1/6','1/5','1/4','1/3','1/2'],a:'C',s:['Rolls of 2 or 4 change nothing, so ignore them.','The first roll that matters is equally likely to be any of 1, 3, 5, 6.','So the probability that it is a 6 is 1/4.']},
 {u:'P1',d:2,q:'Three different numbers are chosen at random from {1, 2, 3, …, 20}. What is the probability that, when arranged in increasing order, they form an arithmetic sequence?',c:['1/57','1/38','1/19','3/38','1/12'],a:'D',s:['An arithmetic triple a, a + d, a + 2d needs a + 2d ≤ 20, so for common difference d there are 20 − 2d choices of a.','Summing over d = 1, …, 9 gives 18 + 16 + ⋯ + 2 = 90 triples.','There are C(20,3) = 1140 equally likely triples, so the probability is 90/1140 = 3/38.']},
 {u:'P1',d:2,q:'A fair coin is flipped 10 times. A <b>run</b> is a maximal block of consecutive identical outcomes; for example, HHTHHH has 3 runs. What is the expected number of runs?',c:['9/2','5','11/2','6','13/2'],a:'C',s:['The number of runs equals 1 plus the number of places where a flip differs from the previous one.','Each of the 9 consecutive pairs differs with probability 1/2.','By linearity of expectation, the expected number of runs is 1 + 9·(1/2) = 11/2.']},
 {u:'P1',d:2,q:'Two different integers a and b are chosen at random from {1, 2, 3, …, 10}. What is the expected value of |a − b|?',c:['5/2','3','10/3','7/2','11/3'],a:'E',s:['For each difference k, there are 10 − k unordered pairs with |a − b| = k.','The sum of all differences is Σ k(10 − k) for k = 1 to 9, which equals 10·45 − 285 = 165.','There are C(10,2) = 45 pairs, so the expected value is 165/45 = 11/3.']},
 {u:'P1',d:2,q:'A function f from {1, 2, 3, 4} to {1, 2, 3, 4} is chosen at random, with all 4⁴ = 256 functions equally likely. What is the probability that f(f(x)) = x for every x in {1, 2, 3, 4}?',c:['1/32','5/128','3/64','1/16','5/64'],a:'B',s:['If f(f(x)) = x for all x, then f is one-to-one, so f is a permutation made only of fixed points and swaps.','Count them: the identity (1), one swap (C(4,2) = 6), or two swaps (3), for 10 functions.','The probability is 10/256 = 5/128.']},
 {u:'P1',d:2,q:'A fair coin is flipped 6 times. What is the probability that the number of heads among the first 3 flips equals the number of heads among the last 3 flips?',c:['3/16','1/4','9/32','5/16','3/8'],a:'D',s:['Turn over the last three flips in your mind: “heads in the first three = heads in the last three” becomes “heads in the first three = tails-turned-heads in the last three.”','Precisely, the condition H₁ = H₂ is equivalent to H₁ + (3 − H₂) = 3, i.e. exactly 3 heads in the sequence after swapping H and T in the last three flips, which is again a uniformly random sequence.','So the probability is C(6,3)/2⁶ = 20/64 = 5/16.']},
 {u:'P1',d:3,q:'A stick of length 1 is broken at two points chosen independently and uniformly at random along its length. What is the probability that all three pieces are longer than 1/5?',c:['1/25','2/25','3/25','1/8','4/25'],a:'E',s:['The ordered piece lengths (x, y, z) with x + y + z = 1 are uniformly distributed on a triangle (a 2-simplex).','Requiring each piece to exceed 1/5 means x′ = x − 1/5, etc., satisfy x′ + y′ + z′ = 2/5 with all positive: a similar triangle scaled by 2/5.','Areas scale by the square, so the probability is (2/5)² = 4/25.']},
 {u:'P1',d:3,q:'An urn contains 1 red ball and 1 blue ball. Five times in a row, a ball is drawn at random and then returned to the urn together with one additional ball of the same color. After the five draws the urn has 7 balls. What is the probability that exactly 3 of them are red?',c:['1/6','10/49','1/4','2/7','5/16'],a:'A',s:['Any specific sequence with k red draws and 5 − k blue draws has probability k!(5 − k)!/6!, regardless of the order of the draws.','There are C(5,k) such sequences, so P(k red draws) = C(5,k)·k!(5 − k)!/6! = 5!/6! = 1/6 for every k.','Exactly 3 red balls means k = 2 red draws, so the probability is 1/6.']},
 {u:'P1',d:3,q:'In an election, candidate A receives 7 votes and candidate B receives 3 votes. The 10 ballots are counted one at a time in a random order. What is the probability that A is strictly ahead of B throughout the entire count (after every ballot)?',c:['1/10','1/6','1/5','3/10','2/5'],a:'E',s:['The first ballot must be for A; count the bad orders, where A and B are tied at some point.','Among orders that start with a B ballot, all are bad; reflecting the part of a bad A-first order before its first tie gives a one-to-one correspondence with the B-first orders.','So bad orders are twice the B-first orders: P(bad) = 2·(3/10) = 3/5.','The probability A is always ahead is 1 − 3/5 = 2/5 (the ballot theorem (a − b)/(a + b)).']},
 {u:'P1',d:3,q:'Real numbers x and y are chosen independently and uniformly from the interval [0, 1]. What is the probability that x, y, and 1 are the side lengths of an obtuse triangle?',c:['(π − 2)/4','1/3','π/8','1/2','π/4'],a:'A',s:['Since x, y ≤ 1, side 1 is the longest, so a triangle requires x + y > 1.','The angle opposite side 1 is obtuse exactly when x² + y² < 1.','The region is the quarter disk of area π/4 minus the triangle below x + y = 1 of area 1/2.','So the probability is π/4 − 1/2 = (π − 2)/4.']},
 {u:'C2',d:3,q:'In how many ways can a 3×6 rectangle be tiled with nine 1×2 dominoes?',c:['11','22','31','36','41'],a:'E',s:['Let aₙ be the number of tilings of a 3×2n rectangle; a₀ = 1 and a₁ = 3.','Look at the first place the tiling can be cut vertically: the first 2 columns can form a block in 3 ways, and for each larger even width there are exactly 2 uncuttable blocks.','So aₙ = 3aₙ₋₁ + 2(aₙ₋₂ + ⋯ + a₀), which simplifies to aₙ = 4aₙ₋₁ − aₙ₋₂.','This gives a₂ = 11 and a₃ = 4·11 − 3 = 41.']},
 {u:'C2',d:2,q:'How many ordered triples (x, y, z) of nonnegative integers satisfy x + 2y + 3z = 20?',c:['36','40','42','44','50'],a:'D',s:['Fix z; then x is determined by y, and y can be any integer from 0 to ⌊(20 − 3z)/2⌋.','For z = 0, 1, …, 6 the remainders 20 − 3z are 20, 17, 14, 11, 8, 5, 2, giving 11, 9, 8, 6, 5, 3, 2 choices of y.','The total is 11 + 9 + 8 + 6 + 5 + 3 + 2 = 44.']},
 {u:'C2',d:3,q:'How many subsets of {1, 2, 3, …, 10}, including the empty set, have a sum of elements divisible by 5?',c:['200','208','210','216','220'],a:'B',s:['Let ω be a primitive 5th root of unity and P(t) = (1 + t)(1 + t²)⋯(1 + t¹⁰); the answer is (1/5)Σ P(ωʲ) for j = 0, …, 4.','P(1) = 2¹⁰ = 1024.','For j ≠ 0, the exponents 1, …, 10 cover each residue mod 5 twice, so P(ωʲ) = [(1 + 1)(1 + ω)(1 + ω²)(1 + ω³)(1 + ω⁴)]² = (2·1)² = 4, using Π(1 + ωᵏ) over k = 1..4 equal to 1.','The answer is (1024 + 4·4)/5 = 1040/5 = 208.']},
 {u:'C2',d:2,q:'How many permutations a₁, a₂, …, a₈ of 1, 2, …, 8 satisfy |aᵢ − i| ≤ 1 for every i?',c:['34','55','64','89','128'],a:'A',s:['Look at where 1 goes: either a₁ = 1, or a₁ = 2 and then 1 must be in position 2, so 1 and 2 swap.','So with pₙ the count for length n, pₙ = pₙ₋₁ + pₙ₋₂, with p₁ = 1 and p₂ = 2.','This is the Fibonacci sequence 1, 2, 3, 5, 8, 13, 21, 34, so p₈ = 34.']},
 {u:'C2',d:3,q:'How many strings of 10 binary digits (0s and 1s) have the property that every maximal block of identical consecutive digits has length at least 2? (For example, 0011100011 qualifies but 0010011111 does not.)',c:['34','55','68','89','110'],a:'C',s:['Fix the first digit; the string is then determined by its block lengths, a composition of 10 into parts each at least 2.','If cₙ counts such compositions, the first part is 2 or longer; removing one cell from a first part longer than 2 gives cₙ = cₙ₋₁ + cₙ₋₂ with c₂ = c₃ = 1.','So c₄, …, c₁₀ = 2, 3, 5, 8, 13, 21, 34.','With 2 choices for the first digit, there are 2·34 = 68 strings.']},
 {u:'C2',d:2,q:'A king walks from (0, 0) to (3, 3), each step being (1, 0), (0, 1), or (1, 1). How many different paths are possible?',c:['20','49','56','63','81'],a:'D',s:['If the path uses k diagonal steps, it uses 3 − k right and 3 − k up steps, for 6 − k steps total.','The number of arrangements is (6 − k)!/(k!(3 − k)!(3 − k)!).','For k = 0, 1, 2, 3 this gives 20, 30, 12, 1.','The total is 20 + 30 + 12 + 1 = 63.']},
 {u:'C2',d:2,q:'How many subsets of {1, 2, 3, …, 10} contain more odd numbers than even numbers?',c:['252','256','362','376','386'],a:'E',s:['Swapping each odd number k with the even number k + 1 (pairs {1,2}, {3,4}, …) maps subsets with more odds to subsets with more evens, one-to-one.','So these two classes are equal in size, and the rest have equally many odds and evens.','Subsets with j odds and j evens number Σ C(5,j)² = C(10,5) = 252.','So the answer is (1024 − 252)/2 = 386.']},
 {u:'C2',d:2,q:'In how many ways can 15 be written as a sum of distinct positive integers, where order does not matter? (The single number 15 counts as one way.)',c:['22','27','28','32','36'],a:'B',s:['Count by the number of parts: one part gives 1 way (15).','Two parts a > b with a + b = 15 give 7 ways (b = 1, …, 7).','Three distinct parts: 12 ways; four distinct parts: 6 ways (e.g. 1+2+3+9, …, 2+3+4+6); five parts must be 1+2+3+4+5, 1 way.','The total is 1 + 7 + 12 + 6 + 1 = 27.']},
 {u:'C2',d:3,q:'How many functions f from {1, 2, 3, 4, 5} to itself satisfy f(f(x)) = f(x) for every x?',c:['196','205','243','251','256'],a:'A',s:['The condition says f fixes every value in its image; so f is determined by its image set S and where it sends the elements outside S.','If |S| = k, choose S in C(5,k) ways, then send each of the other 5 − k elements anywhere in S: k^(5 − k) ways.','The total is Σ C(5,k)·k^(5 − k) = 5·1 + 10·8 + 10·9 + 5·4 + 1·1 = 5 + 80 + 90 + 20 + 1 = 196.']},
 {u:'C2',d:3,q:'Eight different balls are placed into three different boxes, with any number of balls (possibly zero) in each box. In how many ways can this be done so that the first box contains an even number of balls?',c:['2187','3240','3280','3281','6561'],a:'D',s:['Let E and O be the numbers of placements with an even or odd number of balls in box 1; E + O = 3⁸ = 6561.','Weight each placement by (−1)^(number in box 1): each ball contributes −1 + 1 + 1 = 1, so E − O = 1⁸ = 1.','Hence E = (6561 + 1)/2 = 3281.']},
 {u:'C2',d:3,q:'Let C(n,k) denote a binomial coefficient. What is the value of C(12,0) + C(12,3) + C(12,6) + C(12,9) + C(12,12)?',c:['1024','1360','1364','1365','1366'],a:'E',s:['Use the roots-of-unity filter with ω a primitive cube root of unity: the sum equals [(1 + 1)¹² + (1 + ω)¹² + (1 + ω²)¹²]/3.','Since 1 + ω = −ω² is a sixth root of unity, (1 + ω)¹² = 1, and likewise (1 + ω²)¹² = 1.','So the sum is (4096 + 1 + 1)/3 = 1366.']}
);

AB.push(
 {u:'G1',d:1,q:'Square ABCD is drawn, and equilateral triangle ABE is constructed with E inside the square. What is the degree measure of ∠AED?',c:['75','80','90','105','150'],a:'A',s:['Since △ABE is equilateral, AE = AB = AD and ∠EAB = 60°, so ∠DAE = 90° − 60° = 30°.','Triangle ADE is isosceles with AD = AE, so its base angles at D and E are equal.','Thus ∠AED = (180° − 30°)/2 = 75°.']},
 {u:'G1',d:1,q:'An equilateral triangle and a regular hexagon have the same perimeter. The area of the triangle is 12. What is the area of the hexagon?',c:['12','16','18','24','36'],a:'C',s:['If the hexagon has side s, the triangle has side 2s, since 3(2s) = 6s.','The triangle with side 2s splits into 4 equilateral triangles of side s, each of area 12/4 = 3.','The hexagon is made of 6 equilateral triangles of side s, so its area is 6 · 3 = 18.']},
 {u:'G1',d:2,q:'Rectangle ABCD has AB = 12 and BC = 9. The rectangle is folded along a crease so that vertex A lands exactly on vertex C. What is the length of the crease?',c:['21/2','45/4','12','25/2','15'],a:'B',s:['Every point of the crease is equidistant from A and C, so the crease lies on the perpendicular bisector of diagonal AC, which has length 15 and passes through the center O.','Let the crease meet AB at P; then right triangles AOP and ABC are similar (they share ∠A), so OP/AO = BC/AB = 9/12.','With AO = 15/2, OP = (15/2)(3/4) = 45/8.','By symmetry about O the crease has length 2 · 45/8 = 45/4.']},
 {u:'G1',d:2,q:'In △ABC, the median from A and the median from B are perpendicular. If BC = 7 and AC = 6, what is AB?',c:['3','√13','4','√17','2√5'],a:'D',s:['Let G be the centroid, and write GA = 2x, GB = 2y, so the medians have lengths 3x and 3y with right angle at G.','The midpoint M of BC lies on the median from A with GM = x, and △BGM is right-angled at G, so (7/2)² = 4y² + x²; likewise (6/2)² = 4x² + y².','Adding: 5(x² + y²) = 49/4 + 9 = 85/4, so AB² = GA² + GB² = 4(x² + y²) = 17.','In general a² + b² = 5c² when the medians to a and b are perpendicular; here AB = √17.']},
 {u:'G1',d:2,q:'An octagon has all eight interior angles equal to 135°, and its sides alternate in length 4, √2, 4, √2, 4, √2, 4, √2. What is the area of the octagon?',c:['28','30','31','32','34'],a:'E',s:['Extend the four sides of length 4; they form a square, and each side of length √2 cuts off an isosceles right triangle at a corner.','A hypotenuse of √2 means legs of length 1, so the square has side 1 + 4 + 1 = 6 and area 36.','Removing four triangles of area 1/2 each leaves 36 − 2 = 34.']},
 {u:'G1',d:3,q:'All 20 diagonals of a regular octagon are drawn. At how many distinct points strictly inside the octagon do two or more diagonals intersect?',c:['40','49','56','64','70'],a:'B',s:['Every 4 vertices determine exactly one crossing of two diagonals, giving C(8,4) = 70 crossings counted with multiplicity.','The 4 long diagonals all pass through the center: that point absorbs C(4,2) = 6 crossings (one for each pair of long diagonals) but is only 1 point, so subtract 5.','In a regular octagon there are also 8 points where three diagonals meet (each absorbs 3 crossings), so subtract 2 for each: 16 more.','The number of distinct points is 70 − 5 − 16 = 49.']},
 {u:'G1',d:3,q:'Triangle ABC has area 4. Side AB is extended past B to D so that BD = 2·AB, side BC is extended past C to E so that CE = 2·BC, and side CA is extended past A to F so that AF = 2·CA. What is the area of △DEF?',c:['28','52','64','76','100'],a:'D',s:['△DEF consists of △ABC plus three outer triangles DBE, ECF, and FAD.','△DBE has BD = 2·AB and BE = BC + CE = 3·BC, with angle DBE supplementary to ∠ABC, so its area is 2 · 3 = 6 times [ABC].','By symmetry each outer triangle has area 6 · 4 = 24.','So [DEF] = 4 + 3 · 24 = 76 (in general (1 + 3k(k+1))·[ABC] for ratio k).']},
 {u:'G1',d:3,q:'Equilateral triangle ABC has side length 12. Point P moves along side BC, and E and F are the feet of the perpendiculars from P to lines AB and AC, respectively. What is the smallest possible length of EF?',c:['6','4√3','3√6','8','9'],a:'E',s:['Since ∠AEP = ∠AFP = 90°, points A, E, P, F lie on a circle with diameter AP.','In that circle chord EF subtends the inscribed angle ∠EAF = 60°, so EF = AP · sin 60° by the extended law of sines.','EF is smallest when AP is smallest, i.e. when AP is the altitude 6√3.','Then EF = 6√3 · (√3/2) = 9.']},
 {u:'G1',d:3,q:'Triangle ABC has a right angle at C and CA = CB. Point P lies inside the triangle with PA = 1, PC = 2, and PB = 3. What is the area of △ABC?',c:['3','(5 + √2)/2','7/2','(5 + 2√2)/2','9/2'],a:'D',s:['Rotate △CPA by 90° about C so that A goes to B; let P go to P′. Then CP′ = CP = 2, ∠PCP′ = 90°, and P′B = PA = 1.','So PP′ = 2√2, and in △PP′B we have 1² + (2√2)² = 9 = PB², so ∠PP′B = 90°.','Hence ∠CP′B = 45° + 90° = 135°, and this equals ∠CPA.','By the law of cosines in △CPA, CA² = 1 + 4 − 2·1·2·cos 135° = 5 + 2√2, so the area is CA²/2 = (5 + 2√2)/2.']},

 {u:'G2',d:1,q:'Points A, B, C, D lie on a circle in that order. If ∠ABD = 35° and ∠BDC = 45°, and chords AC and BD meet at E, what is the degree measure of ∠AEB?',c:['70','80','90','95','100'],a:'E',s:['Inscribed angle ∠ABD = 35° intercepts arc AD, so arc AD = 70°; likewise ∠BDC = 45° gives arc BC = 90°.','The angle between two chords equals half the sum of the intercepted arcs: ∠AED = (70° + 90°)/2 = 80°.','Angles AEB and AED are supplementary, so ∠AEB = 100°.']},
 {u:'G2',d:1,q:'A belt is stretched tightly around two pulleys, each of radius 6, whose centers are 20 apart. The belt does not cross itself. What is the length of the belt?',c:['20 + 12π','40 + 6π','40 + 12π','20 + 24π','40 + 24π'],a:'C',s:['For equal pulleys, the straight parts of the belt are parallel to the line of centers and each has length 20.','The curved parts are two semicircles of radius 6, together one full circumference 12π.','The total length is 2 · 20 + 12π = 40 + 12π.']},
 {u:'G2',d:2,q:'Square ABCD is inscribed in a circle. Point P lies on minor arc AB with PA = 2 and PB = 4. What is the area of the square?',c:['20','12 + 8√2','20 + 4√2','20 + 8√2','24 + 8√2'],a:'D',s:['Minor arc AB measures 90°, so the arc AB not containing P measures 270°.','Inscribed angle ∠APB intercepts that 270° arc, so ∠APB = 135°.','By the law of cosines, AB² = 2² + 4² − 2·2·4·cos 135° = 20 + 8√2.','The area of the square is AB² = 20 + 8√2.']},
 {u:'G2',d:2,q:'Two circles meet at points A and B. Point P lies on line AB outside both circles. The tangent segment from P to the first circle has length 6. A line through P meets the second circle at C and D, with PC = 4 and C between P and D. What is CD?',c:['3','4','5','6','8'],a:'C',s:['By power of a point for the first circle, PA · PB = 6² = 36.','Line AB is the radical axis: P has the same power with respect to the second circle, so PC · PD = PA · PB = 36.','Thus PD = 36/4 = 9 and CD = 9 − 4 = 5.']},
 {u:'G2',d:2,q:'Square ABCD has side length 2, with AB as its bottom side. Inside the square, quarter-circle arcs of radius 2 are drawn centered at A and at B. A small circle is tangent to side CD and externally tangent to both arcs. What is its radius?',c:['1/10','1/8','1/6','1/5','1/4'],a:'B',s:['By symmetry the small circle’s center is (1, 2 − r), with A = (0, 0) and B = (2, 0).','External tangency to the arc centered at A means the distance from A to the center is 2 + r.','So 1 + (2 − r)² = (2 + r)², which simplifies to 1 = 8r.','Hence r = 1/8.']},
 {u:'G2',d:3,q:'Right triangle ABC has its right angle at C, with CA = 8 and CB = 6. A circle passes through C and is tangent to hypotenuse AB at its midpoint M. What is the radius of the circle?',c:['5/2','125/48','8/3','25/9','3'],a:'B',s:['Place C = (0, 0), A = (8, 0), B = (0, 6); then M = (4, 3) and MC = 5.','The center lies on the line through M perpendicular to AB, on the same side as C.','The unit normal to AB pointing toward C is (−3, −4)/5, and vector MC = (−4, −3), so the angle θ between chord MC and the normal has cos θ = ((12 + 12)/5)/5 = 24/25.','The chord MC of a circle tangent at M satisfies MC = 2r cos θ, so r = 5/(2 · 24/25) = 125/48.']},
 {u:'G2',d:3,q:'Circles of radii 1, 2, and 3 are mutually externally tangent. A fourth circle lies in the gap between them and is externally tangent to all three. What is the radius of the fourth circle?',c:['1/8','1/6','1/4','6/23','2/7'],a:'D',s:['Use Descartes’ circle theorem with curvatures k = 1/r: k₄ = k₁ + k₂ + k₃ + 2√(k₁k₂ + k₂k₃ + k₃k₁).','Here k₁ + k₂ + k₃ = 1 + 1/2 + 1/3 = 11/6, and k₁k₂ + k₂k₃ + k₃k₁ = 1/2 + 1/6 + 1/3 = 1.','So k₄ = 11/6 + 2 = 23/6 (the minus sign gives −1/6, the enclosing circle of radius 6).','The small circle has radius 6/23.']},
 {u:'G2',d:3,q:'Right triangle ABC has legs CA = 12 and CB = 5. A circle is tangent to both legs and internally tangent to the circumcircle of △ABC. What is its radius?',c:['2','3','13/4','7/2','4'],a:'E',s:['Put C at the origin with the legs on the axes; a circle tangent to both legs has center (r, r).','The circumcircle has center at the hypotenuse’s midpoint (6, 5/2) and radius 13/2.','Internal tangency means (6 − r)² + (5/2 − r)² = (13/2 − r)².','This simplifies to r² − 4r = 0, so r = 4 (twice the inradius 2, as in general for this circle at a right angle).']},
 {u:'G2',d:3,q:'A hexagon is inscribed in a circle. Three consecutive sides have length 3 and the other three consecutive sides have length 5. What is the radius of the circle?',c:['7√3/3','13/3','2√5','8√3/3','5'],a:'A',s:['Equal chords subtend equal central angles; if sides 3 subtend α and sides 5 subtend β, then 3α + 3β = 360°, so α + β = 120°.','Rearranging the sides to alternate 3, 5, 3, 5, … keeps the same circle, and then joining every other vertex gives an equilateral triangle.','Each side of that triangle closes a triangle with sides 3 and 5 meeting at an inscribed angle of 120°, so it has length √(9 + 25 + 15) = 7.','An equilateral triangle of side 7 has circumradius 7/√3 = 7√3/3.']},

 {u:'G3',d:1,q:'The point (5, 2) is reflected over the line y = x + 1. What is the distance between (5, 2) and its image?',c:['2√2','4','3√2','4√2','6'],a:'D',s:['The distance from (5, 2) to the line x − y + 1 = 0 is |5 − 2 + 1|/√2 = 4/√2 = 2√2.','A reflection moves a point twice its distance to the mirror line.','So the distance is 2 · 2√2 = 4√2 (the image is (1, 6)).']},
 {u:'G3',d:1,q:'A rectangular box measures 2 × 3 × 6. By how much does the length of a space diagonal exceed the length of the longest diagonal of a face?',c:['7 − 3√5','7 − 2√10','1','3','7 − √13'],a:'A',s:['The space diagonal is √(4 + 9 + 36) = 7.','The longest face diagonal lies on the 3 × 6 face: √(9 + 36) = √45 = 3√5.','The difference is 7 − 3√5.']},
 {u:'G3',d:2,q:'Quadrilateral Q has vertices (0, 0), (6, 0), (6, 4), and (0, 8). The line y = mx divides Q into two regions of equal area. What is m?',c:['2/3','1','10/9','6/5','4/3'],a:'C',s:['Q is a trapezoid with parallel sides 4 and 8 and width 6, so its area is 36 and each half must be 18.','If the line hit the right side x = 6, the region below would be a triangle of area at most (1/2)(6)(4) = 12 < 18, so it hits the top side y = 8 − 2x/3 at some (p, q).','By the shoelace formula, the region (0,0), (6,0), (6,4), (p,q) has area 12 + 3q − 2p = 36 − 4p.','Setting 36 − 4p = 18 gives p = 9/2, q = 5, so m = 5/(9/2) = 10/9.']},
 {u:'G3',d:2,q:'A sector of a circle with radius 9 and central angle 240° is rolled up so that its two straight edges meet, forming the lateral surface of a cone. What is the volume of the cone?',c:['36π','18√5π','24√5π','36√5π','108π'],a:'D',s:['The arc of the sector becomes the base circumference: (240/360) · 2π · 9 = 12π, so the base radius is 6.','The sector’s radius becomes the slant height 9, so the height is √(81 − 36) = 3√5.','The volume is (1/3)π · 36 · 3√5 = 36√5π.']},
 {u:'G3',d:2,q:'An ant walks on the surface of a 2 × 3 × 5 rectangular box from one corner to the diagonally opposite corner. What is the length of the shortest possible path?',c:['√38','5√2','√58','2√17','10'],a:'B',s:['Unfold two adjacent faces into a flat rectangle; the path becomes a straight segment across it.','The possible unfoldings give √((2+3)² + 5²), √((2+5)² + 3²), √((3+5)² + 2²), that is √50, √58, √68.','Adding the two shortest edges gives the shortest path: √50 = 5√2. (The space diagonal √38 is not on the surface.)']},
 {u:'G3',d:3,q:'A square pyramid has all eight edges of length 6. A sphere inside the pyramid is tangent to the base and to all four triangular faces. What is the radius of the sphere?',c:['3 − √3','√2','(3√6 − 3√2)/2','√3','3√2/2'],a:'C',s:['The base diagonal is 6√2, so the apex is above the center at height √(36 − 18) = 3√2, and the volume is (1/3)(36)(3√2) = 36√2.','The surface area is 36 + 4 · (√3/4)(36) = 36 + 36√3.','For a solid with an inscribed sphere, V = (1/3) r S, so r = 3V/S = 108√2/(36(1 + √3)) = 3√2/(1 + √3).','Rationalizing gives r = 3√2(√3 − 1)/2 = (3√6 − 3√2)/2.']},
 {u:'G3',d:3,q:'A tetrahedron has vertices (0, 0, 0), (6, 0, 0), (0, 6, 0), and (0, 0, 12). What is the radius of the sphere tangent to all four faces?',c:['1','6/5','4/3','7/5','3/2'],a:'E',s:['The volume is (1/6) · 6 · 6 · 12 = 72.','The three right-triangle faces have areas 18, 36, and 36; the slanted face has area (1/2)√((6·6)² + (6·12)² + (12·6)²) = (1/2)√11664 = 54.','The total surface area is 18 + 36 + 36 + 54 = 144.','Using V = (1/3) r S, r = 3 · 72/144 = 3/2.']},
 {u:'G3',d:3,q:'Points A = (0, 0) and B = (12, 0) are given. Point P moves so that PA = 2·PB. What is the largest possible area of △PAB?',c:['24','32','36','40','48'],a:'E',s:['Write PA² = 4PB²: x² + y² = 4((x − 12)² + y²), which simplifies to x² − 32x + y² + 192 = 0.','Completing the square gives (x − 16)² + y² = 64, a circle (of Apollonius) with center (16, 0) and radius 8.','The height of △PAB above AB is at most the radius 8, attained at P = (16, ±8).','So the maximum area is (1/2)(12)(8) = 48.']},
 {u:'G3',d:3,q:'Let S be the set of all points in space that lie inside or within distance 1 of some point of a solid 2 × 3 × 4 rectangular box. What is the volume of S?',c:['52 + 31π/3','76 + 9π','76 + 31π/3','76 + 12π','76 + 40π/3'],a:'C',s:['Split S into the box, slabs over faces, quarter-cylinders along edges, and eighth-spheres at corners.','The box has volume 24 and the face slabs have volume equal to the surface area 2(6 + 8 + 12) = 52.','The 12 edges give quarter-cylinders of radius 1 whose lengths total 4(2 + 3 + 4) = 36, contributing (π/4)·36 = 9π.','The 8 corners make one full unit sphere, 4π/3, so the volume is 24 + 52 + 9π + 4π/3 = 76 + 31π/3.']},

 {u:'G4',d:1,q:'A triangle has side lengths 7, 8, and 13. What is the degree measure of its largest angle?',c:['90','105','120','135','150'],a:'C',s:['The largest angle is opposite the longest side, 13.','By the law of cosines, cos θ = (7² + 8² − 13²)/(2·7·8) = (49 + 64 − 169)/112 = −1/2.','So θ = 120°.']},
 {u:'G4',d:1,q:'Two sides of a triangle have lengths 8 and 10, and the area of the triangle is 20. What is the sum of the squares of all possible lengths of the third side?',c:['164','200','256','300','328'],a:'E',s:['Area = (1/2)(8)(10) sin θ = 40 sin θ = 20, so sin θ = 1/2 and θ is 30° or 150°.','By the law of cosines the third side squared is 164 − 160 cos θ, which is 164 − 80√3 or 164 + 80√3.','The radicals cancel in the sum: 328.']},
 {u:'G4',d:2,q:'In △ABC, tan A = 2, tan B = 3, and AB = 10. What is the area of △ABC?',c:['60','75','100','120','150'],a:'A',s:['Both A and B are acute, so the foot D of the altitude from C lies on AB; let h = CD.','Then AD = h/tan A = h/2 and DB = h/tan B = h/3.','So h/2 + h/3 = 10, giving h = 12.','The area is (1/2)(10)(12) = 60.']},
 {u:'G4',d:2,q:'In △ABC, ∠A = 60°, BC = 7, and AB + AC = 10. What is the area of △ABC?',c:['4√3','17√3/4','5√3','6√3','17√3/2'],a:'B',s:['Let b = AC and c = AB. The law of cosines with ∠A = 60° gives 49 = b² + c² − bc = (b + c)² − 3bc.','So 3bc = 100 − 49 = 51 and bc = 17.','The area is (1/2) bc sin 60° = (17/2)(√3/2) = 17√3/4.']},
 {u:'G4',d:2,q:'The three altitudes of a triangle have lengths 12, 15, and 20. What is the area of the triangle?',c:['150','180','200','240','300'],a:'A',s:['Since each side times its altitude equals twice the area, the sides are proportional to 1/12 : 1/15 : 1/20 = 5 : 4 : 3.','So the triangle is right with sides 3k, 4k, 5k; the altitude to each leg is the other leg, so 4k = 20 and 3k = 15, giving k = 5.','The legs are 15 and 20, giving area (1/2)(15)(20) = 150 (and the altitude to the hypotenuse 25 is 300/25 = 12, as required).']},
 {u:'G4',d:3,q:'In △ABC, the altitude, the angle bisector, and the median from C divide ∠ACB into four equal angles. If AB = 8, what is the area of △ABC?',c:['8','8√2','12','16','16√2'],a:'B',s:['The altitude CH and the line CO to the circumcenter are always reflections of each other in the bisector of ∠C; since the median CM makes the same angle with the bisector as CH, the median lies along CO.','O also lies on the perpendicular to AB at M, and CM is not perpendicular to AB (else altitude = median), so O = M: AB is a diameter and ∠ACB = 90°.','Then each of the four angles is 22.5°, so the angles of the triangle are 90°, 67.5°, and 22.5°.','The area is (1/2)·AB²·sin A·cos A = (AB²/4) sin 45° = 16 · (√2/2) = 8√2.']},
 {u:'G4',d:3,q:'In △ABC, ∠BAC = 135°. The altitude from A meets side BC at D with BD = 4 and DC = 6. What is the area of △ABC?',c:['10','12','15','20','30'],a:'A',s:['Let h = AD. Then tan ∠BAD = 4/h and tan ∠DAC = 6/h, and these angles add to 135°.','By the tangent addition formula, (4/h + 6/h)/(1 − 24/h²) = tan 135° = −1.','This gives 10h = 24 − h², so h² + 10h − 24 = 0 and h = 2.','The area is (1/2)(10)(2) = 10.']},
 {u:'G4',d:3,q:'In △ABC, the values tan A, tan B, and tan C are all positive integers. The side opposite the largest angle has length 10. What is the area of △ABC?',c:['100/3','36','40','50','60'],a:'A',s:['In any triangle, tan A + tan B + tan C = tan A · tan B · tan C.','The only positive integers with x + y + z = xyz are 1, 2, 3 (if the smallest is at least 2, the product is too big), so the tangents are 1, 2, 3.','Let tan C = 3 be the largest angle, opposite AB = 10. The altitude h from C splits AB into h/1 + h/2 = 10, so h = 20/3.','The area is (1/2)(10)(20/3) = 100/3.']},
 {u:'G4',d:3,q:'In △ABC, AB = 5, BC = 6, and CA = 7. Let E and F be the feet of the altitudes from B and C, respectively. What is EF?',c:['3','22/7','16/5','13/4','114/35'],a:'E',s:['Since ∠BEC = ∠BFC = 90°, points B, C, E, F are concyclic, so △AEF is similar to △ABC with ratio AE/AB = cos A.','By the law of cosines, cos A = (5² + 7² − 6²)/(2·5·7) = 38/70 = 19/35.','So EF = BC · cos A = 6 · 19/35 = 114/35.']}
);

AB.push(
 {u:'A4',d:1,q:'The function f(x) = log₂(log₃(log₄(log₅ x))) is defined for exactly those real x with x > c. What is c?',c:['5','25','125','256','625'],a:'E',s:['Work from the outside in: log₂(u) needs u > 0, so log₃(log₄(log₅ x)) > 0.','That means log₄(log₅ x) > 1, so log₅ x > 4.','Hence x > 5⁴ = 625 (and this automatically makes every inner logarithm defined), so c = 625.']},
 {u:'A4',d:1,q:'What is the value of (2²⁰²⁶ + 2²⁰²⁴)/(2²⁰²⁵ − 2²⁰²³)?',c:['5/3','2','5/2','3','10/3'],a:'E',s:['Factor the smallest power out of each part: the numerator is 2²⁰²⁴(4 + 1) = 5 · 2²⁰²⁴.','The denominator is 2²⁰²³(4 − 1) = 3 · 2²⁰²³.','The ratio is (5 · 2²⁰²⁴)/(3 · 2²⁰²³) = 10/3.']},
 {u:'A4',d:1,q:'A geometric sequence of positive numbers a₁, a₂, a₃, … satisfies a₃ · a₈ = 32. What is log₂ a₁ + log₂ a₂ + ⋯ + log₂ a₁₀?',c:['10','20','25','32','50'],a:'C',s:['The sum of logs is log₂(a₁a₂⋯a₁₀).','In a geometric sequence, terms whose indices have the same sum have the same product, so a₁a₁₀ = a₂a₉ = ⋯ = a₅a₆ = a₃a₈ = 32.','So the product of the ten terms is 32⁵ = 2²⁵, and the sum of logs is 25.']},
 {u:'A4',d:2,q:'What is the value of (log₂ 6)(log₃ 6) − log₂ 6 − log₃ 6?',c:['−1','0','1','log₂ 3','2'],a:'B',s:['Let p = log₂ 6 and q = log₃ 6; the expression is pq − p − q = (p − 1)(q − 1) − 1.','Now p − 1 = log₂ 6 − log₂ 2 = log₂ 3 and q − 1 = log₃ 6 − log₃ 3 = log₃ 2.','Since log₂ 3 · log₃ 2 = 1, the expression equals 1 − 1 = 0.']},
 {u:'A4',d:2,q:'Nonzero real numbers x, y, and z satisfy 2ˣ = 3ʸ = 6ᶻ. Which of the following is equal to z?',c:['xy/(x + y)','x + y','(x + y)/(xy)','√(xy)','xy'],a:'A',s:['Call the common value k; since x ≠ 0, k ≠ 1, and taking logarithms gives x = log k/log 2, y = log k/log 3, z = log k/log 6.','Then 1/x + 1/y = (log 2 + log 3)/log k = log 6/log k = 1/z.','So z = 1/(1/x + 1/y) = xy/(x + y).']},
 {u:'A4',d:2,q:'A positive real number x satisfies x^(x⁴) = 4. What is x²?',c:['√2','2','2√2','4','16'],a:'B',s:['Raise both sides to the 4th power: (x^(x⁴))⁴ = (x⁴)^(x⁴) = 4⁴.','So t = x⁴ satisfies tᵗ = 4⁴; for 0 < t ≤ 1 we have tᵗ ≤ 1, and tᵗ is increasing for t ≥ 1, so t = 4 is the only solution.','Thus x⁴ = 4 and x² = 2.']},
 {u:'A4',d:3,q:'Which of the following fractions is closest to log₂ 3?',c:['3/2','11/7','19/12','8/5','13/8'],a:'C',s:['Comparing log₂ 3 with p/q is the same as comparing 3^q with 2^p.','3⁵ = 243 < 256 = 2⁸ gives log₂ 3 < 8/5, while 3¹² = 531441 > 524288 = 2¹⁹ gives log₂ 3 > 19/12; so 13/8 (above 8/5) and 3/2, 11/7 (below 19/12) are all farther away.','So log₂ 3 lies between 19/12 ≈ 1.5833 and 8/5 = 1.6, and log₂ 3 − 19/12 = (1/12) log₂(531441/524288) is tiny because the ratio is about 1.014.','Indeed log₂ 3 ≈ 1.585, which is within 0.002 of 19/12 but 0.015 from 8/5, so the answer is 19/12.']},
 {u:'A4',d:2,q:'What is the sum of the two real solutions of 2ˣ · 3^(x²) = 6?',c:['−log₃ 6','−log₃ 2','0','log₃ 2','log₂ 3'],a:'B',s:['Take log base 3 of both sides: x log₃ 2 + x² = log₃ 6.','This is the quadratic x² + (log₃ 2)x − log₃ 6 = 0 (its roots are 1 and −log₃ 6).','By Vieta, the sum of its solutions is −log₃ 2.']},
 {u:'A4',d:2,q:'How many real numbers x satisfy (x² − 5)^(x + 2) = 1?',c:['1','2','3','4','5'],a:'D',s:['A power aᵇ equals 1 when b = 0 (with a ≠ 0), when a = 1, or when a = −1 and b is an even integer.','Exponent 0: x = −2, where the base is −1 ≠ 0, which works. Base 1: x² = 6 gives x = ±√6.','Base −1: x² = 4 gives x = 2 (exponent 4, even, works) or x = −2 (already counted).','The solutions are −2, 2, √6, −√6, so there are 4.']},
 {u:'A4',d:3,q:'The number 2¹⁰⁰ has 31 digits. For how many integers k with 1 ≤ k ≤ 100 does the decimal representation of 2ᵏ begin with the digit 1?',c:['30','31','32','34','50'],a:'A',s:['If N has m + 1 digits, then 2N gains a digit exactly when N ≥ 5 · 10ᵐ, and in that case 2N lies in [10ᵐ⁺¹, 2 · 10ᵐ⁺¹) and begins with 1; otherwise 2N lies in [2 · 10ᵐ, 10ᵐ⁺¹) and begins with 2 through 9.','So 2ᵏ starts with 1 exactly when 2ᵏ has one more digit than 2ᵏ⁻¹, and each digit count from 2 to 31 is reached for the first time at exactly one such k.','Going from 2⁰ = 1 (1 digit) to 2¹⁰⁰ (31 digits), the digit count increases 30 times, so 30 values of k work.']},
 {u:'A4',d:3,q:'Let f(x) = 2ˣ/(2ˣ + √2). What is f(1/2026) + f(2/2026) + f(3/2026) + ⋯ + f(2025/2026)?',c:['1012','2025/2','1013','2025','2026'],a:'B',s:['Compute f(1 − x) = 2^(1−x)/(2^(1−x) + √2); multiplying top and bottom by 2ˣ/√2 gives √2/(√2 + 2ˣ).','Therefore f(x) + f(1 − x) = (2ˣ + √2)/(2ˣ + √2) = 1.','Pair k/2026 with (2026 − k)/2026 for k = 1, …, 1012 to get 1012, and the middle term is f(1/2) = √2/(2√2) = 1/2.','The total is 1012 + 1/2 = 2025/2.']},
 {u:'A4',d:3,q:'Real numbers x and y satisfy 2ˣ + 2ʸ = 2^(x+y). What is the minimum possible value of 4ˣ + 4ʸ?',c:['2','4','4√2','8','16'],a:'D',s:['Let a = 2ˣ > 0 and b = 2ʸ > 0; the condition is a + b = ab, and we want a² + b².','Let s = a + b = ab; AM–GM gives ab ≤ (a + b)²/4, so s ≤ s²/4 and s ≥ 4.','Then a² + b² = s² − 2s = (s − 1)² − 1, which is increasing for s ≥ 4, so its minimum is 16 − 8 = 8, at a = b = 2 (x = y = 1).']},

 {u:'T1',d:1,q:'What is the value of cos 75° · cos 15°?',c:['1/8','1/4','√3/4','1/2','√3/2'],a:'B',s:['Since 75° and 15° are complementary, cos 75° = sin 15°.','So the product is sin 15° cos 15° = (1/2) sin 30°.','That equals (1/2)(1/2) = 1/4.']},
 {u:'T1',d:1,q:'How many complex numbers z satisfy z² = z̄, where z̄ denotes the complex conjugate of z?',c:['2','3','4','5','6'],a:'C',s:['Taking absolute values gives |z|² = |z|, so |z| = 0 or |z| = 1.','If |z| = 1, then z̄ = 1/z, so z² = 1/z, i.e. z³ = 1, which has 3 solutions.','Together with z = 0, there are 4 solutions.']},
 {u:'T1',d:1,q:'What is the smallest positive period of f(x) = sin(2x/3) + cos(x/2)?',c:['2π','4π','6π','7π','12π'],a:'E',s:['sin(2x/3) has period 2π ÷ (2/3) = 3π, and cos(x/2) has period 2π ÷ (1/2) = 4π.','A period of the sum must be a common multiple of 3π and 4π, because the two terms have different frequencies and cannot cancel each other’s variation.','The least common multiple is 12π.']},
 {u:'T1',d:2,q:'In the complex plane, the points 0, 4 + 2i, and z are the vertices of an equilateral triangle. What is the product of the two possible values of z?',c:['20','20i','12 − 16i','16 + 12i','12 + 16i'],a:'E',s:['The third vertex comes from rotating 4 + 2i about 0 by +60° or −60°, so z = (4 + 2i)ω or (4 + 2i)ω̄ with ω = cos 60° + i sin 60°.','The product is (4 + 2i)² · ωω̄ = (4 + 2i)² · |ω|² = (4 + 2i)².','Expanding, (4 + 2i)² = 16 + 16i + 4i² = 12 + 16i.']},
 {u:'T1',d:2,q:'The numbers tan A and tan B are the two roots of x² − 6x + 4 = 0. What is cos(2A + 2B)?',c:['−3/5','−1/5','1/5','3/5','4/5'],a:'A',s:['By Vieta, tan A + tan B = 6 and tan A tan B = 4.','So tan(A + B) = 6/(1 − 4) = −2.','Using cos 2θ = (1 − tan²θ)/(1 + tan²θ) with θ = A + B gives (1 − 4)/(1 + 4) = −3/5.']},
 {u:'T1',d:2,q:'For how many integers n with 1 ≤ n ≤ 100 is (√3 + i)ⁿ a real number?',c:['16','17','25','33','50'],a:'A',s:['Write √3 + i = 2(cos 30° + i sin 30°), so by De Moivre (√3 + i)ⁿ = 2ⁿ(cos 30n° + i sin 30n°).','This is real exactly when sin 30n° = 0, i.e. 30n is a multiple of 180, i.e. 6 divides n.','There are ⌊100/6⌋ = 16 such n.']},
 {u:'T1',d:2,q:'How many values of x in the interval [0, 2π) satisfy sin 3x = cos x?',c:['2','3','4','6','8'],a:'D',s:['Rewrite cos x = sin(π/2 − x); sin u = sin v means u = v + 2πk or u = π − v + 2πk.','Case 1: 3x = π/2 − x + 2πk gives x = π/8 + kπ/2, which gives 4 values in [0, 2π).','Case 2: 3x = π/2 + x + 2πk gives x = π/4 + kπ, which gives 2 more values, none equal to those in case 1.','So there are 6 solutions.']},
 {u:'T1',d:2,q:'In △ABC, ∠A = 30°, BC = 5, and CA = 8. There are two noncongruent triangles with these measurements. What is the sum of the two possible lengths of AB?',c:['4√3','8','13','8√3','16'],a:'D',s:['Let AB = c. The Law of Cosines at A gives 5² = 8² + c² − 2 · 8 · c · cos 30°.','This simplifies to c² − 8√3 c + 39 = 0, whose discriminant 192 − 156 = 36 is positive, giving c = 4√3 ± 3, both positive.','By Vieta, the two lengths sum to 8√3.']},
 {u:'T1',d:3,q:'What is the value of tan²(π/16) + tan²(3π/16) + tan²(5π/16) + tan²(7π/16)?',c:['16','24','28','30','32'],a:'C',s:['Since 7π/16 and 5π/16 are complementary to π/16 and 3π/16, the sum is (tan²α + cot²α) + (tan²β + cot²β) with α = π/16, β = 3π/16.','tan²θ + cot²θ = (tan θ + cot θ)² − 2 = 4/sin²2θ − 2, so the sum is 4(1/sin²(π/8) + 1/sin²(3π/8)) − 4.','Because sin(3π/8) = cos(π/8), 1/sin²(π/8) + 1/cos²(π/8) = 1/(sin²(π/8)cos²(π/8)) = 4/sin²(π/4) = 8.','So the sum is 4 · 8 − 4 = 28.']},
 {u:'T1',d:3,q:'In △ABC, tan A : tan B : tan C = 1 : 2 : 3. What is AB/AC?',c:['√2/2','√10/4','1','3√2/4','3/2'],a:'D',s:['In any triangle (no right angle), tan A + tan B + tan C = tan A tan B tan C, because tan C = −tan(A + B).','With tangents k, 2k, 3k (all positive, since at most one angle is obtuse), 6k = 6k³ gives k = 1, so tan B = 2 and tan C = 3.','Then sin B = 2/√5 and sin C = 3/√10, and by the Law of Sines AB/AC = sin C/sin B = (3/√10)(√5/2) = 3√2/4.']},
 {u:'T1',d:3,q:'What is the sum of |z|² over all complex numbers z satisfying (z − 1)⁶ = z⁶?',c:['5/4','5/2','35/12','3','15/4'],a:'C',s:['The equation has degree 5 (the z⁶ terms cancel), and z = 0 is not a root, so it is equivalent to ((z − 1)/z)⁶ = 1, i.e. 1 − 1/z = ω for a sixth root of unity ω ≠ 1.','So z = 1/(1 − ω) and |z|² = 1/|1 − ω|² = 1/(4 sin²(θ/2)) where ω = cos θ + i sin θ, θ = 60°, 120°, 180°, 240°, 300°.','Since sin²30° = 1/4, sin²60° = 3/4, sin²90° = 1, the values are 1, 1/3, 1/4, 1/3, 1.','Their sum is 35/12.']},
 {u:'T1',d:3,q:'What is the value of C(12,0) + C(12,3) + C(12,6) + C(12,9) + C(12,12), where C(n,k) is a binomial coefficient?',c:['1364','1365','4096/3','1366','1368'],a:'D',s:['Let ω be a primitive cube root of unity; 1 + ωᵏ + ω²ᵏ equals 3 if 3 divides k and 0 otherwise.','So the desired sum is [(1 + 1)¹² + (1 + ω)¹² + (1 + ω²)¹²]/3.','Since 1 + ω = −ω² and 1 + ω² = −ω, we get (1 + ω)¹² = ω²⁴ = 1 and (1 + ω²)¹² = ω¹² = 1.','The sum is (4096 + 1 + 1)/3 = 1366.']},

 {u:'A5',d:1,q:'An ellipse has foci (0, 0) and (6, 0) and passes through the point (3, 4). What is the area of the ellipse?',c:['12π','15π','20π','24π','25π'],a:'C',s:['The sum of distances from (3, 4) to the foci is 5 + 5 = 10, so the semi-major axis is a = 5.','The center is (3, 0) and the focal distance is c = 3, so the semi-minor axis is b = √(25 − 9) = 4 (indeed (3, 4) is the top of the minor axis).','The area is πab = 20π.']},
 {u:'A5',d:1,q:'A parabola has focus (2, 5) and directrix y = 1. The point (10, k) lies on the parabola. What is k?',c:['8','9','10','11','13'],a:'D',s:['A point is on the parabola when its distance to the focus equals its distance to the directrix: 8² + (k − 5)² = (k − 1)².','Expanding, 64 + k² − 10k + 25 = k² − 2k + 1, so 88 = 8k.','Thus k = 11.']},
 {u:'A5',d:2,q:'A hyperbola centered at the origin has asymptotes y = x/2 and y = −x/2 and passes through the point (4, 3). What is the distance between its foci?',c:['2√5','5','5√2','2√15','10'],a:'E',s:['Every hyperbola with these asymptotes has the form x²/4 − y² = k for some k ≠ 0.','Plugging in (4, 3) gives k = 4 − 9 = −5, so the hyperbola is y²/5 − x²/20 = 1, which opens up and down.','Then c² = 5 + 20 = 25, so c = 5 and the foci are 10 apart.']},
 {u:'A5',d:2,q:'What is the sum of the distinct real roots of x⁴ − 5x³ + 8x² − 5x + 1 = 0?',c:['3','4','9/2','5','6'],a:'B',s:['The coefficients are symmetric, so divide by x² and set t = x + 1/x: t² − 2 − 5t + 8 = 0, i.e. t² − 5t + 6 = 0.','t = 2 gives x + 1/x = 2, so x = 1 (a double root).','t = 3 gives x² − 3x + 1 = 0 with two distinct real roots summing to 3.','The distinct real roots are 1 and (3 ± √5)/2, with sum 4 (not the Vieta total 5, which counts 1 twice).']},
 {u:'A5',d:2,q:'For how many integers k does the equation x³ − kx + 6 = 0 have at least one integer solution?',c:['2','3','4','5','6'],a:'E',s:['An integer root r must divide 6, so r ∈ {±1, ±2, ±3, ±6}, and then k = (r³ + 6)/r = r² + 6/r.','The eight values of r give k = 7, −5, 7, 1, 11, 7, 37, 35 for r = 1, −1, 2, −2, 3, −3, 6, −6.','The distinct values are −5, 1, 7, 11, 35, 37, so there are 6.']},
 {u:'A5',d:2,q:'A real number r satisfies r² = r + 1. Then r¹⁰ = ar + b for some integers a and b. What is a + b?',c:['76','89','110','123','144'],a:'B',s:['If rⁿ = Fₙr + Fₙ₋₁, then rⁿ⁺¹ = Fₙr² + Fₙ₋₁r = Fₙ(r + 1) + Fₙ₋₁r = (Fₙ + Fₙ₋₁)r + Fₙ.','So the coefficients follow the Fibonacci numbers: r² = r + 1, r³ = 2r + 1, r⁴ = 3r + 2, …, r¹⁰ = 55r + 34.','Hence a + b = 55 + 34 = 89.']},
 {u:'A5',d:2,q:'Let f(x) = x² + 8x + 14. What is the minimum value of f(f(f(x))) over all real x?',c:['−2','2','14','23','34'],a:'E',s:['Complete the square: f(x) = (x + 4)² − 2, so f takes exactly the values ≥ −2 and is increasing for x ≥ −4.','So y = f(x) ranges over [−2, ∞), where f is increasing; the minimum of f(f(x)) is f(−2) = 4 − 16 + 14 = 2.','Then z = f(f(x)) ranges over [2, ∞), and the minimum of f(z) is f(2) = 4 + 16 + 14 = 34.']},
 {u:'A5',d:3,q:'A circle meets the hyperbola xy = 1 in exactly four points. Three of them are (1, 1), (2, 1/2), and (−1/3, −3). What is the fourth point?',c:['(−3/2, −2/3)','(−2/3, −3/2)','(−1/2, −2)','(3/2, 2/3)','(−6, −1/6)'],a:'A',s:['Write the circle as x² + y² + Dx + Ey + F = 0 and substitute y = 1/x, then multiply by x².','This gives x⁴ + Dx³ + Fx² + Ex + 1 = 0, whose four roots are the x-coordinates of the intersection points.','By Vieta the product of the x-coordinates is 1, so the fourth x-coordinate is 1/(1 · 2 · (−1/3)) = −3/2.','The fourth point is (−3/2, −2/3).']},
 {u:'A5',d:3,q:'Let f(x) = x² − 6x + 12. What is the sum of all real numbers x that satisfy f(f(x)) = x?',c:['5','7','10','12','14'],a:'B',s:['Any solution of f(x) = x also solves f(f(x)) = x, so x² − 7x + 12 divides the quartic f(f(x)) − x.','Dividing, f(f(x)) − x = (x² − 7x + 12)(x² − 5x + 7).','The first factor has real roots 3 and 4, while x² − 5x + 7 has discriminant 25 − 28 < 0, so no other real solutions.','The sum is 3 + 4 = 7 (the Vieta sum 12 includes two nonreal roots).']},
 {u:'A5',d:3,q:'A rectangle has all four of its sides tangent to the ellipse x²/16 + y²/9 = 1. What is the greatest possible area of the rectangle?',c:['25','40','48','50','64'],a:'D',s:['A line with unit normal (cos θ, sin θ) tangent to the ellipse lies at distance √(16cos²θ + 9sin²θ) from the center.','So a circumscribed rectangle with sides tilted by θ has dimensions 2√(16cos²θ + 9sin²θ) and 2√(16sin²θ + 9cos²θ).','Its area is 4√(PQ) where P + Q = 25, so by AM–GM the area is at most 4 · 25/2 = 50, achieved at θ = 45° (P = Q = 12.5).','The greatest area is 50 (the axis-parallel rectangle has only 48).']},
 {u:'A5',d:3,q:'A chord of the parabola y² = 4x passes through the focus F of the parabola and has endpoints A and B. If AF = 3, what is BF?',c:['1','4/3','3/2','2','3'],a:'C',s:['The focus is F = (1, 0) and the directrix is x = −1, so a point (x, y) on the parabola has distance x + 1 to F.','AF = 3 gives A = (2, ±2√2); the line through A and F has slope ±2√2, and substituting into y² = 4x gives 2x² − 5x + 2 = 0, so B has x = 1/2.','Then BF = 1/2 + 1 = 3/2, consistent with the focal-chord identity 1/AF + 1/BF = 1.']}
);
