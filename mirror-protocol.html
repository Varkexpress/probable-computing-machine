 {u:'G2',d:2,q:'Square ABCD has side length 8. A circle passes through vertices A and B and is tangent to side CD. What is the radius of the circle?',c:['4','9/2','5','16/3','4√2'],a:'C',s:['Place A = (0, 0), B = (8, 0), and line CD as y = 8. By symmetry the center lies on x = 4, say at (4, k).','Tangency to CD means the radius is 8 − k, and passing through A means 4² + k² = (8 − k)².','This simplifies to 16 = 64 − 16k, so k = 3 and the radius is 8 − 3 = 5.']},
 {u:'G2',d:2,q:'From a point P outside a circle with center O and radius 6, two tangent segments PA and PB are drawn, with ∠APB = 60°. What is the area of the region bounded by segments PA, PB, and the minor arc AB?',c:['36√3−12π','18√3','12π','36√3−6π','36√3'],a:'A',s:['Radii OA and OB are perpendicular to the tangents, and PO bisects ∠APB, so △OAP is a 30-60-90 triangle with OA = 6 and PA = 6√3.','Kite OAPB has area 2 · (1/2) · 6 · 6√3 = 36√3.','Since ∠AOB = 180° − 60° = 120°, the sector OAB has area (120/360) · 36π = 12π.','The region is the kite minus the sector: 36√3 − 12π.']},
 {u:'G2',d:2,q:'Two circles, each of radius 6, are drawn so that each passes through the center of the other. What is the area of the region inside both circles?',c:['6π','12π−9√3','18π−9√3','24π−18√3','24π−9√3'],a:'D',s:['The centers are 6 apart, and each center together with the two intersection points forms equilateral triangles, so the common chord subtends a 120° angle at each center.','The overlap consists of two circular segments, each equal to a 120° sector minus the triangle formed by the two radii.','Each segment has area (1/3)·36π − (1/2)·6·6·sin 120° = 12π − 9√3.','So the overlap is 2(12π − 9√3) = 24π − 18√3.']},
 {u:'G2',d:3,q:'Circles of radius 4 and 9 are externally tangent to each other, and both are tangent to line ℓ on the same side of ℓ. A third, smaller circle is tangent to ℓ and externally tangent to both larger circles, fitting in the gap between them and ℓ. What is the radius of the smallest circle?',c:['1','36/25','3/2','2','12/5'],a:'B',s:['If two circles of radii r and s are externally tangent and both tangent to a line, the distance between their points of tangency on the line is √((r + s)² − (r − s)²) = 2√(rs).','So the three tangency points on ℓ satisfy 2√(4·9) = 2√(4x) + 2√(9x), where x is the small radius.','Dividing by 2: 6 = 2√x + 3√x = 5√x, so √x = 6/5.','Thus x = 36/25.']},
 {u:'G2',d:3,q:'Chords AC and BD of a circle are perpendicular and intersect at E. If AE = 2, EC = 8, and BE = ED, what is the area of the circle?',c:['20π','25π','28π','34π','100π'],a:'B',s:['By power of a point, BE · ED = AE · EC = 16, and since BE = ED, each equals 4.','Put E at the origin with A = (−2, 0), C = (8, 0), B = (0, 4), D = (0, −4). The center lies on the perpendicular bisectors x = 3 and y = 0.','So the center is (3, 0) and the radius is the distance to C, which is 5 (check: distance to B is √(9 + 16) = 5).','The area is 25π.']},
 {u:'G2',d:3,q:'Convex quadrilateral ABCD is inscribed in a circle with AB = 3, BC = 5, CD = 3, and DA = 8. What is the area of ABCD?',c:['39√3/4','39/2','12√3','39√3/2','21√3'],a:'A',s:['Let BD = x and ∠A = θ; since ABCD is cyclic, ∠C = 180° − θ, so cos C = −cos θ.','The Law of Cosines in △ABD and △CBD gives x² = 9 + 64 − 48 cos θ = 25 + 9 + 30 cos θ, so 78 cos θ = 39 and θ = 60°, with x = 7.','The area is (1/2)·3·8·sin 60° + (1/2)·5·3·sin 120° = (24 + 15)·√3/4.','So the area is 39√3/4.']},
 {u:'G2',d:3,q:'Square ABCD has side length 10. A circle passes through vertex A and is tangent to both sides BC and CD (at points on those sides). What is the radius of the circle?',c:['10−5√2','10√2−10','5','20−10√2','6'],a:'D',s:['Place C at the origin with sides CB and CD along the axes, so A = (10, 10). A circle tangent to both axes in the first quadrant has center (r, r) and radius r.','Since the center and A both lie on the line y = x, the distance from the center to A is √2(10 − r), which must equal r.','So r(1 + √2) = 10√2, giving r = 10√2/(√2 + 1) = 10√2(√2 − 1) = 20 − 10√2.','The other solution, 20 + 10√2, is too large for the tangency points to lie on the sides.']},
 {u:'G3',d:1,q:'What is the area of the quadrilateral with vertices (0, 0), (6, 1), (5, 6), and (1, 4), taken in that order?',c:['20','21','45/2','24','45'],a:'C',s:['Use the shoelace formula: sum xᵢyᵢ₊₁ − xᵢ₊₁yᵢ around the polygon.','The terms are 0·1 − 6·0 = 0, 6·6 − 5·1 = 31, 5·4 − 1·6 = 14, and 1·0 − 0·4 = 0, for a total of 45.','The area is half the absolute value: 45/2.']},
 {u:'G3',d:1,q:'A rectangular box has faces with areas 24, 32, and 48 square units. What is its volume?',c:['144','192','216','256','288'],a:'B',s:['If the dimensions are a, b, c, then ab = 24, bc = 32, and ca = 48.','Multiplying gives (abc)² = 24 · 32 · 48 = 36864.','So the volume is abc = √36864 = 192 (the box is 4 × 6 × 8).']},
 {u:'G3',d:2,q:'The circle with center (10, 5) and radius 5 is tangent to the x-axis. There is exactly one other line through the origin that is tangent to this circle. What is its slope?',c:['1/2','3/4','1','4/3','2'],a:'D',s:['The line y = mx, or mx − y = 0, is tangent exactly when its distance from the center equals the radius: |10m − 5|/√(m² + 1) = 5.','Squaring: 100m² − 100m + 25 = 25m² + 25, so 75m² = 100m.','The root m = 0 is the x-axis, so the other tangent has slope 4/3.']},
 {u:'G3',d:2,q:'A right circular cone has height 8 and volume 96π. What is its total surface area, including the base?',c:['36π','60π','96π','108π','132π'],a:'C',s:['From V = (1/3)πr²h we get (1/3)πr² · 8 = 96π, so r² = 36 and r = 6.','The slant height is √(6² + 8²) = 10.','The total surface area is πr² + πrℓ = 36π + 60π = 96π.']},
 {u:'G3',d:2,q:'A rectangular box has the sum of the lengths of its 12 edges equal to 52 and total surface area 104. What is the length of a space diagonal of the box?',c:['2√13','√65','2√26','3√13','13'],a:'B',s:['If the dimensions are a, b, c, then 4(a + b + c) = 52, so a + b + c = 13, and 2(ab + bc + ca) = 104.','The space diagonal satisfies d² = a² + b² + c² = (a + b + c)² − 2(ab + bc + ca).','So d² = 169 − 104 = 65 and d = √65.']},
 {u:'G3',d:3,q:'A regular tetrahedron has edge length 6. A sphere is tangent to all six edges of the tetrahedron. What is the radius of the sphere?',c:['√2','3/2','√3','2','3√2/2'],a:'E',s:['By symmetry the sphere is centered at the center of the tetrahedron and touches each edge at its midpoint.','Inscribe the tetrahedron in a cube using alternate vertices: a tetrahedron of edge 6 sits in a cube of edge 6/√2 = 3√2.','The midpoint of each tetrahedron edge is the center of a cube face, whose distance from the cube’s center is half the cube’s edge.','So the radius is 3√2/2.']},
 {u:'G3',d:3,q:'A bug starts at (5, 3), crawls in straight segments to some point on the x-axis, then to some point on the y-axis, and finally to (2, 6). What is the shortest possible length of the bug’s path?',c:['√106','√113','√130','12','√170'],a:'C',s:['Reflect the start (5, 3) over the x-axis to (5, −3) and the end (2, 6) over the y-axis to (−2, 6); reflections do not change the lengths of the corresponding segments.','The path then becomes a broken line from (5, −3) to (−2, 6), which is shortest when straight; this straight segment does cross the positive x-axis and then the positive y-axis in the right order.','Its length is √(7² + 9²) = √130.']},
 {u:'G3',d:3,q:'How many points with both coordinates integers lie strictly inside the triangle with vertices (0, 0), (24, 0), and (9, 12)?',c:['127','130','131','143','144'],a:'B',s:['Pick’s theorem says Area = I + B/2 − 1, where I counts interior lattice points and B counts boundary lattice points.','The area is (1/2)·24·12 = 144.','A segment with displacement (Δx, Δy) contains gcd(Δx, Δy) lattice steps, so B = gcd(24, 0) + gcd(15, 12) + gcd(9, 12) = 24 + 3 + 3 = 30.','Then I = 144 − 15 + 1 = 130.']},
 {u:'G3',d:3,q:'A rectangular box measures 3 × 4 × 12. A space diagonal is drawn, and one of the edges of length 12 that shares no vertex with that diagonal is chosen. What is the shortest distance between the diagonal and this edge?',c:['9/5','2','12/5','36/13','3'],a:'C',s:['Look straight down the edges of length 12: the box projects to a 3 × 4 rectangle, the chosen edge projects to a corner point, and the diagonal projects to the rectangle’s diagonal.','Because both the edge and the viewing direction are parallel, the shortest distance between the two lines equals the distance in this projection from that corner to the rectangle’s diagonal.','That distance is the altitude to the hypotenuse of a 3-4-5 right triangle, 3·4/5 = 12/5.']},
 {u:'G4',d:1,q:'Two sides of a triangle have lengths 5 and 7, and the angle between them measures 150°. What is the area of the triangle?',c:['35/4','35√3/4','35/2','35√3/2','35'],a:'A',s:['The area of a triangle with sides a and b enclosing angle C is (1/2)ab sin C.','Since sin 150° = sin 30° = 1/2, the area is (1/2) · 5 · 7 · (1/2) = 35/4.']},
 {u:'G4',d:2,q:'Equilateral triangle ABC is inscribed in a circle. Point P lies on minor arc BC with PB = 3 and PC = 5. What is PA?',c:['√19','√34','7','8','15'],a:'D',s:['Let s be the side of the triangle. Ptolemy’s theorem on cyclic quadrilateral ABPC gives PA · BC = PB · AC + PC · AB.','Since all sides of the triangle equal s, this becomes PA · s = 3s + 5s.','So PA = PB + PC = 8.']},
 {u:'G4',d:2,q:'In △ABC, AB = 7, AC = 8, and BC = 9. Point D lies on BC with BD = 3. What is AD?',c:['√30','6','√39','2√10','7'],a:'B',s:['Stewart’s theorem for cevian AD with BD = m = 3 and DC = n = 6 states AB² · n + AC² · m = BC(AD² + mn).','Substituting: 49 · 6 + 64 · 3 = 9(AD² + 18), so 486 = 9AD² + 162.','Then AD² = 36 and AD = 6.']},
 {u:'G4',d:2,q:'In △ABC, AB = 6, AC = 12, and ∠BAC = 120°. The bisector of ∠BAC meets BC at D. What is AD?',c:['3','2√3','4','9/2','6'],a:'C',s:['The bisector splits △ABC into △ABD and △ACD, each with a 60° angle at A, so compare areas using (1/2)ab sin C.','(1/2)·6·12·sin 120° = (1/2)·6·AD·sin 60° + (1/2)·12·AD·sin 60°, and the sines are equal.','So 72 = 18·AD, giving AD = 4.']},
 {u:'G4',d:3,q:'Triangle ABC has area 60. Point D lies on BC with BD : DC = 2 : 3, and point E lies on AC with AE : EC = 1 : 2. Segments AD and BE intersect at P. What is the area of quadrilateral PDCE?',c:['24','26','28','88/3','32'],a:'D',s:['Assign mass points: AE : EC = 1 : 2 gives masses A = 2, C = 1; BD : DC = 2 : 3 needs 2·B = 3·C, so B = 3/2.','Then E has mass 3, so BP : PE = 3 : (3/2) = 2 : 1, meaning PE = BE/3.','Since AE = AC/3, △ABE has area 20, and △APE has area 20/3. Also BD = (2/5)BC, so △ADC has area 36.','Quadrilateral PDCE is △ADC minus △APE: 36 − 20/3 = 88/3.']},
 {u:'G4',d:3,q:'Triangle ABC has AB = AC = 5 and BC = 6. Let O be its circumcenter and I its incenter. What is OI?',c:['1/4','3/8','1/2','9/16','5/8'],a:'E',s:['The area is (1/2)·6·4 = 12 (the altitude from A is 4) and the semiperimeter is 8, so r = 12/8 = 3/2.','The circumradius is R = abc/(4K) = 5·5·6/48 = 25/8.','Euler’s formula gives OI² = R² − 2Rr = 625/64 − 75/8 = 25/64.','So OI = 5/8.']},
 {u:'G4',d:3,q:'Right triangle ABC has a right angle at C, AC = 3, and BC = 4. Let D₁ be the foot of the perpendicular from C to AB, D₂ the foot of the perpendicular from D₁ to BC, D₃ the foot of the perpendicular from D₂ to AB, and so on, alternating between AB and BC forever. What is CD₁ + D₁D₂ + D₂D₃ + ⋯?',c:['48/5','10','12','15','16'],a:'C',s:['First, CD₁ = (3·4)/5 = 12/5 as the altitude to the hypotenuse.','Each new segment is the altitude of a right triangle with an acute angle at B that is similar to the previous one, so every segment is (cos B) = 4/5 times the one before it.','The sum is a geometric series: (12/5)/(1 − 4/5) = 12.']},
 {u:'G4',d:3,q:'Quadrilateral ABCD is inscribed in a circle with BC = CD and ∠BCD = 120°. If AB = 5 and AD = 3, what is AC?',c:['4','8√3/3','5','4√2','8'],a:'B',s:['In isosceles △BCD with apex angle 120°, BD = BC·√3.','Ptolemy’s theorem gives AC · BD = AB · CD + AD · BC = BC(AB + AD) = 8 · BC.','Dividing by BD = √3·BC gives AC = 8/√3 = 8√3/3.']},
 {u:'G4',d:3,q:'Triangle ABC has AB = 13, BC = 14, and CA = 15. A line parallel to BC is tangent to the incircle of △ABC and cuts off a small triangle at vertex A. What is the inradius of that small triangle?',c:['2/3','1','4/3','8/5','2'],a:'C',s:['△ABC has area 84 (Heron), semiperimeter 21, so its inradius is 84/21 = 4, and the altitude from A to BC is 2·84/14 = 12.','The tangent line parallel to BC lies 2r = 8 above BC, so it is 12 − 8 = 4 from A.','The small triangle is similar to △ABC with ratio 4/12 = 1/3, so its inradius is 4/3.']}
);

AB.push(
 {u:'A4',d:1,q:'What is the value of (log₄ 27)(log₉ 32)?',c:['5/4','2','9/4','3','15/4'],a:'E',s:['Change base to natural logs: log₄ 27 = 3 ln 3 / (2 ln 2) and log₉ 32 = 5 ln 2 / (2 ln 3).','Multiplying, ln 2 and ln 3 cancel, leaving (3 · 5)/(2 · 2).','The product is 15/4.']},
 {u:'A4',d:1,q:'How many digits does the number 2⁴⁰ · 5³⁵ have when written in base ten?',c:['36','37','38','39','75'],a:'B',s:['Pair each 5 with a 2 to make tens: 2⁴⁰ · 5³⁵ = 2⁵ · 10³⁵.','This is 32 followed by 35 zeros.','So it has 2 + 35 = 37 digits.']},
 {u:'A4',d:2,q:'A real number x > 1 satisfies log₂(log₄ x) + log₄(log₂ x) = 2. What is x?',c:['2','4','8','16','64'],a:'D',s:['Let y = log₂ x; then log₄ x = y/2 and log₄ y = (1/2) log₂ y.','The equation becomes log₂ y − 1 + (1/2) log₂ y = 2, so (3/2) log₂ y = 3.','Thus log₂ y = 2, y = 4, and x = 2⁴ = 16.']},
 {u:'A4',d:2,q:'What is the product of all positive real numbers x satisfying x^(log₂ x) = 8x²?',c:['1/2','4','8','16','24'],a:'B',s:['Take log₂ of both sides: (log₂ x)² = 3 + 2 log₂ x.','With t = log₂ x, t² − 2t − 3 = 0, so the two values of t sum to 2 by Vieta (they are 3 and −1).','The product of the x’s is 2^(sum of the t’s) = 2² = 4.']},
 {u:'A4',d:2,q:'For how many integers n with 1 ≤ n ≤ 1000 is ⌊log₂ n⌋ an even number?',c:['256','331','341','512','683'],a:'C',s:['⌊log₂ n⌋ = k exactly when 2ᵏ ≤ n ≤ 2ᵏ⁺¹ − 1, a block of 2ᵏ integers.','Even k ≤ 9 give k = 0, 2, 4, 6, 8, all of whose blocks lie in 1 to 511; the block for k = 9 (512 to 1000) is odd.','The count is 1 + 4 + 16 + 64 + 256 = 341.']},
 {u:'A4',d:2,q:'How many positive integers x satisfy (log₂ x) · log₂(64/x) ≥ 5?',c:['27','28','30','31','32'],a:'D',s:['Let t = log₂ x, so log₂(64/x) = 6 − t and the inequality is t(6 − t) ≥ 5.','This rearranges to t² − 6t + 5 ≤ 0, i.e. (t − 1)(t − 5) ≤ 0, so 1 ≤ t ≤ 5.','Then 2 ≤ x ≤ 32, which contains 31 integers.']},
 {u:'A4',d:3,q:'Let a = log₂ 3 and b = log₃ 5. Which expression equals log₁₅ 20?',c:['(2 + ab)/(a + ab)','(1 + ab)/(a + b)','(2 + b)/(a + b)','(2a + b)/(1 + ab)','(2 + ab)/(1 + a)'],a:'A',s:['Rewrite everything in base 2: log₂ 3 = a and log₂ 5 = log₂ 3 · log₃ 5 = ab.','Then log₂ 20 = 2 + log₂ 5 = 2 + ab and log₂ 15 = log₂ 3 + log₂ 5 = a + ab.','By change of base, log₁₅ 20 = (2 + ab)/(a + ab).']},
 {u:'A4',d:3,q:'Positive real numbers x and y with y = 4x satisfy xʸ = yˣ. What is log₂(xy)?',c:['10/3','7/2','4','9/2','5'],a:'A',s:['Substitute y = 4x and take the x-th root of both sides: x⁴ = 4x (raising both sides to the power 1/x).','Since x > 0, x³ = 4, so x = 2^(2/3).','Then xy = 4x² = 2² · 2^(4/3) = 2^(10/3), so log₂(xy) = 10/3.']},
 {u:'A4',d:3,q:'For how many ordered pairs (m, n) of integers with 2 ≤ m ≤ 100 and 1 ≤ n ≤ 100 is log_m n a rational number?',c:['149','198','230','238','248'],a:'E',s:['If log_m n = p/q in lowest terms with p ≠ 0, then n^q = m^p, which forces m and n to be powers of a common base; conversely such pairs always give rational logs.','The pairs with n = 1 (log = 0) give 99, and the pairs with n = m give another 99.','For m ≠ n ≠ 1, group numbers by their primitive base: {2, 4, 8, 16, 32, 64} gives 6 · 5 = 30 ordered pairs, {3, 9, 27, 81} gives 12, and {5, 25}, {6, 36}, {7, 49}, {10, 100} give 2 each, for 50.','The total is 99 + 99 + 50 = 248.']},
 {u:'A4',d:3,q:'Real numbers 1 < a < b satisfy log_a b + log_b a = 10/3 and ab = 3⁸. What is a + b?',c:['90','162','252','738','6562'],a:'D',s:['Let t = log_a b; then t + 1/t = 10/3, so 3t² − 10t + 3 = 0 and t = 3 or 1/3.','Since b > a > 1, t > 1, so t = 3 and b = a³.','Then ab = a⁴ = 3⁸ gives a = 9 and b = 729, so a + b = 738.']},
 {u:'A4',d:3,q:'Let p = log₂ 3, q = log₃ 5, and r = log₅ 8. Which of the following is true?',c:['p < q < r','p < r < q','q < p < r','r < p < q','r < q < p'],a:'E',s:['Compare each log with a simple fraction by comparing integer powers.','Since 2³ < 3², p > 3/2; since 5² < 3³, q < 3/2.','Since 3⁴ = 81 < 125 = 5³, q > 4/3; since 8³ = 512 < 625 = 5⁴, r < 4/3.','Therefore r < q < p.']},
 {u:'T1',d:1,q:'A complex number z satisfies z + 2z̄ = 9 − 4i, where z̄ is the conjugate of z. What is |z|?',c:['3','4','5','√41','7'],a:'C',s:['Write z = x + yi, so z̄ = x − yi and z + 2z̄ = 3x − yi.','Matching parts gives 3x = 9 and −y = −4, so z = 3 + 4i.','Then |z| = √(9 + 16) = 5.']},
 {u:'T1',d:1,q:'A triangle has side lengths 5, 7, and 8. What is the measure of the angle opposite the side of length 7?',c:['45°','60°','90°','120°','150°'],a:'B',s:['By the Law of Cosines, 7² = 5² + 8² − 2 · 5 · 8 · cos θ.','So 49 = 89 − 80 cos θ and cos θ = 1/2.','Therefore θ = 60°.']},
 {u:'T1',d:2,q:'A complex number z satisfies z + 1/z = √3. What is z²⁰²⁶ + 1/z²⁰²⁶?',c:['−1','0','1','√3','2'],a:'C',s:['Solving z² − √3 z + 1 = 0 gives z = cos 30° ± i sin 30°, so zⁿ + 1/zⁿ = 2 cos(30n°) by De Moivre.','Since z¹² = 1, reduce 2026 mod 12: 2026 = 12 · 168 + 10.','So the value is 2 cos 300° = 2 · (1/2) = 1.']},
 {u:'T1',d:2,q:'In △ABC, AB = 5, AC = 8, and ∠A = 60°. What is the inradius of △ABC?',c:['1','√3','2','5/2','2√3'],a:'B',s:['By the Law of Cosines, BC² = 25 + 64 − 2 · 5 · 8 · (1/2) = 49, so BC = 7.','The area is (1/2) · 5 · 8 · sin 60° = 10√3, and the semiperimeter is (5 + 8 + 7)/2 = 10.','The inradius is area/semiperimeter = 10√3/10 = √3.']},
 {u:'T1',d:2,q:'What is (1 + tan 5°)(1 + tan 10°)(1 + tan 15°) ⋯ (1 + tan 40°)?',c:['4','8','16','32','256'],a:'C',s:['If A + B = 45°, then tan(A + B) = 1 gives tan A + tan B = 1 − tan A tan B, so (1 + tan A)(1 + tan B) = 2.','The eight factors pair up as 5° + 40°, 10° + 35°, 15° + 30°, 20° + 25°, each pair having product 2.','So the product is 2⁴ = 16.']},
 {u:'T1',d:2,q:'Let ω = cos(2π/5) + i sin(2π/5). What is (2 − ω)(2 − ω²)(2 − ω³)(2 − ω⁴)?',c:['31','32','33','63','64'],a:'A',s:['The fifth roots of unity are the roots of x⁵ − 1 = (x − 1)(x − ω)(x − ω²)(x − ω³)(x − ω⁴).','Dividing by x − 1, (x − ω)(x − ω²)(x − ω³)(x − ω⁴) = x⁴ + x³ + x² + x + 1.','At x = 2 this is 16 + 8 + 4 + 2 + 1 = 31.']},
 {u:'T1',d:3,q:'Over all complex numbers z with |z| = 1, what is the maximum value of |(z − 1)²(z + 1)|?',c:['2','8/3','3','16√3/9','2√3'],a:'D',s:['Write z = cos θ + i sin θ; then |z − 1| = 2|sin(θ/2)| and |z + 1| = 2|cos(θ/2)|.','So the expression is 8s²c, where s = |sin(θ/2)|, c = |cos(θ/2)|, and s² = 1 − c².','Maximize f(c) = c − c³ on [0, 1]: f′(c) = 1 − 3c² = 0 gives c = 1/√3 and f = 2/(3√3).','The maximum is 8 · 2/(3√3) = 16√3/9.']},
 {u:'T1',d:3,q:'Let ω = cos(2π/7) + i sin(2π/7). What is the value of the sum 1/(1 − ω) + 1/(1 − ω²) + ⋯ + 1/(1 − ω⁶)?',c:['1','3/2','2','5/2','3'],a:'E',s:['Pair the term for ωᵏ with the term for ω⁷⁻ᵏ = 1/ωᵏ, which is the conjugate.','1/(1 − ωᵏ) + 1/(1 − ω⁻ᵏ) = 1/(1 − ωᵏ) + ωᵏ/(ωᵏ − 1) = (1 − ωᵏ)/(1 − ωᵏ) = 1.','The six terms form three such pairs, so the sum is 3.']},
 {u:'T1',d:3,q:'What is the sum of all x in the interval [0, 2π] satisfying sin x + sin 2x + sin 3x = 0?',c:['5π','6π','7π','8π','9π'],a:'C',s:['Sum-to-product gives sin x + sin 3x = 2 sin 2x cos x, so the equation is sin 2x(2 cos x + 1) = 0.','sin 2x = 0 gives x = 0, π/2, π, 3π/2, 2π, which sum to 5π.','cos x = −1/2 gives x = 2π/3 and 4π/3, which sum to 2π.','The total is 7π.']},
 {u:'T1',d:3,q:'What is the area of the region in the complex plane consisting of all z with |z − 3i| ≥ 2|z|?',c:['2π','3π','4π','6π','9π'],a:'C',s:['Write z = x + yi and square both sides: x² + (y − 3)² ≥ 4(x² + y²).','This simplifies to 3x² + 3y² + 6y − 9 ≤ 0, i.e. x² + (y + 1)² ≤ 4.','The region is a disk of radius 2 centered at −i, with area 4π.']},
 {u:'T1',d:3,q:'Let ω = cos(2π/7) + i sin(2π/7). What is the product of 1 + ωᵏ + ω²ᵏ over k = 1, 2, …, 6?',c:['−1','0','1','3','7'],a:'C',s:['Since ωᵏ ≠ 1, each factor equals (ω³ᵏ − 1)/(ωᵏ − 1).','As k runs over 1 to 6, 3k mod 7 also runs over 1 to 6 (3 is invertible mod 7), so the numerators are a rearrangement of the denominators.','The whole product is therefore 1.']},
 {u:'A5',d:1,q:'Let r, s, t be the roots of x³ − 4x² + 5x − 7. What is 1/r + 1/s + 1/t?',c:['−5/7','−4/7','4/7','5/7','5/4'],a:'D',s:['Combine the fractions: 1/r + 1/s + 1/t = (rs + st + tr)/(rst).','By Vieta, rs + st + tr = 5 and rst = 7.','So the sum is 5/7.']},
 {u:'A5',d:1,q:'The polynomial 2x³ − 3x² − 11x + 6 has three rational roots. What is the difference between its largest and smallest roots?',c:['3','7/2','4','9/2','5'],a:'E',s:['By the Rational Root Theorem, try divisors of 6 over divisors of 2; x = 3 works since 54 − 27 − 33 + 6 = 0.','Dividing by x − 3 leaves 2x² + 3x − 2 = (2x − 1)(x + 2).','The roots are 3, 1/2, −2, so the difference is 3 − (−2) = 5.']},
 {u:'A5',d:2,q:'Let a, b, c be the roots of x³ − 3x + 1. What is a³ + b³ + c³?',c:['−9','−3','0','3','9'],a:'B',s:['Each root satisfies r³ = 3r − 1.','Summing over the three roots gives a³ + b³ + c³ = 3(a + b + c) − 3.','By Vieta a + b + c = 0, so the sum is −3.']},
 {u:'A5',d:2,q:'A polynomial P(x) leaves remainder 3 when divided by x − 1 and remainder 7 when divided by x − 3. What is the remainder when P(x) is divided by (x − 1)(x − 3)?',c:['x + 2','2x − 1','3x','4x − 1','2x + 1'],a:'E',s:['The remainder on division by a quadratic is linear, so P(x) = (x − 1)(x − 3)Q(x) + ax + b.','Setting x = 1 and x = 3 gives a + b = 3 and 3a + b = 7.','So a = 2 and b = 1, and the remainder is 2x + 1.']},
 {u:'A5',d:2,q:'Points A and B lie on the parabola y = x², with O the origin, and ∠AOB = 90°. As A and B vary, line AB always passes through which fixed point?',c:['(0, 1)','(0, 1/2)','(0, 1/4)','(0, 2)','(1, 0)'],a:'A',s:['Let line AB be y = mx + k; its intersections with y = x² satisfy x² − mx − k = 0, so x₁x₂ = −k by Vieta.','OA ⊥ OB means x₁x₂ + y₁y₂ = x₁x₂ + (x₁x₂)² = 0, so −k + k² = 0.','Since k ≠ 0 (otherwise O is on the line), k = 1 for every such chord, so the fixed point is (0, 1).']},
 {u:'A5',d:2,q:'The hyperbola x²/16 − y²/9 = 1 has foci F₁ = (−5, 0) and F₂ = (5, 0). A point P on the right branch satisfies PF₁ = 13. What is PF₂?',c:['3','5','8','12','21'],a:'B',s:['For x²/a² − y²/b² = 1, every point has |PF₁ − PF₂| = 2a; here a = 4, so the difference is 8.','On the right branch P is closer to F₂, so PF₁ − PF₂ = 8.','Thus PF₂ = 13 − 8 = 5.']},
 {u:'A5',d:3,q:'Let r₁, r₂, r₃, r₄ be the roots of x⁴ − x³ − 3x² + 2x + 1. What is r₁⁴ + r₂⁴ + r₃⁴ + r₄⁴?',c:['19','21','23','25','27'],a:'A',s:['Let pₖ be the sum of kth powers; by Vieta e₁ = 1, e₂ = −3, e₃ = −2, e₄ = 1.','Newton’s identities give p₁ = 1, p₂ = e₁p₁ − 2e₂ = 7, and p₃ = e₁p₂ − e₂p₁ + 3e₃ = 4.','Then p₄ = e₁p₃ − e₂p₂ + e₃p₁ − 4e₄ = 4 + 21 − 2 − 4 = 19.']},
 {u:'A5',d:3,q:'A polynomial P(x) of degree at most 3 satisfies P(1) = 1, P(2) = 4, P(3) = 9, and P(4) = 17. What is P(5)?',c:['25','26','27','28','29'],a:'E',s:['Let Q(x) = P(x) − x², which has degree at most 3 and vanishes at x = 1, 2, 3.','So Q(x) = k(x − 1)(x − 2)(x − 3), and Q(4) = 17 − 16 = 1 gives 6k = 1.','Then P(5) = 25 + (4 · 3 · 2)/6 = 25 + 4 = 29.']},
 {u:'A5',d:3,q:'Let r, s, t be the roots of x³ − 2x² + 3x − 5, and let Q(x) be the monic cubic whose roots are r², s², t². What is Q(1)?',c:['−33','−11','3','11','33'],a:'A',s:['With P(x) = (x − r)(x − s)(x − t), we have Q(1) = (1 − r²)(1 − s²)(1 − t²) = ∏(1 − r) · ∏(1 + r).','∏(1 − r) = P(1) = 1 − 2 + 3 − 5 = −3.','∏(1 + r) = −∏(−1 − r) = −P(−1) = −(−1 − 2 − 3 − 5) = 11.','So Q(1) = (−3)(11) = −33.']},
 {u:'A5',d:3,q:'The ellipse x²/25 + y²/9 = 1 has foci F₁ and F₂. A point P on the ellipse satisfies ∠F₁PF₂ = 90°. What is the area of △F₁PF₂?',c:['6','8','9','12','15'],a:'C',s:['Here a = 5, b = 3, and c = √(25 − 9) = 4, so PF₁ + PF₂ = 10 and F₁F₂ = 8.','The right angle gives PF₁² + PF₂² = 64, so 2 · PF₁ · PF₂ = 100 − 64 = 36.','The area is (1/2) · PF₁ · PF₂ = 9.']},
 {u:'A5',d:3,q:'A polynomial P(x) with integer coefficients satisfies P(1) = P(3) = P(5) = P(7) = 2. Which of the following could be the value of P(6)?',c:['7','20','25','32','40'],a:'D',s:['P(x) − 2 has roots 1, 3, 5, 7, so P(x) − 2 = (x − 1)(x − 3)(x − 5)(x − 7)Q(x), and Q has integer coefficients because we divided by a monic integer polynomial.','At x = 6 the product is 5 · 3 · 1 · (−1) = −15, so P(6) − 2 = −15 · Q(6) is a multiple of 15.','Among the choices only 32 satisfies this (32 − 2 = 30), and Q(x) = −2 achieves it.']}
);

/* ===================== AMC TRAINING: new units, rebuild, real past-contest links ===================== */
UNITS.push(
 {u:'A5',n:'Polynomials and conics',amc12:1,body:`<div class="rule">Vieta for degree n: sum of roots = −(next coefficient)/(leading); product = (−1)ⁿ(constant)/(leading).<br>Newton’s sums: pₖ = rᵏ + sᵏ + …; for x² − ex + f: pₖ = e·pₖ₋₁ − f·pₖ₋₂.<br>Rational Root Theorem: rational roots are ±(factor of constant)/(factor of leading).<br>Remainder of p(x) ÷ (x − a)(x − b) is the line through (a, p(a)) and (b, p(b)).<br>Parabola y = ax² + bx + c: vertex at x = −b/(2a). Ellipse x²/a² + y²/b² = 1: area πab, foci at ±√(a² − b²).</div><p>Integer-coefficient polynomials: a − b divides p(a) − p(b). Pairing roots r and 1/r, or substituting y = x + 1/x, simplifies palindromic polynomials.</p>`},
 {u:'C2',n:'Advanced counting: recursion, bijections, derangements',amc12:1,body:`<div class="rule">Recursion: count strings or tilings by the last step (Fibonacci-style aₙ = aₙ₋₁ + aₙ₋₂).<br>Derangements: D₁ = 0, D₂ = 1, D₃ = 2, D₄ = 9, D₅ = 44; Dₙ = (n − 1)(Dₙ₋₁ + Dₙ₋₂).<br>Distributing n identical objects into k distinct boxes: C(n + k − 1, k − 1). Distinct objects: kⁿ.<br>Hockey stick: C(r, r) + C(r + 1, r) + … + C(n, r) = C(n + 1, r + 1).</div><p>A bijection turns a hard count into an easy one (paths ↔ binary strings, subsets ↔ yes/no choices). When symmetry is involved, count arrangements and divide by the number of equivalent copies only if every arrangement has the same number of copies.</p>`},
 {u:'G4',n:'Advanced geometry: Stewart, mass points, Ptolemy, trig areas',amc12:1,body:`<div class="rule">Stewart: for cevian AD = d with BD = m, DC = n, BC = a: b²m + c²n = a(d² + mn).<br>Area = ½ab sin C = abc/(4R) = rs.<br>Ptolemy (cyclic ABCD): AC · BD = AB · CD + AD · BC.<br>Mass points: masses inversely proportional to the segment lengths on each side.<br>Angle bisector length: d² = bc(1 − a²/(b + c)²).</div><p>For ratios of areas, share a height or a base. Chains of similar triangles often come from parallel lines or equal angles in a circle.</p>`});
UNITS.forEach(x=>UBY[x.u]=x);
UNITS.forEach(U=>{if(U.u==='S0')return;const id='B_'+U.u;if(!TBYID[id])TBYID[id]={id,mod:'r_'+U.u,gen(){return bankItem(bankPick(p=>p.u===U.u))}}});
function amcRebuild(){Object.keys(MBYID).filter(k=>k.startsWith('r_')).forEach(k=>delete MBYID[k]);MODS4.length=0;
 UNITS.forEach(U=>{const id='r_'+U.u;const probs=AB.filter(p=>p.u===U.u).sort((a,b)=>a.d-b.d);const gens=GEN_FOR[U.u]||[];const t=U.u==='S0'?['B_A1','B_N1','B_C1','B_G1','B_P1']:['B_'+U.u,'B_'+U.u,'B_'+U.u,'B_'+U.u].concat(gens.slice(0,1));
  const m={id,n:U.n,t,body:(U.amc12?'<p><span class="chip go">AMC 12</span> Beyond the AMC 10 syllabus, but it shows up on the AMC 12.</p>':'')+U.body+(probs.length?`<h3>Worked problems (${probs.length})</h3><p class="muted">Sorted from warm-up to hard. Try each one first, then open it for the full solution.</p>${probs.map(exHTML).join('')}`:'')};MODS4.push(m);MBYID[id]=m})}
amcRebuild();
amcBuild=function(level){bankRecent.clear();const u10=['A1','A2','A3','N1','N2','C1','P1','G1','G2','G3','S1'],u12=u10.concat(['A4','T1','A5','C2','G4']);const units=level===12?u12:u10;const gens=['a1','a7','a8','n4','g3','k1','a6','n2'];
 const plan=[[1,8],[2,9],[3,8]];const items=[];const used=new Set();
 plan.forEach(([d,n],idx)=>{for(let i=0;i<n;i++){if(idx===0&&i<2){const g=gens[i+Math.floor(Math.random()*6)];const it=TBYID[g].gen();it.tid=g;items.push(it);continue}
   let pool=AB.filter(p=>p.d===d&&units.includes(p.u)&&!used.has(p));if(level===12&&d>=2&&Math.random()<.4){const adv=pool.filter(p=>['A4','T1','A5','C2','G4'].includes(p.u));if(adv.length)pool=adv}
   if(!pool.length)pool=AB.filter(q=>!used.has(q)&&units.includes(q.u));const p=pick(pool);used.add(p);const it=bankItem(p);it.tid='B_'+p.u;items.push(it)}});
 return items.slice(0,25)};
const PAST=[];for(let y=2025;y>=2002;y--){if(y===2021){PAST.push(['2021 Fall AMC 10A','2021_Fall_AMC_10A_Problems'],['2021 Fall AMC 10B','2021_Fall_AMC_10B_Problems'],['2021 AMC 10A (spring)','2021_AMC_10A_Problems'],['2021 AMC 10B (spring)','2021_AMC_10B_Problems'])}else PAST.push([y+' AMC 10A',y+'_AMC_10A_Problems'],[y+' AMC 10B',y+'_AMC_10B_Problems'])}
function pastView(){setPanel(`<div class="eyebrow">Real past contests</div><h2>Official AMC 10 problems</h2><p>The real AMC 10 problems are copyrighted by the MAA, so they are not copied into the game. Every past test (with community solutions) is on the Art of Problem Solving wiki. Each link opens in a new tab.</p>
 <div class="rule"><b>How to use them with this trainer.</b> Take a real test under the 75-minute clock. Mark each miss with its unit (Algebra, Number theory, Counting, Probability, Geometry, Techniques). Drill those units here, then take the next real test. Our difficulty labels follow the real contest: warm-up ≈ problems 1–10, medium ≈ 11–18, hard ≈ 19–25.</div>
 <div class="cards">${PAST.map(([n,slug])=>`<a class="card" href="https://artofproblemsolving.com/wiki/index.php/${slug}" target="_blank" rel="noopener" style="text-decoration:none"><span class="num">↗</span><span class="nm"><b>${n}</b><span>25 problems with solutions</span></span><span class="chip go">Open</span></a>`).join('')}</div>
 <p class="muted">AMC 12 tests use the same address pattern with “12” in place of “10”.</p><div class="row"><button class="btn" id="bk2" type="button">Back</button></div>`,'wide tall');$('#bk2').onclick=amcHome}
const _amcHomeP=amcHome;amcHome=function(){_amcHomeP();const cards=UI.querySelector('.cards');if(cards){cards.insertAdjacentHTML('beforeend',`<button class="card" type="button" id="mPast"><span class="num">↗</span><span class="nm"><b>Real past AMC 10 contests</b><span>Links to every official AMC 10A/10B test (2002–2025) with solutions, and how to pair them with these units.</span></span><span class="chip go">Open</span></button>`);$('#mPast').onclick=pastView}
 const p=UI.querySelector('#ui > p');if(p)p.textContent=`${AB.length} original contest-style problems with full solutions, ${UNITS.length} lessons, generated drills, a formula sheet, and timed mocks scored 6 / 1.5 / 0.`};
function amcFormulas(){return UNITS.filter(U=>U.u!=='S0').map(U=>`<h3>${U.n}${U.amc12?' <span class="chip go">AMC 12</span>':''}</h3>${(U.body.match(/<div class="rule">[\s\S]*?<\/div>/)||[''])[0]}`).join('')}

if(EMBED){$('#bBack').hidden=false;$('#bBack').onclick=()=>mpPost('mp-close')}
