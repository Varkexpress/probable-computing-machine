 /* ---------- A1 algebra I ---------- */
 {u:'A1',d:1,q:'Pens cost $3 and notebooks cost $5. Maya spends exactly $47 and buys at least one of each. What is the greatest number of items she could have bought?',c:['11','13','14','15','16'],a:'D',s:['To maximize the count, buy as few of the expensive item as possible.','47 − 5n must be a positive multiple of 3. n = 1 gives 42 = 3·14.','14 pens + 1 notebook = 15 items.']},
 {u:'A1',d:1,q:'Two trains 300 miles apart head toward each other at 40 mph and 60 mph. A bird flies at 80 mph back and forth between them until they meet. How many miles does the bird fly?',c:['180','200','240','300','320'],a:'C',s:['Don’t sum the zig-zags. Find the time instead.','Closing speed 100 mph, so they meet after 300/100 = 3 hours.','The bird flies 80 · 3 = 240 miles.']},
 {u:'A1',d:2,q:'If x + 1/x = 5, what is x² + 1/x²?',c:['21','23','25','27','29'],a:'B',s:['Square both sides: x² + 2 + 1/x² = 25.','x² + 1/x² = 23.']},
 {u:'A1',d:2,q:'If x + 1/x = 5, what is x³ + 1/x³?',c:['100','110','115','120','125'],a:'B',s:['(x + 1/x)³ = x³ + 1/x³ + 3(x + 1/x).','125 = x³ + 1/x³ + 15, so x³ + 1/x³ = 110.']},
 {u:'A1',d:2,q:'How many liters of pure acid must be added to 12 liters of a 25% acid solution to make a 40% solution?',c:['2','2.5','3','3.6','4'],a:'C',s:['Acid now: 0.25 · 12 = 3 liters. Add x liters of pure acid.','(3 + x)/(12 + x) = 0.4 → 3 + x = 4.8 + 0.4x → 0.6x = 1.8 → x = 3.']},
 {u:'A1',d:1,q:'Working together, Al and Bo paint a fence in 6 hours. Al alone takes 10 hours. How many hours does Bo take alone?',c:['12','14','15','16','18'],a:'C',s:['Rates add: 1/6 = 1/10 + 1/b.','1/b = 1/6 − 1/10 = 1/15, so b = 15.']},
 {u:'A1',d:2,q:'The ratio of boys to girls in a class is 3 : 5. After 6 more boys join, the ratio is 1 : 1. How many students are in the class now?',c:['24','27','30','32','36'],a:'C',s:['Boys 3k, girls 5k. 3k + 6 = 5k → k = 3.','Originally 9 boys and 15 girls; now 15 and 15: 30 students.']},
 /* ---------- A2 algebra II ---------- */
 {u:'A2',d:2,q:'The roots of x² − 7x + k = 0 differ by 3. What is k?',c:['6','8','10','12','14'],a:'C',s:['Vieta: r + s = 7. With r − s = 3, r = 5 and s = 2.','k = rs = 10.']},
 {u:'A2',d:2,q:'Let r, s, t be the roots of x³ − 6x² + 11x − 6 = 0. What is r² + s² + t²?',c:['12','14','16','18','36'],a:'B',s:['Vieta: r + s + t = 6 and rs + st + tr = 11.','r² + s² + t² = (r + s + t)² − 2(rs + st + tr) = 36 − 22 = 14.']},
 {u:'A2',d:3,q:'What is the remainder when x¹⁰⁰ is divided by x² − 1?',c:['0','1','x','x + 1','2x'],a:'B',s:['Modulo x² − 1, x² ≡ 1.','x¹⁰⁰ = (x²)⁵⁰ ≡ 1. The remainder is 1. (Check: plugging x = 1 and x = −1 into x¹⁰⁰ both give 1.)']},
 {u:'A2',d:2,q:'For positive real x, what is the minimum value of x + 16/x?',c:['4','6','8','10','16'],a:'C',s:['AM-GM: x + 16/x ≥ 2√(x · 16/x) = 8.','Equality at x = 4.']},
 {u:'A2',d:1,q:'What is the minimum value of x² − 6x + 13 over all real x?',c:['3','4','5','6','13'],a:'B',s:['Complete the square: (x − 3)² + 4.','Minimum 4 at x = 3.']},
 {u:'A2',d:2,q:'What is the sum of all real solutions of |x − 3| = 2x + 6?',c:['−10','−9','−1','0','1'],a:'C',s:['Case x ≥ 3: x − 3 = 2x + 6 → x = −9, rejected (not ≥ 3).','Case x < 3: 3 − x = 2x + 6 → x = −1, valid.','Sum = −1. Always check absolute-value cases against their conditions.']},
 {u:'A2',d:3,q:'A polynomial p(x) satisfies p(1) = 3 and p(2) = 7. What is the remainder when p(x) is divided by (x − 1)(x − 2)?',c:['4x − 1','4x + 1','3x + 1','2x + 1','x + 2'],a:'A',s:['The remainder is linear: ax + b, and it agrees with p at the roots of the divisor.','a + b = 3 and 2a + b = 7 → a = 4, b = −1.','Remainder 4x − 1.']},
 /* ---------- A3 functions & sequences ---------- */
 {u:'A3',d:2,q:'a₁ = 1 and aₙ₊₁ = aₙ + 2n for n ≥ 1. What is a₁₀?',c:['81','89','91','100','110'],a:'C',s:['aₙ = 1 + 2(1 + 2 + ⋯ + (n − 1)) = 1 + n(n − 1).','a₁₀ = 1 + 90 = 91.']},
 {u:'A3',d:2,q:'What is 1/(1·2) + 1/(2·3) + ⋯ + 1/(99·100)?',c:['49/50','98/99','99/100','100/101','1'],a:'C',s:['Telescope: 1/(k(k + 1)) = 1/k − 1/(k + 1).','The sum collapses to 1 − 1/100 = 99/100.']},
 {u:'A3',d:1,q:'Let f(x) = 2x + 3. What is f(f(f(0)))?',c:['15','18','21','24','27'],a:'C',s:['f(0) = 3, f(3) = 9, f(9) = 21.']},
 {u:'A3',d:1,q:'An infinite geometric series has first term 4 and sum 12. What is its common ratio?',c:['1/4','1/3','1/2','2/3','3/4'],a:'D',s:['S = a/(1 − r): 12 = 4/(1 − r) → 1 − r = 1/3 → r = 2/3.']},
 {u:'A3',d:2,q:'For how many integers n with 1 ≤ n ≤ 100 is ⌊√n⌋ = 5?',c:['9','10','11','12','13'],a:'C',s:['⌊√n⌋ = 5 means 25 ≤ n < 36.','n = 25, …, 35: 11 integers.']},
 {u:'A3',d:3,q:'f(1) = 1, f(2) = 3, and f(n + 2) = f(n + 1) − f(n). What is f(2026)?',c:['−3','−2','−1','1','3'],a:'C',s:['List terms: 1, 3, 2, −1, −3, −2, 1, 3, … The period is 6.','2026 = 6 · 337 + 4, so f(2026) = f(4) = −1.']},
 {u:'A3',d:3,q:'A function satisfies f(x) + 2f(1 − x) = 3x for all real x. What is f(0)?',c:['−2','−1','0','1','2'],a:'E',s:['x = 0: f(0) + 2f(1) = 0. x = 1: f(1) + 2f(0) = 3.','From the first, f(0) = −2f(1). Then f(1) − 4f(1) = 3 → f(1) = −1, f(0) = 2.']},
 /* ---------- A4 exponents & logs (AMC 12) ---------- */
 {u:'A4',d:2,q:'If 2ᵃ = 3 and 3ᵇ = 16, what is ab?',c:['2','3','4','6','8'],a:'C',s:['Substitute: 16 = 3ᵇ = (2ᵃ)ᵇ = 2ᵃᵇ.','2ᵃᵇ = 2⁴, so ab = 4.']},
 {u:'A4',d:2,q:'If log₂ x + log₄ x = 6, what is x?',c:['4','8','16','32','64'],a:'C',s:['log₄ x = (log₂ x)/2.','(3/2) log₂ x = 6 → log₂ x = 4 → x = 16.']},
 {u:'A4',d:1,q:'What is log₃ 27 + log₂ (1/8) + log₅ 125?',c:['−3','0','3','6','9'],a:'C',s:['3 + (−3) + 3 = 3.']},
 {u:'A4',d:3,q:'If 8ˣ − 8ˣ⁻¹ = 112, what is x?',c:['2','7/3','5/2','8/3','3'],a:'B',s:['Factor: 8ˣ(1 − 1/8) = 112 → 8ˣ = 128.','2³ˣ = 2⁷ → x = 7/3.']},
 {u:'A4',d:2,q:'How many digits does 2³⁰ · 5²⁵ have?',c:['25','26','27','28','30'],a:'C',s:['Pair up 2s and 5s: 2³⁰ · 5²⁵ = 2⁵ · 10²⁵ = 32 · 10²⁵.','That is 32 followed by 25 zeros: 27 digits.']},
 {u:'A4',d:2,q:'If a, b, c > 1, what is log_a b · log_b c · log_c a?',c:['0','1','abc','a + b + c','cannot be determined'],a:'B',s:['Change of base: (ln b/ln a)(ln c/ln b)(ln a/ln c) = 1.']},
 /* ---------- N1 number theory I ---------- */
 {u:'N1',d:2,q:'How many positive divisors of 720 are perfect squares?',c:['4','5','6','8','9'],a:'C',s:['720 = 2⁴ · 3² · 5.','A square divisor uses even exponents: 2 ∈ {0, 2, 4}, 3 ∈ {0, 2}, 5 ∈ {0}.','3 · 2 · 1 = 6.']},
 {u:'N1',d:2,q:'What is the smallest positive integer with exactly 10 positive divisors?',c:['36','48','60','72','80'],a:'B',s:['10 = 10 or 5 · 2, so n = p⁹ or p⁴q.','Smallest: 2⁴ · 3 = 48 (2⁹ = 512 is bigger).']},
 {u:'N1',d:3,q:'What is gcd(2²⁴ − 1, 2¹⁸ − 1)?',c:['3','7','15','63','255'],a:'D',s:['gcd(2ᵃ − 1, 2ᵇ − 1) = 2^gcd(a, b) − 1.','gcd(24, 18) = 6, so the answer is 2⁶ − 1 = 63.']},
 {u:'N1',d:2,q:'For how many integers n with 1 ≤ n ≤ 100 is n² + 1 divisible by 5?',c:['20','25','40','50','60'],a:'C',s:['Check n mod 5: n² ≡ 0, 1, 4, 4, 1 for n ≡ 0, 1, 2, 3, 4.','n² + 1 ≡ 0 needs n² ≡ 4: n ≡ 2 or 3 (mod 5).','2 out of every 5: 40.']},
 {u:'N1',d:1,q:'What is the sum of all positive divisors of 36?',c:['55','78','90','91','108'],a:'D',s:['36 = 2² · 3². σ = (1 + 2 + 4)(1 + 3 + 9) = 7 · 13 = 91.']},
 {u:'N1',d:1,q:'Two positive integers have gcd 4 and lcm 120. What is their product?',c:['120','124','240','480','960'],a:'D',s:['gcd · lcm = product: 4 · 120 = 480.']},
 /* ---------- N2 number theory II ---------- */
 {u:'N2',d:2,q:'What is the remainder when 3¹⁰⁰ is divided by 7?',c:['1','2','3','4','5'],a:'D',s:['3⁶ ≡ 1 (mod 7) (Fermat).','100 = 6 · 16 + 4, so 3¹⁰⁰ ≡ 3⁴ = 81 ≡ 4.']},
 {u:'N2',d:2,q:'What are the last two digits of 7²⁰²⁶?',c:['01','07','43','49','57'],a:'D',s:['7⁴ = 2401 ≡ 01 (mod 100).','2026 = 4 · 506 + 2, so 7²⁰²⁶ ≡ 7² = 49.']},
 {u:'N2',d:2,q:'What is the smallest positive integer that leaves remainder 2 when divided by 3, 3 when divided by 5, and 2 when divided by 7?',c:['23','38','53','68','83'],a:'A',s:['≡ 2 mod 3 and mod 7 means ≡ 2 mod 21: 2, 23, 44, …','23 ≡ 3 (mod 5). Answer 23. (Chinese Remainder Theorem.)']},
 {u:'N2',d:3,q:'The four-digit number 3A5B is divisible by 36. What is the largest possible value of A + B?',c:['1','8','9','10','17'],a:'D',s:['Divisible by 4: 5B ∈ {52, 56}, so B = 2 or 6.','Divisible by 9: 3 + A + 5 + B ≡ 0 → A + B ≡ 1 (mod 9) → A + B = 1 or 10.','B = 2, A = 8 or B = 6, A = 4 both give 10. A + B = 1 is impossible with B ≥ 2.']},
 {u:'N2',d:1,q:'In base b, the number 123_b equals 66 in base ten. What is b?',c:['5','6','7','8','9'],a:'C',s:['b² + 2b + 3 = 66 → b² + 2b − 63 = 0 → (b + 9)(b − 7) = 0 → b = 7.']},
 {u:'N2',d:3,q:'What is the remainder when 2²⁰²⁶ is divided by 13?',c:['1','3','8','10','12'],a:'D',s:['Fermat: 2¹² ≡ 1 (mod 13). 2026 = 12 · 168 + 10.','2¹⁰ = 1024 = 13 · 78 + 10. Remainder 10.']},
 /* ---------- C1 counting ---------- */
 {u:'C1',d:1,q:'How many distinct arrangements of the letters of LEVEL are there?',c:['20','24','30','60','120'],a:'C',s:['5 letters with L twice and E twice: 5!/(2! · 2!) = 30.']},
 {u:'C1',d:2,q:'A committee of 4 is chosen from 6 men and 5 women. How many committees include at least one woman?',c:['300','310','315','320','330'],a:'C',s:['Complement: all committees minus all-men committees.','C(11, 4) − C(6, 4) = 330 − 15 = 315.']},
 {u:'C1',d:2,q:'How many integers from 1 to 1000 are divisible by none of 2, 3, or 5?',c:['264','266','268','270','272'],a:'B',s:['Inclusion–exclusion for “divisible by at least one”: 500 + 333 + 200 − 166 − 100 − 66 + 33 = 734.','1000 − 734 = 266.']},
 {u:'C1',d:2,q:'How many ordered triples of positive integers (a, b, c) satisfy a + b + c = 12?',c:['45','55','66','78','91'],a:'B',s:['Stars and bars for positive solutions: C(12 − 1, 3 − 1) = C(11, 2) = 55.']},
 {u:'C1',d:2,q:'How many shortest lattice paths go from (0, 0) to (4, 3) moving only right or up, without passing through (2, 1)?',c:['15','16','17','18','20'],a:'C',s:['All paths: C(7, 3) = 35.','Through (2, 1): C(3, 1) · C(4, 2) = 3 · 6 = 18.','35 − 18 = 17.']},
 {u:'C1',d:2,q:'How many four-digit numbers have digits that are strictly increasing from left to right?',c:['120','126','210','252','3024'],a:'B',s:['0 cannot appear (it would have to be first). Any 4 digits from 1–9 can be arranged increasingly in exactly one way.','C(9, 4) = 126.']},
 {u:'C1',d:3,q:'In how many ways can 8 people sit around a round table if two particular people must sit next to each other? (Rotations are the same.)',c:['720','1440','2880','5040','10080'],a:'B',s:['Glue the pair into one unit: 7 units around a circle → (7 − 1)! = 720.','The pair can be ordered 2 ways: 1440.']},
 /* ---------- P1 probability ---------- */
 {u:'P1',d:1,q:'Three fair dice are rolled. What is the probability that the sum is 4?',c:['1/216','1/108','1/72','1/54','1/36'],a:'C',s:['Only (1, 1, 2) in some order: 3 outcomes out of 216.','3/216 = 1/72.']},
 {u:'P1',d:1,q:'Two cards are drawn from a standard 52-card deck without replacement. What is the probability that both are hearts?',c:['1/26','1/17','1/16','1/13','1/4'],a:'B',s:['(13/52)(12/51) = (1/4)(4/17) = 1/17.']},
 {u:'P1',d:2,q:'A fair die is rolled until a 6 appears. What is the expected number of rolls?',c:['3','5','6','7','36'],a:'C',s:['A geometric wait with success probability p has expected value 1/p.','1/(1/6) = 6.']},
 {u:'P1',d:2,q:'A point is chosen uniformly at random in the square with corners (0, 0) and (2, 2). What is the probability that x + y < 1?',c:['1/16','1/8','1/4','1/3','1/2'],a:'B',s:['The region x + y < 1 in the square is a right triangle with legs 1: area 1/2.','Square area 4. Probability (1/2)/4 = 1/8.']},
 {u:'P1',d:1,q:'Four fair coins are flipped. What is the probability of exactly two heads?',c:['1/4','5/16','3/8','1/2','5/8'],a:'C',s:['C(4, 2)/2⁴ = 6/16 = 3/8.']},
 {u:'P1',d:3,q:'A fair coin is flipped until two heads in a row appear. What is the expected number of flips?',c:['4','5','6','7','8'],a:'C',s:['States: E₀ = no progress, E₁ = last flip was H.','E₀ = 1 + ½E₁ + ½E₀ and E₁ = 1 + ½ · 0 + ½E₀.','Solving: E₁ = 1 + E₀/2, E₀ = 2 + E₁ = 3 + E₀/2 → E₀ = 6.']},
 {u:'P1',d:2,q:'A bag has 3 red and 2 blue marbles. Two are drawn without replacement. What is the probability they are different colors?',c:['2/5','1/2','3/5','2/3','3/4'],a:'C',s:['Different-color pairs: 3 · 2 = 6. All pairs: C(5, 2) = 10.','6/10 = 3/5.']},
 /* ---------- G1 geometry I ---------- */
 {u:'G1',d:1,q:'A right triangle has legs 20 and 21. What is the hypotenuse?',c:['27','28','29','30','31'],a:'C',s:['√(400 + 441) = √841 = 29. (20-21-29 is a Pythagorean triple worth memorizing.)']},
 {u:'G1',d:1,q:'In △ABC, AB = AC and ∠A = 40°. AD bisects ∠A and meets BC at D. What is ∠ADB?',c:['70°','80°','90°','100°','110°'],a:'C',s:['In an isosceles triangle, the bisector of the vertex angle is also the perpendicular bisector of the base.','So ∠ADB = 90°.']},
 {u:'G1',d:2,q:'In △ABC, D is on AB and E is on AC with DE ∥ BC. AD = 4, DB = 6, and the area of △ADE is 8. What is the area of trapezoid DBCE?',c:['34','40','42','48','50'],a:'C',s:['△ADE ~ △ABC with ratio 4/10 = 2/5, so areas scale by 4/25.','Area of △ABC = 8 · 25/4 = 50. Trapezoid = 50 − 8 = 42.']},
 {u:'G1',d:1,q:'Each interior angle of a regular polygon measures 156°. How many sides does it have?',c:['12','13','14','15','18'],a:'D',s:['Each exterior angle is 180 − 156 = 24°, and exterior angles sum to 360°.','360/24 = 15.']},
 {u:'G1',d:2,q:'What is the inradius of a triangle with sides 5, 12, 13?',c:['1','3/2','2','5/2','3'],a:'C',s:['r = Area/s = 30/15 = 2. (For a right triangle, also r = (a + b − c)/2 = (5 + 12 − 13)/2 = 2.)']},
 {u:'G1',d:2,q:'What is the area of a triangle with sides 7, 8, and 9?',c:['24','12√5','28','20√2','18√3'],a:'B',s:['Heron: s = 12. Area = √(12 · 5 · 4 · 3) = √720 = 12√5.']},
 {u:'G1',d:2,q:'In △ABC, AB = 6, AC = 9, BC = 10. The bisector of ∠A meets BC at D. What is BD?',c:['3','4','9/2','5','6'],a:'B',s:['Angle Bisector Theorem: BD/DC = AB/AC = 6/9 = 2/3.','BD = 10 · 2/5 = 4.']},
 /* ---------- G2 circles ---------- */
 {u:'G2',d:1,q:'Chords AB and CD of a circle intersect at P. AP = 4, PB = 6, CP = 3. What is PD?',c:['6','7','8','9','12'],a:'C',s:['Power of a Point: AP · PB = CP · PD → 24 = 3 · PD → PD = 8.']},
 {u:'G2',d:2,q:'From a point P outside a circle, a tangent segment PT has length 12. A secant from P through the center meets the circle first at A with PA = 8. What is the radius?',c:['4','5','6','8','10'],a:'B',s:['Power of a Point: PT² = PA · PB → 144 = 8 · PB → PB = 18.','AB is a diameter: 18 − 8 = 10, so r = 5.']},
 {u:'G2',d:1,q:'The central angle ∠AOB measures 110°. Point C is on the major arc. What is ∠ACB?',c:['35°','55°','70°','110°','125°'],a:'B',s:['An inscribed angle is half the central angle on the same arc: 110/2 = 55°.']},
 {u:'G2',d:3,q:'A circle is inscribed in a square of side 10. A smaller circle sits in one corner, tangent to two sides of the square and to the big circle. What is its radius?',c:['5 − 3√2','15 − 10√2','3 − √2','5√2 − 5','10√2 − 10'],a:'B',s:['Big circle: center (5, 5), radius 5. Small circle: center (t, t), radius t.','Distance between centers = 5 + t: √2(5 − t) = 5 + t.','t = 5(√2 − 1)/(√2 + 1) = 5(√2 − 1)² = 15 − 10√2.']},
 {u:'G2',d:1,q:'ABCD is a cyclic quadrilateral with ∠A = 3∠C. What is ∠A?',c:['45°','90°','120°','135°','150°'],a:'D',s:['Opposite angles of a cyclic quadrilateral are supplementary: ∠A + ∠C = 180°.','4∠C = 180 → ∠C = 45°, ∠A = 135°.']},
 /* ---------- G3 coordinate & 3D ---------- */
 {u:'G3',d:2,q:'What is the distance from the point (1, 2) to the line 3x + 4y − 21 = 0?',c:['1','2','3','4','5'],a:'B',s:['Distance = |3(1) + 4(2) − 21|/√(3² + 4²) = 10/5 = 2.']},
 {u:'G3',d:2,q:'What is the area of the quadrilateral with vertices (0, 0), (4, 0), (5, 3), (1, 4)?',c:['12','13','29/2','15','16'],a:'C',s:['Shoelace: ½|0·0 − 4·0 + 4·3 − 5·0 + 5·4 − 1·3 + 1·0 − 0·4| = ½ · 29 = 29/2.']},
 {u:'G3',d:2,q:'A cube has edge 6. What is the distance from a vertex to the center of the opposite face?',c:['6','3√5','3√6','6√2','9'],a:'C',s:['Vertex (0, 0, 0); opposite face z = 6 with center (3, 3, 6).','√(9 + 9 + 36) = √54 = 3√6.']},
 {u:'G3',d:1,q:'A cone has radius 3 and slant height 5. What is its volume?',c:['9π','12π','15π','36π','45π'],a:'B',s:['Height = √(5² − 3²) = 4. V = ⅓πr²h = ⅓π · 9 · 4 = 12π.']},
 {u:'G3',d:2,q:'Lines through (2, 3) with slopes 2 and −1/2 form a triangle with the x-axis. What is its area?',c:['9','10','45/4','12','15'],a:'C',s:['Slope 2 meets y = 0 at x = 2 − 3/2 = 1/2. Slope −1/2 meets it at x = 2 + 6 = 8.','Base 15/2, height 3: area = ½ · 15/2 · 3 = 45/4.']},
 {u:'G3',d:1,q:'What is the radius of the circle x² + y² − 6x + 8y = 0?',c:['3','4','5','6','25'],a:'C',s:['Complete squares: (x − 3)² + (y + 4)² = 25. Radius 5.']},
 /* ---------- T1 trig & complex (AMC 12) ---------- */
 {u:'T1',d:1,q:'A triangle has sides 5 and 8 with a 60° angle between them. What is the third side?',c:['6','7','8','√79','9'],a:'B',s:['Law of Cosines: c² = 25 + 64 − 2·5·8·cos 60° = 89 − 40 = 49 → c = 7.']},
 {u:'T1',d:2,q:'If sin x + cos x = 1/2, what is sin 2x?',c:['−3/4','−1/2','−1/4','1/4','3/4'],a:'A',s:['Square: sin²x + 2 sin x cos x + cos²x = 1/4 → 1 + sin 2x = 1/4.','sin 2x = −3/4.']},
 {u:'T1',d:2,q:'What is (1 + i)¹⁰?',c:['−32','32','−32i','32i','1024'],a:'D',s:['(1 + i)² = 2i. So (1 + i)¹⁰ = (2i)⁵ = 32 i⁵ = 32i.']},
 {u:'T1',d:3,q:'What is the product of all complex solutions of z⁵ = 32?',c:['−32','−2','0','2','32'],a:'E',s:['z⁵ − 32 = 0 has degree 5. Product of roots = (−1)⁵ · (−32)/1 = 32.']},
 {u:'T1',d:2,q:'In △ABC, ∠A = 30° and BC = 6. What is the circumradius?',c:['3','3√3','6','6√3','12'],a:'C',s:['Extended Law of Sines: a/sin A = 2R → 6/(1/2) = 12 = 2R → R = 6.']},
 {u:'T1',d:3,q:'A complex number z satisfies z + 1/z = 1. What is z³?',c:['−1','0','1','i','−i'],a:'A',s:['z² − z + 1 = 0. Multiply by (z + 1): z³ + 1 = 0.','z³ = −1.']},
 {u:'T1',d:2,q:'If tan θ = 2, what is sin θ cos θ?',c:['1/5','2/5','1/2','3/5','4/5'],a:'B',s:['sin θ cos θ = tan θ/(1 + tan²θ) = 2/5. (Or use a right triangle with legs 1 and 2, hypotenuse √5.)']},
 /* ---------- S1 techniques ---------- */

const UNITS=[
 {u:'S0',n:'AMC 10/12: format, scoring, and strategy',amc12:0,body:`<div class="rule">AMC 10 and AMC 12: 25 multiple-choice problems, 75 minutes, choices (A)–(E). Scoring: 6 per correct answer, 1.5 per blank, 0 per wrong answer (maximum 150). No calculators.</div>
 <p><b>AMC 10</b> covers material through about 10th grade: algebra, number theory, counting and probability, and geometry, with no trigonometry, logarithms, or complex numbers needed. <b>AMC 12</b> adds those, plus harder polynomials, sequences, and 3D geometry. This training covers both; units marked <span class="chip go">AMC 12</span> go beyond the AMC 10.</p>
 <h3>How to train</h3><p>1. Read a unit’s lesson and learn its key facts. 2. Work the example problems without looking, then read every step. 3. Drill the unit until you can do its problems quickly. 4. Take full mocks under the 75-minute clock. 5. Review every miss: write down the idea you lacked.</p>
 <h3>Test-day strategy</h3><p>Problems 1–10 are usually quick; do them carefully, since each miss costs 6. On problems 11–20, read everything and pick the ones that click. Use the choices: plug them in, estimate, check parity or divisibility. A blank is worth 1.5, so guessing pays only if you can eliminate at least two choices. Save 10 minutes to re-check easy problems.</p>`},
 {u:'A1',n:'Algebra I: equations, rates, and clever substitutions',body:`<div class="rule">Rates add (work, speed). Distance = rate × time. Mixtures: track the amount of the pure substance. Weighted average = total ÷ count.</div><p><b>Key tricks:</b> x + 1/x = k gives x² + 1/x² = k² − 2 and x³ + 1/x³ = k³ − 3k. In optimization with integer constraints, push the expensive item to its minimum. Avoid summing infinite back-and-forth motion: compute the total time.</p><p><b>Traps:</b> percent of what? Ratios after a change: set up variables for the originals.</p>`},
 {u:'A2',n:'Algebra II: quadratics, Vieta, polynomials, inequalities',body:`<div class="rule">Vieta (x² + bx + c): r + s = −b, rs = c.<br>Cubic x³ + ax² + bx + c: r + s + t = −a, rs + st + tr = b, rst = −c.<br>r² + s² + t² = (Σr)² − 2Σrs.<br>Remainder Theorem: p(x) mod (x − a) = p(a).<br>AM-GM: (a + b)/2 ≥ √(ab), equality when a = b.</div><p>Complete the square to find minimums. For absolute value equations, split into cases and check each answer against its case condition.</p>`},
 {u:'A3',n:'Functions, sequences, and series',body:`<div class="rule">Arithmetic: aₙ = a₁ + (n − 1)d, Sₙ = n(a₁ + aₙ)/2. Geometric: aₙ = a₁rⁿ⁻¹, infinite sum a/(1 − r) for |r| < 1.<br>Telescoping: 1/(k(k + 1)) = 1/k − 1/(k + 1).<br>Floor: ⌊x⌋ = n ⇔ n ≤ x < n + 1.</div><p>Recursions on contests are usually periodic or have a closed form: write out the first 8–10 terms. For functional equations, plug in special values (0, 1, and x ↦ 1 − x) to get a system.</p>`},
 {u:'A4',n:'Exponents and logarithms',amc12:1,body:`<div class="rule">log_b(xy) = log_b x + log_b y · log_b(xⁿ) = n log_b x · change of base: log_b x = log x / log b · log_b a · log_a b = 1.<br>Digits of N = ⌊log₁₀ N⌋ + 1.</div><p>Rewrite everything in a common base. Factor common powers: aˣ − aˣ⁻¹ = aˣ(1 − 1/a). Pair 2s with 5s to make powers of 10.</p>`},
 {u:'N1',n:'Number theory I: primes, divisors, gcd and lcm',body:`<div class="rule">n = p^a q^b ⋯ has (a + 1)(b + 1)⋯ divisors, divisor sum (1 + p + ⋯ + p^a)(1 + q + ⋯ + q^b)⋯.<br>gcd · lcm = product of the two numbers.<br>gcd(2ᵃ − 1, 2ᵇ − 1) = 2^gcd(a,b) − 1.</div><p>Count square divisors by restricting to even exponents. To find the smallest number with k divisors, factor k and give the largest exponents to the smallest primes.</p>`},
 {u:'N2',n:'Number theory II: modular arithmetic, CRT, bases',body:`<div class="rule">Fermat’s Little Theorem: a^(p−1) ≡ 1 (mod p) for prime p not dividing a.<br>Divisibility: 4 (last two digits), 8 (last three), 9 and 3 (digit sum), 11 (alternating sum).<br>Base b: d₂d₁d₀ = d₂b² + d₁b + d₀.</div><p>Find a cycle for last digits (mod 10 or mod 100). For simultaneous congruences (CRT), combine two at a time and list candidates.</p>`},
 {u:'C1',n:'Counting: permutations, combinations, PIE, stars and bars',body:`<div class="rule">Arrangements with repeats: n!/(a! b! ⋯). Circular arrangements: (n − 1)!.<br>Stars and bars: nonnegative solutions to x₁ + ⋯ + x_k = n: C(n + k − 1, k − 1); positive: C(n − 1, k − 1).<br>PIE: |A ∪ B ∪ C| = Σ|A| − Σ|A ∩ B| + |A ∩ B ∩ C|.<br>Lattice paths: C(right + up, up).</div><p>“At least one” → complement. “Must sit together” → glue them into a block. Increasing digits → choose a set; order is forced.</p>`},
 {u:'P1',n:'Probability and expected value',body:`<div class="rule">P = favorable/total (equally likely outcomes). Independent events multiply.<br>Expected value is linear: E[X + Y] = E[X] + E[Y], even when X and Y are dependent.<br>Waiting for an event with probability p: expected 1/p trials.</div><p>For “until” problems, set up states and equations (E₀, E₁, …). For geometric probability, compare areas or lengths.</p>`},
 {u:'G1',n:'Geometry I: triangles, similarity, areas, angles',body:`<div class="rule">Triples: 3-4-5, 5-12-13, 8-15-17, 7-24-25, 20-21-29. 30-60-90: 1 : √3 : 2. 45-45-90: 1 : 1 : √2.<br>Heron: √(s(s−a)(s−b)(s−c)). Area = rs (r = inradius). Angle Bisector Theorem: BD/DC = AB/AC.<br>Similar figures: lengths × k, areas × k², volumes × k³.</div><p>Polygon interior sum 180(n − 2). Exterior angles sum to 360. Compute an area two ways to find a length (altitude to the hypotenuse = ab/c).</p>`},
 {u:'G2',n:'Geometry II: circles',body:`<div class="rule">Inscribed angle = ½ intercepted arc. Opposite angles of a cyclic quadrilateral sum to 180°.<br>Power of a Point: chords AP·PB = CP·PD; tangent PT² = PA·PB.<br>A tangent is perpendicular to the radius at the point of tangency.</div><p>Draw radii to tangent points and to intersection points. For circles tangent to each other, the distance between centers is the sum (or difference) of radii.</p>`},
 {u:'G3',n:'Coordinate and 3D geometry',body:`<div class="rule">Distance from (x₀, y₀) to ax + by + c = 0: |ax₀ + by₀ + c|/√(a² + b²).<br>Shoelace area. Circle: complete the square.<br>Space diagonal √(a² + b² + c²). Cone/pyramid volume ⅓·base·height. Sphere ⁴⁄₃πr³, surface 4πr².</div><p>Put figures on axes to turn geometry into algebra. In 3D, use coordinates for the vertices of cubes and boxes.</p>`},
 {u:'T1',n:'Trigonometry and complex numbers',amc12:1,body:`<div class="rule">Law of Cosines c² = a² + b² − 2ab cos C. Law of Sines a/sin A = 2R.<br>sin 2x = 2 sin x cos x; sin²x + cos²x = 1.<br>Complex: i² = −1, (1 + i)² = 2i, De Moivre (cos θ + i sin θ)ⁿ = cos nθ + i sin nθ. Roots of zⁿ = c sit on a circle; their product is (−1)ⁿ⁺¹c (for zⁿ − c).</div><p>Squaring sin x + cos x gives sin 2x. z + 1/z = 2cos θ for |z| = 1. Multiply by (z + 1) or (z − 1) to recognize roots of unity.</p>`},
 {u:'S1',n:'Problem-solving techniques: invariants, symmetry, pigeonhole',body:`<p><b>Invariants:</b> find a quantity that changes predictably (sum, parity, coloring). <b>Symmetry:</b> each digit appears equally often in each place. <b>Pigeonhole:</b> n + 1 objects in n boxes force a repeat. <b>Casework:</b> organize by the most restrictive condition. <b>Estimation:</b> compare logs to rank huge numbers.</p><p>When stuck: try small cases, draw a picture, work backwards from the answer choices.</p>`}];

function amcBuild(level){bankRecent.clear();const u10=['A1','A2','A3','N1','N2','C1','P1','G1','G2','G3','S1'],u12=u10.concat(['A4','T1']);const units=level===12?u12:u10;const gens=['a1','a7','a8','n4','g3','k1','a6','n2','a2','n1','n3','k3','g4','g6','k2'];

 want.forEach(([d,n],idx)=>{for(let i=0;i<n;i++){if((d===1&&i<3)||(d===2&&i<3)){const g=gens[(idx*5+i)%gens.length];const it=TBYID[g].gen();it.tid=g;items.push(it);continue}

 return items.slice(0,25)}

AB.push(
 {u:'A1',d:1,q:'In a chess club the ratio of boys to girls is 5 : 7. There are 12 more girls than boys. How many members does the club have?',c:['48','60','66','72','84'],a:'D',s:['Write the counts as 5k boys and 7k girls for some positive integer k.','The difference 7k − 5k = 2k equals 12, so k = 6.','The total is 12k = 72.']},
 {u:'A1',d:1,q:'Real numbers x and y satisfy 3x + 5y = 47 and 5x + 3y = 49. What is x² − y²?',c:['1','11','12','13','24'],a:'C',s:['Rather than solving for x and y, add and subtract the equations.','Adding gives 8x + 8y = 96, so x + y = 12; subtracting gives 2x − 2y = 2, so x − y = 1.','Factor x² − y² = (x + y)(x − y) = 12 · 1 = 12.']},
 {u:'A1',d:2,q:'Working together, Avery and Blake can paint a fence in 10 days, Blake and Casey can paint it in 12 days, and Avery and Casey can paint it in 15 days. How many days would Avery need to paint the fence alone?',c:['20','24','30','40','48'],a:'B',s:['Let a, b, c be the fractions of the fence each person paints per day, so a + b = 1/10, b + c = 1/12, a + c = 1/15.','Adding all three: 2(a + b + c) = 1/10 + 1/12 + 1/15 = 1/4, so a + b + c = 1/8.','Subtract b + c: a = 1/8 − 1/12 = 1/24, so Avery alone needs 24 days.']},
 {u:'A1',d:2,q:'A jug holds a mixture that is 30% alcohol. A certain fraction of the mixture is poured out and replaced with water, and then the same fraction of the new mixture is poured out and replaced with water. The jug is now 19.2% alcohol. What fraction was poured out each time?',c:['1/10','1/6','1/5','1/4','9/25'],a:'C',s:['Each replacement keeps a fraction 1 − f of the alcohol, so after two rounds the concentration is 30%·(1 − f)².','Set 0.30(1 − f)² = 0.192, so (1 − f)² = 0.64.','Then 1 − f = 0.8, giving f = 1/5.']},
 {u:'A1',d:2,q:'Museum tickets cost $7 for an adult and $4 for a child. A group that includes at least one adult and at least one child spends exactly $100 on tickets. What is the sum of all possible numbers of people in the group?',c:['38','41','54','57','60'],a:'D',s:['With a adults and c children, 7a + 4c = 100 with a, c ≥ 1.','Reducing mod 4, 7a ≡ 0, so a is a multiple of 4: a = 4, 8, or 12 (a = 16 is too large).','These give c = 18, 11, 4 and group sizes 22, 19, 16.','The sum of the possible sizes is 22 + 19 + 16 = 57.']},
 {u:'A1',d:2,q:'Mira walks up an upward-moving escalator and takes 20 steps to reach the top. The next day she walks up the same escalator, moving at the same speed as before, but steps twice as quickly and takes 32 steps. How many steps are visible on the escalator?',c:['64','72','80','88','96'],a:'C',s:['Let N be the number of visible steps and r the ratio of the escalator’s speed to Mira’s first stepping rate.','On day one the escalator moves 20r steps while she takes 20, so N = 20 + 20r.','On day two her time is 32/2 = 16 of her day-one step-times, so N = 32 + 16r.','Equating gives 4r = 12, r = 3, and N = 80.']},
 {u:'A1',d:3,q:'Ava and Ben start at the same moment from opposite ends A and B of a straight 600-meter path and run toward each other, each at a constant speed. Whenever a runner reaches an end of the path, that runner immediately turns around. They first meet 240 meters from A. How far from A are they when they meet for the second time?',c:['120','240','360','400','480'],a:'E',s:['At the first meeting the two runners together have covered one path length, and Ava’s share is 240 meters.','At the second meeting they have together covered three path lengths, so Ava has run 3 · 240 = 720 meters.','Ava ran 600 meters to B and then 120 meters back, so the second meeting is 600 − 120 = 480 meters from A.']},
 {u:'A1',d:3,q:'Flask P holds 10 liters of a 20% salt solution and flask Q holds 15 liters of a 50% salt solution. The same volume x liters is taken from each flask at the same time, and the portion taken from each is poured into the other flask. Afterward the two flasks have the same salt concentration. What is x?',c:['4','5','6','15/2','9'],a:'C',s:['If the concentrations end up equal, each must equal the overall concentration (2 + 7.5)/25 = 38%.','Flask P still holds 10 liters, so it must contain 3.8 liters of salt.','Its salt is 2 − 0.2x + 0.5x = 2 + 0.3x, so 0.3x = 1.8 and x = 6.']},
 {u:'A1',d:3,q:'A rancher spends exactly $100 to buy exactly 100 animals: cows cost $5 each, pigs $2 each, and chickens 25 cents each. She buys at least one animal of each kind. What is the greatest possible number of chickens she buys?',c:['64','70','72','76','80'],a:'D',s:['With c cows, p pigs, h chickens: c + p + h = 100 and 20c + 8p + h = 400 (prices in quarters).','Subtracting eliminates h: 19c + 7p = 300.','Mod 7 this gives 5c ≡ 6, so c ≡ 4 (mod 7); c = 4 gives p = 32, c = 11 gives p = 13, and c = 18 is too large.','The chicken counts are 64 and 76, so the greatest is 76.']},
 {u:'A1',d:3,q:'Positive real numbers x, y, z satisfy x + y + xy = 11, y + z + yz = 14, and z + x + zx = 19. What is x + y + z?',c:['6','8','9','10','12'],a:'C',s:['Add 1 to each equation to factor: (x + 1)(y + 1) = 12, (y + 1)(z + 1) = 15, (z + 1)(x + 1) = 20.','Let X = x + 1, Y = y + 1, Z = z + 1; multiplying gives (XYZ)² = 3600, so XYZ = 60 since all are positive.','Then X = 60/15 = 4, Y = 60/20 = 3, Z = 60/12 = 5, so x, y, z = 3, 2, 4.','Thus x + y + z = 9.']},
 {u:'A1',d:3,q:'For each of five numbers, the average of the other four numbers is computed. The five averages obtained are 13, 15, 17, 19, and 21. What is the largest of the five original numbers?',c:['21','29','33','37','45'],a:'C',s:['Let S be the sum of the five numbers; the average of the others for number xᵢ is (S − xᵢ)/4.','Adding all five averages gives (5S − S)/4 = S, so S = 13 + 15 + 17 + 19 + 21 = 85.','Each number is xᵢ = S − 4·(its average), so the largest corresponds to the smallest average: 85 − 4·13 = 33.']},
 {u:'A2',d:1,q:'What is the minimum value of x² + y² − 6x + 10y + 40 over all real numbers x and y?',c:['0','6','34','40','74'],a:'B',s:['Complete the square in each variable: x² − 6x = (x − 3)² − 9 and y² + 10y = (y + 5)² − 25.','The expression becomes (x − 3)² + (y + 5)² + 6.','Squares are at least 0, with equality at x = 3, y = −5, so the minimum is 6.']},
 {u:'A2',d:1,q:'How many integers n satisfy (n² − 9)(n² − 49) < 0?',c:['3','5','6','7','12'],a:'C',s:['A product of two factors is negative when they have opposite signs; since n² − 9 > n² − 49, we need n² − 9 > 0 > n² − 49.','So 9 < n² < 49, meaning n² ∈ {16, 25, 36}.','That gives n = ±4, ±5, ±6, a total of 6 integers.']},
 {u:'A2',d:2,q:'When the polynomial P(x) is divided by x − 1 the remainder is 5, and when it is divided by x + 2 the remainder is −4. What is the remainder when P(x) is divided by (x − 1)(x + 2)?',c:['x + 4','2x + 3','3x + 2','3x − 2','−3x + 8'],a:'C',s:['Dividing by a quadratic leaves a linear remainder, so P(x) = (x − 1)(x + 2)Q(x) + ax + b.','By the remainder theorem, P(1) = a + b = 5 and P(−2) = −2a + b = −4.','Subtracting gives 3a = 9, so a = 3 and b = 2; the remainder is 3x + 2.']},
 {u:'A2',d:2,q:'What is the minimum value of (x + 4)(x + 9)/x for x > 0?',c:['13','24','25','26','36'],a:'C',s:['Expand and divide: (x + 4)(x + 9)/x = x + 36/x + 13.','By AM-GM, x + 36/x ≥ 2√36 = 12, with equality at x = 6.','So the minimum is 12 + 13 = 25.']},
 {u:'A2',d:2,q:'A monic polynomial P(x) of degree 4 satisfies P(1) = 2, P(2) = 4, P(3) = 6, and P(4) = 8. What is P(6)?',c:['12','120','128','132','144'],a:'D',s:['The polynomial Q(x) = P(x) − 2x vanishes at x = 1, 2, 3, 4.','Since P is monic of degree 4, Q(x) = (x − 1)(x − 2)(x − 3)(x − 4).','Then P(6) = 12 + 5·4·3·2 = 12 + 120 = 132.']},
 {u:'A2',d:2,q:'For how many integers k does the equation x² − kx + 2k = 0 have two integer roots (not necessarily distinct)?',c:['2','3','4','5','6'],a:'C',s:['If the roots are r and s, Vieta gives r + s = k and rs = 2k, so rs = 2(r + s).','Rearrange and factor (Simon’s trick): rs − 2r − 2s + 4 = 4, so (r − 2)(s − 2) = 4.','The factor pairs of 4 give {r, s} = {3, 6}, {4, 4}, {1, −2}, {0, 0}, so k = 9, 8, −1, 0.','That is 4 values of k.']},
 {u:'A2',d:3,q:'Let a, b, c be the roots of x³ − 5x² + 3x + 7 = 0. What is 1/a² + 1/b² + 1/c²?',c:['9/49','19/49','61/49','79/49','19/7'],a:'D',s:['By Vieta, a + b + c = 5, ab + bc + ca = 3, and abc = −7.','The reciprocals have sum (ab + bc + ca)/abc = −3/7 and pairwise-product sum (a + b + c)/abc = −5/7.','So 1/a² + 1/b² + 1/c² = (−3/7)² − 2(−5/7) = 9/49 + 70/49 = 79/49.']},
 {u:'A2',d:3,q:'Positive real numbers a and b satisfy a + 2b = 1. What is the minimum possible value of 1/a + 2/b?',c:['3 + 2√2','6','8','9','5 + 4√2'],a:'D',s:['Multiply by the constraint, which equals 1: 1/a + 2/b = (1/a + 2/b)(a + 2b).','Expanding gives 1 + 2b/a + 2a/b + 4 = 5 + 2(a/b + b/a).','By AM-GM, a/b + b/a ≥ 2, with equality when a = b = 1/3.','So the minimum is 5 + 4 = 9.']},
 {u:'A2',d:3,q:'For some real number k, all three roots of x³ − 12x² + kx − 64 = 0 are positive real numbers. What is k?',c:['36','44','48','52','64'],a:'C',s:['By Vieta, the roots have sum 12 and product 64.','Their arithmetic mean is 4 and their geometric mean is ∛64 = 4, so AM-GM holds with equality.','Equality forces all three roots to equal 4, so the polynomial is (x − 4)³ = x³ − 12x² + 48x − 64.','Hence k = 48.']},
 {u:'A2',d:3,q:'What is the sum of all real numbers x satisfying |x² − 6x| = 2x − 7?',c:['2 + √11','7','11','9 + √11','13'],a:'D',s:['The right side must be nonnegative, so any solution has x ≥ 7/2.','Case x² − 6x = 2x − 7: x² − 8x + 7 = 0 gives x = 1 or 7, and only x = 7 has x ≥ 7/2.','Case x² − 6x = −(2x − 7): x² − 4x − 7 = 0 gives x = 2 ± √11, and only 2 + √11 ≈ 5.3 has x ≥ 7/2.','Both survivors check, so the sum is 7 + 2 + √11 = 9 + √11.']},
 {u:'A2',d:3,q:'For how many integers x with 1 ≤ x ≤ 100 is √(x + 2√(x − 1)) + √(x − 2√(x − 1)) an integer?',c:['8','9','10','11','12'],a:'C',s:['Let t = √(x − 1); then x ± 2t = (t ± 1)², so the expression is (t + 1) + |t − 1|.','If t ≤ 1 (x = 1 or 2) the expression equals 2, an integer.','If t > 1 it equals 2t = 2√(x − 1), which for integer x is an integer exactly when x − 1 is a perfect square, here 4, 9, …, 81: 8 values.','In total 2 + 8 = 10 integers work.']},
 {u:'A3',d:1,q:'Let f(x) = 2x − 3 and g(x) = x² + 1. What is f(g(3)) − g(f(3))?',c:['−7','0','3','7','10'],a:'D',s:['Evaluate compositions from the inside out: g(3) = 10, so f(g(3)) = 17.','Similarly f(3) = 3, so g(f(3)) = 10.','The difference is 17 − 10 = 7.']},
 {u:'A3',d:1,q:'What is the value of 1/(√1 + √2) + 1/(√2 + √3) + 1/(√3 + √4) + ⋯ + 1/(√24 + √25)?',c:['3','4','24/5','2√6','5'],a:'B',s:['Rationalize each term: 1/(√k + √(k+1)) = √(k+1) − √k.','The sum telescopes to √25 − √1.','That equals 5 − 1 = 4.']},
 {u:'A3',d:2,q:'What is ⌊√1⌋ + ⌊√2⌋ + ⌊√3⌋ + ⋯ + ⌊√30⌋?',c:['90','96','100','105','110'],a:'C',s:['Group n by the value of ⌊√n⌋: it equals k for k² ≤ n ≤ (k+1)² − 1, which is 2k + 1 values of n.','Values 1, 2, 3, 4 appear 3, 5, 7, 9 times, contributing 3 + 10 + 21 + 36 = 70.','The value 5 appears for n = 25 to 30, six times, contributing 30.','The total is 100.']},
 {u:'A3',d:2,q:'A sequence has a₁ = 2 and aₙ₊₁ = 1/(1 − aₙ) for n ≥ 1. What is a₁ + a₂ + ⋯ + a₁₀₀?',c:['99/2','50','51','103/2','105/2'],a:'D',s:['Compute a few terms: 2, −1, 1/2, 2, … so the sequence repeats with period 3.','Each block of three sums to 2 − 1 + 1/2 = 3/2, and the first 99 terms form 33 blocks totaling 99/2.','Adding a₁₀₀ = a₁ = 2 gives 103/2.']},
 {u:'A3',d:2,q:'A function f satisfies f(x) + 2f(1 − x) = 3x² for all real x. What is f(3)?',c:['−3','−1','1','3','9'],a:'B',s:['Substitute x = 3 and x = −2, since 1 − 3 = −2 and 1 − (−2) = 3.','This gives f(3) + 2f(−2) = 27 and f(−2) + 2f(3) = 12.','From the second, f(−2) = 12 − 2f(3); substituting, f(3) + 24 − 4f(3) = 27, so f(3) = −1.']},
 {u:'A3',d:2,q:'The sum of the first 10 terms of an arithmetic sequence is 120, and the sum of the first 20 terms is 440. What is the sum of the first 30 terms?',c:['760','840','900','960','1080'],a:'D',s:['The partial sums of an arithmetic sequence have the form Sₙ = An² + Bn.','So 100A + 10B = 120 and 400A + 20B = 440, giving 10A + B = 12 and 20A + B = 22.','Then A = 1, B = 2, and S₃₀ = 900 + 60 = 960.']},
 {u:'A3',d:3,q:'Let f(x) = (x − 1)/(x + 1). If f is applied 50 times in succession starting from the number 3, what is the result?',c:['−3','−1/3','1/3','1/2','3'],a:'B',s:['Compose f with itself: f(f(x)) = −1/x, so applying f four times gives x back.','Since 50 leaves remainder 2 when divided by 4, the result equals f(f(3)).','f(3) = 1/2 and f(1/2) = (−1/2)/(3/2) = −1/3.']},
 {u:'A3',d:3,q:'How many distinct values appear in the list ⌊1²/100⌋, ⌊2²/100⌋, ⌊3²/100⌋, …, ⌊100²/100⌋?',c:['50','51','75','76','100'],a:'D',s:['Consecutive values n²/100 differ by (2n + 1)/100, which is less than 1 for n ≤ 49 and greater than 1 for n ≥ 50.','For n = 1 to 50 no integer is skipped, so the floors take every value from 0 to 25: that is 26 values.','For n = 51 to 100 each step exceeds 1, so these 50 floors are distinct and all exceed 25.','In total there are 26 + 50 = 76 distinct values.']},
 {u:'A3',d:3,q:'A function f defined on the positive integers satisfies f(1) = 1 and f(m + n) = f(m) + f(n) + 2mn + 1 for all positive integers m and n. What is f(10)?',c:['99','100','109','110','119'],a:'C',s:['Set n = 1 to get a recursion: f(m + 1) − f(m) = f(1) + 2m + 1 = 2m + 2.','Summing the differences, f(n) = 1 + Σ from m = 1 to n − 1 of (2m + 2) = 1 + (n − 1)n + 2(n − 1) = n² + n − 1.','So f(10) = 100 + 10 − 1 = 109.']},
 {u:'A3',d:3,q:'What is the value of the product (2³ − 1)/(2³ + 1) · (3³ − 1)/(3³ + 1) · (4³ − 1)/(4³ + 1) ⋯ (10³ − 1)/(10³ + 1)?',c:['7/11','2/3','37/55','11/16','3/4'],a:'C',s:['Factor each term: (n³ − 1)/(n³ + 1) = [(n − 1)/(n + 1)] · [(n² + n + 1)/(n² − n + 1)].','The first factors multiply to (1·2)/(10·11) = 1/55 after cancelling, since each numerator reappears two terms later as a denominator.','For the second factors note n² − n + 1 = (n − 1)² + (n − 1) + 1, so they telescope to (10² + 10 + 1)/(2² − 2 + 1) = 111/3 = 37.','The product is 37/55.']},
 {u:'A3',d:3,q:'What is the value of the infinite sum 1²/3 + 2²/3² + 3²/3³ + 4²/3⁴ + ⋯?',c:['1','9/8','4/3','3/2','2'],a:'D',s:['Let S = Σ n²/3ⁿ. Subtract S/3 from S: (2/3)S = Σ (n² − (n − 1)²)/3ⁿ = Σ (2n − 1)/3ⁿ.','Similarly T = Σ n/3ⁿ satisfies (2/3)T = Σ 1/3ⁿ = 1/2, so T = 3/4.','Then (2/3)S = 2T − Σ 1/3ⁿ = 3/2 − 1/2 = 1, so S = 3/2.']}
);

AB.push(
 {u:'N1',d:1,q:'What is the smallest positive integer n such that 7!·n is a perfect square?',c:['5','7','14','35','70'],a:'D',s:['Factor 7! = 5040 = 2⁴·3²·5·7.','A perfect square needs every prime exponent even, so the exponents of 5 and 7 must each be raised by 1.','The smallest multiplier is n = 5·7 = 35.']},
 {u:'N1',d:1,q:'How many digits does the number 4¹²·5²⁰ have when written in base ten?',c:['20','21','22','23','32'],a:'C',s:['Rewrite 4¹² = 2²⁴, so the product is 2²⁴·5²⁰ = 2⁴·(2·5)²⁰.','That equals 16·10²⁰, which is 16 followed by 20 zeros.','So it has 2 + 20 = 22 digits.']},
 {u:'N1',d:1,q:'Two prime numbers have a sum of 99. What is their product?',c:['194','388','970','2240','2450'],a:'A',s:['Every prime except 2 is odd, and two odd numbers have an even sum.','Since 99 is odd, one of the primes must be 2, so the other is 97, which is prime.','Their product is 2·97 = 194.']},
 {u:'N1',d:2,q:'How many ordered pairs (a, b) of positive integers satisfy gcd(a, b) = 6 and lcm(a, b) = 2520?',c:['4','8','12','16','32'],a:'D',s:['Write a = 6x and b = 6y with gcd(x, y) = 1; then lcm(a, b) = 6xy, so xy = 420.','Since 420 = 2²·3·5·7, each of the four prime powers 2², 3, 5, 7 must go entirely to x or entirely to y (they are coprime).','That gives 2⁴ = 16 ordered pairs.']},
 {u:'N1',d:2,q:'What is the smallest positive integer that has exactly 18 positive divisors?',c:['120','144','180','240','288'],a:'C',s:['If n = p₁^e₁·p₂^e₂·…, the divisor count is (e₁+1)(e₂+1)…, so we need this product to be 18.','The factorizations 18, 9·2, 6·3, 3·3·2 give candidates 2¹⁷, 2⁸·3, 2⁵·3², and 2²·3²·5, putting larger exponents on smaller primes.','The smallest of these is 2²·3²·5 = 180.']},
 {u:'N1',d:2,q:'For how many positive integers n is (n² + 2026)/(n + 2) an integer?',c:['12','14','15','16','30'],a:'B',s:['Divide: n² + 2026 = (n + 2)(n − 2) + 2030, so the fraction is an integer exactly when n + 2 divides 2030.','Since 2030 = 2·5·7·29, it has 2⁴ = 16 positive divisors.','We need n + 2 ≥ 3, which rules out the divisors 1 and 2, leaving 14 values of n.']},
 {u:'N1',d:2,q:'The product of all the positive divisors of a positive integer n > 1 equals n⁶. What is the smallest possible value of n?',c:['32','48','60','64','72'],a:'C',s:['Pair each divisor k with n/k: the product of all divisors of n is n^(d/2), where d is the number of divisors.','So n^(d/2) = n⁶ forces d = 12.','The smallest integer with 12 divisors is 2²·3·5 = 60.']},
 {u:'N1',d:2,q:'What is the sum of the digits of 10⁵⁰ − 2026?',c:['414','432','441','450','459'],a:'C',s:['Compute the subtraction on the last four digits: 10000 − 2026 = 7974, and every borrow turns the earlier zeros into 9s.','So 10⁵⁰ − 2026 is 46 nines followed by 7974, a 50-digit number.','The digit sum is 46·9 + 7 + 9 + 7 + 4 = 414 + 27 = 441.']},
 {u:'N1',d:3,q:'Let P = 1!·2!·3!·…·9!. How many positive divisors of P are perfect squares?',c:['336','504','672','840','1008'],a:'C',s:['Find the exponent of each prime in P by adding its exponents in each factorial: 2 appears to the power 0+1+1+3+3+4+4+7+7 = 30, 3 to the power 13, 5 to the power 5, and 7 to the power 3.','A square divisor uses an even exponent of each prime: 0, 2, …, 30 gives 16 choices for 2, then 7 choices for 3, 3 for 5, and 2 for 7.','The count is 16·7·3·2 = 672.']},
 {u:'N1',d:3,q:'For how many integers n with 1 ≤ n ≤ 100 is n! divisible by n²?',c:['73','74','75','76','78'],a:'B',s:['Since n! = n·(n − 1)!, the condition is equivalent to n dividing (n − 1)!.','If n is prime, (n − 1)! has no factor of n, so primes fail; the 25 primes up to 100 are excluded.','A composite n = ab with 1 < a < b < n divides (n − 1)!, and n = p² with p > 2 works because p and 2p both appear; only n = 4 fails, since 3! = 6 is not divisible by 4.','n = 1 works, so the count is 100 − 25 − 1 = 74.']},
 {u:'N1',d:3,q:'A positive integer N has exactly 20 positive divisors, 2N has exactly 24, and 3N has exactly 30. How many positive divisors does 6N have?',c:['32','36','40','42','48'],a:'B',s:['Write N = 2ᵃ·3ᵇ·m with gcd(m, 6) = 1, so d(N) = (a+1)(b+1)d(m).','Doubling only changes the factor a+1 to a+2, so (a+2)/(a+1) = 24/20 = 6/5 gives a = 4; similarly (b+2)/(b+1) = 30/20 = 3/2 gives b = 1.','Then 5·2·d(m) = 20 gives d(m) = 2.','Hence d(6N) = (a+2)(b+2)d(m) = 6·3·2 = 36.']},
 {u:'N1',d:3,q:'For how many positive integers n < 1000 is the sum of all positive divisors of n an odd number?',c:['31','46','52','53','62'],a:'D',s:['The divisor sum is multiplicative; for an odd prime p, 1 + p + … + pᵉ has e + 1 odd terms, so it is odd exactly when e is even, while the factor for p = 2 is always odd.','So the sum is odd exactly when the odd part of n is a perfect square, i.e. n = k² or n = 2k².','There are 31 squares below 1000 (k ≤ 31) and 22 numbers 2k² below 1000 (k ≤ 22), and these never overlap.','The total is 31 + 22 = 53.']},
 {u:'N2',d:1,q:'What is the units digit of 7²⁰²⁶ + 3²⁰²⁶?',c:['0','2','4','6','8'],a:'E',s:['Units digits of powers of 7 cycle 7, 9, 3, 1 and powers of 3 cycle 3, 9, 7, 1, both with period 4.','Since 2026 leaves remainder 2 when divided by 4, both powers end in 9.','So the sum ends in the units digit of 9 + 9 = 18, which is 8.']},
 {u:'N2',d:1,q:'For some base b, the numeral 253 in base b represents the base-ten number 136. What is b?',c:['6','7','8','9','11'],a:'B',s:['The numeral 253 in base b means 2b² + 5b + 3.','Set 2b² + 5b + 3 = 136, i.e. 2b² + 5b − 133 = 0, which factors as (b − 7)(2b + 19) = 0.','The positive solution is b = 7, and the digit 5 is valid in base 7.']},
 {u:'N2',d:2,q:'What is the remainder when 3²⁰²⁶ is divided by 100?',c:['9','29','49','69','89'],a:'B',s:['Compute small powers: 3⁵ = 243 ≡ 43 and 3¹⁰ ≡ 43² = 1849 ≡ 49, so 3²⁰ ≡ 49² = 2401 ≡ 1 (mod 100).','Since 2026 = 20·101 + 6, we get 3²⁰²⁶ ≡ 3⁶ = 729 (mod 100).','The remainder is 29.']},
 {u:'N2',d:2,q:'A collector has more than 100 and fewer than 200 coins. Arranged in rows of 3 there are 2 left over, in rows of 5 there are 3 left over, and in rows of 7 there are 4 left over. How many coins are there?',c:['128','143','158','173','188'],a:'C',s:['Combine congruences one at a time: N ≡ 3 (mod 5) and N ≡ 2 (mod 3) together give N ≡ 8 (mod 15).','Test 8, 23, 38, 53 modulo 7: 53 = 49 + 4 works, so N ≡ 53 (mod 105) by the Chinese Remainder Theorem.','The only value between 100 and 200 is 53 + 105 = 158.']},
 {u:'N2',d:2,q:'The five-digit number 24A8B, where A and B are digits, is divisible by 72. What is the sum of all possible values of A + B?',c:['4','13','14','17','21'],a:'D',s:['Divisibility by 72 means divisibility by 8 and by 9.','By 8: the last three digits 100A + 80 + B must be divisible by 8, and since 100A ≡ 4A (mod 8) this means 4A + B ≡ 0 (mod 8): B ∈ {0, 8} if A is even, and B = 4 if A is odd.','By 9: 2 + 4 + 8 + A + B = 14 + A + B must be a multiple of 9, so A + B = 4 or 13.','A even with B ∈ {0, 8} gives only (4, 0); A odd with B = 4 gives only (9, 4); so A + B is 4 or 13, and the requested total is 17.']},
 {u:'N2',d:2,q:'In a game, a team can score only 7 points or 11 points on each play. What is the largest total score that is impossible to reach?',c:['47','53','59','65','77'],a:'C',s:['For coprime a and b, every integer greater than ab − a − b is a nonnegative combination of a and b, and ab − a − b itself is not (the Chicken McNugget theorem).','Here 7·11 − 7 − 11 = 59.','Check: 59 − 11k for k = 0 to 5 gives 59, 48, 37, 26, 15, 4, none divisible by 7, so 59 is the answer.']},
 {u:'N2',d:2,q:'What are the last two digits of 7^(7⁷)?',c:['01','07','43','49','57'],a:'C',s:['Note 7⁴ = 2401 ≡ 1 (mod 100), so powers of 7 modulo 100 repeat with period 4.','The exponent 7⁷ is odd and 7 ≡ −1 (mod 4), so 7⁷ ≡ −1 ≡ 3 (mod 4).','So 7^(7⁷) ≡ 7³ = 343 (mod 100), and the last two digits are 43.']},
 {u:'N2',d:2,q:'How many five-digit palindromes are divisible by 11?',c:['80','81','82','90','100'],a:'C',s:['Write the palindrome as abcba; the alternating digit sum is a − b + c − b + a = 2a − 2b + c, which must be a multiple of 11.','For each of the 90 choices of (a, b), c ≡ 2b − 2a (mod 11) is determined, and it works unless that residue is 10.','2(b − a) ≡ 10 (mod 11) means b − a ≡ 5 (mod 11), i.e. b − a = 5 or b − a = −6, which happens for 4 + 4 = 8 pairs.','So 90 − 8 = 82 palindromes are divisible by 11.']},
 {u:'N2',d:3,q:'How many ordered pairs (x, y) of nonzero integers satisfy 1/x + 1/y = 1/12?',c:['14','15','28','29','30'],a:'D',s:['Clear denominators: 12y + 12x = xy, which rearranges to (x − 12)(y − 12) = 144 (Simon’s Favorite Factoring Trick).','Each ordered factorization of 144 into two integers (positive or negative) gives a pair; 144 = 2⁴·3² has 15 positive divisors, so there are 30 signed factorizations.','The factorization (−12)(−12) gives x = y = 0, which is not allowed.','That leaves 29 ordered pairs.']},
 {u:'N2',d:3,q:'Given that 1013 is prime, what is the remainder when 2²⁰²⁶ is divided by 2026?',c:['1','2','4','8','1012'],a:'C',s:['Since 2026 = 2·1013, find the remainder modulo 2 and modulo 1013 separately.','Modulo 2, the number is 0; modulo 1013, Fermat’s Little Theorem gives 2¹⁰¹² ≡ 1, so 2²⁰²⁶ = (2¹⁰¹²)²·2² ≡ 4.','The even number below 2026 that is 4 more than a multiple of 1013 is 4, so by the Chinese Remainder Theorem the remainder is 4.']},
 {u:'N2',d:3,q:'For how many integers n with 1 ≤ n ≤ 1000 is 2ⁿ − n divisible by 3?',c:['166','250','333','334','500'],a:'C',s:['Since 2 ≡ −1 (mod 3), 2ⁿ ≡ 1 when n is even and 2ⁿ ≡ 2 when n is odd.','So we need n even with n ≡ 1 (mod 3), i.e. n ≡ 4 (mod 6), or n odd with n ≡ 2 (mod 3), i.e. n ≡ 5 (mod 6).','From 1 to 1000 there are 166 full blocks of 6 (up to 996) contributing 2 each, plus 997–1000, which includes 1000 ≡ 4 (mod 6).','The total is 332 + 1 = 333.']},
 {u:'N2',d:3,q:'A positive integer N is written as a three-digit numeral abc in base 6, and as the three-digit numeral cba (the same digits reversed) in base 11. What is N?',c:['121','144','169','196','225'],a:'C',s:['Equate the two expansions: 36a + 6b + c = 121c + 11b + a, which simplifies to 35a = 5b + 120c, or 7a = b + 24c.','Base-6 digits force 1 ≤ a, c ≤ 5 and 0 ≤ b ≤ 5, so 24c ≤ 7a ≤ 35 gives c = 1 and then 7a − 24 = b ∈ [0, 5], so a = 4 and b = 4.','Thus N = 441 in base 6 = 144 + 24 + 1 = 169, and indeed 169 = 144 in base 11.']},
 {u:'S1',d:1,q:'A drawer holds 6 red, 8 blue, 10 green, and 3 black socks. In the dark, what is the smallest number of socks one must draw to be certain of having 4 socks of the same color?',c:['10','12','13','15','25'],a:'C',s:['Look for the worst case: draw as many socks as possible without getting 4 of one color.','That is 3 red, 3 blue, 3 green, and all 3 black, for 12 socks.','The next sock must make 4 of red, blue, or green, so by the pigeonhole principle the answer is 13.']},
 {u:'S1',d:3,q:'A pile has n coins. Two players alternate turns, and on each turn a player removes 1, 3, or 4 coins. The player who takes the last coin wins. For how many values of n with 1 ≤ n ≤ 50 can the second player force a win?',c:['7','13','14','16','25'],a:'C',s:['Work backwards: a position is losing for the player to move if every move leads to a winning position for the opponent; 0 is losing.','Computing upward gives losing positions 0, 2, 7, 9, 14, 16, …, i.e. n ≡ 0 or 2 (mod 7), and the pattern repeats because each block of 7 behaves the same way.','The second player wins exactly when n is a losing position: n = 2, 7, 9, 14, …, 44, 49.','There are 7 multiples of 7 and 7 numbers ≡ 2 (mod 7) in this range, for 14 values.']},
 {u:'S1',d:2,q:'The numbers 1, 2, 3, …, 10 are written on a board. A move consists of erasing two numbers a and b and writing a + b + ab. After nine moves one number remains. What is it?',c:['10! − 1','10!','11! − 1','11!','11! + 1'],a:'C',s:['Notice a + b + ab = (a + 1)(b + 1) − 1.','So the product of (x + 1) over all numbers x on the board is invariant under each move.','Initially that product is 2·3·…·11 = 11!, so the final number x satisfies x + 1 = 11!, giving x = 11! − 1.']},
 {u:'S1',d:3,q:'One square is removed from a 5×5 grid, and the remaining 24 squares are then covered exactly by 12 dominoes (1×2 rectangles). How many of the 25 squares could have been the removed square?',c:['1','9','12','13','25'],a:'D',s:['Color the grid like a checkerboard with corners black: there are 13 black and 12 white squares.','Each domino covers one black and one white square, so the removed square must be black, giving at most 13 options.','Every black square actually works: the remaining region can be split into strips of even length around the removed square, so each of the 13 black squares is possible, and the answer is 13.']},
 {u:'S1',d:3,q:'The numbers 1, 2, …, 10 are written on a board. A move consists of erasing two numbers and writing their positive difference (or 0 if they are equal). After nine moves one number remains. How many different values could that number be?',c:['1','4','5','9','10'],a:'C',s:['Since |a − b| ≡ a + b (mod 2), the parity of the sum of the numbers on the board never changes.','The initial sum is 55, which is odd, so the final number is odd; it also cannot exceed 10, leaving 1, 3, 5, 7, 9.','Each is achievable: for example, 10−9, 8−7, 6−5, 4−3 give four 1s that cancel in pairs, leaving 1 and 2 to make 1; similar pairings keep 9, 7, 5, or 3 alive, so there are 5 possible values.']},
 {u:'S1',d:3,q:'What is the sum of all positive integers whose digits are distinct and all come from the set {1, 2, 3, 4, 5}? (This includes one-digit numbers.)',c:['399960','4021305','4419975','4420575','4466640'],a:'D',s:['Group by length k: there are 5·4·…·(5 − k + 1) such numbers, and by symmetry each digit appears equally often in each position, namely 4·3·…·(5 − k + 1) times, i.e. 1/5 of the time.','So the sum of the k-digit numbers is (number of them)/5 · 15 · (11…1 with k ones).','For k = 1 to 5 this gives 15, 4·15·11 = 660, 12·15·111 = 19980, 24·15·1111 = 399960, and 24·15·11111 = 3999960.','Adding: 15 + 660 + 19980 + 399960 + 3999960 = 4420575.']},
 {u:'S1',d:2,q:'How many non-congruent triangles with integer side lengths have perimeter 30?',c:['12','17','19','21','27'],a:'C',s:['Let the sides be a ≤ b ≤ c with a + b + c = 30; the triangle inequality a + b > c means c < 15, and c ≥ 10 since c is the largest.','For each c from 10 to 14, count pairs a ≤ b ≤ c with a + b = 30 − c.','Since b ranges from ⌈(30 − c)/2⌉ to c, the counts are c = 10: 1, c = 11: 2, c = 12: 4, c = 13: 5, c = 14: 7.','The total is 1 + 2 + 4 + 5 + 7 = 19.']},
 {u:'S1',d:3,q:'Let S = 1/√1 + 1/√2 + 1/√3 + … + 1/√100. What is ⌊S⌋?',c:['9','10','17','18','19'],a:'D',s:['Compare each term with a telescoping difference: 2(√(k+1) − √k) = 2/(√(k+1) + √k) < 1/√k < 2/(√k + √(k−1)) = 2(√k − √(k−1)).','Summing the left inequality for k = 1 to 100 gives S > 2(√101 − 1) > 2(10 − 1) = 18.','Summing the right inequality for k = 2 to 100 and adding 1 for k = 1 gives S < 1 + 2(√100 − 1) = 19.','So 18 < S < 19 and ⌊S⌋ = 18.']},
 {u:'S1',d:3,q:'What is the smallest number of distinct integers that must be chosen from {1, 2, …, 40} to guarantee that one of the chosen numbers divides another?',c:['11','20','21','30','31'],a:'C',s:['Write each number as 2ᵏ·m with m odd; there are 20 possible odd parts m = 1, 3, …, 39.','Two numbers with the same odd part form a pair where the smaller divides the larger, so by pigeonhole any 21 numbers contain such a pair.','The 20 numbers 21, 22, …, 40 contain no such pair (any proper multiple is at least 42), so 20 is not enough and the answer is 21.']}
);

AB.push(
 {u:"C1",d:1,q:"How many distinguishable arrangements of the letters in LEVELED are there in which the three E’s are <b>not</b> all next to one another?",c:["300", "340", "360", "400", "420"],a:"C",s:["Without restriction there are 7!/(3!·2!) = 420 arrangements, since there are three E’s and two L’s.", "Glue the three E’s into one block; then arrange the 5 objects L, L, V, D, [EEE] in 5!/2! = 60 ways.", "By complementary counting, 420 − 60 = 360 arrangements do not have the E’s all together."]},
 {u:"C1",d:1,q:"A 3×6 rectangle is divided into 18 unit squares by grid lines. How many rectangles whose sides lie along the grid lines are <b>not</b> squares?",c:["84", "94", "98", "108", "126"],a:"B",s:["A rectangle is determined by choosing 2 of the 7 vertical lines and 2 of the 4 horizontal lines, giving C(7,2)·C(4,2) = 21·6 = 126 rectangles.", "Squares of side 1, 2, 3 number 3·6 = 18, 2·5 = 10, and 1·4 = 4, for 32 squares in all.", "So 126 − 32 = 94 rectangles are not squares."]},
 {u:"C1",d:2,q:"A path from (0,0) to (6,4) consists of unit steps, each either one unit right or one unit up. How many such paths pass through neither (2,2) nor (4,2)?",c:["30", "48", "66", "84", "120"],a:"C",s:["There are C(10,4) = 210 paths in all.", "Paths through (2,2) number C(4,2)·C(6,2) = 6·15 = 90, and paths through (4,2) number C(6,2)·C(4,2) = 90.", "Paths through both number C(4,2)·1·C(4,2) = 36, since (2,2) to (4,2) is a single straight segment.", "By inclusion–exclusion, 210 − 90 − 90 + 36 = 66 paths avoid both points."]},
 {u:"C1",d:2,q:"Four men, including Bob, and four women, including Ann, sit around a round table so that men and women alternate. Seatings that differ only by a rotation are considered the same. In how many seatings is Ann <b>not</b> sitting next to Bob?",c:["48", "72", "96", "108", "144"],a:"B",s:["Fix Bob’s seat to remove rotational symmetry. The other three men fill the three remaining men’s seats in 3! = 6 ways.", "The four women’s seats alternate with the men’s; exactly two of them are next to Bob.", "Ann must take one of the 2 women’s seats not adjacent to Bob, and the other three women fill the rest in 3! = 6 ways.", "The total is 6·2·6 = 72."]},
 {u:"C1",d:2,q:"How many four-digit positive integers have digits whose sum is 20?",c:["556", "597", "633", "670", "715"],a:"B",s:["Write the digits as a+b+c+d = 20 with 1 ≤ a ≤ 9 and 0 ≤ b,c,d ≤ 9; substitute a′ = a − 1 to get a′+b+c+d = 19 with a′ ≤ 8 and the others ≤ 9.", "Stars and bars gives C(22,3) = 1540 solutions with no upper bounds.", "Subtract violations: a′ ≥ 9 leaves a sum of 10, giving C(13,3) = 286; each of b, c, d ≥ 10 leaves a sum of 9, giving C(12,3) = 220.", "Double violations: a′ ≥ 9 together with one of b, c, d ≥ 10 leaves a sum of 0 (1 solution each, 3 total); two of b, c, d ≥ 10 is impossible.", "So the count is 1540 − 286 − 3·220 + 3 = 597."]},
 {u:"C1",d:2,q:"How many integers from 1 to 1000, inclusive, are divisible by exactly one of the numbers 4, 6, and 9?",c:["222", "250", "278", "306", "389"],a:"C",s:["Let A, B, C be the multiples of 4, 6, 9: |A| = 250, |B| = 166, |C| = 111.", "Pairwise intersections are multiples of lcm values 12, 36, 18: |A∩B| = 83, |A∩C| = 27, |B∩C| = 55, and |A∩B∩C| = 27 (multiples of 36).", "The number in exactly one set is ΣA − 2Σ|pairs| + 3|triple| = 527 − 2·165 + 3·27 = 278."]},
 {u:"C1",d:3,q:"How many distinguishable arrangements of the seven letters A, A, B, B, C, C, D have no two identical letters next to each other?",c:["192", "228", "246", "270", "312"],a:"C",s:["There are 7!/(2!·2!·2!) = 630 arrangements in all; use inclusion–exclusion on the events “the A’s are adjacent,” etc.", "Gluing one pair gives 6!/(2!·2!) = 180 arrangements; gluing two pairs gives 5!/2! = 60; gluing all three gives 4! = 24.", "The count is 630 − 3·180 + 3·60 − 24 = 246."]},
 {u:"C1",d:3,q:"The 16 points (x,y) with x,y ∈ {0,1,2,3} form a square array. How many triangles with positive area have all three vertices among these points?",c:["504", "516", "520", "528", "560"],a:"B",s:["There are C(16,3) = 560 triples of points; subtract the collinear triples.", "Each of the 4 rows and 4 columns contains C(4,3) = 4 collinear triples, giving 32.", "The two long diagonals give 4 each (8 total), and the four diagonals with exactly 3 points give 1 each (4 total); no other line contains 3 of the points.", "So the answer is 560 − 32 − 8 − 4 = 516."]},
 {u:"C1",d:3,q:"Three distinct vertices of a regular 12-gon are chosen. For how many of the C(12,3) = 220 possible choices is the resulting triangle obtuse?",c:["40", "60", "100", "120", "160"],a:"D",s:["A triangle inscribed in a circle is obtuse exactly when all three vertices lie strictly within some open semicircle, i.e., one arc between consecutive chosen vertices exceeds 6 edges.", "For an obtuse triangle, let v be the first chosen vertex going clockwise around that semicircle; the other two vertices must lie among the next 5 vertices clockwise from v, in C(5,2) = 10 ways.", "Each obtuse triangle is counted exactly once (from its first vertex clockwise), so there are 12·10 = 120 obtuse triangles.", "As a check, 60 triangles are right (one side a diameter: 6 diameters × 10 third vertices) and 40 are acute, and 120 + 60 + 40 = 220."]},
 {u:"C1",d:3,q:"How many noncongruent obtuse triangles have integer side lengths and perimeter 30?",c:["7", "8", "9", "10", "12"],a:"C",s:["Let a ≤ b ≤ c with a+b+c = 30; the triangle inequality forces c ≤ 14, and c ≥ 10 since c is the largest side.", "The triangle is obtuse exactly when a² + b² < c², with a + b = 30 − c.", "For c = 14 (a + b = 16): a² + (16 − a)² < 196 simplifies to a² − 16a + 30 < 0, true for 3 ≤ a ≤ 8, giving 6 triangles.", "For c = 13 (a + b = 17): a² − 17a + 60 < 0 means 5 < a < 12, so a = 6, 7, 8 (with a ≥ 4 and a ≤ b), giving 3 triangles; note (5,12,13) is right, not obtuse.", "For c = 12: a² − 18a + 90 < 0 has no real solutions, and smaller c fare worse, so the total is 6 + 3 = 9."]},
 {u:"C1",d:3,q:"In how many permutations of 1, 2, 3, 4, 5, 6 does no number k appear immediately before k + 1 (for k = 1, 2, 3, 4, 5)?",c:["265", "309", "351", "415", "455"],a:"B",s:["Let Eₖ be the event that k is immediately followed by k + 1. If j of these events occur, the forced pairs merge numbers into 6 − j blocks, so the intersection has (6 − j)! permutations.", "By inclusion–exclusion, the count is Σ (−1)ʲ·C(5,j)·(6 − j)! for j = 0 to 5.", "This is 720 − 600 + 240 − 60 + 10 − 1 = 309."]},
 {u:"P1",d:1,q:"Two fair six-sided dice are rolled. What is the probability that the product of the two numbers rolled is a perfect square?",c:["1/6", "7/36", "2/9", "1/4", "5/18"],a:"C",s:["Doubles always give a perfect square, accounting for 6 outcomes.", "The only non-double squares are 1·4 = 4 and 4·1 = 4, adding 2 outcomes.", "So the probability is 8/36 = 2/9."]},
 {u:"P1",d:1,q:"A bag contains 4 red marbles and 6 blue marbles. Three marbles are drawn at random without replacement. What is the probability that the marbles drawn are <b>not</b> all the same color?",c:["1/5", "3/5", "7/10", "4/5", "9/10"],a:"D",s:["There are C(10,3) = 120 equally likely draws.", "All red happens in C(4,3) = 4 ways and all blue in C(6,3) = 20 ways.", "By complementary counting, the probability is 1 − 24/120 = 4/5."]},
 {u:"P1",d:1,q:"Alice and Bob take turns flipping coins, Alice first. Alice’s coin lands heads with probability 1/3, and Bob’s coin is fair. The first person to flip heads wins. What is the probability that Alice wins?",c:["1/3", "2/5", "1/2", "4/7", "2/3"],a:"C",s:["In each full round, Alice wins immediately with probability 1/3, and the round passes with no winner with probability (2/3)(1/2) = 1/3.", "So Bob wins a given round with probability (2/3)(1/2) = 1/3 as well.", "Alice and Bob are equally likely to be the first to win in any round, so Alice wins with probability 1/2."]},
 {u:"P1",d:2,q:"Three fair six-sided dice are rolled. Given that at least one die shows a 6, what is the probability that the sum of the three dice is at least 15?",c:["19/216", "10/91", "19/91", "20/91", "1/4"],a:"C",s:["The number of outcomes with at least one 6 is 6³ − 5³ = 91.", "Any outcome with sum at least 15 contains a 6 unless it is (5,5,5), so count all outcomes with sum 15 to 18 and then remove (5,5,5).", "Sums 15, 16, 17, 18 occur in 10, 6, 3, 1 ways, totaling 20; removing (5,5,5) leaves 19.", "The conditional probability is 19/91."]},
 {u:"P1",d:2,q:"A point (x, y) is chosen uniformly at random from the rectangle with 0 ≤ x ≤ 2 and 0 ≤ y ≤ 4. What is the probability that x < y < x²?",c:["1/12", "5/48", "1/8", "7/48", "1/6"],a:"B",s:["The condition x < y < x² requires x < x², so x > 1.", "For 1 < x ≤ 2 the favorable y-interval has length x² − x, which stays inside 0 ≤ y ≤ 4.", "The favorable area is ∫ from 1 to 2 of (x² − x) dx = 7/3 − 3/2 = 5/6.", "Divide by the rectangle’s area 8 to get 5/48."]},
 {u:"P1",d:2,q:"A fair six-sided die is rolled repeatedly until some roll matches the roll immediately before it. What is the expected total number of rolls?",c:["6", "13/2", "7", "15/2", "12"],a:"C",s:["The first roll can never end the process.", "Each later roll matches the previous roll with probability 1/6, independently, so the number of additional rolls is geometric with expectation 6.", "The expected total is 1 + 6 = 7."]},
 {u:"P1",d:2,q:"A fair six-sided die is rolled four times. What is the expected number of distinct values that appear?",c:["625/216", "3", "671/216", "10/3", "7/2"],a:"C",s:["By linearity of expectation, sum over each face the probability that it appears at least once.", "A given face fails to appear with probability (5/6)⁴ = 625/1296, so it appears with probability 671/1296.", "The expected number of distinct values is 6 · 671/1296 = 671/216."]},
 {u:"P1",d:3,q:"A token starts at vertex A of a regular pentagon. Each second it moves to one of the two adjacent vertices, each with probability 1/2. What is the probability that the token is at A after exactly 7 moves?",c:["1/16", "5/64", "7/64", "1/8", "5/32"],a:"C",s:["Record clockwise moves as +1 and counterclockwise as −1; the token is at A when the total is a multiple of 5.", "Seven ±1 steps give an odd total between −7 and 7, so it must be 5 or −5.", "A total of 5 needs 6 clockwise and 1 counterclockwise move (7 ways); a total of −5 likewise has 7 ways.", "The probability is 14/2⁷ = 7/64."]},
 {u:"P1",d:3,q:"A fair six-sided die is rolled repeatedly until each of the numbers 2, 4, and 6 has appeared at least once. What is the expected number of rolls?",c:["9", "10", "11", "12", "33/2"],a:"C",s:["Break the process into stages according to how many even numbers have been seen so far.", "While 3 evens are still missing, each roll gives a new one with probability 3/6, so the stage takes 2 rolls on average; then 2/6 gives 3 rolls; then 1/6 gives 6 rolls.", "By linearity of expectation, the total is 2 + 3 + 6 = 11."]},
 {u:"P1",d:3,q:"Ten cards numbered 1 through 10 are shuffled and dealt face up one at a time. A card is called a <b>leader</b> if its number is larger than every card dealt before it (the first card is always a leader). What is the expected number of leaders?",c:["5/2", "11/4", "7381/2520", "55/18", "10/3"],a:"C",s:["By linearity of expectation, add up the probabilities that each position holds a leader.", "The kth card is a leader exactly when it is the largest of the first k cards, which by symmetry has probability 1/k.", "The expected number is 1 + 1/2 + 1/3 + … + 1/10 = 7381/2520."]},
 {u:"P1",d:3,q:"A bug starts at vertex A of a cube. Each minute it crawls along an edge to one of the three adjacent vertices, chosen at random. What is the probability that the bug is back at A after exactly 4 minutes?",c:["1/9", "2/9", "7/27", "1/3", "20/27"],a:"C",s:["Track only the bug’s distance from A (0, 1, 2, or 3). From distance 0 or 3 it must move to 1 or 2; from 1 it goes to 0 with probability 1/3 and to 2 with probability 2/3; from 2 it goes to 3 with probability 1/3 and to 1 with probability 2/3.", "After 2 minutes, the bug is at distance 0 with probability 1/3 and distance 2 with probability 2/3.", "From distance 0, returning in 2 more minutes has probability 1/3; from distance 2, it must go to distance 1 (2/3) then to 0 (1/3), probability 2/9.", "Total: (1/3)(1/3) + (2/3)(2/9) = 3/27 + 4/27 = 7/27."]},
 {u:"C2",d:1,q:"In how many ways can a 2×9 rectangle be tiled with nine 1×2 dominoes?",c:["34", "55", "64", "81", "89"],a:"B",s:["Let tₙ be the number of tilings of a 2×n rectangle. The leftmost column is covered either by one vertical domino or by two stacked horizontal dominoes.", "This gives tₙ = tₙ₋₁ + tₙ₋₂ with t₁ = 1 and t₂ = 2, a Fibonacci recursion.", "Continuing: 3, 5, 8, 13, 21, 34, 55, so t₉ = 55."]},
 {u:"C2",d:1,q:"Six letters are placed at random into six addressed envelopes, one per envelope. In how many of the 720 possible placements do exactly two letters land in their correct envelopes?",c:["90", "120", "135", "180", "240"],a:"C",s:["First choose which 2 letters are correct: C(6,2) = 15 ways.", "The other 4 letters must all be wrong, which is a derangement of 4 objects; D₄ = 9 (from Dₙ = (n−1)(Dₙ₋₁ + Dₙ₋₂) with D₂ = 1, D₃ = 2).", "The count is 15·9 = 135."]},
 {u:"C2",d:2,q:"Maya climbs a staircase of 10 steps, taking either 1 or 2 steps at a time, but she never takes two 2-step strides in a row. In how many ways can she reach the top?",c:["34", "41", "55", "60", "89"],a:"B",s:["Let aₙ count valid climbs of n steps. Look at the last stride: either it is a 1-step (aₙ₋₁ ways before it), or it is a 2-step that must be preceded by a 1-step or by nothing.", "This gives aₙ = aₙ₋₁ + aₙ₋₃ for n ≥ 3, with a₀ = 1, a₁ = 1, a₂ = 2.", "Computing: a₃ = 3, a₄ = 4, a₅ = 6, a₆ = 9, a₇ = 13, a₈ = 19, a₉ = 28, a₁₀ = 41."]},
 {u:"C2",d:2,q:"Six different books are given to three students, Ava, Ben, and Cal, so that each student receives at least one book and Ava receives strictly more books than each of the other two. In how many ways can this be done?",c:["30", "120", "150", "180", "210"],a:"C",s:["The possible book counts (Ava, Ben, Cal) are (4,1,1), (3,2,1), and (3,1,2).", "For (4,1,1): choose Ava’s 4 books in C(6,4) = 15 ways, then give the remaining two to Ben and Cal in 2 ways, for 30.", "For (3,2,1) or (3,1,2): choose Ava’s 3 in C(6,3) = 20 ways, then split the other 3 as 2 and 1 in 3 ways, giving 60 each.", "The total is 30 + 60 + 60 = 150."]},
 {u:"C2",d:2,q:"Let C(n,k) denote a binomial coefficient. What is the value of C(10,0)·C(10,2) + C(10,1)·C(10,3) + C(10,2)·C(10,4) + … + C(10,8)·C(10,10)?",c:["77520", "92378", "125970", "167960", "184756"],a:"C",s:["Rewrite C(10,k+2) as C(10,8−k), so each term is C(10,k)·C(10,8−k).", "By Vandermonde’s identity, Σ C(10,k)·C(10,8−k) counts ways to choose 8 items from two groups of 10, which is C(20,8).", "So the sum is C(20,8) = 125970."]},
 {u:"C2",d:2,q:"How many four-digit positive integers have digits that are nondecreasing from left to right (for example, 1336 or 2222)?",c:["330", "455", "495", "715", "1001"],a:"C",s:["The leading digit is nonzero, and the digits never decrease, so no digit can be 0; all digits come from {1,…,9}.", "A nondecreasing sequence is determined by the multiset of its digits, so we count multisets of size 4 from 9 values.", "By stars and bars, this is C(9+4−1,4) = C(12,4) = 495."]},
 {u:"C2",d:3,q:"Each of 12 seats in a row is painted red or blue. In how many ways can this be done if no three consecutive seats are all red?",c:["927", "1705", "2031", "2745", "3136"],a:"B",s:["Let aₙ be the number of valid colorings of n seats. Classify by how the coloring ends: B, BR, or BRR (or the whole row is R or RR).", "This gives aₙ = aₙ₋₁ + aₙ₋₂ + aₙ₋₃ with a₀ = 1, a₁ = 2, a₂ = 4.", "Continuing: 7, 13, 24, 44, 81, 149, 274, 504, 927, 1705, so a₁₂ = 1705."]},
 {u:"C2",d:3,q:"A circular bracelet has 7 equally spaced beads, each colored red, white, or green. Two bracelets are considered the same if one can be rotated to match the other (flipping is not allowed). How many different bracelets are possible?",c:["309", "312", "315", "318", "333"],a:"C",s:["There are 3⁷ = 2187 colorings before accounting for rotation.", "Since 7 is prime, any coloring that is not a single color has 7 distinct rotations, while the 3 monochromatic colorings are fixed by every rotation.", "So there are (2187 − 3)/7 = 312 classes of non-constant colorings plus 3 constant ones, for 315 bracelets."]},
 {u:"C2",d:3,q:"A fair six-sided die is rolled repeatedly and a running total is kept. What is the probability that the running total is exactly 6 at some point?",c:["1/6", "7/36", "2/7", "1/3", "16807/46656"],a:"E",s:["Let pₙ be the probability the running total ever equals n. Conditioning on the last roll before hitting n gives pₙ = (pₙ₋₁ + pₙ₋₂ + … + pₙ₋₆)/6, with p₀ = 1 and pₖ = 0 for k < 0.", "Then p₁ = 1/6, and for 2 ≤ n ≤ 6, pₙ = pₙ₋₁ + pₙ₋₁/6 = (7/6)pₙ₋₁.", "Hence p₆ = (1/6)(7/6)⁵ = 7⁵/6⁶ = 16807/46656."]},
 {u:"C2",d:3,q:"Fourteen points are equally spaced around a circle. In how many ways can 4 of the points be chosen so that no two chosen points are adjacent?",c:["210", "266", "294", "330", "364"],a:"C",s:["Fix a particular point P. If P is chosen, its two neighbors are excluded, leaving 3 points to choose from a line of 11 with no two adjacent: C(11−3+1,3) = C(9,3) = 84.", "If P is not chosen, cut the circle at P to get a line of 13 points; choose 4 with no two adjacent in C(13−4+1,4) = C(10,4) = 210 ways.", "The total is 84 + 210 = 294."]},
 {u:"C2",d:3,q:"How many subsets of {1, 2, 3, …, 10}, including the empty set, contain no two elements that differ by exactly 2?",c:["89", "144", "169", "196", "233"],a:"C",s:["Numbers differing by 2 have the same parity, so the condition splits into independent conditions on the odds {1,3,5,7,9} and the evens {2,4,6,8,10}.", "Within each 5-element chain, we need a subset with no two consecutive members of the chain; the number of such subsets of an n-chain is the Fibonacci number Fₙ₊₂, which for n = 5 is 13.", "Multiplying the independent choices gives 13·13 = 169."]}
);

AB.push(
 {u:'G1',d:1,q:'A right triangle has integer side lengths. One leg has length 20, and the hypotenuse is 2 longer than the other leg. What is the perimeter of the triangle?',c:['198','202','210','220','242'],a:'D',s:['Let the other leg be b, so the hypotenuse is b + 2.','Then (b + 2)² − b² = 20², which simplifies to 4b + 4 = 400.','So b = 99, the hypotenuse is 101, and the perimeter is 20 + 99 + 101 = 220.']},
 {u:'G1',d:1,q:'Each interior angle of a regular polygon measures 156°. How many diagonals does the polygon have?',c:['77','90','105','120','135'],a:'B',s:['Each exterior angle is 180° − 156° = 24°, and the exterior angles sum to 360°, so the polygon has 360/24 = 15 sides.','A polygon with n sides has n(n − 3)/2 diagonals, since each vertex connects to n − 3 non-adjacent vertices and each diagonal is counted twice.','So there are 15 · 12/2 = 90 diagonals.']},
 {u:'G1',d:2,q:'In △ABC, point D lies on side BC so that AB = AD = DC. If ∠BAC = 111°, what is the degree measure of ∠ABC?',c:['46','48','52','54','58'],a:'A',s:['Let ∠C = x. Since AD = DC, △ADC is isosceles, so ∠DAC = x and the exterior angle ∠ADB = 2x.','Since AB = AD, ∠ABD = ∠ADB = 2x, and then ∠BAD = 180° − 4x.','So ∠BAC = (180° − 4x) + x = 180° − 3x = 111°, giving x = 23°.','Therefore ∠ABC = 2x = 46°.']},
 {u:'G1',d:2,q:'Point P lies inside rectangle ABCD with PA = 3, PB = 4, and PC = 5. What is PD?',c:['√7','3','3√2','2√5','√34'],a:'C',s:['Drop perpendiculars from P to the four sides, splitting the rectangle into four smaller rectangles; each of PA, PB, PC, PD is a diagonal of one of them.','Writing each squared distance as a sum of two squared perpendicular distances shows PA² + PC² = PB² + PD².','So PD² = 9 + 25 − 16 = 18, and PD = 3√2.']},
 {u:'G1',d:2,q:'In right triangle ABC, the altitude from the right angle C to hypotenuse AB has length 12, and it divides AB into two segments whose lengths differ by 7. What is the perimeter of △ABC?',c:['36','45','50','56','60'],a:'E',s:['The altitude to the hypotenuse is the geometric mean of the two segments it creates (the two smaller triangles are similar), so if the segments are p and p + 7, then p(p + 7) = 144.','This gives p = 9, so the segments are 9 and 16 and the hypotenuse is 25.','The legs are √(9·25) = 15 and √(16·25) = 20, so the perimeter is 15 + 20 + 25 = 60.']},
 {u:'G1',d:2,q:'Right triangle ABC has a right angle at C, AC = 15, and BC = 20. The altitude from C meets AB at D. What is the sum of the inradii of triangles ABC, ACD, and BCD?',c:['9','10','11','12','13'],a:'D',s:['For a right triangle with legs x, y and hypotenuse z, the inradius is (x + y − z)/2; for △ABC this is (15 + 20 − 25)/2 = 5.','Triangles ACD and BCD are both similar to △ABC, with hypotenuses AC = 15 and BC = 20, so their scale factors are 15/25 = 3/5 and 20/25 = 4/5.','Their inradii are 5 · 3/5 = 3 and 5 · 4/5 = 4, so the sum is 5 + 3 + 4 = 12.']},
 {u:'G1',d:3,q:'How many noncongruent right triangles with all three side lengths integers have a leg of length 60?',c:['12','13','14','26','27'],a:'B',s:['If the other leg is b and the hypotenuse is c, then c² − b² = 3600, so (c − b)(c + b) = 3600.','The factors c − b and c + b have the same parity and their product is even, so both are even: write c − b = 2m and c + b = 2n with mn = 900 and m < n.','Since 900 = 2²·3²·5² has 3·3·3 = 27 divisors, and m = n = 30 must be excluded (it gives b = 0), there are (27 − 1)/2 = 13 pairs.','Each pair gives a different b = n − m, so there are 13 triangles.']},
 {u:'G1',d:3,q:'Triangle ABC has area 390. Points D, E, F lie on sides BC, CA, AB respectively with BD : DC = CE : EA = AF : FB = 1 : 3. Segments AD, BE, and CF bound a smaller triangle inside △ABC. What is the area of that smaller triangle?',c:['90','104','117','120','130'],a:'D',s:['Use mass points (or coordinates) on cevians AD and BE: with BD : DC = 1 : 3 and CE : EA = 1 : 3, the cevian BE cuts AD with BP : PE = 4 : 9 at their intersection P.','Since △ABE has area 3/4 of △ABC (as AE = (3/4)AC) and BP = (4/13)BE, △ABP has area (3/4)(4/13) = 3/13 of △ABC; by symmetry the other two triangles of this type do too.','These three triangles cover everything except the inner triangle, which therefore has 1 − 9/13 = 4/13 of the area.','So the area is 390 · 4/13 = 120.']},
 {u:'G1',d:3,q:'A convex hexagon ABCDEF has all six interior angles equal to 120°. If AB = 3, BC = 7, CD = 2, and DE = 4, what is the perimeter of the hexagon?',c:['23','24','25','26','27'],a:'C',s:['Extend sides AB, CD, EF to form a large equilateral triangle; the hexagon is this triangle with three small equilateral corners removed.','Equivalently, for an equiangular hexagon with consecutive sides a₁,…,a₆ we get a₁ + a₂ = a₄ + a₅ and a₂ + a₃ = a₅ + a₆.','So 3 + 7 = 4 + EF gives EF = 6, and 7 + 2 = 6 + FA gives FA = 3.','The perimeter is 3 + 7 + 2 + 4 + 6 + 3 = 25.']},
 {u:'G2',d:1,q:'Quadrilateral ABCD is inscribed in a circle. If ∠A = 2∠C and ∠B = 3∠D, what is ∠A − ∠D, in degrees?',c:['45','60','65','75','90'],a:'D',s:['Opposite angles of a cyclic quadrilateral are supplementary.','From ∠A + ∠C = 180° and ∠A = 2∠C we get ∠C = 60° and ∠A = 120°.','From ∠B + ∠D = 180° and ∠B = 3∠D we get ∠D = 45°.','So ∠A − ∠D = 120° − 45° = 75°.']},
 {u:'G2',d:1,q:'Chords AB and CD of a circle intersect at point P. If AP = 6, PB = 8, and CP = 4, what is the length of CD?',c:['12','14','16','18','20'],a:'C',s:['By the power of a point, AP · PB = CP · PD.','So 6 · 8 = 4 · PD, giving PD = 12.','Then CD = CP + PD = 4 + 12 = 16.']},
