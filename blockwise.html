<title>Blockwise Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Blockwise: staff rota and weekly schedule builder with live labour cost, rule checks, auto-staffing and calendar export.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: engineering-pad week grid (the work surface) with a narrow ledger sidebar; header + tool rail on top. Sidebar stacks under the grid on phones. */
:root{
  --acc-l:#2747d6; --acc-d:#8197ff;          /* cobalt ink; skins override these two */
  --bg:#eef1f6;      /* desk */
  --sheet:#ffffff;   /* the pad */
  --ink:#141a2b;
  --muted:#5b6478;
  --line:#d6dce8;
  --grid:#e6ebf4;
  --accent:var(--acc-l);
  --accent-ink:#ffffff;
  --gold:#a8701a;    /* Pro */
  --danger:#c6283d;
  --ok:#1d8a5a;
  --shadow:0 1px 2px rgba(20,26,43,.06),0 8px 24px rgba(20,26,43,.08);
  --f-disp:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --hh:52px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c101c;--sheet:#141a2b;--ink:#e6e9f2;--muted:#98a1b8;--line:#283049;--grid:#1c2236;
  --accent:var(--acc-d);--accent-ink:#0b0f1c;--gold:#e2b04a;--danger:#ff6b7d;--ok:#4cc98e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c101c;--sheet:#141a2b;--ink:#e6e9f2;--muted:#98a1b8;--line:#283049;--grid:#1c2236;
  --accent:var(--acc-d);--accent-ink:#0b0f1c;--gold:#e2b04a;--danger:#ff6b7d;--ok:#4cc98e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
:root[data-skin="riso"]{--acc-l:#d63a73;--acc-d:#ff7aa8}
:root[data-skin="forest"]{--acc-l:#2c7a4b;--acc-d:#5fd394}
:root[data-skin="ember"]{--acc-l:#c2410c;--acc-d:#ff9a5c}
:root[data-skin="graphite"]{--acc-l:#2b2f3a;--acc-d:#d5d9e3}
:root[data-skin="lagoon"]{--acc-l:#0e7490;--acc-d:#4fd1e8}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand{display:flex;align-items:center;gap:8px;font:800 20px var(--f-disp);letter-spacing:-.02em}
.brand svg{width:26px;height:26px}
.sched-pick{display:flex;align-items:center;gap:6px;min-width:0}
.sched-pick select{max-width:220px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--sheet)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:600 12px var(--f-body);letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);background:var(--sheet);color:var(--muted)}
.pill.pro{border-color:color-mix(in srgb,var(--gold) 50%,transparent);color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--sheet))}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
:root[data-theme="dark"] .btn.gold{color:#1a1206}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.gold{color:#1a1206}}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.lock{font-size:11px;color:var(--gold);font-weight:600;letter-spacing:.03em}

.rail{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;background:var(--sheet);border:1px solid var(--line);border-radius:12px}
.rail .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--sheet);cursor:pointer}
.chip.warn{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line));background:color-mix(in srgb,var(--danger) 8%,var(--sheet))}
.chip.good{color:var(--ok)}

/* main split */
.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
@media (max-width:960px){.main{grid-template-columns:minmax(0,1fr)}}

/* calendar */
.cal-wrap{background:var(--sheet);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100dvh - 150px);min-height:420px;position:relative;box-shadow:var(--shadow)}
.cal{--g:54px;min-width:calc(var(--g) + var(--cols) * 104px)}
.cal-head,.cal-body{display:grid;grid-template-columns:var(--g) repeat(var(--cols),minmax(0,1fr))}
.cal-head{position:sticky;top:0;z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.dh{padding:8px 8px 7px;border-left:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.dh b{font:700 13px var(--f-disp);text-transform:uppercase;letter-spacing:.06em}
.dh span{font:12px var(--f-mono);color:var(--muted)}
.dh.today b{color:var(--accent)}
.dh.today{box-shadow:inset 0 -2px 0 var(--accent)}
.gut{position:relative}
.gut i{position:absolute;right:8px;transform:translateY(-50%);font:11px var(--f-mono);font-style:normal;color:var(--muted)}
.col{position:relative;border-left:1px solid var(--line);cursor:crosshair;touch-action:pan-x pan-y;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(color-mix(in srgb,var(--grid) 55%,transparent) 1px,transparent 1px);
  background-size:100% var(--hh),100% var(--hh);background-position:0 0,0 calc(var(--hh) / 2)}
.col.weekend{background-color:color-mix(in srgb,var(--ink) 2.5%,transparent)}
.now{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.blk{position:absolute;border-radius:7px;padding:4px 6px 6px 8px;overflow:hidden;cursor:grab;z-index:2;user-select:none;
  background:color-mix(in srgb,var(--c) 17%,var(--sheet));border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-left:4px solid var(--c);
  font-size:12px;line-height:1.25;transition:box-shadow .12s}
.blk:hover{box-shadow:0 4px 14px color-mix(in srgb,var(--c) 30%,transparent);z-index:4}
.blk.drag{cursor:grabbing;opacity:.85;z-index:6;box-shadow:0 10px 28px rgba(0,0,0,.25)}
.blk .bt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .bm{font:11px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.conf{background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--danger) 16%,transparent) 0 6px,transparent 6px 12px);border-color:var(--danger)}
.blk.auto::after{content:"auto";position:absolute;right:5px;top:3px;font:600 9px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.blk .rz{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.ghost-blk{position:absolute;left:3px;right:3px;border-radius:7px;background:color-mix(in srgb,var(--accent) 18%,transparent);border:1.5px dashed var(--accent);z-index:3;pointer-events:none;font:600 11px var(--f-mono);color:var(--accent);padding:4px 6px}

/* sidebar */
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.big{font:800 40px/1 var(--f-disp);letter-spacing:-.03em}
.big small{font:500 14px var(--f-body);color:var(--muted);letter-spacing:0;margin-left:4px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){font-family:var(--f-mono);text-align:right}
.catrow{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;cursor:pointer;padding:2px 0}
.catrow .sw{width:12px;height:12px;border-radius:3px;background:var(--c)}
.catrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catrow .hr{font:12px var(--f-mono);color:var(--muted)}
.bar{grid-column:2/4;height:5px;border-radius:3px;background:var(--grid);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:3px}
.task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.task b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task small{grid-column:1;color:var(--muted);font-family:var(--f-mono);font-size:11.5px}
.task button{grid-row:1/3;grid-column:2;align-self:center}
.meter{height:6px;border-radius:3px;background:var(--grid);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.full i{background:var(--danger)}
.hint{font-size:12.5px;color:var(--muted)}
.sponsor{border-style:dashed}
.sponsor .tag{font:600 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.codebox{display:flex;gap:6px;align-items:center}
.codebox code{flex:1;min-width:0;padding:6px 8px;border-radius:6px;background:var(--grid);font:500 13px var(--f-mono);letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row input[type=text]{flex:1;min-width:0}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(8,11,20,.5);z-index:50;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--sheet);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal.wide{width:min(940px,100%)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.modal-h h2{font-size:22px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input,.field select,.field textarea,.inp{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);width:100%;min-width:0}
.field textarea{resize:vertical;min-height:64px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days label{display:inline-flex}
.days input{position:absolute;opacity:0;pointer-events:none}
.days span{padding:6px 10px;border:1px solid var(--line);border-radius:7px;font:600 12px var(--f-body);cursor:pointer;min-width:44px;text-align:center}
.days input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.days input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.catpick label{position:relative}
.catpick input{position:absolute;opacity:0;pointer-events:none}
.catpick span{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;cursor:pointer}
.catpick span::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.catpick input:checked+span{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--sheet));font-weight:600}
.catpick input:focus-visible+span{outline:2px solid var(--accent)}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.foot .left{margin-right:auto}
.err{color:var(--danger);font-size:13px;min-height:1em}
.confirm{border:1px solid color-mix(in srgb,var(--danger) 40%,var(--line));background:color-mix(in srgb,var(--danger) 6%,var(--sheet));border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.confirm p{margin:0;flex:1 1 220px}

/* pricing */
.why{margin:0;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--gold) 10%,var(--sheet));border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;align-self:center}
.toggle button{border:0;background:transparent;padding:5px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:720px){.tiers{grid-template-columns:1fr}}
.tier{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.tier.hot{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.tier h3{font-size:18px;display:flex;justify-content:space-between;align-items:center}
.price{font:800 32px/1 var(--f-disp)}
.price small{font:500 13px var(--f-body);color:var(--muted)}
.tier ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:13px;flex:1}
.tier li::before{content:"✓ ";color:var(--ok);font-weight:700}
.tier li.no{color:var(--muted)}
.tier li.no::before{content:"– ";color:var(--muted)}
.save{font:600 11px var(--f-body);color:var(--ok);text-transform:uppercase;letter-spacing:.05em}

/* galleries */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tpl{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tpl h4{margin:0;font:700 15px var(--f-disp)}
.tpl p{margin:0;font-size:12.5px;color:var(--muted);flex:1}
.tpl .mini{height:64px;border-radius:6px;background:var(--grid);position:relative;overflow:hidden}
.tpl .mini i{position:absolute;border-radius:2px;opacity:.85}
.tpl.sp{border-style:dashed}
.skin{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;cursor:pointer;background:var(--sheet);text-align:left}
.skin.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.skin .sw{height:42px;border-radius:7px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.out{width:100%;min-height:150px;font:12px var(--f-mono);padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);resize:vertical}
.preview-img{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:9px 16px;border-radius:999px;font-weight:500;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.tryon{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--sheet);border:1px solid var(--gold);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);max-width:calc(100% - 32px);flex-wrap:wrap}
.empty{position:absolute;inset:auto 0 40% 0;text-align:center;color:var(--muted);pointer-events:none;font-size:13px}
/* roster */
.ros{min-width:calc(150px + var(--cols) * 112px)}
.rrow{display:grid;grid-template-columns:150px repeat(var(--cols),minmax(0,1fr));border-bottom:1px solid var(--line)}
.rrow.head{position:sticky;top:0;z-index:6;background:var(--sheet)}
.rp{position:sticky;left:0;z-index:4;background:var(--sheet);padding:9px 10px;display:flex;flex-direction:column;gap:2px;min-width:0;border:0;border-right:1px solid var(--line);cursor:pointer;text-align:left;font:inherit;color:inherit}
.rp b{display:flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp b i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.rp small{font:11px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp.over small:last-child{color:var(--danger)}
.rc{border-left:1px solid var(--line);padding:5px;display:flex;flex-direction:column;gap:4px;min-height:58px;cursor:pointer;min-width:0}
.rc.off{background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ink) 7%,transparent) 0 5px,transparent 5px 10px)}
.rc:hover{background-color:color-mix(in srgb,var(--accent) 6%,transparent)}
.rc.drop{background-color:color-mix(in srgb,var(--accent) 14%,transparent);box-shadow:inset 0 0 0 2px var(--accent)}
.rc .offl{font:11px var(--f-mono);color:var(--muted);margin:auto}
.sh{border-radius:6px;padding:4px 6px 4px 8px;background:color-mix(in srgb,var(--c) 17%,var(--sheet));border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-left:4px solid var(--c);cursor:grab;user-select:none;font-size:12px;line-height:1.25;min-width:0}
.sh b{display:block;font:500 11.5px var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh.bad{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger)}
.sh.open{border-style:dashed;border-left-style:solid;background:transparent}
.sh.drag{position:relative;z-index:9;opacity:.92;box-shadow:0 10px 28px rgba(0,0,0,.25);cursor:grabbing;pointer-events:none}
.rrow.openrow .rp b{color:var(--muted)}
.rrow.cov{background:color-mix(in srgb,var(--ink) 3%,transparent);border-bottom:0}
.rrow.cov .rc{cursor:default;font:11px var(--f-mono);min-height:0;padding:8px 6px;color:var(--muted)}
.rrow.cov .rc:hover{background-color:transparent}
.rrow.cov .ok{color:var(--ok)}
.rrow.cov .gap{color:var(--danger)}
.issue{display:grid;grid-template-columns:8px minmax(0,1fr);gap:8px;font-size:13px;align-items:baseline}
.issue::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold)}
.issue.bad::before{background:var(--danger)}
.daybars{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:end}
.daybars div{display:flex;flex-direction:column;align-items:center;gap:3px;font:10px var(--f-mono);color:var(--muted)}
.daybars i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.prow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:4px 8px;align-items:center;cursor:pointer;padding:2px 0;background:none;border:0;text-align:left;color:inherit;font:inherit;font-size:13px;width:100%}
.prow .sw{width:10px;height:10px;border-radius:50%;background:var(--c)}
.prow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .hr{font:12px var(--f-mono);color:var(--muted)}
.prow.over .hr{color:var(--danger)}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:480px){.kind{grid-template-columns:1fr}}
.kind label{position:relative;display:block}
.kind input{position:absolute;opacity:0}
.kind span{display:block;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;height:100%}
.kind span b{display:block;font:700 15px var(--f-disp)}
.kind span small{color:var(--muted)}
.kind input:checked+span{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.kind input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.msg{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.msg .out{min-height:110px}
#ex-body{display:flex;flex-direction:column;gap:10px}
.tier h3 small{font:500 12px var(--f-body);color:var(--muted);letter-spacing:0}
@media (max-width:520px){.ros{min-width:calc(104px + var(--cols) * 104px)}.rrow{grid-template-columns:104px repeat(var(--cols),minmax(0,1fr))}}
@media (max-width:520px){#zoomIn,#zoomOut,.rail .sep{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
/* ===================== Owner configuration =====================
   Paste your Stripe / Lemon Squeezy / Gumroad checkout links below.
   With demoMode on, the pricing screen also offers a "Demo: unlock Pro" button
   so you can try every paid feature. Turn it off before you launch. */
const CONFIG = {
  demoMode: true,
  prices: { proMonthly: 5, proYearly: 36, lifetime: 79, teamMonthly: 19, teamYearly: 180, template: 3 },
  checkout: { proMonthly: '', proYearly: '', lifetime: '', teamMonthly: '', teamYearly: '', template: '' },
  licenseSalt: 'replace-this-salt-before-launch',
  limits: { schedules: 2, blocks: 40, categories: 5, autofillPerWeek: 3, staff: 5, coverRules: 2 },
  trialDays: 7,
  referralDays: 7,
  sponsor: { title: 'Advertise to weekly planners', blurb: 'One sponsor card shows here for free-plan users. Rent this slot by the week.', url: '', cta: 'Sponsor this slot' },
  watermark: 'Made with Blockwise',
};

/* ===================== helpers ===================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, '0');
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const DAY_LETTER = { M: 0, T: 1, W: 2, R: 3, F: 4, S: 5, U: 6 };
const todayIdx = () => (new Date().getDay() + 6) % 7;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const DAY_MS = 864e5;

function fmt(min) {
  min = clamp(Math.round(min), 0, 1440);
  const h = Math.floor(min / 60), m = min % 60;
  if (S.prefs.h24) return `${pad(h % 24 === 0 && h ? 24 : h)}:${pad(m)}`;
  const h12 = ((h + 11) % 12) + 1, ap = h < 12 || h === 24 ? 'am' : 'pm';
  return `${h12}${m ? ':' + pad(m) : ''}${ap}`;
}
const toHHMM = min => `${pad(Math.floor(min / 60) % 24)}:${pad(min % 60)}`;
const fromHHMM = s => { const [h, m] = String(s).split(':').map(Number); return isNaN(h) ? null : h * 60 + (m || 0); };
const hrs = min => { const h = min / 60; return (Math.round(h * 10) / 10).toString(); };
function weekKey(d = new Date()) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x.toISOString().slice(0, 10); }

function hash32(str) { let h = 0x811c9dc5; for (const ch of str) { h ^= ch.charCodeAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
const B32 = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const enc = (n, len) => { let s = ''; for (let i = 0; i < len; i++) { s += B32[n % 32]; n = Math.floor(n / 32); } return s; };
const randCode = len => Array.from({ length: len }, () => B32[Math.floor(Math.random() * 32)]).join('');

/* ===================== team rota: core ===================== */
const isTeamSched = sc => sc.kind === 'team';
const person = (sc, id) => (sc.staff || []).find(p => p.id === id);
const bColor = (b, sc) => isTeamSched(sc) ? (person(sc, b.who)?.color || '#868e96') : cat(b.cat).color;
const bTitle = (b, sc) => isTeamSched(sc) ? (person(sc, b.who)?.name || 'Open') + (b.title ? ' · ' + b.title : '') : b.title;
const RULES0 = { restH: 11, maxDayH: 10, breakMin: 30, breakAfterH: 6, otAfterH: 40, otMult: 1.5 };
const money = (sc, n) => (sc.cur || '$') + n.toLocaleString('en-US', { maximumFractionDigits: Math.abs(n) >= 100 ? 0 : 2 });
function paidMin(b, sc) { const d = b.end - b.start, r = sc.rules; return d - (r.breakMin && d > r.breakAfterH * 60 ? r.breakMin : 0); }
function restGap(a, b) {   // minutes of rest between two shifts on a repeating week, the short way round
  const W = 10080, g1 = ((b.day * 1440 + b.start) - (a.day * 1440 + a.end) + W) % W, g2 = ((a.day * 1440 + a.start) - (b.day * 1440 + b.end) + W) % W;
  return Math.min(g1, g2);
}
function cafeSchedule() {
  const s = { id: uid(), kind: 'team', name: 'Corner Café (example rota)', startHour: 6, endHour: 21, days: [0, 1, 2, 3, 4, 5, 6], snap: 15, blocks: [], tasks: [],
    staff: [], cover: [], rules: { ...RULES0 }, budget: 0, cur: '$' };
  const P = (name, role, wage, maxH, off) => { const p = { id: 'p' + uid(), name, role, wage, maxH, off, color: PALETTE[[0, 2, 3, 5, 6][s.staff.length]] }; s.staff.push(p); return p.id; };
  const maya = P('Maya', 'Manager', 24, 40, [6]), leo = P('Leo', 'Barista', 17, 40, [1]), ines = P('Inés', 'Barista', 17, 32, [0, 2]), sam = P('Sam', 'Kitchen', 19, 40, [6]), tariq = P('Tariq', 'Barista', 16.5, 24, [3, 4]);
  const add = (who, days, span, title) => { const [a, b] = span.split('-').map(fromHHMM); for (const ch of days) s.blocks.push({ id: uid(), day: DAY_LETTER[ch], start: a, end: b, title, who, cat: '', loc: '', notes: '' }); };
  add(maya, 'MTWRF', '08:00-16:00', 'Manager');
  add(leo, 'MWRF', '06:30-14:30', 'Barista'); add(leo, 'S', '07:00-14:00', 'Barista');
  add(ines, 'TR', '12:00-18:30', 'Barista'); add(ines, 'S', '11:00-18:30', 'Barista'); add(ines, 'U', '08:00-16:00', 'Barista');
  add(sam, 'MTWR', '07:00-15:00', 'Kitchen');
  add(tariq, 'MW', '13:00-18:30', 'Barista'); add(tariq, 'S', '14:00-20:30', 'Barista'); add(tariq, 'U', '06:30-13:00', 'Barista');
  add('', 'S', '08:00-14:00', 'Kitchen'); add('', 'F', '14:30-18:30', 'Barista');
  s.cover = [{ id: uid(), days: [0, 1, 2, 3, 4, 5, 6], start: 480, end: 960, need: 2 }];
  return s;
}

/* ===================== state ===================== */
const KEY = 'blockwise_v1';
const DEFAULT_CATS = [
  { id: 'c1', name: 'Work', color: '#3b5bdb' },
  { id: 'c2', name: 'Study', color: '#7c4dff' },
  { id: 'c3', name: 'Health', color: '#12a150' },
  { id: 'c4', name: 'Personal', color: '#e8590c' },
  { id: 'c5', name: 'Errands', color: '#868e96' },
];
const PALETTE = ['#3b5bdb', '#7c4dff', '#12a150', '#e8590c', '#868e96', '#d6336c', '#0c8599', '#f08c00', '#5c940d', '#ae3ec9', '#1971c2', '#c92a2a'];

function sampleSchedule() {
  const s = { id: uid(), name: 'Example week', startHour: 6, endHour: 23, days: [0, 1, 2, 3, 4, 5, 6], snap: 15, blocks: [], tasks: [] };
  const add = (days, span, title, cat, loc = '') => {
    const [a, b] = span.split('-').map(fromHHMM);
    for (const ch of days) s.blocks.push({ id: uid(), day: DAY_LETTER[ch], start: a, end: b, title, cat, loc, notes: '' });
  };
  add('MWF', '07:00-08:00', 'Gym', 'c3', 'Northside gym');
  add('MTWRF', '09:00-12:30', 'Deep work', 'c1');
  add('MTWRF', '13:30-17:30', 'Meetings & email', 'c1');
  add('TR', '19:00-21:00', 'Spanish course', 'c2', 'Library room 2');
  add('S', '08:00-09:30', 'Long run', 'c3', 'River trail');
  add('S', '11:00-12:00', 'Groceries', 'c5');
  add('U', '16:00-17:30', 'Meal prep', 'c4');
  add('F', '19:30-22:00', 'Dinner with friends', 'c4');
  s.tasks = [
    { id: uid(), title: 'Read', dur: 45, times: 3, win: 'evening', cat: 'c4' },
    { id: uid(), title: 'Portfolio project', dur: 90, times: 2, win: 'any', cat: 'c2' },
  ];
  return s;
}
function fresh() {
  const s = sampleSchedule(), c = cafeSchedule();
  return {
    v: 1, seenTeam: true, schedules: [c, s], active: c.id, cats: structuredClone(DEFAULT_CATS),
    plan: { tier: 'free', trialEnds: 0, trialUsed: false, proUntil: 0, license: '' },
    credits: { week: weekKey(), used: 0 },
    referral: { mine: makeReferral(), redeemed: '' },
    prefs: { h24: false, zoom: 1, skin: 'graph' },
    owned: [],
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (!S || !S.schedules || !S.schedules.length) S = fresh();
S.prefs = Object.assign({ h24: false, zoom: 1, skin: 'graph' }, S.prefs);
S.owned = S.owned || [];
function migrate() {
  for (const s of S.schedules) if (isTeamSched(s)) { s.rules = Object.assign({}, RULES0, s.rules); s.staff = s.staff || []; s.cover = s.cover || []; }
  if (!S.seenTeam) { if (!S.schedules.some(isTeamSched)) { const c = cafeSchedule(); S.schedules.unshift(c); S.active = c.id; } S.seenTeam = true; }
}
migrate();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
const sched = () => S.schedules.find(s => s.id === S.active) || S.schedules[0];
const cat = id => S.cats.find(c => c.id === id) || S.cats[0] || { id: '', name: 'None', color: '#868e96' };

/* ===================== plan & monetization ===================== */
function isTeam() { const p = S.plan; return p.tier === 'team' || p.trialEnds > Date.now(); }
function isPro() { const p = S.plan; return isTeam() || p.tier === 'pro' || p.tier === 'lifetime' || p.proUntil > Date.now(); }
function planLabel() {
  const p = S.plan, now = Date.now(), left = t => Math.ceil((t - now) / DAY_MS);
  if (p.tier === 'team') return 'Team';
  if (p.trialEnds > now) return `Team trial · ${left(p.trialEnds)}d left`;
  if (p.tier === 'lifetime') return 'Lifetime';
  if (p.tier === 'pro') return 'Pro';
  if (p.proUntil > now) return `Pro · ${left(p.proUntil)}d left`;
  return 'Free';
}
function creditsLeft() {
  if (S.credits.week !== weekKey()) S.credits = { week: weekKey(), used: 0 };
  return Math.max(0, CONFIG.limits.autofillPerWeek - S.credits.used);
}
function gate(reason) { if (isPro()) return true; openUpgrade(reason, null, 'pro'); return false; }
function gateTeam(reason) { if (isTeam()) return true; openUpgrade(reason, null, 'team'); return false; }

function checkLicense(k) {
  const m = /^BW-([A-Z2-9]{4})-([A-Z2-9]{4})-([A-Z2-9]{4})$/.exec(String(k).trim().toUpperCase());
  if (!m || enc(hash32(m[1] + m[2] + CONFIG.licenseSalt), 4) !== m[3]) return null;
  return m[1][0] === 'L' ? 'lifetime' : m[1][0] === 'T' ? 'team' : 'pro';
}
function makeReferral() { const a = randCode(5); return `BWR-${a}${enc(hash32('ref' + a), 1)}`; }
function checkReferral(k) { const m = /^BWR-([A-Z2-9]{5})([A-Z2-9])$/.exec(String(k).trim().toUpperCase()); return !!m && enc(hash32('ref' + m[1]), 1) === m[2]; }

/* ===================== undo ===================== */
const undoStack = [], redoStack = [];
const snap = () => JSON.stringify({ schedules: S.schedules, active: S.active, cats: S.cats });
function pushUndo() { undoStack.push(snap()); if (undoStack.length > 80) undoStack.shift(); redoStack.length = 0; }
function restore(str) { const o = JSON.parse(str); S.schedules = o.schedules; S.active = o.active; S.cats = o.cats; save(); render(); }
function undo() { if (!undoStack.length) return; redoStack.push(snap()); restore(undoStack.pop()); toast('Undone'); }
function redo() { if (!redoStack.length) return; undoStack.push(snap()); restore(redoStack.pop()); toast('Redone'); }
function mutate(fn) { pushUndo(); fn(); save(); render(); }

/* ===================== analysis ===================== */
function overlaps(a, b) { return a.day === b.day && a.start < b.end && b.start < a.end; }
function conflicts(sc) {
  const ids = new Set(), bl = sc.blocks;
  for (let i = 0; i < bl.length; i++) for (let j = i + 1; j < bl.length; j++) if (overlaps(bl[i], bl[j])) { ids.add(bl[i].id); ids.add(bl[j].id); }
  return ids;
}
function layoutDay(blocks) {
  const sorted = [...blocks].sort((a, b) => a.start - b.start || b.end - a.end);
  const out = new Map(); let cluster = [], clusterEnd = -1;
  const flush = () => {
    const lanes = [];
    for (const b of cluster) { let i = lanes.findIndex(e => e <= b.start); if (i < 0) { i = lanes.length; lanes.push(0); } lanes[i] = b.end; out.set(b.id, { lane: i }); }
    for (const b of cluster) out.get(b.id).lanes = lanes.length;
    cluster = [];
  };
  for (const b of sorted) { if (b.start >= clusterEnd && cluster.length) flush(); cluster.push(b); clusterEnd = Math.max(clusterEnd, b.end); }
  if (cluster.length) flush();
  return out;
}
function busyMinutes(blocks, lo, hi) {
  const iv = blocks.map(b => [Math.max(lo, b.start), Math.min(hi, b.end)]).filter(([a, b]) => b > a).sort((x, y) => x[0] - y[0]);
  let tot = 0, cs = -1, ce = -1;
  for (const [a, b] of iv) { if (a > ce) { if (ce > cs) tot += ce - cs; cs = a; ce = b; } else ce = Math.max(ce, b); }
  if (ce > cs) tot += ce - cs; return tot;
}
function stats(sc) {
  const lo = sc.startHour * 60, hi = sc.endHour * 60;
  const byCat = {}, byDay = Array(7).fill(0); let total = 0;
  for (const b of sc.blocks) { const d = b.end - b.start; total += d; byCat[b.cat] = (byCat[b.cat] || 0) + d; byDay[b.day] += d; }
  let free = 0; for (const d of sc.days) free += (hi - lo) - busyMinutes(sc.blocks.filter(b => b.day === d), lo, hi);
  let busiest = sc.days[0] ?? 0; for (const d of sc.days) if (byDay[d] > byDay[busiest]) busiest = d;
  return { total, byCat, byDay, free, busiest };
}

/* ===================== render ===================== */
let showConf = false;
function render() {
  document.documentElement.dataset.skin = tryOn ? tryOn.skin : S.prefs.skin;
  document.documentElement.style.setProperty('--hh', Math.round(52 * S.prefs.zoom) + 'px');
  const sc = sched();
  // header
  $('#schedSel').innerHTML = S.schedules.map(s => `<option value="${s.id}" ${s.id === sc.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
  const pro = isPro(), team = isTeamSched(sc), unl = team ? isTeam() : pro, roster = team && S.prefs.view !== 'time';
  $('#planPill').textContent = planLabel();
  $('#planPill').classList.toggle('pro', pro);
  $('#upgradeBtn').hidden = S.plan.tier === 'team';
  $('#upgradeBtn').textContent = S.plan.tier === 'pro' || S.plan.tier === 'lifetime' ? 'Get Team' : 'Upgrade';
  $('#undoBtn').disabled = !undoStack.length; $('#redoBtn').disabled = !redoStack.length;
  $('#addLbl').textContent = team ? 'Shift' : 'Block';
  $('#tplBtn').hidden = team; $('#viewBtn').hidden = !team;
  $('#viewBtn').textContent = roster ? 'Timeline view' : 'Roster view';
  $('#zoomIn').hidden = $('#zoomOut').hidden = roster;
  $('#exportBtn').textContent = team ? 'Publish' : 'Export';
  $('#fillBtn').innerHTML = (team ? 'Auto-staff' : 'Auto-fill') + (unl ? '' : ` <span class="lock">${creditsLeft()} left</span>`);
  const issues = team ? teamIssues(sc) : null, conf = team ? teamBadIds(sc, issues) : conflicts(sc), n = team ? issues.length : conf.size;
  $('#confChip').innerHTML = !n ? `<span class="chip good">${team ? 'Rota is clean' : 'No overlaps'}</span>`
    : roster ? `<span class="chip warn" style="cursor:default">${n} rota issue${n > 1 ? 's' : ''}</span>`
    : `<button class="chip warn" id="confToggle">${team ? n + ' rota issue' + (n > 1 ? 's' : '') : conf.size + ' blocks overlap'}${showConf ? ' · hide' : ' · show'}</button>`;
  if ($('#confToggle')) $('#confToggle').onclick = () => { showConf = !showConf; render(); };
  roster ? renderRoster(sc) : renderGrid(sc, conf);
  team ? renderTeamSide(sc) : renderSide(sc, conf);
}

function renderGrid(sc, conf) {
  const HH = Math.round(52 * S.prefs.zoom), lo = sc.startHour * 60, hi = sc.endHour * 60;
  const H = (sc.endHour - sc.startHour) * HH, ppm = HH / 60, st = stats(sc), td = todayIdx();
  let gut = '';
  for (let h = sc.startHour + 1; h < sc.endHour; h++) gut += `<i style="top:${(h - sc.startHour) * HH}px">${fmt(h * 60)}</i>`;
  const cols = sc.days.map(d => {
    const bl = sc.blocks.filter(b => b.day === d), lay = layoutDay(bl);
    const items = bl.map(b => {
      const L = lay.get(b.id), c = { color: bColor(b, sc) };
      const top = (clamp(b.start, lo, hi) - lo) * ppm, h = Math.max(14, (clamp(b.end, lo, hi) - clamp(b.start, lo, hi)) * ppm - 2);
      const w = 100 / L.lanes;

  $('#calWrap').innerHTML = `<div class="cal" style="--cols:${sc.days.length}">

    ${sc.blocks.length ? '' : '<div class="empty">Drag on the grid to add your first block, or pick a template.</div>'}`;
}

/* ===================== modal / toast ===================== */
function modal(html, { wide = false, onClose } = {}) {
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  scrim.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(scrim);
  const m = scrim.firstElementChild;
  const close = () => { scrim.remove(); onClose && onClose(); };
  scrim.addEventListener('pointerdown', e => { if (e.target === scrim) close(); });
  $$('[data-close]', m).forEach(b => b.onclick = close);
  setTimeout(() => { const f = $('[autofocus]', m) || $('input,select,button', m); f && f.focus(); }, 20);
  m.close = close; return m;
}
const closeX = '<button class="btn ghost" data-close aria-label="Close">✕</button>';
let toastT;
function toast(msg) { $$('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2400); }
function copy(text, selEl) {
  const fallback = () => { if (selEl) { if (selEl.select) selEl.select(); else { const r = document.createRange(); r.selectNodeContents(selEl); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } } toast('Selected. Press Ctrl+C to copy'); };
  try { navigator.clipboard.writeText(text).then(() => toast('Copied'), fallback); } catch (e) { fallback(); }
}
function tryDownload(name, text, type) {
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); } catch (e) { }
}
function confirmIn(container, text, yesLabel, onYes) {
  container.innerHTML = `<div class="confirm"><p>${esc(text)}</p><button class="btn" data-no>Cancel</button><button class="btn primary" data-yes>${esc(yesLabel)}</button></div>`;
  $('[data-no]', container).onclick = () => container.innerHTML = '';
  $('[data-yes]', container).onclick = onYes;
}

/* ===================== grid interactions ===================== */
let drag = null;
function colAt(x, y) { for (const el of document.elementsFromPoint(x, y)) if (el.classList?.contains('col')) return el; return null; }
function minAt(col, y) { const sc = sched(), r = col.getBoundingClientRect(), HH = Math.round(52 * S.prefs.zoom); return sc.startHour * 60 + (y - r.top) / HH * 60; }
const snapM = m => Math.round(m / sched().snap) * sched().snap;

$('#calWrap').addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const col = e.target.closest('.col'); if (!col) return;
  const sc = sched(), blkEl = e.target.closest('.blk');
  const touch = e.pointerType === 'touch';
  if (blkEl) {
    const b = sc.blocks.find(x => x.id === blkEl.dataset.id); if (!b) return;
    drag = { type: e.target.dataset.rz && !touch ? 'resize' : 'move', b, el: blkEl, x0: e.clientX, y0: e.clientY, off: minAt(col, e.clientY) - b.start, orig: { ...b }, moved: false, touch };
  } else {
    const m = clamp(Math.floor(minAt(col, e.clientY) / sc.snap) * sc.snap, 0, 1440 - sc.snap);
    drag = { type: 'create', col, day: +col.dataset.day, a: m, b: m + sc.snap, x0: e.clientX, y0: e.clientY, moved: false, touch };
  }
  if (!touch) { e.preventDefault(); $('#calWrap').setPointerCapture(e.pointerId); }
});
$('#calWrap').addEventListener('pointermove', e => {
  if (!drag) return;
  const dist = Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0);
  if (drag.touch) { if (dist > 10) drag = null; return; }   // touch: let the grid scroll
  if (!drag.moved && dist < 4) return;
  const sc = sched();
  if (!drag.moved) { drag.moved = true; if (drag.type !== 'create') pushUndo(); }
  if (drag.type === 'create') {
    const m = clamp(snapM(minAt(drag.col, e.clientY)), 0, 1440);
    const a = Math.min(drag.a, m), b = Math.max(drag.a + sc.snap, m);
    drag.lo = a; drag.hi = b;
    let g = $('.ghost-blk', drag.col); if (!g) { g = document.createElement('div'); g.className = 'ghost-blk'; drag.col.appendChild(g); }
    const HH = Math.round(52 * S.prefs.zoom), ppm = HH / 60;
    g.style.top = (a - sc.startHour * 60) * ppm + 'px'; g.style.height = (b - a) * ppm + 'px'; g.textContent = `${fmt(a)}–${fmt(b)}`;
  } else if (drag.type === 'move') {
    const col = colAt(e.clientX, e.clientY) || $(`.col[data-day="${drag.b.day}"]`);
    const dur = drag.orig.end - drag.orig.start;
    const st = clamp(snapM(minAt(col, e.clientY) - drag.off), 0, 1440 - dur);
    drag.b.day = +col.dataset.day; drag.b.start = st; drag.b.end = st + dur;
    renderGrid(sc, conflicts(sc)); $(`.blk[data-id="${drag.b.id}"]`)?.classList.add('drag');
  } else {
    const col = $(`.col[data-day="${drag.b.day}"]`);
    drag.b.end = clamp(snapM(minAt(col, e.clientY)), drag.b.start + sc.snap, 1440);
    renderGrid(sc, conflicts(sc)); $(`.blk[data-id="${drag.b.id}"]`)?.classList.add('drag');
  }
});
function endDrag(e, cancel) {
  if (!drag) return; const d = drag; drag = null;
  const sc = sched();
  if (cancel) { if (d.b && d.moved) Object.assign(d.b, d.orig); render(); return; }
  if (d.type === 'create') {
    $$('.ghost-blk').forEach(g => g.remove());
    const a = d.moved ? d.lo : d.a, b = d.moved ? d.hi : Math.min(1440, d.a + 60);
    if (!canAddBlocks(1)) return;
    openEditor({ id: uid(), day: d.day, start: a, end: b, title: '', cat: S.cats[0]?.id, loc: '', notes: '' }, true);
  } else if (!d.moved) { openEditor(d.b); }
  else { save(); render(); }
}
$('#calWrap').addEventListener('pointerup', e => endDrag(e, false));
$('#calWrap').addEventListener('pointercancel', e => endDrag(e, true));
$('#calWrap').addEventListener('keydown', e => {
  const el = e.target.closest('.blk'); if (!el) return;
  const b = sched().blocks.find(x => x.id === el.dataset.id); if (!b) return;

/* ===================== auto-fill ===================== */
function autofill(sc) {
  const lo = sc.startHour * 60, hi = sc.endHour * 60, BUF = 10;
  const win = { any: [Math.max(lo, 480), Math.min(hi, 1290)], morning: [Math.max(lo, 360), 720], afternoon: [720, 1020], evening: [1020, Math.min(hi, 1380)] };
  const blocks = sc.blocks.filter(b => !b.auto), placed = [], missed = [];
  for (const t of sc.tasks || []) {
    let [a, z] = win[t.win] || win.any; a = Math.max(a, lo); z = Math.min(z, hi);
    for (let k = 0; k < t.times; k++) {
      const all = blocks.concat(placed);
      const load = d => all.filter(b => b.day === d).reduce((s, b) => s + b.end - b.start, 0);
      const same = d => placed.filter(b => b.day === d && b.task === t.id).length;
      const order = [...sc.days].sort((x, y) => same(x) - same(y) || load(x) - load(y) || x - y);
      let ok = null;
      outer: for (const d of order) {
        for (let s = Math.ceil(a / sc.snap) * sc.snap; s + t.dur <= z; s += sc.snap) {
          const e = s + t.dur;
          if (!all.some(b => b.day === d && s < b.end + BUF && b.start - BUF < e)) { ok = { d, s, e }; break outer; }
        }
      }
      if (ok) placed.push({ id: uid(), day: ok.d, start: ok.s, end: ok.e, title: t.title, cat: t.cat, loc: '', notes: '', auto: true, task: t.id });
      else missed.push(t.title);
    }
  }
  return { placed, missed };
}
function runAutofill() {
  const sc = sched();
  if (!sc.tasks?.length) { openTask(); return; }
  if (!isPro() && creditsLeft() <= 0) { openUpgrade(`You’ve used this week’s ${CONFIG.limits.autofillPerWeek} free auto-fill runs. Pro has unlimited runs, or wait until Monday.`); return; }
  const { placed, missed } = autofill(sc);
  const keep = sc.blocks.filter(b => !b.auto).length;
  if (!isPro() && keep + placed.length > CONFIG.limits.blocks) { openUpgrade(`Auto-fill wants to place ${placed.length} blocks, which would take this schedule past the free limit of ${CONFIG.limits.blocks}.`); return; }
  mutate(() => { sc.blocks = sc.blocks.filter(b => !b.auto).concat(placed); if (!isPro()) S.credits.used++; });
  const u = [...new Set(missed)];
  toast(`Placed ${placed.length} sessions` + (u.length ? `. No room for: ${u.join(', ')}` : ''));
}

/* ===================== team rota: analysis ===================== */
function teamStats(sc) {
  const r = sc.rules, per = {}, byDay = Array(7).fill(0); let cost = 0, paid = 0, ot = 0, open = 0;
  for (const p of sc.staff) per[p.id] = { min: 0, paid: 0, shifts: 0, cost: 0, otH: 0 };
  for (const b of sc.blocks) {
    const s = per[b.who]; if (!s) { open++; continue; }
    const pm = paidMin(b, sc); s.min += b.end - b.start; s.paid += pm; s.shifts++;
    byDay[b.day] += pm / 60 * person(sc, b.who).wage;
  }
  for (const p of sc.staff) {
    const s = per[p.id], h = s.paid / 60;
    s.otH = r.otAfterH > 0 ? Math.max(0, h - r.otAfterH) : 0;
    s.cost = (h - s.otH) * p.wage + s.otH * p.wage * r.otMult;
    cost += s.cost; paid += s.paid; ot += s.otH * p.wage * (r.otMult - 1);
  }
  return { per, byDay, cost, paid, ot, open };
}
function coverageGaps(sc, countOpen) {
  const out = [];
  for (const rule of sc.cover || []) for (const d of rule.days) {
    if (!sc.days.includes(d)) continue;
    const bl = sc.blocks.filter(b => b.day === d && (countOpen || person(sc, b.who))); let run = null;
    for (let t = rule.start; t < rule.end; t += 15) {
      const have = bl.filter(b => b.start <= t && b.end >= t + 15).length;
      if (have < rule.need) { if (run && run.have === have) run.b = t + 15; else { run && out.push(run); run = { day: d, a: t, b: t + 15, have, need: rule.need }; } }
      else if (run) { out.push(run); run = null; }
    }
    run && out.push(run);
  }
  return out;
}
function teamIssues(sc) {
  const out = [], r = sc.rules, st = teamStats(sc);
  const add = (lvl, text, ids = [], mark = true) => out.push({ lvl, text, ids, mark });
  for (const p of sc.staff) {
    const sh = sc.blocks.filter(b => b.who === p.id).sort((a, b) => a.day - b.day || a.start - b.start), s = st.per[p.id];
    if (s.paid / 60 > p.maxH) add('bad', `${p.name} has ${hrs(s.paid)}h, over the ${p.maxH}h limit`);
    for (const b of sh) if ((p.off || []).includes(b.day)) add('bad', `${p.name} is off on ${DAYS[b.day]} but has a shift`, [b.id]);
    for (let i = 0; i < sh.length; i++) for (let j = i + 1; j < sh.length; j++) if (overlaps(sh[i], sh[j])) add('bad', `${p.name} is double-booked on ${DAYS[sh[i].day]}`, [sh[i].id, sh[j].id]);
    for (let i = 0, n = sh.length === 2 ? 1 : sh.length; i < n && sh.length > 1; i++) {
      const a = sh[i], b = sh[(i + 1) % sh.length]; if (a.day === b.day) continue;
      const g = restGap(a, b);
      if (g < r.restH * 60) add('warn', `${p.name} gets ${hrs(g)}h rest between ${DAYS[a.day]} and ${DAYS[b.day]} (minimum ${r.restH}h)`, [a.id, b.id]);
    }
    const dayMin = Array(7).fill(0); sh.forEach(b => dayMin[b.day] += b.end - b.start);
    dayMin.forEach((m, d) => { if (m > r.maxDayH * 60) add('warn', `${p.name} works ${hrs(m)}h on ${DAYS[d]}`, sh.filter(b => b.day === d).map(b => b.id)); });
    if (dayMin.every(m => m > 0)) add('warn', `${p.name} works all 7 days`);
    if (s.otH > 0) add('warn', `${p.name} earns ${hrs(s.otH * 60)}h of overtime`);
  }
  const open = sc.blocks.filter(b => !person(sc, b.who));
  if (open.length) add('warn', `${open.length} open shift${open.length > 1 ? 's' : ''} with nobody assigned`, open.map(b => b.id), false);
  for (const g of coverageGaps(sc, false)) add('bad', `${DAYS[g.day]} ${fmt(g.a)}–${fmt(g.b)}: ${g.have} of ${g.need} people on`);
  if (sc.budget > 0 && st.cost > sc.budget) add('bad', `Labour is ${money(sc, Math.round(st.cost - sc.budget))} over the weekly budget`);
  return out.sort((a, b) => (a.lvl === 'bad' ? 0 : 1) - (b.lvl === 'bad' ? 0 : 1));
}
function teamBadIds(sc, issues = teamIssues(sc)) { const s = new Set(); for (const i of issues) if (i.mark) i.ids.forEach(id => s.add(id)); return s; }

/* ===================== team rota: auto-staff ===================== */
function canWork(sc, p, b, mine) {
  const r = sc.rules;
  if ((p.off || []).includes(b.day)) return false;
  if (mine.some(s => overlaps(s, b))) return false;
  if (mine.some(s => s.day !== b.day && restGap(s, b) < r.restH * 60)) return false;
  if (mine.reduce((t, s) => t + paidMin(s, sc), 0) + paidMin(b, sc) > p.maxH * 60) return false;
  if (mine.filter(s => s.day === b.day).reduce((t, s) => t + s.end - s.start, 0) + b.end - b.start > r.maxDayH * 60) return false;
  return true;
}
function autoStaff(sc) {
  let added = 0, filled = 0;
  for (let i = 0; i < 80; i++) {            // 1. open a shift for every coverage gap
    const g = coverageGaps(sc, true)[0]; if (!g) break;
    let a = g.a, b = g.b;
    if (b - a > 480) b = a + Math.ceil((b - a) / 2 / 30) * 30;
    if (b - a < 180) { b = Math.min(1440, a + 180); a = Math.min(a, b - 180); }
    sc.blocks.push({ id: uid(), day: g.day, start: a, end: b, title: 'Cover', who: '', cat: '', loc: '', notes: '', auto: true }); added++;
  }
  const roles = new Set(sc.staff.map(p => (p.role || '').toLowerCase()).filter(Boolean));
  const mine = p => sc.blocks.filter(s => s.who === p.id);
  const fill = p => mine(p).reduce((s, x) => s + paidMin(x, sc), 0) / (p.maxH * 60 || 1);
  const open = sc.blocks.filter(b => !person(sc, b.who)).sort((x, y) => (y.end - y.start) - (x.end - x.start) || x.day - y.day);
  for (const b of open) {                   // 2. give each open shift to the least-loaded person who can take it
    const t = (b.title || '').toLowerCase();
    const pool = roles.has(t) ? sc.staff.filter(p => (p.role || '').toLowerCase() === t) : sc.staff;
    const ok = pool.filter(p => canWork(sc, p, b, mine(p))).sort((x, y) => fill(x) - fill(y) || x.wage - y.wage);
    if (!ok.length) { b.who = ''; continue; }
    b.who = ok[0].id; if (b.title === 'Cover') b.title = ok[0].role || ''; filled++;
  }
  return { added, filled, open: sc.blocks.filter(b => !person(sc, b.who)).length };
}
function runAutoStaff() {
  const sc = sched();
  if (!sc.staff.length) return openStaff(null);
  if (!isTeam() && creditsLeft() <= 0) return openUpgrade(`You’ve used this week’s ${CONFIG.limits.autofillPerWeek} free Auto-staff runs. Team has unlimited runs, or wait until Monday.`, null, 'team');
